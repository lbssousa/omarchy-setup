---
# EPSON L4160 printer — driverless CUPS queue (IPP Everywhere). Network
# URI resolved by mDNS hostname, with printer-error-policy=abort-job so
# one bad job doesn't jam the whole queue. CUPS + Avahi + nss-mdns aren't
# installed by default on a clean Omarchy, so this playbook installs and
# enables all three first.
#
# If the printer doesn't answer via mDNS (most likely just powered
# off), the queue setup is skipped with a warning instead of failing
# the play — a hard failure here would abort the whole `site.yml` run,
# breaking `just setup` for every other playbook over something as
# routine as the L4160 being off.
- name: EPSON L4160 printer (driverless)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Install CUPS, Avahi and nss-mdns via pacman
      community.general.pacman:
        name:
          - cups
          - avahi
          - nss-mdns
        state: present
      become: true

    - name: Enable and start CUPS (socket) and Avahi
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - cups.socket
        - avahi-daemon.service
      become: true

    - name: Ensure CUPS (lpadmin) is available
      ansible.builtin.command: which lpadmin
      register: lpadmin_check
      changed_when: false

    - name: "Check the printer answers via mDNS ({{ printer_l4160_hostname }})"
      ansible.builtin.command: "getent hosts {{ printer_l4160_hostname }}"
      register: printer_l4160_resolve
      changed_when: false
      failed_when: false

    - name: Warn and skip if the printer didn't answer
      ansible.builtin.debug:
        msg: >-
          "{{ printer_l4160_hostname }}" didn't answer via mDNS
          (`getent hosts` found nothing) — skipping the print queue
          setup. Check the L4160 is powered on and connected to
          Wi-Fi, then rerun (`just printer`). If the hostname changed,
          update printer_l4160_hostname in group_vars/all/main.yml.
      when: printer_l4160_resolve.rc != 0

    - name: EPSON L4160 printer (driverless)
      become: true
      when: printer_l4160_resolve.rc == 0
      block:
        - name: Check the current L4160 print queue
          ansible.builtin.command: "lpstat -v {{ printer_l4160_name }}"
          register: l4160_current
          changed_when: false
          failed_when: false

        - name: Configure the L4160 queue via IPP Everywhere (driverless)
          ansible.builtin.command: >-
            lpadmin -p {{ printer_l4160_name }} -E
            -v {{ printer_l4160_device_uri }}
            -m everywhere
            -L "{{ printer_l4160_location }}"
            -D "{{ printer_l4160_description }}"
            -o printer-error-policy={{ printer_l4160_error_policy }}
          changed_when: printer_l4160_device_uri not in l4160_current.stdout

        - name: Check the current system default printer
          ansible.builtin.command: lpstat -d
          register: default_printer_current
          changed_when: false
          failed_when: false

        - name: Set the L4160 as the system default printer
          ansible.builtin.command: "lpadmin -d {{ printer_l4160_name }}"
          changed_when: true
          when:
            - printer_l4160_set_default
            - printer_l4160_name not in default_printer_current.stdout
