---
# Adds the pam_u2f line to one PAM stack (pam_file) of the security-key play
# in system/plugins.yml, reading Omarchy's root-owned authfile
# (security_key_plugin_authfile). An existing line keeps its other options,
# but one without authfile= is pointed at that file: earlier runs left keys in
# ~/.config/Yubico/u2f_keys, which that play has already moved.
#
# A key alone never authenticates: pinverification=1 and userpresence=1 make
# pam_u2f ask for its PIN and a touch, whatever the options on each registered
# credential. A key without a PIN is refused, and the stack goes on to the next
# module.
#
# The line goes right after pam_fprintd, the order pam-auth-order pins, and
# so also after the clamshell gate, which skips only the next module. Without
# pam_fprintd it goes before the first auth line.
- name: "Look for {{ pam_file }}"
  ansible.builtin.stat:
    path: "{{ pam_file }}"
  register: pam_u2f_file_stat

# Omarchy 4.5 ships polkit-1 only in /usr/lib/pam.d; see
# tasks/pam-auth-order-file.yml.
- name: "Seed {{ pam_file }} from the vendor copy in /usr/lib/pam.d"
  ansible.builtin.copy:
    src: "/usr/lib/pam.d/{{ pam_file | basename }}"
    dest: "{{ pam_file }}"
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0644"
  become: true
  when: not pam_u2f_file_stat.stat.exists

- name: "Read {{ pam_file }}"
  ansible.builtin.slurp:
    src: "{{ pam_file }}"
  register: pam_u2f_raw

- name: "Work out what {{ pam_file }} already has"
  ansible.builtin.set_fact:
    pam_u2f_auth_lines: >-
      {{ (pam_u2f_raw.content | b64decode).splitlines()
         | select('match', '^\s*auth\s') | list }}

- name: "Add pam_u2f to {{ pam_file }}"
  ansible.builtin.lineinfile:
    path: "{{ pam_file }}"
    line: "auth      sufficient pam_u2f.so cue authfile={{ security_key_plugin_authfile }} pinverification=1 userpresence=1"
    insertafter: "{{ '^\\s*auth\\s.*pam_fprintd\\.so' if pam_u2f_has_fprintd else omit }}"
    insertbefore: "{{ omit if pam_u2f_has_fprintd else '^\\s*auth\\s' }}"
    firstmatch: true
    backup: true
  vars:
    pam_u2f_has_fprintd: "{{ pam_u2f_auth_lines | select('search', 'pam_fprintd\\.so') | list | length > 0 }}"
  become: true
  when: pam_u2f_auth_lines | select('search', 'pam_u2f\.so') | list | length == 0

# openasuser only served files in a user's home.
- name: "Drop openasuser from pam_u2f in {{ pam_file }}"
  ansible.builtin.replace:
    path: "{{ pam_file }}"
    regexp: '^(\s*auth\s.*pam_u2f\.so.*?)[ \t]+openasuser\b(.*)$'
    replace: '\1\2'
    backup: true
  become: true

- name: "Point pam_u2f at {{ security_key_plugin_authfile }} in {{ pam_file }}"
  ansible.builtin.replace:
    path: "{{ pam_file }}"
    regexp: '^(\s*auth\s.*pam_u2f\.so(?:(?!authfile=).)*)$'
    replace: '\1 authfile={{ security_key_plugin_authfile }}'
    backup: true
  become: true

- name: "Drop any other {{ item }} setting from pam_u2f in {{ pam_file }}"
  ansible.builtin.replace:
    path: "{{ pam_file }}"
    regexp: '^(\s*auth\s.*pam_u2f\.so.*?)[ \t]+{{ item }}=(?!1(?:\s|$))\S*(.*)$'
    replace: '\1\2'
    backup: true
  loop: [pinverification, userpresence]
  become: true

- name: "Require {{ item }} from pam_u2f in {{ pam_file }}"
  ansible.builtin.replace:
    path: "{{ pam_file }}"
    regexp: '^(\s*auth\s.*pam_u2f\.so(?:(?!{{ item }}).)*)$'
    replace: '\1 {{ item }}=1'
    backup: true
  loop: [pinverification, userpresence]
  become: true
