---
# Index of automations for a freshly installed Omarchy desktop. Run a
# single one with --tags <tag>, or skip one with --skip-tags <tag>.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml
- name: polkitd ExpirationSeconds + legacy sudoers drop-in cleanup
  ansible.builtin.import_playbook: playbooks/polkit.yml
  tags: [polkit]

# Fingerprint, then FIDO2/U2F key, then password, in the sudo and polkit PAM
# stacks (Omarchy's setup scripts each insert at the top, so the order
# otherwise depends on which ran last). A no-op when either is not set up.
- name: PAM auth order (fingerprint, then FIDO2/U2F, then password)
  ansible.builtin.import_playbook: playbooks/pam-auth-order.yml
  tags: [pam-auth-order]

- name: Firefox
  ansible.builtin.import_playbook: playbooks/firefox.yml
  tags: [firefox]

# The tab apps in firefox_taskbar_apps, with the webapp keybinds pointed at
# them instead of Omarchy's own web app launchers.
- name: Firefox Taskbar Tabs
  ansible.builtin.import_playbook: playbooks/firefox-taskbar-apps.yml
  tags: [firefox-taskbar-apps]

- name: Brave
  ansible.builtin.import_playbook: playbooks/brave.yml
  tags: [brave]

# Brave as the default browser, with Omarchy's native web apps working on
# the Flathub build (a brave-browser.desktop shim, see the playbook).
- name: Default browser (Brave, Flathub-aware wrapper)
  ansible.builtin.import_playbook: playbooks/default-browser.yml
  tags: [default-browser]

- name: ONLYOFFICE Desktop Editors
  ansible.builtin.import_playbook: playbooks/onlyoffice.yml
  tags: [onlyoffice]

- name: Emacs + AUCTeX, yasnippet, lsp-mode (classic teal theme)
  ansible.builtin.import_playbook: playbooks/emacs.yml
  tags: [emacs]

- name: Zed editor
  ansible.builtin.import_playbook: playbooks/zed.yml
  tags: [zed]

# Kdenlive, OBS Studio, Pinta and Xournal++ — the native builds Omarchy
# pre-installs, replaced by their Flathub builds. One tag for the set;
# trim flathub_app_migrations in group_vars/all/main.yml to narrow it.
- name: Flathub app migrations (native -> Flatpak)
  ansible.builtin.import_playbook: playbooks/flathub-apps.yml
  tags: [flathub-apps]

- name: gregorio-lsp
  ansible.builtin.import_playbook: playbooks/gregorio-lsp.yml
  tags: [gregorio-lsp]

- name: PDF viewer (Zathura default, Papers optional, Evince kept for sushi)
  ansible.builtin.import_playbook: playbooks/pdf-viewer.yml
  tags: [pdf-viewer]

- name: GTK4 file chooser dialogs for non-GNOME apps
  ansible.builtin.import_playbook: playbooks/file-chooser.yml
  tags: [file-chooser]

- name: LazyVim plugin preferences (LaTeX extra + gregorio.nvim)
  ansible.builtin.import_playbook: playbooks/lazyvim.yml
  tags: [lazyvim]

- name: pt-BR localization
  ansible.builtin.import_playbook: playbooks/ptbr.yml
  tags: [ptbr]

# Plays: Podman (tag podman), Distrobox (tag distrobox, which also runs
# Podman first), starship prompt inside distrobox (tag starship-distrobox).
- name: Containers (Podman, Distrobox, starship in distrobox)
  ansible.builtin.import_playbook: playbooks/containers.yml
  tags: [containers]

- name: Flatpak + Flathub
  ansible.builtin.import_playbook: playbooks/flatpak.yml
  tags: [flatpak]

# Plays: snapd (tag snapd), Visual Studio Code (tag vscode, which also runs
# snapd first).
- name: snapd + Visual Studio Code
  ansible.builtin.import_playbook: playbooks/snap.yml
  tags: [snap]

- name: libfprint (goodix538d)
  ansible.builtin.import_playbook: playbooks/libfprint.yml
  tags: [libfprint]

- name: EPSON L4160 printer (driverless)
  ansible.builtin.import_playbook: playbooks/printer.yml
  tags: [printer]

# Plays: scrolling column resize (tag hypr-scrolling-resize), screen scale +
# text size (tag text-size), night light (tag nightlight-solar).
- name: Desktop tuning (Hyprland resize, text size, night light)
  ansible.builtin.import_playbook: playbooks/desktop.yml
  tags: [desktop]

- name: Caps Lock via keyd
  ansible.builtin.import_playbook: playbooks/capslock.yml
  tags: [capslock]

- name: Inkscape + svg2tikz (SVG to TikZ/PGF export extension)
  ansible.builtin.import_playbook: playbooks/inkscape.yml
  tags: [inkscape]

- name: Omadwaita Omarchy themes (Adwaita-based)
  ansible.builtin.import_playbook: playbooks/omadwaita-themes.yml
  tags: [omadwaita-themes]

- name: Omaraptor Omarchy themes (GNOME palette + Bluefin wallpapers)
  ansible.builtin.import_playbook: playbooks/omaraptor-themes.yml
  tags: [omaraptor-themes]

- name: Omaraptor day/night theme switching (systemd --user timer)
  ansible.builtin.import_playbook: playbooks/omaraptor-theme-auto.yml
  tags: [omaraptor-theme-auto]

- name: Limine silent boot (quiet + 1s timeout)
  ansible.builtin.import_playbook: playbooks/limine-silent-boot.yml
  tags: [limine-silent-boot]

- name: ble.sh (Bash autosuggestions + syntax highlighting)
  ansible.builtin.import_playbook: playbooks/blesh.yml
  tags: [blesh]

- name: openssh with askpass touch notifications (SSH_ASKPASS_REQUIRE in notify_start)
  ansible.builtin.import_playbook: playbooks/openssh-askpass.yml
  tags: [openssh-askpass]

# Third-party shell plugins: this desktop's own list (omarchy_plugins in
# group_vars/all/main.yml — Radio Atlas first) plus pinentry-omarchy,
# ssh-askpass-omarchy and polkit-omarchy. No tags here on purpose: each play
# in the file carries its own (plugins, pinentry, ssh-askpass, polkit-agent),
# and a tag on the import would be inherited by all of them.
- name: Omarchy shell plugins
  ansible.builtin.import_playbook: playbooks/plugins.yml

# Google Drive (Meu Drive + Compartilhados Comigo) mounted with rclone. Tag "never":
# needs the Google OAuth credentials, so it only runs on
# request (--tags rclone-gdrive / `just rclone-gdrive`).
- name: rclone — Google Drive mounts
  ansible.builtin.import_playbook: playbooks/rclone-gdrive.yml
  tags: [rclone-gdrive, never]
