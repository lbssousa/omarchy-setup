---
# The machine's accounts, from omarchy_users (group_vars/all/users.yml):
# existing accounts are updated (with their full name in GECOS, from
# omarchy_user_full_names in the untracked local.yml — fish as their login shell,
# and their groups). Uncreated accounts are left alone unless explicitly requested
# (users_filter, users_create_all: true; `just users <name>...`).
#
#   admin: true   wheel (sudo, the system phase)
#   admin: false  omarchy-users (their own FIDO2 key and fingerprints, through
#                 omarchy-multiuser's sudoers rules); taken out of wheel if
#                 they were in it, except the account running this, after
#                 the sudo grants that would keep root outside wheel
#                 (omarchy-mu-accounts drop-grants)
#   child: true   omarchy-users and omarchy-child (no extra groups; default
#                 blocked apps and adult-unlock fallback on the lock screen)
#
# Newly created accounts start with a locked password ('!'); right after this play,
# `just users <name>` asks for it (omarchy-mu-user-password), which also makes it
# their key to an encrypted disk.
# Omarchy's per-user provisioning (theme, keyring, user units) runs at their
# first login, as it does for the owner.
# Accounts missing from the list are left alone.
#
# Usage: just users [name...]
- name: User accounts (omarchy_users)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [users]

  tasks:
    - name: Check the account list
      ansible.builtin.assert:
        that:
          - omarchy_users | length > 0
          - omarchy_users | selectattr('admin', 'defined') | selectattr('admin') | list | length > 0
          - omarchy_users | selectattr('admin', 'defined') | selectattr('admin') | selectattr('child', 'defined') | selectattr('child') | list | length == 0
          - omarchy_users | selectattr('child', 'defined') | selectattr('child') | selectattr('groups', 'defined') | selectattr('groups') | list | length == 0
          - omarchy_users | map(attribute='name') | select('match', '^[a-z_][a-z0-9_-]{0,31}$') | list | length == omarchy_users | length
          - omarchy_user_full_names.values() | select('search', '[:,\n]') | list | length == 0
          - omarchy_users | map(attribute='name') | unique | length == omarchy_users | length
          - target_user in (omarchy_users | selectattr('admin', 'defined') | selectattr('admin') | map(attribute='name'))
        fail_msg: >-
          omarchy_users (group_vars/all/users.yml) needs at least one admin,
          valid unique login names, you ({{ target_user }}) among its admins,
          and no account marked both admin and child (or child with extra
          groups); omarchy_user_full_names (local.yml) needs full names
          without ':' ',' or line breaks.
        quiet: true

    - name: Check the login shell is listed in /etc/shells
      ansible.builtin.command: grep -qx {{ fish_login_shell | quote }} /etc/shells
      changed_when: false

    - name: Read the existing accounts
      ansible.builtin.getent:
        database: passwd

    - name: Create the omarchy-users and omarchy-child groups
      ansible.builtin.group:
        name: "{{ item }}"
        system: true
      loop:
        - omarchy-users
        - omarchy-child
      become: true

    - name: Remember which accounts existed before this run
      ansible.builtin.set_fact:
        users_existing: "{{ ansible_facts.getent_passwd.keys() | list }}"

    - name: Validate users_filter if provided
      ansible.builtin.assert:
        that:
          - item in (omarchy_users | map(attribute='name'))
        fail_msg: "User '{{ item }}' is not defined in omarchy_users (group_vars/all/users.yml)."
      loop: "{{ users_filter | default([]) }}"

    - name: Determine accounts to manage
      ansible.builtin.set_fact:
        managed_users: >-
          {{
            omarchy_users | selectattr('name', 'in', users_filter) | list
            if users_filter is defined and users_filter | length > 0
            else (
              omarchy_users
              if users_create_all | default(false)
              else omarchy_users | selectattr('name', 'in', users_existing) | list
            )
          }}

    - name: Report uncreated accounts
      ansible.builtin.debug:
        msg: >-
          Account(s) declared in omarchy_users but not created on this system:
          {{ uncreated_users | join(', ') }}.
          Run `just users <name>` to create them.
      vars:
        uncreated_users: "{{ omarchy_users | map(attribute='name') | reject('in', users_existing) | list }}"
      when:
        - uncreated_users | length > 0
        - users_filter is not defined or users_filter | length == 0

    - name: Create or update each account
      ansible.builtin.user:
        name: "{{ item.name }}"
        comment: "{{ omarchy_user_full_names[item.name] | default(omit) }}"
        shell: "{{ fish_login_shell }}"
        groups: "{{ ['wheel'] + item.groups | default([]) if item.admin | default(false) else (['omarchy-users', 'omarchy-child'] if item.child | default(false) else ['omarchy-users'] + item.groups | default([])) }}"
        append: true
        create_home: true
        password: "!"
        update_password: on_create
      loop: "{{ managed_users }}"
      loop_control:
        label: "{{ item.name }}"
      become: true

    # The grants go first, as omarchy-mu-user-admin does: the installer's by
    # name and passwordless sudo's by UID would keep root outside wheel. Fails
    # rather than leave them when omarchy-multiuser isn't installed yet, or
    # when root's password still belongs to the account leaving wheel.
    - name: Take non-administrators out of wheel, and their sudo grants (never the account running this)
      ansible.builtin.shell: |
        set -e
        if id -nG {{ item.name | quote }} | tr ' ' '\n' | grep -qx wheel; then
          if ! command -v omarchy-mu-accounts >/dev/null; then
            echo "omarchy-multiuser isn't installed; run: just apply omarchy-multiuser, then this again" >&2
            exit 1
          fi
          if command -v omarchy-mu-user-helper >/dev/null && [[ $(omarchy-mu-user-helper root-holder) == {{ item.name | quote }} ]]; then
            echo "Root's password is {{ item.name }}'s; hand it over first with: sudo omarchy-mu-user-helper root-take (or omarchy-mu-user-admin {{ item.name }} off)" >&2
            exit 1
          fi
          omarchy-mu-accounts drop-grants {{ item.name | quote }}
          gpasswd -d {{ item.name | quote }} wheel >/dev/null
          omarchy-mu-accounts sync-migration-watchers
          echo removed
        fi
      loop: "{{ managed_users | rejectattr('admin', 'defined') | list + managed_users | selectattr('admin', 'defined') | rejectattr('admin') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name != target_user
      register: users_wheel_removal
      changed_when: "'removed' in users_wheel_removal.stdout"
      become: true

    - name: Take non-child accounts out of omarchy-child
      ansible.builtin.shell: |
        if id -nG {{ item.name | quote }} | tr ' ' '\n' | grep -qx omarchy-child; then
          gpasswd -d {{ item.name | quote }} omarchy-child >/dev/null && echo removed
        fi
      loop: "{{ managed_users | rejectattr('child', 'defined') | list + managed_users | selectattr('child', 'defined') | rejectattr('child') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: users_child_removal
      changed_when: "'removed' in users_child_removal.stdout"
      become: true

    - name: Seed default blocked apps for child accounts (when omarchy-multiuser is installed)
      ansible.builtin.shell: |
        set -euo pipefail
        if [[ -f /usr/share/omarchy-multiuser/child-blocked-apps && ! -f /var/lib/omarchy-multiuser/blocked-apps/{{ item.name | quote }} ]]; then
          install -d -m 0755 /var/lib/omarchy-multiuser/blocked-apps
          grep -v '^#' /usr/share/omarchy-multiuser/child-blocked-apps | sed 's/\.desktop$//' | grep -v '^$' | sort -u > /var/lib/omarchy-multiuser/blocked-apps/{{ item.name | quote }}
          chmod 0600 /var/lib/omarchy-multiuser/blocked-apps/{{ item.name | quote }}
          omarchy-mu-user-apps-apply
          echo seeded
        fi
      args:
        executable: /bin/bash
      loop: "{{ managed_users | selectattr('child', 'defined') | selectattr('child') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: users_child_apps
      changed_when: "'seeded' in users_child_apps.stdout"
      become: true

    - name: Take administrators out of omarchy-users (wheel covers them)
      ansible.builtin.shell: |
        if id -nG {{ item.name | quote }} | tr ' ' '\n' | grep -qx omarchy-users; then
          gpasswd -d {{ item.name | quote }} omarchy-users >/dev/null && echo removed
        fi
      loop: "{{ managed_users | selectattr('admin', 'defined') | selectattr('admin') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: users_group_removal
      changed_when: "'removed' in users_group_removal.stdout"
      become: true

    - name: Give every user a subuid/subgid range
      ansible.builtin.include_tasks: tasks/subid-ranges.yml
      vars:
        subid_users: "{{ managed_users }}"

    - name: Say which new accounts still need a password
      ansible.builtin.debug:
        msg: >-
          New account(s): {{ users_new | join(', ') }}. They start locked;
          `just users` asks for their passwords next.
      vars:
        users_new: "{{ managed_users | map(attribute='name') | reject('in', users_existing) | list }}"
      when: users_new | length > 0
