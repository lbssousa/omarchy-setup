---
# Hyprland — corrige o redimensionamento de coluna no layout "scrolling"
# (SUPER+L alterna a workspace ativa entre dwindle e scrolling — ver
# omarchy-hyprland-workspace-layout-toggle).
#
# Sintoma: com duas janelas lado a lado no "scrolling", a da direita
# não passa de resize algum além do que já está visível na tela —
# tentar redimensioná-la além disso não tem efeito nenhum.
#
# Causa: os binds de redimensionar do próprio Omarchy
# (/usr/share/omarchy/default/hypr/bindings/tiling.lua — SUPER+MINUS
# "Expand window left", SUPER+EQUAL "Shrink window left", e as
# variantes ALT/CTRL "a little"/"a lot") usam só o dispatcher genérico
# de resize do Hyprland (hl.dsp.window.resize), pensado pro layout
# "dwindle". Esse dispatcher não conhece o modelo de fita horizontal
# infinita do "scrolling": ele prende o crescimento da janela aos
# pixels já visíveis no monitor, em vez de alargar a coluna e deixar a
# camada rolar pra revelar o resto. Confirmado nesta máquina: com o
# dispatcher específico do layout (colresize, abaixo), a coluna focada
# cresceu de 941px para 1651px numa tela de 1920px — passando do que
# cabia na tela, coisa que o resize genérico nunca conseguia.
#
# Correção: o "scrolling" tem seu próprio dispatcher de layout,
# hl.dsp.layout("colresize <±fração>") — fração da largura do monitor,
# [0.1-1.0] (ver
# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/). Este
# playbook faz SUPER+MINUS/SUPER+EQUAL disparar OS DOIS dispatchers na
# mesma tecla (só é possível com uma função Lua como dispatcher — ver
# "Multiple binds to one key" em
# https://wiki.hypr.land/Configuring/Basics/Binds/): o resize genérico
# de sempre (preserva o comportamento atual no dwindle/master) e o
# colresize (o que resolve o bug no scrolling). No dwindle/master, o
# colresize é uma mensagem de layout não reconhecida — confirmado
# nesta máquina que o Hyprland só loga um erro (`Unknown dwindle
# layoutmsg: colresize ...`) e ignora, sem quebrar o resize genérico
# que roda na mesma função.
#
# code:20/code:21 (keycode físico, não os símbolos MINUS/EQUAL) porque
# é assim que o Omarchy já bindava essas teclas originalmente — mantém
# o alvo físico correto independente do layout de teclado (ex.: pt-BR
# vs en-US), sem precisar redescobrir a que símbolo cada keycode
# resolve.
#
# Direção: o Omarchy original associa EQUAL a "Shrink" e MINUS a
# "Expand" — backwards em relação à convenção comum de teclado
# (EQUAL/"+" aumenta, MINUS/"-" diminui, ex.: zoom no navegador).
# Reportado como confuso no uso real (SUPER+EQUAL "diminuindo" em vez
# de aumentar); este playbook TROCA qual keycode recebe qual
# comportamento (mantendo os sinais x/colresize de cada comportamento
# como estão — só troca QUEM dispara QUAL), então agora SUPER+EQUAL
# cresce a coluna/janela e SUPER+MINUS encolhe, nos dois layouts.
#
# Escrito em ~/.config/hypr/bindings.lua (arquivo que o próprio Omarchy
# reserva para overrides pessoais, nunca nos arquivos default do
# pacote omarchy, que são sobrescritos em atualizações), via
# ansible.builtin.blockinfile com marcadores — preserva qualquer outra
# customização que já esteja lá (ex.: o bind do Bitwarden, de
# playbooks/bitwarden.yml, no mesmo arquivo).
- name: "Hyprland — resize de coluna no layout scrolling (SUPER+MINUS/SUPER+EQUAL)"
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Criar ~/.config/hypr
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr"
        state: directory
        mode: "0755"

    - name: Criar ~/.config/hypr/bindings.lua a partir do padrão do Omarchy, se ainda não existir
      ansible.builtin.copy:
        src: /usr/share/omarchy/default/hypr/bindings.lua
        dest: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
        remote_src: true
        force: false
        mode: "0644"

    - name: "Rebindar SUPER+EQUAL=cresce / SUPER+MINUS=encolhe, com colresize (±{{ hypr_scrolling_colresize_step }})"
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
        marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/hypr-scrolling-resize.yml — resize de coluna no scrolling)"
        block: |
          -- Was: SUPER + EQUAL (code:21) → "Shrink window left" (generic resize only).
          -- Swapped with code:20 below: EQUAL now grows (convenção +/-).
          hl.unbind("SUPER + code:21")
          hl.bind("SUPER + code:21", function()
            hl.dispatch(hl.dsp.window.resize({ x = -100, y = 0, relative = true }))
            hl.dispatch(hl.dsp.layout("colresize +{{ hypr_scrolling_colresize_step }}"))
          end, { description = "Expand window left / grow column" })

          -- Was: SUPER + MINUS (code:20) → "Expand window left" (generic resize only).
          -- Swapped with code:21 above: MINUS now shrinks (convenção +/-).
          hl.unbind("SUPER + code:20")
          hl.bind("SUPER + code:20", function()
            hl.dispatch(hl.dsp.window.resize({ x = 100, y = 0, relative = true }))
            hl.dispatch(hl.dsp.layout("colresize -{{ hypr_scrolling_colresize_step }}"))
          end, { description = "Shrink window left / shrink column" })
      register: hypr_scrolling_resize_binding
      notify: reload Hyprland

  handlers:
    - name: reload Hyprland
      # Só tem efeito se estivermos rodando dentro de uma sessão
      # Hyprland de verdade (o caso comum deste repo); fora dela não há
      # o que recarregar, e o bind já vale a partir do próximo login.
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      listen: reload Hyprland
