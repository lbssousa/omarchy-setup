---
# Creates the Firefox Taskbar Tabs ("tab apps") listed in
# firefox_taskbar_apps (group_vars/all/main.yml) — sites that open as their
# own app-like window — and points the webapp keybinds at them instead of
# Omarchy's omarchy-launch-webapp, which only knows the Chromium family's
# --app= flag. Everything lives in the user's home, so no root.
#
# Firefox pins a tab through the DynamicLauncher portal, with a
# confirmation dialog per site. files/firefox-taskbar-apps.py writes the
# same registry entries and launchers directly instead (see its docstring),
# so Firefox has to be closed while it runs.
- name: Firefox web apps as Taskbar Tabs (create, remove Omarchy launchers, wire keybinds)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [firefox-taskbar-apps]

  tasks:
    - name: Create ~/.local/bin
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Deploy omarchy-setup-launch-firefox-taskbar-app
      ansible.builtin.template:
        src: launch-firefox-taskbar-app.sh.j2
        dest: "{{ firefox_taskbar_app_launcher }}"
        mode: "0755"

    - name: Ensure Flatpak Firefox is installed
      ansible.builtin.command: flatpak info {{ firefox_flatpak_id }}
      changed_when: false

    # Firefox reads taskbartabs.json once at startup and rewrites it whole on
    # every change, so editing it under a running Firefox gets clobbered.
    # Worse, a launcher whose -taskbar-tab uuid the running instance doesn't
    # know makes it recreate the app under a fresh uuid
    # (TaskbarTabsCmd.sys.mjs), and the window's class then matches no
    # .desktop file.
    - name: Check that Firefox isn't running
      ansible.builtin.command: flatpak ps --columns=application
      register: firefox_running_check
      changed_when: false

    # A warning and a skip rather than a failure, which would also stop
    # every play after this one in a full site.yml run.
    - name: Warn that Firefox is running
      ansible.builtin.debug:
        msg: >-
          SKIPPED: Firefox ({{ firefox_flatpak_id }}) is running, and it keeps
          the Taskbar Tabs registry in memory, overwriting any change. Close
          it and run `just firefox-taskbar-apps`.
      when: firefox_flatpak_id in firefox_running_check.stdout_lines

    - name: Skip the rest of this play while Firefox is running
      ansible.builtin.meta: end_host
      when: firefox_flatpak_id in firefox_running_check.stdout_lines

    # Writes the registry entries, launchers and icons, and removes
    # Omarchy's launchers for the same sites plus anything orphaned — see
    # the script. It prints one line per change.
    - name: Create the Taskbar Tabs and clean up stale launchers
      ansible.builtin.script:
        cmd: >-
          firefox-taskbar-apps.py {{ {
            'apps': firefox_taskbar_apps,
            'flatpak_id': firefox_flatpak_id,
            'profiles_dir': ansible_facts.env.HOME ~ '/.var/app/' ~ firefox_flatpak_id ~ '/config/mozilla/firefox',
            'desktop_dir': firefox_webapp_desktop_dir,
            'backup_dir': ansible_facts.env.HOME ~ '/.cache/omarchy-setup/firefox-taskbar-removed-launchers',
          } | to_json | quote }}
        executable: python3
      register: firefox_taskbar_apps_result
      changed_when: firefox_taskbar_apps_result.stdout | trim | length > 0
      notify: refresh the applications database

    - name: Create ~/.config/hypr
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr"
        state: directory
        mode: "0755"

    - name: Create ~/.config/hypr/bindings.lua from the Omarchy default, if missing
      ansible.builtin.copy:
        src: /usr/share/omarchy/default/hypr/bindings.lua
        dest: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
        remote_src: true
        force: false
        mode: "0644"

    # This play used to be playbooks/firefox-pwa-keybinds.yml; blockinfile
    # keys blocks by marker, so the rename would otherwise leave its blocks
    # behind next to the new ones.
    - name: Remove the blocks written under the old playbook name
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
        marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/firefox-pwa-keybinds.yml — {{ item }})"
        state: absent
      loop:
        - Firefox Taskbar Tabs tiled fullscreen
        - Firefox Taskbar Tabs keybindings
      notify: reload Hyprland

    # Every tab app's window class is <flatpak id>.webapp-<uuid>. The uuid is
    # per-install, so the rule matches the whole family: any site pinned later
    # opens the same way.
    - name: Open the Firefox Taskbar Tabs in tiled fullscreen
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
        marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/firefox-taskbar-apps.yml — Firefox Taskbar Tabs tiled fullscreen)"
        block: |
          o.window("^{{ firefox_flatpak_id | replace('.', '\\.') }}\\.webapp-.*$", { fullscreen_state = "0 2" })
      notify: reload Hyprland

    - name: Rebind the webapp keys to the Taskbar Tabs
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
        marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/firefox-taskbar-apps.yml — Firefox Taskbar Tabs keybindings)"
        block: |
          {% for app in firefox_taskbar_apps %}
          hl.unbind("{{ app.keybind }}")
          o.bind("{{ app.keybind }}", "{{ app.label }}", { launch = "{{ firefox_taskbar_app_launcher }} {{ app.desktop_name | quote }}" })
          {% endfor %}
      notify: reload Hyprland

  handlers:
    # Best effort: lets launchers show up without a session restart.
    - name: refresh the applications database
      ansible.builtin.command: update-desktop-database {{ firefox_webapp_desktop_dir }}
      changed_when: false
      failed_when: false

    - name: reload Hyprland
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
