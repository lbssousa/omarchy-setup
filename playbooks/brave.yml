---
# Installs Brave Origin — Brave without Rewards, Wallet, VPN, Leo and
# News — the way Omarchy's own menu does it (Install > Browser > Brave
# Origin): `omarchy-install-browser brave-origin` installs the AUR
# brave-origin-bin package with omarchy-pkg-aur-add, writes Omarchy's
# Chromium flags to ~/.config/brave-origin-flags.conf, sets up the managed
# browser policy in /etc/brave/policies/managed and syncs the theme color.
# Only runs when the package is missing, so re-running doesn't reset the
# flags file. Making it the default browser is playbooks/default-browser.yml.
#
# The second play wires Omarchy's own web app launchers (the --app= ones,
# see playbooks/templates/fix-brave-omarchy-webapp-containers.sh.j2 and
# brave_omarchy_webapp_containers) to Brave containers.
- name: Brave Origin
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check whether Brave Origin is installed
      ansible.builtin.command: pacman -Q {{ brave_origin_package }}
      register: brave_origin_check
      changed_when: false
      failed_when: false

    # Run as the user, like emacs.yml's omarchy-pkg-aur-add: yay refuses to
    # build as root and asks for its own privileges for the install.
    - name: Install Brave Origin with Omarchy's browser installer
      ansible.builtin.command: omarchy-install-browser {{ brave_origin_browser }}
      when: brave_origin_check.rc != 0

# Omarchy's native web apps (YouTube, WhatsApp, Google Maps, ...; see
# ~/.local/share/applications) are launchers whose Exec runs
# `omarchy-launch-webapp <url>`. With Brave Origin the default browser
# that opens a Brave Origin --app= window in the profile's default
# (non-container) partition. Brave supports `--container=<name>` together with `--app=`
# since 1.95.x (brave/brave-browser#58019 landed via brave-core#38964),
# so a launcher can opt into a storage-isolated container by appending
# --container=<name> to its Exec=. This play converges the launchers
# mapped in brave_omarchy_webapp_containers (group_vars/all/main.yml) on
# their container, idempotently, and installs a systemd --user path unit
# that reruns the fix whenever a web app launcher appears or is rewritten
# (e.g. by omarchy-webapp-install). Container names must already exist
# in Brave Origin (brave://settings/containers).
- name: Brave Omarchy web app container wiring
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [brave, brave-webapp-containers]

  tasks:
    - name: Create ~/.local/bin
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0755"
      tags: [brave, brave-webapp-containers]

    - name: Deploy fix-brave-omarchy-webapp-containers
      ansible.builtin.template:
        src: fix-brave-omarchy-webapp-containers.sh.j2
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/fix-brave-omarchy-webapp-containers"
        mode: "0755"
      tags: [brave, brave-webapp-containers]

    - name: Create ~/.config/systemd/user
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
        state: directory
        mode: "0755"
      tags: [brave, brave-webapp-containers]

    - name: Install the fix-brave-omarchy-webapp-containers systemd --user units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/{{ item }}"
        mode: "0644"
      loop:
        - fix-brave-omarchy-webapp-containers.service
        - fix-brave-omarchy-webapp-containers.path
      notify: reload systemd --user
      tags: [brave, brave-webapp-containers]

    - name: Enable the fix-brave-omarchy-webapp-containers path unit
      ansible.builtin.systemd:
        name: fix-brave-omarchy-webapp-containers.path
        scope: user
        daemon_reload: true
        enabled: true
        state: started
      tags: [brave, brave-webapp-containers]

    - name: Run fix-brave-omarchy-webapp-containers now
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/fix-brave-omarchy-webapp-containers"
      register: fix_brave_omarchy_webapp_containers_result
      changed_when: "fix_brave_omarchy_webapp_containers_result.stdout is search('Result: [1-9]')"
      tags: [brave, brave-webapp-containers]

  handlers:
    - name: reload systemd --user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      listen: reload systemd --user
