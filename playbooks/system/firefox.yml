---
# Installs Firefox from Flathub (org.mozilla.firefox), replacing the native
# Arch package (`firefox` + `firefox-i18n-pt-br`): the Flathub build bundles
# every locale itself, so no separate language pack is needed (see
# playbooks/system/ptbr.yml) — and enables "tab apps" (Taskbar Tabs — pin a
# site to the taskbar as an app-like window), off by default on Linux even
# though it's already stable and on by default on Windows.
#
# Bootstraps Flatpak + the Flathub remote itself (same tasks as
# playbooks/system/flatpak.yml, system-wide) so `just firefox` keeps working
# standalone, with no ordering dependency on that playbook.
#
# browser.taskbarTabs.enabled isn't in the fixed allowlist the Preferences
# key in policies.json accepts, so it can't be set that way (see
# policies.json's Firefox pt-BR block in playbooks/system/ptbr.yml, which
# CAN use it for RequestedLocale). Instead, this drops a small
# defaults/pref/*.js file — which only changes the *default* value: still
# visible and user-overridable in about:config, and untouched by future
# Firefox upgrades. Because the Flatpak sandbox can't see the host's
# /usr/lib/firefox, both policies.json and defaults/pref/*.js go through the
# org.mozilla.firefox.systemconfig extension directory instead (mounted at
# /app/etc/firefox inside the sandbox).
#
# Also links /usr/local/bin/firefox to the Flatpak's exported launcher so
# Omarchy's own `omarchy-default-browser firefox` and `omarchy-launch-browser`
# find `firefox` on PATH (paired with the hidden firefox.desktop shim in
# playbooks/user/firefox.yml).
#
# Runs before playbooks/system/ptbr.yml (see system.yml) so that Firefox is
# already installed by the time the pt-BR RequestedLocale step checks for it.
#
# Usage: just firefox
- name: Firefox (Flatpak)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [firefox]

  tasks:
    - name: Ensure Flatpak is installed
      community.general.pacman:
        name: "{{ flatpak_package }}"
        state: present
      become: true

    - name: Ensure the Flathub remote is configured (system-wide)
      community.general.flatpak_remote:
        name: "{{ flatpak_flathub_remote }}"
        state: present
        method: system
        flatpakrepo_url: "{{ flatpak_flathub_repo_url }}"
      become: true

    - name: Install Firefox from Flathub
      community.general.flatpak:
        name: "{{ firefox_flatpak_id }}"
        state: present
        method: system
      become: true

    - name: Remove the native Firefox package (and its pt-BR language pack, if present)
      community.general.pacman:
        name: "{{ firefox_native_packages }}"
        state: absent
      become: true

    - name: Expose `firefox` on PATH via the Flatpak's exported launcher
      ansible.builtin.file:
        src: "{{ flatpak_system_exports_bin_dir }}/{{ firefox_flatpak_id }}"
        dest: "{{ firefox_command_link }}"
        state: link
        force: true
      become: true

    - name: Look up the arch/branch of the installed Firefox flatpak
      ansible.builtin.command: "flatpak info --show-ref {{ firefox_flatpak_id }}"
      register: firefox_flatpak_ref
      changed_when: false

    - name: Parse the arch/branch out of the flatpak ref
      vars:
        ref_parts: "{{ firefox_flatpak_ref.stdout_lines[0].split('/') }}"
      ansible.builtin.set_fact:
        firefox_flatpak_arch: "{{ ref_parts[2] }}"
        firefox_flatpak_branch: "{{ ref_parts[3] }}"

    - name: Ensure the systemconfig extension's policies directory exists
      ansible.builtin.file:
        path: "{{ firefox_systemconfig_dir }}/{{ firefox_flatpak_arch }}/{{ firefox_flatpak_branch }}/policies"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Seed Omarchy's default Firefox policies.json into the systemconfig extension, if missing
      ansible.builtin.copy:
        src: /usr/share/omarchy/default/firefox/policies.json
        dest: "{{ firefox_systemconfig_dir }}/{{ firefox_flatpak_arch }}/{{ firefox_flatpak_branch }}/policies/policies.json"
        remote_src: true
        force: false
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Ensure the systemconfig extension's defaults/pref directory exists
      ansible.builtin.file:
        path: "{{ firefox_systemconfig_dir }}/{{ firefox_flatpak_arch }}/{{ firefox_flatpak_branch }}/defaults/pref"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: "Enable tab apps by default ({{ firefox_taskbar_tabs_pref_name }})"
      ansible.builtin.copy:
        content: |
          // Tab apps (Taskbar Tabs) — stable but off by default on
          // Linux. Only flips the default; still user-overridable in
          // about:config.
          pref("{{ firefox_taskbar_tabs_pref_name }}", true);
        dest: "{{ firefox_systemconfig_dir }}/{{ firefox_flatpak_arch }}/{{ firefox_flatpak_branch }}/defaults/pref/{{ firefox_taskbar_tabs_pref_file }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: "Set the default page font size to {{ firefox_default_font_size_px }}px (font.size.variable.x-western)"
      # Same defaults/pref mechanism as the taskbar-tabs pref above, so
      # it's a default rather than a locked policy (what policies.json's
      # fixed allowlist would accept anyway). The browser chrome already
      # follows the GTK font set by playbooks/user/desktop.yml; this only
      # raises the default size for page text, one step above Firefox's
      # own 16px (see firefox_default_font_size_px in group_vars).
      ansible.builtin.copy:
        content: |
          // Default size for page text — one step above Firefox's own
          // 16px, matching the 13pt GTK bump. Only flips the default;
          // still user-overridable in about:config.
          pref("font.size.variable.x-western", {{ firefox_default_font_size_px }});
        dest: "{{ firefox_systemconfig_dir }}/{{ firefox_flatpak_arch }}/{{ firefox_flatpak_branch }}/defaults/pref/{{ firefox_font_size_pref_file }}"
        owner: root
        group: root
        mode: "0644"
      become: true
