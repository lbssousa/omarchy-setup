---
# Web browsers, system phase (apps: browser). The packages themselves come
# from apps/packages.yml; this adds, per installed build:
#
#   Firefox (Flatpak)  /usr/local/bin/firefox → its exported launcher, so
#                      Omarchy's omarchy-default-browser and
#                      omarchy-launch-browser find `firefox` (with the hidden
#                      firefox.desktop shim of user/apps/browser.yml); and,
#                      through the systemconfig extension (/app/etc/firefox
#                      in the sandbox, which can't see /usr/lib/firefox):
#                      Omarchy's policies.json (if missing), Taskbar Tabs on
#                      and a larger default page font.
#   Firefox (native)   the same policies and prefs in /usr/lib/firefox.
#   Google Chrome,     the system-wide steps of Omarchy's
#   Brave Origin       omarchy-install-browser (and omarchy-remove-browser
#                      when uninstalled): the managed policy directory with
#                      Omarchy's omarchy.json (DefaultBrowserSettingEnabled:
#                      false, and the directory omarchy-theme-set-browser
#                      looks for before writing color.json) and, for Brave
#                      Origin, the /opt/WidevineCdm/chromium link.
#   Google Chrome,     the PWAs that rebuild Omarchy's web apps
#   Brave Origin,      (user/apps/webapps.yml), force-installed through the
#   Chromium           browser's machine policy (WebAppInstallForceList),
#                      for the union of the webapps lists in users/ — only for
#                      the engine chosen in `just configure`, so a browser
#                      that merely stays installed (Omarchy's Chromium) gets
#                      no PWAs.
- name: Apps — web browsers
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [apps]

  vars:
    firefox_flatpak_on: "{{ 'firefox-flatpak' in apps.browser.installed }}"
    firefox_native_on: "{{ 'firefox' in apps.browser.installed }}"
    brave_origin_on: "{{ 'brave-origin' in apps.browser.installed }}"

  tasks:
    - name: Firefox (Flatpak)
      when: firefox_flatpak_on | bool
      block:
        - name: Expose `firefox` on PATH via the Flatpak's exported launcher
          ansible.builtin.file:
            src: "{{ flatpak_system_exports_bin_dir }}/{{ firefox_flatpak_id }}"
            dest: "{{ firefox_command_link }}"
            state: link
            force: true
          become: true
          # The native build owns `firefox` when both are installed.
          when: not firefox_native_on | bool

        - name: Look up the arch/branch of the installed Firefox Flatpak
          ansible.builtin.command: "flatpak info --show-ref {{ firefox_flatpak_id }}"
          register: firefox_flatpak_ref
          changed_when: false

        - name: Firefox defaults inside the systemconfig extension
          ansible.builtin.include_tasks: tasks/firefox-defaults.yml
          vars:
            firefox_defaults_dir: >-
              {{ firefox_systemconfig_dir }}/{{ firefox_flatpak_ref.stdout_lines[0].split('/')[2] }}/{{ firefox_flatpak_ref.stdout_lines[0].split('/')[3] }}
            firefox_policies_dir: "{{ firefox_defaults_dir }}/policies"

    - name: Remove the `firefox` link to the Flatpak when it isn't installed
      ansible.builtin.file:
        path: "{{ firefox_command_link }}"
        state: absent
      become: true
      when: not firefox_flatpak_on | bool or firefox_native_on | bool

    - name: Firefox (native) defaults in /usr/lib/firefox
      ansible.builtin.include_tasks: tasks/firefox-defaults.yml
      vars:
        firefox_defaults_dir: "{{ firefox_native_dir }}"
        firefox_policies_dir: "{{ firefox_native_dir }}/distribution"
      when: firefox_native_on | bool

    - name: Create the managed policy directory for each installed Chromium-family browser
      ansible.builtin.file:
        path: "{{ item.value.policy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ chromium_browsers | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      become: true
      when: item.key in apps.browser.installed

    - name: Deploy Omarchy's default Chromium policy (omarchy.json) for each installed browser
      ansible.builtin.copy:
        src: "{{ chromium_omarchy_policy_src }}"
        dest: "{{ item.value.policy_dir }}/omarchy.json"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ chromium_browsers | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      become: true
      when: item.key in apps.browser.installed

    - name: Remove Omarchy's managed policy files for uninstalled Chromium-family browsers
      ansible.builtin.file:
        path: "{{ item.0.value.policy_dir }}/{{ item.1 }}"
        state: absent
      loop: "{{ (chromium_browsers | dict2items) | product(['omarchy.json', 'color.json']) | list }}"
      loop_control:
        label: "{{ item.0.key }} ({{ item.1 }})"
      become: true
      when: item.0.key not in apps.browser.installed

    - name: Check whether Chromium's WidevineCdm is present for Brave Origin
      ansible.builtin.stat:
        path: "{{ chromium_widevine_src }}"
      register: chromium_widevine_stat
      when: brave_origin_on | bool

    - name: Check whether Brave Origin already has a WidevineCdm entry
      ansible.builtin.stat:
        path: "{{ chromium_browsers['brave-origin'].widevine_dest }}"
      register: brave_widevine_dest_stat
      when: brave_origin_on | bool

    - name: Link Chromium's WidevineCdm into Brave Origin
      ansible.builtin.file:
        src: "{{ chromium_widevine_src }}"
        dest: "{{ chromium_browsers['brave-origin'].widevine_dest }}"
        state: link
      become: true
      when:
        - brave_origin_on | bool
        - chromium_widevine_stat.stat.exists
        - not brave_widevine_dest_stat.stat.exists or (brave_widevine_dest_stat.stat.islnk | default(false))

    - name: Remove the WidevineCdm link when Brave Origin isn't installed
      ansible.builtin.file:
        path: "{{ chromium_browsers['brave-origin'].widevine_dest }}"
        state: absent
      become: true
      when: not brave_origin_on | bool

    - name: PWA machine policy, per Chromium-family engine
      ansible.builtin.include_tasks: tasks/webapps-pwa-policy.yml
      loop: "{{ webapps_pwa_engines | dict2items }}"
      loop_control:
        loop_var: engine
        label: "{{ engine.key }}"
      vars:
        pwa_policy_on: "{{ webapps_engine == engine.key }}"
