---
# Yubikey GPG public key — imports it, assigns ultimate trust, and
# configures git to sign commits/tags with it. Opt-in: depends on the
# physical token being connected (`just apply gpg-yubikey`; the
# security-key-omarchy overlay in Setup > Security also imports the
# OpenPGP key interactively).
#
# Runs in both phases so `just apply gpg-yubikey` (or opting in alongside
# `*_verify_commit: true` for the plugin checkouts) has the key in the
# administrator's keyring before system/plugins.yml; the user phase's run is
# then a no-op for them, and the import for everyone else. No task here
# becomes root, so in the system phase it still touches only the caller's
# keyring.
#
# Never uses `become: true` for GPG or git tasks — the keyring and
# ~/.gitconfig are personal user data. gnupg itself ships with Omarchy.
# Usage: just apply gpg-yubikey
- name: Yubikey GPG public key — import, trust, sign in git
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [gpg-yubikey]

  tasks:
    # pcscd (system/yubikey.yml) holds the Yubikey's CCID interface, so
    # scdaemon's own CCID driver can't open it; go through pcscd. Before the
    # card check below, which would otherwise find no card.
    #
    # Not in shared mode (pcsc-shared): another PC/SC client selecting a
    # different applet (KeePassXC's challenge-response, ykman) drops the
    # OpenPGP applet's verified PIN, so gpg asks for it again and again
    # instead of once per insertion. scdaemon keeps the card exclusively
    # while it runs; `gpgconf --kill scdaemon` frees it for ykman.
    - name: Create ~/.gnupg
      ansible.builtin.file:
        path: "{{ yubikey_scdaemon_conf | dirname }}"
        state: directory
        mode: "0700"

    - name: "Make scdaemon use pcscd ({{ yubikey_scdaemon_conf }})"
      ansible.builtin.lineinfile:
        path: "{{ yubikey_scdaemon_conf }}"
        regexp: '^\s*{{ item }}\s*$'
        line: "{{ item }}"
        create: true
        mode: "0600"
      register: yubikey_scdaemon_conf_result
      loop: [disable-ccid]

    - name: "Drop pcsc-shared from {{ yubikey_scdaemon_conf }}"
      ansible.builtin.lineinfile:
        path: "{{ yubikey_scdaemon_conf }}"
        regexp: '^\s*pcsc-shared\s*$'
        state: absent
      register: yubikey_scdaemon_shared_result

    - name: Restart scdaemon to read its new configuration
      ansible.builtin.command: gpgconf --kill scdaemon
      when: yubikey_scdaemon_conf_result.changed or yubikey_scdaemon_shared_result.changed
      changed_when: true

    - name: Import the Yubikey's GPG public key and assign it ultimate trust
      ansible.builtin.import_tasks: tasks/yubikey-gpg-key.yml

    - name: "Configure git to sign commits/tags with the Yubikey key ({{ yubikey_gpg_signing_key | default('?') }})"
      when: yubikey_gpg_card_check.rc == 0
      block:
        - name: "git config --global user.signingkey"
          community.general.git_config:
            name: user.signingkey
            value: "{{ yubikey_gpg_signing_key }}"
            scope: global
            state: present

        - name: "git config --global commit.gpgsign true"
          community.general.git_config:
            name: commit.gpgsign
            value: "true"
            scope: global
            state: present

        - name: "git config --global tag.gpgsign true"
          community.general.git_config:
            name: tag.gpgsign
            value: "true"
            scope: global
            state: present

    - name: Note if no Yubikey/OpenPGP card was found (no action taken)
      ansible.builtin.debug:
        msg: >-
          No OpenPGP card found (gpg --card-status failed) — connect
          the Yubikey and rerun. Nothing was imported or configured.
      when: yubikey_gpg_card_check.rc != 0
