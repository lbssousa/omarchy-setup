---
# The per-user half of `omarchy-install-dev-env rust`: the official rustup
# installer, non-interactively, into ~/.cargo and ~/.rustup. The other half,
# the clang package bindgen needs, is installed in the system phase
# (system/gregorio-lsp.yml for user/gregorio-lsp.yml, the play that
# includes this file).
- name: Expect clang (installed by the system phase)
  ansible.builtin.command: pacman -Q clang
  changed_when: false

- name: Install Rust with the official rustup script
  ansible.builtin.shell: |
    set -o pipefail
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  args:
    executable: /bin/bash
    creates: "{{ target_home }}/.cargo/bin/cargo"
