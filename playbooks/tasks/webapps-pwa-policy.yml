---
# The PWA force-install policy of one Chromium-family engine
# (webapps_pwa_engines, `engine` = {key, value}; playbooks/system/apps/
# browser.yml). With pwa_policy_on, the engine's managed policy directory
# gets a WebAppInstallForceList with every user's webapps marked pwa
# (users/*.yml, plus the caller's own list), each opening in its own window with a
# desktop shortcut, which user/apps/webapps.yml turns into the launcher
# Omarchy's web app had. The browser picks the file up live. Without it,
# the file goes (the PWAs it installed are uninstalled by the browser).
- name: "[{{ engine.key }}] PWA policy"
  when: pwa_policy_on | bool
  block:
    - name: "[{{ engine.key }}] Find every user's settings"
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../../users"
        patterns: "*.yml"
        excludes: "local.example.yml"
      register: webapps_user_files

    - name: "[{{ engine.key }}] Start from the caller's own web apps"
      ansible.builtin.set_fact:
        webapps_all: "{{ webapps }}"

    - name: "[{{ engine.key }}] Add every user's web apps"
      ansible.builtin.set_fact:
        webapps_all: >-
          {{ webapps_all
             + ((lookup('ansible.builtin.file', item.path) | from_yaml | default({}, true)).webapps | default([])) }}
      loop: "{{ webapps_user_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # Only the sites that are PWAs: the browser would install any other as a
    # mere shortcut. Each from its pwa_install_url when it has one (url
    # redirects), else from url.
    - name: "[{{ engine.key }}] One install url per PWA"
      ansible.builtin.set_fact:
        webapps_install_urls: >-
          {%- set urls = [] -%}
          {%- for app in webapps_all if app.pwa | default(false) -%}
          {%- set _ = urls.append(app.pwa_install_url | default(app.url)) -%}
          {%- endfor -%}
          {{ urls | unique | list }}

    - name: "[{{ engine.key }}] Create {{ engine.value.policy_dir }}"
      ansible.builtin.file:
        path: "{{ engine.value.policy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    # default_launch_container only applies when the browser has no display
    # mode of its own for the app yet. One it already has (set by the user,
    # or synced from another device: YouTube's app id is the one Chrome
    # preinstalls, "open in tab") wins, and --app-id= opens a tab. Set it
    # once by hand: chrome://apps, right-click the app, Open as window.
    - name: "[{{ engine.key }}] Force-install every web app as a PWA"
      ansible.builtin.copy:
        dest: "{{ engine.value.policy_dir }}/{{ webapps_pwa_policy_file }}"
        owner: root
        group: root
        mode: "0644"
        content: >-
          {{ {'WebAppInstallForceList': webapps_install_urls | map('community.general.dict_kv', 'url')
              | map('combine', {'default_launch_container': 'window', 'create_desktop_shortcut': true})
              | list}
             | to_nice_json(indent=2) }}
      become: true

- name: "[{{ engine.key }}] Remove the PWA policy (not the default browser's engine)"
  ansible.builtin.file:
    path: "{{ engine.value.policy_dir }}/{{ webapps_pwa_policy_file }}"
    state: absent
  become: true
  when: not pwa_policy_on | bool
