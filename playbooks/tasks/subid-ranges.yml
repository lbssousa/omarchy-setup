---
# Rootless Podman needs a subuid/subgid range. useradd allocates one for
# accounts it creates (SUB_UID_* in /etc/login.defs), so this only fills in an
# account that predates that or was created without it: it gets the next free
# range after every existing one, never a fixed start that could overlap
# another account's.
#
# Runs as root.
- name: Give you a subuid/subgid range that overlaps nobody's
  ansible.builtin.shell: |
    set -euo pipefail
    changed=0
    for kind in uid gid; do
      file=/etc/sub$kind
      touch "$file"
      grep -q "^{{ target_user }}:" "$file" && continue
      start=$(awk -F: -v min={{ podman_subuid_start }} '
        { end = $2 + $3; if (end > max) max = end }
        END { print (max > min ? max : min) }' "$file")
      usermod --add-sub${kind}s "$start-$((start + {{ podman_subuid_count }} - 1))" "{{ target_user }}"
      changed=1
    done
    echo "changed=$changed"
  args:
    executable: /bin/bash
  register: subid_ranges_result
  changed_when: "'changed=1' in subid_ranges_result.stdout"
  become: true
