---
# AppArmor as an active kernel LSM. Not part of `just setup` — it rewrites
# the kernel command line (needs a reboot to take effect), so it only runs
# when called explicitly.
#
# The Omarchy kernel (linux-omarchy) is already built with
# CONFIG_SECURITY_APPARMOR=y, but the default CONFIG_LSM
# ("landlock,lockdown,yama,integrity,bpf") leaves it out, so
# /sys/kernel/security/lsm doesn't list it. What snapd's strict confinement
# needs is AppArmor active at boot: `lsm=` on the kernel command line. It
# REPLACES the whole list, so the value below is the default one with
# `apparmor` added (Arch wiki's recommended order) — dropping the others
# would silently turn off Landlock/Yama.
#
# The command line is assembled by limine-entry-tool from /etc/default/limine
# plus the drop-ins in /etc/limine-entry-tool.d/*.conf — the mechanism Omarchy's
# own hardware fixes use (see /usr/share/omarchy/install/hardware/intel/fred.sh).
# So this playbook writes its own drop-in, /etc/limine-entry-tool.d/apparmor.conf,
# and runs `limine-update` (as playbooks/limine-silent-boot.yml does), which
# rebuilds the UKIs and re-enrolls the Limine config checksum (Secure Boot's
# ENABLE_ENROLL_LIMINE_CONFIG=yes). It does NOT use `omarchy-refresh-limine`,
# which overwrites /boot/limine.conf with the stock template and would drop the
# silent-boot settings. Snapper snapshot entries keep the command line they
# were taken with, so they boot without AppArmor — harmless.
#
# Two variants, picked by apparmor_load_profiles (group_vars/all/main.yml, or
# `-e apparmor_load_profiles=true` on the command line):
#
#   false (default; `just apparmor`) — kernel LSM only. AppArmor is active,
#     but apparmor.service is disabled, so none of the distro profiles in
#     /etc/apparmor.d are loaded and the desktop behaves exactly as before.
#     snapd still loads its own snap profiles (snapd.apparmor.service,
#     enabled by playbooks/snapd.yml), so strict snaps get confined. The
#     lowest-risk way to get what snapd wants.
#
#   true (`just apparmor-profiles`) — also enables apparmor.service, which loads
#     the ~145 profiles the apparmor package ships. Most of the ~70 desktop
#     ones (Firefox, Chromium, Flatpak, Podman, ...) are `flags=(unconfined)`
#     stubs with no effect; what really gets enforced on this machine is:
#       - unix-chkpwd  — the PAM password helper (hyprlock, login). The only
#                        one with a real lock-out risk: keep a TTY logged in
#                        the first time, and if it misbehaves, run
#                        `sudo aa-complain /etc/apparmor.d/unix-chkpwd`.
#       - avahi-daemon — mDNS; the printer's .local name resolves through it.
#       - ping, nvidia_modprobe, lsb_release, zgrep.
#     Docker (installed, service disabled) would also get its docker-default
#     profile if enabled with AppArmor active.
#
# Switching variants later just rerun with the other value: the drop-in is
# unchanged, only apparmor.service's enabled state flips.
#
# After the reboot: `aa-enabled` (prints Yes), `aa-status`, and
# `journalctl -k | grep 'apparmor="DENIED"'` for denials. To roll back, delete
# /etc/limine-entry-tool.d/apparmor.conf and run `limine-update` (or boot the
# Limine fallback entry if something goes wrong at boot).
#
# Usage: ansible-playbook playbooks/apparmor.yml --ask-become-pass
#        ansible-playbook playbooks/apparmor.yml --ask-become-pass -e apparmor_load_profiles=true
- name: AppArmor (kernel LSM, optionally with the distro profiles)
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Check the bootloader is Limine + limine-entry-tool
      ansible.builtin.command: pacman -Qi limine limine-mkinitcpio-hook
      register: apparmor_limine_check
      changed_when: false
      failed_when: false

    - name: Fail if the bootloader isn't Limine + limine-entry-tool
      ansible.builtin.fail:
        msg: >-
          This playbook adds a limine-entry-tool drop-in to set the kernel
          command line — only present when limine-mkinitcpio-hook is
          installed. Doesn't apply to GRUB/systemd-boot.
      when: apparmor_limine_check.rc != 0

  tasks:
    - name: Install AppArmor's userspace (apparmor_parser, aa-* tools, profiles)
      community.general.pacman:
        name: "{{ apparmor_package }}"
        state: present
      become: true

    - name: Add AppArmor to the kernel's LSM list (limine-entry-tool drop-in)
      ansible.builtin.copy:
        dest: "{{ apparmor_limine_dropin }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # AppArmor as an active LSM (playbooks/apparmor.yml). lsm= replaces
          # the kernel's default list, so it lists every LSM to keep.
          KERNEL_CMDLINE[default]+=" lsm={{ apparmor_lsm }}"
      become: true
      register: apparmor_dropin

    - name: Apply — rebuild UKIs and re-enroll the config checksum (when changed)
      ansible.builtin.command: limine-update
      become: true
      when: apparmor_dropin.changed

    - name: Enable apparmor.service only in the "load the distro profiles" variant
      ansible.builtin.systemd_service:
        name: "{{ apparmor_service }}"
        enabled: "{{ apparmor_load_profiles | bool }}"
      become: true

    - name: Read the LSMs active in the running kernel
      ansible.builtin.slurp:
        src: "{{ apparmor_active_lsm_file }}"
      register: apparmor_active_lsm_raw

    - name: Check whether AppArmor is already active
      ansible.builtin.set_fact:
        apparmor_active: "{{ 'apparmor' in (apparmor_active_lsm_raw.content | b64decode | trim).split(',') }}"

    # Only when AppArmor is already active (a rerun after the reboot): before
    # that the unit's ConditionSecurity=apparmor makes a start a silent no-op.
    - name: Load the distro profiles now (AppArmor already active)
      ansible.builtin.systemd_service:
        name: "{{ apparmor_service }}"
        state: started
      become: true
      when: apparmor_active and apparmor_load_profiles | bool

    - name: Report what's left to do
      ansible.builtin.debug:
        msg: >-
          {{ 'AppArmor is active in the running kernel.'
             if apparmor_active else
             'Reboot to activate AppArmor (lsm=' ~ apparmor_lsm ~ ' takes effect at boot).' }}
          Variant: {{ 'kernel LSM + distro profiles (apparmor.service enabled)'
                      if apparmor_load_profiles | bool else
                      'kernel LSM only (apparmor.service disabled, no distro profiles)' }}.
