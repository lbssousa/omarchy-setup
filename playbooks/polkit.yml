---
# Polkit side of privilege escalation. This repo escalates with run0
# (ansible.cfg's become_method), which authenticates through polkit.
#
# 1. Raises polkitd's authentication cache window (ExpirationSeconds,
#    default 300s), so polkit-based desktop tools (pkexec and friends)
#    don't re-prompt every few minutes. It doesn't help run0: checked on
#    this machine, polkit doesn't carry a run0 authorization over to the
#    next run0 process, which is why playbooks run under run-empowered.sh.
#
# 2. Removes the /etc/sudoers.d drop-in that an earlier version of this
#    repo installed (playbooks/sudo.yml, now gone) to shorten sudo's
#    passwd_timeout: back when `become` used sudo, it kept an unattended
#    terminal from hanging on the fingerprint prompt. run0 never reads
#    sudoers, so the file does nothing now.
#
# 3. Disables the systemd --user OpenSSH agent (ssh-agent.socket +
#    ssh-agent.service) if a past `just setup` run enabled it. It used
#    to be enabled unconditionally: its only consumer, KeePassXC, was
#    still imported by site.yml back then (playbooks/keepassxc.yml is
#    optional now, not imported — see the README). `just keepassxc` /
#    `just ssh-agent` re-enable it on demand.
- name: polkitd ExpirationSeconds + legacy cleanup (sudoers drop-in, OpenSSH agent)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [polkit]

  tasks:
    - name: "Set ExpirationSeconds={{ polkit_expiration_seconds }} in /etc/polkit-1/polkitd.conf"
      community.general.ini_file:
        path: /etc/polkit-1/polkitd.conf
        section: Polkitd
        option: ExpirationSeconds
        value: "{{ polkit_expiration_seconds }}"
        create: true
        mode: "0644"
      become: true
      notify: reload polkit

    - name: Remove the legacy sudo passwd_timeout drop-in
      ansible.builtin.file:
        path: /etc/sudoers.d/omarchy-setup-passwd-timeout
        state: absent
      become: true

    - name: "Disable the OpenSSH agent (no longer enabled by just setup — see playbooks/keepassxc.yml)"
      ansible.builtin.systemd:
        name: "{{ item }}"
        scope: user
        enabled: false
        state: stopped
      loop: "{{ ssh_agent_units }}"

  handlers:
    - name: reload polkit
      ansible.builtin.systemd:
        name: polkit
        state: reloaded
      become: true
      listen: reload polkit
