---
# Password managers, system phase (apps: password). The packages come from
# apps/packages.yml; this adds:
#
#   Bitwarden (Flatpak)  the D-Bus names its tray icon needs and XWayland,
#                        for copying passwords (see
#                        bitwarden_flatpak_own_names / bitwarden_flatpak_env)
#   Bitwarden (either)   the polkit action its biometric unlock needs, from
#                        https://bitwarden.com/help/biometrics/ (removed when
#                        neither build is installed)
#   KeePassXC (Flatpak)  the D-Bus names its tray icon needs
#
# The keybind, autostart and SSH agent are per user, for the default one
# (user/apps/password.yml).
- name: Apps — password managers
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [apps]

  vars:
    bitwarden_any_on: "{{ apps.password.installed | intersect(['bitwarden-flatpak', 'bitwarden']) | length > 0 }}"

  tasks:
    - name: Bitwarden (Flatpak) overrides
      ansible.builtin.include_tasks: tasks/flatpak-overrides.yml
      vars:
        override_app: "{{ bitwarden_flatpak_id }}"
        override_own_names: "{{ bitwarden_flatpak_own_names }}"
        override_env: "{{ bitwarden_flatpak_env }}"
      when: "'bitwarden-flatpak' in apps.password.installed"

    - name: Install the Bitwarden polkit action (biometric unlock)
      ansible.builtin.copy:
        src: com.bitwarden.Bitwarden.policy
        dest: "{{ bitwarden_polkit_action_dest }}"
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: restart polkit
      when: bitwarden_any_on | bool

    - name: Remove the Bitwarden polkit action (no Bitwarden installed)
      ansible.builtin.file:
        path: "{{ bitwarden_polkit_action_dest }}"
        state: absent
      become: true
      notify: restart polkit
      when: not bitwarden_any_on | bool

    - name: KeePassXC (Flatpak) overrides
      ansible.builtin.include_tasks: tasks/flatpak-overrides.yml
      vars:
        override_app: "{{ keepassxc_flatpak_id }}"
        override_own_names: "{{ keepassxc_flatpak_own_names }}"
      when: "'keepassxc-flatpak' in apps.password.installed"

  handlers:
    - name: restart polkit
      ansible.builtin.systemd:
        name: polkit
        state: restarted
      become: true
      listen: restart polkit
