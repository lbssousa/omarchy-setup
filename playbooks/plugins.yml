---
# Everything that puts a third-party plugin into the Omarchy shell, one play
# per source (each with its own tag, so `--tags pinentry` etc. still run
# alone; the plays below the first are the plugins that also ship a binary
# and are deployed from a signed release tag):
#
#   plugins       omarchy_plugins list, via `omarchy plugin add`
#   pinentry      pinentry-omarchy  (lbssousa.pinentry)
#   ssh-askpass   ssh-askpass-omarchy  (lbssousa.ssh_askpass)
#   polkit-agent  polkit-omarchy  (lbssousa.polkit)
#
# Play 1 — installs this desktop's list of third-party Omarchy shell plugins:
# omarchy_plugins in group_vars/all/main.yml (Radio Atlas first). Each entry
# is cloned by `omarchy plugin add` into ~/.config/omarchy/plugins/<id>,
# pinned to its `ref`, enabled, and moved to the bar section the entry asks
# for: the icon's place in the bar is part of the setup, not something left
# to whichever defaultSection the manifest happens to declare.
#
# Why the play drives `omarchy plugin add` per entry instead of taking a URL
# to type:
# - add is the only supported installer: it clones, validates the manifest,
#   refuses an id another plugin already claims, moves the clone into place
#   and rescans. It runs no plugin code, no install hook, no sudo.
# - It refuses to continue when it isn't interactive unless --yes is passed,
#   so the play passes it: the repos and pins are listed (and reviewed) in
#   group_vars, which is the review add asks for.
# - --enable is deliberately not passed. With --yes, add skips its placement
#   prompt and lets the shell fall back to the manifest's defaultSection
#   ("left" for Radio Atlas). `omarchy plugin enable <id> --section <s>` below
#   both enables and moves — PluginRegistry.setEnabled calls moveBarEntry when
#   the widget is already on the bar — so it is idempotent and also pulls an
#   icon moved by hand back to where the list says. With a section and no
#   index, the shell anchors the widget right after omarchy.tray
#   (PluginRegistry.barTarget), i.e. first in the right-hand group.
# - add fails when the id's directory already exists, so the play only adds
#   what is missing — omarchy-plugin-catalog, which walks the plugin dirs, is
#   the authority on what's installed — and otherwise leaves the clone alone.
#   Updating is `omarchy plugin update <id>`, which fast-forwards a pinned
#   checkout off its tag; bump `ref` and re-run instead.
#
# The last tasks re-read the plugin list and the bar layout and fail unless
# every entry is enabled and sits in its section: a clone that only got
# installed, or a widget enabled without landing in the bar, stays inert and
# nothing above fails on it.
#
# Must run inside the graphical session — the shell is the IPC target.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags plugins
- name: Omarchy shell plugins (omarchy_plugins)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [plugins]

  tasks:
    - name: Ping the shell (enabling a plugin is a call to the live shell)
      ansible.builtin.command: omarchy-shell shell ping
      register: plugins_ping
      changed_when: false
      failed_when: false

    - name: Fail early when omarchy-shell isn't running
      ansible.builtin.fail:
        msg: >-
          omarchy-shell didn't answer a ping (rc {{ plugins_ping.rc }}), so
          it isn't running: enabling and placing a plugin happens inside the
          live shell. Run this from inside the graphical session.
      when: plugins_ping.rc != 0

    - name: Collect the runtime dependencies of every plugin in the list
      ansible.builtin.set_fact:
        plugins_packages: "{{ omarchy_plugins | map(attribute='packages', default=[]) | flatten | unique }}"

    - name: "Check which of them pacman is missing ({{ plugins_packages | join(', ') }})"
      # `pacman -T` prints the targets it can't find and exits 127, so probing
      # first keeps the privileged install out of the run on a stock Omarchy,
      # where every plugin's dependencies already ship.
      ansible.builtin.command:
        argv: [pacman, -T, "{{ item }}"]
      loop: "{{ plugins_packages }}"
      register: plugins_dep_probe
      changed_when: false
      failed_when: false

    - name: Install the missing runtime dependencies
      community.general.pacman:
        name: "{{ plugins_dep_probe.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | list }}"
        state: present
      become: true
      when: plugins_dep_probe.results | selectattr('rc', 'ne', 0) | list | length > 0

    - name: Read the plugin catalog (what is installed on disk)
      ansible.builtin.command: omarchy-plugin-catalog
      register: plugins_catalog
      changed_when: false

    - name: "Install the plugins that aren't on disk yet"
      ansible.builtin.command:
        argv: [omarchy-plugin-add, "{{ item.repo }}", --yes]
      loop: "{{ omarchy_plugins }}"
      loop_control:
        label: "{{ item.id }}"
      register: plugins_add_result
      failed_when: false
      when: item.id not in (plugins_catalog.stdout | from_json | map(attribute='id') | list)

    # Kept as its own task (instead of a block/rescue, which can't take a
    # loop here): omarchy plugin add's own message is the useful part, this
    # only adds what to do about the one case it can't explain.
    - name: "Explain a clone that omarchy plugin add refused"
      ansible.builtin.fail:
        msg: >-
          `omarchy plugin add {{ item.item.repo }}` failed (rc {{ item.rc }}):
          {{ item.stderr | default('unknown error') | trim }}. It refuses to
          install when another plugin already claims the id, and when the
          target directory exists — a directory left behind by a run that
          died before its manifest landed looks exactly like an installed
          plugin. Clear it (`omarchy plugin remove {{ item.item.id }}`, or
          delete {{ omarchy_plugins_dir }}/{{ item.item.id }}) and re-run.
      loop: "{{ plugins_add_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.id }}"
      when: item.rc | default(0) != 0

    - name: Let the shell discover the plugins
      # Not conditional on the adds having happened: a clone that was already
      # on disk but never rescanned (a run that died before add's own
      # rescanPlugins, or one added by hand) is unknown to the registry, and
      # omarchy-plugin-enable then fails with "plugin '<id>' is not known; run:
      # omarchy-shell shell rescanPlugins". A rescan is cheap and idempotent.
      ansible.builtin.command:
        argv: [omarchy-shell, shell, rescanPlugins]
      changed_when: false

    - name: Read the plugin catalog again (the adds are on disk now)
      ansible.builtin.command: omarchy-plugin-catalog
      register: plugins_catalog_final
      changed_when: false

    - name: "Assert each entry's id is the one its repo actually ships"
      ansible.builtin.fail:
        msg: >-
          {{ item.repo }} cloned fine, but no installed manifest declares the
          id {{ item.id }}, so nothing can enable it and the bar icon would
          never show up. Upstream must have renamed the plugin or moved it:
          the catalog lists these third-party ids —
          {{ plugins_catalog_final.stdout | from_json | rejectattr('firstParty') | map(attribute='id') | join(', ') }}.
          Fix `id` (and re-read the release) in
          group_vars/all/main.yml.
      loop: "{{ omarchy_plugins }}"
      loop_control:
        label: "{{ item.id }}"
      when: item.id not in (plugins_catalog_final.stdout | from_json | map(attribute='id') | list)

    - name: Pin each plugin to the ref its entry names
      # A detached checkout at the pin: for code that runs unsandboxed in the
      # shell, the pinned ref is the record of what was reviewed. `omarchy
      # plugin update` fast-forwards a pinned clone off its tag (a detached
      # HEAD still takes the fast-forward) and the next run pins it back;
      # bump `ref` to move forward on purpose.
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          dir={{ (omarchy_plugins_dir ~ '/' ~ item.id) | quote }}
          if ! target=$(git -C "$dir" rev-parse --verify --quiet {{ item.ref | quote }}^{commit}); then
            git -C "$dir" fetch --quiet origin {{ item.ref | quote }}
            target=$(git -C "$dir" rev-parse --verify {{ item.ref | quote }}^{commit})
          fi
          current=$(git -C "$dir" rev-parse HEAD)
          if [ "$target" = "$current" ]; then
            echo "already at $target"
            exit 0
          fi
          git -C "$dir" checkout --quiet --detach "$target"
          echo "checked out $target"
      register: plugins_pin_result
      loop: "{{ omarchy_plugins }}"
      loop_control:
        label: "{{ item.id }} ({{ item.ref }})"
      when: item.ref | default('') != ''
      changed_when: "'checked out' in plugins_pin_result.stdout | default('')"
      failed_when: false

    - name: "Explain a ref a checkout can't reach"
      ansible.builtin.fail:
        msg: >-
          Couldn't pin {{ item.item.id }} to {{ item.item.ref }}:
          {{ item.stderr | default('unknown error') | trim }}. The pin must be
          a tag, branch or commit the repo has (`git ls-remote --tags
          {{ item.item.repo }}`) — if it was renamed upstream, bump `ref` in
          group_vars/all/main.yml.
      loop: "{{ plugins_pin_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.id }}"
      when: item.rc | default(0) != 0

    - name: List the shell plugins
      ansible.builtin.command:
        argv: [omarchy-plugin-list, --json]
      register: plugins_list
      changed_when: false

    - name: Read the bar layout (which section each widget sits in)
      ansible.builtin.command:
        argv:
          - jq
          - -c
          - >-
            [.bar.layout | to_entries[] | .key as $section | .value[]
            | (if type == "object" then .id else . end) as $id
            | {key: $id, value: $section}] | from_entries
          - "{{ omarchy_plugins_shell_json }}"
      register: plugins_bar_layout
      changed_when: false

    - name: "Enable each plugin, in the bar section its entry asks for"
      ansible.builtin.command:
        argv: >-
          {{ ['omarchy-plugin-enable', item.id]
          + (['--section', item.section] if item.section | default('') else []) }}
      loop: "{{ omarchy_plugins }}"
      loop_control:
        label: "{{ item.id }}"
      register: plugins_enable_result
      vars:
        enabled_ids: "{{ plugins_list.stdout | from_json | selectattr('enabled') | map(attribute='id') | list }}"
        bar_sections: "{{ plugins_bar_layout.stdout | from_json }}"
      when: >-
        item.id not in enabled_ids
        or ((item.section | default('') != '')
        and (bar_sections[item.id] | default('')) != item.section)

    - name: Restart the shell so the new code and the bar layout take effect
      ansible.builtin.command: omarchy-restart-shell
      when: >-
        plugins_add_result is changed
        or plugins_pin_result is changed
        or plugins_enable_result is changed
      changed_when: true

    - name: List the shell plugins again (after the restart)
      ansible.builtin.command:
        argv: [omarchy-plugin-list, --json]
      register: plugins_list_after
      changed_when: false

    - name: Read the bar layout again (after the restart)
      ansible.builtin.command:
        argv:
          - jq
          - -c
          - >-
            [.bar.layout | to_entries[] | .key as $section | .value[]
            | (if type == "object" then .id else . end) as $id
            | {key: $id, value: $section}] | from_entries
          - "{{ omarchy_plugins_shell_json }}"
      register: plugins_bar_layout_after
      changed_when: false

    - name: "Assert each plugin is enabled, in its bar section"
      vars:
        entry: "{{ plugins_list_after.stdout | from_json | selectattr('id', 'equalto', item.id) | first | default({}) }}"
        sections: "{{ plugins_bar_layout_after.stdout | from_json }}"
      ansible.builtin.fail:
        msg: >-
          {{ item.name }} ({{ item.id }}) isn't in the state omarchy_plugins
          asks for: it is
          {{ 'enabled' if entry.enabled | default(false) else 'not enabled' }},
          and sits
          {{ 'in the ' + sections[item.id] + ' section of the bar' if sections[item.id] | default('') else 'nowhere in the bar layout' }}
          {{ '(expected ' + item.section + ')' if item.section | default('') }}.
          Check `omarchy plugin list` and
          {{ omarchy_plugins_shell_json }}, then enable it by hand with
          `omarchy plugin enable {{ item.id }}{{ ' --section ' + item.section if item.section | default('') }}`
          — that also moves an icon that is already on the bar.
      loop: "{{ omarchy_plugins }}"
      loop_control:
        label: "{{ item.id }}"
      when: >-
        not (entry.enabled | default(false))
        or (item.section | default('') != ''
        and (sections[item.id] | default('')) != item.section)

# pinentry-omarchy — GnuPG's PIN/passphrase prompts (Yubikey card PIN,
# key passphrases) in the same overlay dialog as Omarchy's polkit agent,
# instead of the stock gtk/qt/curses pinentry
# (https://github.com/lbssousa/pinentry-omarchy).
#
# It has two halves: a Rust pinentry binary that gpg-agent runs, and a
# third-party omarchy-shell plugin (lbssousa.pinentry) that draws the
# dialog. They talk over $XDG_RUNTIME_DIR/pinentry-omarchy.sock. Without a
# Wayland session or with the shell down, the binary execs
# pinentry-gnome3/pinentry-curses instead, so gpg keeps working over SSH
# or from a TTY.
#
# The repo's own PKGBUILD (packaging/) builds the package, which is then
# installed with pacman:
# - makepkg runs with --nodeps, because cargo comes from rustup in
#   ~/.cargo (installed like playbooks/gregorio-lsp.yml does, via
#   `omarchy-install-dev-env rust`), which pacman doesn't know about.
# - It runs as the user, never with become: makepkg refuses to run as root.
# - A rebuild happens only when the checkout changed or the package is
#   missing.
#
# Third-party shell plugins are only discovered in
# ~/.config/omarchy/plugins/, so the packaged plugin
# (/usr/share/pinentry-omarchy/plugin) is symlinked there. It is then
# enabled through the shell's IPC, which records it in
# ~/.config/omarchy/shell.json. That step needs omarchy-shell running (run
# the playbook from inside the graphical session).
#
# The package is built, and installed as root, from whatever the checkout
# holds. So the playbook checks out a release tag (pinentry_omarchy_ref),
# never main, and requires that tag's GPG signature to verify and to come
# from one of pinentry_omarchy_signing_keys:
# - verify_commit makes the git module run `git verify-tag` for an
#   annotated tag.
# - gpg_allowlist pins the signer.
# The releases are signed with the Yubikey's OpenPGP key, which
# playbooks/yubikey.yml imports (`just gpg-yubikey`). main itself only
# holds squash merges signed by GitHub's key, so it isn't deployable.
#
# The plugin is a keepLoaded service, and those survive the shell's plugin
# hot-reload. So after the package changes, the shell is restarted to load
# the new QML.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags pinentry
- name: pinentry-omarchy (GnuPG prompts in the polkit-style shell dialog)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [pinentry]

  vars:
    pinentry_omarchy_cargo_env:
      PATH: "{{ pinentry_omarchy_cargo_bin_dir }}:{{ ansible_facts.env.PATH }}"

  tasks:
    - name: Install build/runtime dependencies (gnupg, stock pinentry for the fallback)
      community.general.pacman:
        name:
          - base-devel
          - git
          - gnupg
          - pinentry
        state: present
      become: true

    - name: Check whether Rust (cargo) is already installed
      ansible.builtin.stat:
        path: "{{ pinentry_omarchy_cargo_bin_dir }}/cargo"
      register: pinentry_omarchy_cargo_stat

    - name: Install Rust (omarchy-install-dev-env rust)
      ansible.builtin.command: omarchy-install-dev-env rust
      when: not pinentry_omarchy_cargo_stat.stat.exists

    - name: Check that the release signing key is in the GPG keyring
      ansible.builtin.command: "gpg --list-keys --with-colons {{ item }}"
      loop: "{{ pinentry_omarchy_signing_keys }}"
      register: pinentry_omarchy_key_check
      changed_when: false
      failed_when: false
      when: pinentry_omarchy_verify_commit

    - name: Fail early if the signing key is missing (run `just gpg-yubikey`)
      ansible.builtin.fail:
        msg: >-
          pinentry-omarchy is deployed from a release tag whose GPG signature is
          verified, and the signing key isn't in your keyring yet
          ({{ pinentry_omarchy_signing_keys | join(', ') }}). Import it first with
          `just gpg-yubikey` (Yubikey plugged in): that playbook is a
          dependency of this one. Set pinentry_omarchy_verify_commit=false only
          for an unsigned fork.
      when: >-
        pinentry_omarchy_verify_commit
        and (pinentry_omarchy_key_check.results | selectattr('rc', 'ne', 0) | list | length) > 0

    - name: "Check out the pinentry-omarchy release ({{ pinentry_omarchy_ref }})"
      block:
        - name: "Check out the pinentry-omarchy release ({{ pinentry_omarchy_ref }}), verifying its signed tag"
          ansible.builtin.git:
            repo: "{{ pinentry_omarchy_repo }}"
            dest: "{{ pinentry_omarchy_checkout_dir }}"
            version: "{{ pinentry_omarchy_ref }}"
            force: false
            verify_commit: "{{ pinentry_omarchy_verify_commit }}"
            gpg_allowlist: "{{ pinentry_omarchy_signing_keys if pinentry_omarchy_verify_commit else [] }}"
          register: pinentry_omarchy_git_result
      rescue:
        - name: Explain a failed signature check
          ansible.builtin.fail:
            msg: >-
              Couldn't check out {{ pinentry_omarchy_repo }}
              ({{ pinentry_omarchy_ref }}) with a verified GPG signature:
              {{ ansible_failed_result.msg | default('unknown error') }}.
              pinentry_omarchy_ref must be a release tag signed with one of
              pinentry_omarchy_signing_keys (the Yubikey's OpenPGP key). A
              branch like main won't do, because its merges are signed by
              GitHub. If the key is missing from the keyring, import it with
              `just gpg-yubikey` (token plugged in). Set
              pinentry_omarchy_verify_commit=false only for an unsigned fork.

    - name: Check whether the package is installed
      ansible.builtin.command: pacman -Q pinentry-omarchy
      register: pinentry_omarchy_installed
      changed_when: false
      failed_when: false

    - name: Build and install the package
      when: pinentry_omarchy_git_result.changed or pinentry_omarchy_installed.rc != 0
      block:
        - name: Build the package (makepkg)
          ansible.builtin.command:
            cmd: makepkg -f --nodeps --noconfirm
            chdir: "{{ pinentry_omarchy_checkout_dir }}/packaging"
          environment: "{{ pinentry_omarchy_cargo_env }}"

        - name: Locate the built package
          ansible.builtin.command:
            cmd: makepkg --packagelist
            chdir: "{{ pinentry_omarchy_checkout_dir }}/packaging"
          register: pinentry_omarchy_packagelist
          changed_when: false

        - name: Install the package
          community.general.pacman:
            name: "{{ pinentry_omarchy_packagelist.stdout_lines | first }}"
            state: present
          become: true
          register: pinentry_omarchy_package_result

    - name: Create ~/.config/omarchy/plugins
      ansible.builtin.file:
        path: "{{ pinentry_omarchy_plugin_link | dirname }}"
        state: directory
        mode: "0755"

    - name: "Link the packaged shell plugin ({{ pinentry_omarchy_plugin_link }})"
      ansible.builtin.file:
        src: "{{ pinentry_omarchy_plugin_dir }}"
        dest: "{{ pinentry_omarchy_plugin_link }}"
        state: link
        force: true
      register: pinentry_omarchy_link_result

    - name: Read the shell config
      ansible.builtin.slurp:
        src: "{{ pinentry_omarchy_shell_json }}"
      register: pinentry_omarchy_shell_json_raw
      failed_when: false

    - name: Work out whether the plugin is already enabled
      ansible.builtin.set_fact:
        pinentry_omarchy_plugin_enabled: >-
          {{ (pinentry_omarchy_shell_json_raw.content is defined)
             and (((pinentry_omarchy_shell_json_raw.content | b64decode | from_json).plugins | default([]))
                  | selectattr('id', 'equalto', pinentry_omarchy_plugin_id) | list | length > 0) }}

    - name: "Enable the {{ pinentry_omarchy_plugin_id }} shell plugin"
      ansible.builtin.command:
        argv: [omarchy-shell, shell, enablePlugin, "{{ pinentry_omarchy_plugin_id }}", "{}"]
      register: pinentry_omarchy_enable_result
      failed_when: pinentry_omarchy_enable_result.rc != 0 or pinentry_omarchy_enable_result.stdout | trim != 'ok'
      when: not pinentry_omarchy_plugin_enabled

    - name: Restart the shell to load the new plugin code
      ansible.builtin.command: omarchy-restart-shell
      when: >-
        (pinentry_omarchy_package_result is changed or pinentry_omarchy_link_result is changed)
        and pinentry_omarchy_enable_result is skipped
      changed_when: true

    - name: Create ~/.gnupg
      ansible.builtin.file:
        path: "{{ pinentry_omarchy_gpg_agent_conf | dirname }}"
        state: directory
        mode: "0700"

    - name: "Use pinentry-omarchy in gpg-agent ({{ pinentry_omarchy_gpg_agent_conf }})"
      ansible.builtin.lineinfile:
        path: "{{ pinentry_omarchy_gpg_agent_conf }}"
        regexp: '^\s*pinentry-program\s'
        line: "pinentry-program {{ pinentry_omarchy_program }}"
        create: true
        mode: "0600"
      register: pinentry_omarchy_agent_conf_result

    - name: Reload gpg-agent
      ansible.builtin.command: gpgconf --reload gpg-agent
      when: pinentry_omarchy_agent_conf_result.changed or pinentry_omarchy_package_result is changed
      changed_when: true

# Installs ssh-askpass-omarchy (https://github.com/lbssousa/ssh-askpass-omarchy)
# from a release tag (ssh_askpass_ref), checked out in
# ssh_askpass_checkout_dir only after the tag's GPG signature verifies and
# comes from one of ssh_askpass_signing_keys: the build runs as the user,
# and the result is installed as root. Releases are signed tags made on the
# merged commit (see the "Releases" section of its README); main only holds
# GitHub-signed squash merges, so it isn't deployable.
# This compiles the Rust binary (--locked, from the repo's Cargo.lock),
# installs it to /usr/bin,
# links the shell plugin, enables it via omarchy-shell IPC,
# and configures SSH to use it.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags ssh-askpass
- name: ssh-askpass-omarchy (SSH prompts in the polkit-style shell dialog)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [ssh-askpass]

  vars:
    ssh_askpass_cargo_env:
      PATH: "{{ ssh_askpass_cargo_bin_dir }}:{{ ansible_facts.env.PATH }}"

  tasks:
    - name: Install git and gnupg (the signature check needs both)
      community.general.pacman:
        name:
          - git
          - gnupg
        state: present
      become: true

    - name: Check that the release signing key is in the GPG keyring
      ansible.builtin.command: "gpg --list-keys --with-colons {{ item }}"
      loop: "{{ ssh_askpass_signing_keys }}"
      register: ssh_askpass_key_check
      changed_when: false
      failed_when: false
      when: ssh_askpass_verify_commit

    - name: Fail early if the signing key is missing (run `just gpg-yubikey`)
      ansible.builtin.fail:
        msg: >-
          ssh-askpass-omarchy is deployed from a release tag whose GPG signature is
          verified, and the signing key isn't in your keyring yet
          ({{ ssh_askpass_signing_keys | join(', ') }}). Import it first with
          `just gpg-yubikey` (Yubikey plugged in): that playbook is a
          dependency of this one. Set ssh_askpass_verify_commit=false only
          for an unsigned fork.
      when: >-
        ssh_askpass_verify_commit
        and (ssh_askpass_key_check.results | selectattr('rc', 'ne', 0) | list | length) > 0

    - name: "Check out the ssh-askpass-omarchy release ({{ ssh_askpass_ref }}), verifying its signed tag"
      block:
        - name: "Check out the ssh-askpass-omarchy release ({{ ssh_askpass_ref }}), verifying its signed tag"
          ansible.builtin.git:
            repo: "{{ ssh_askpass_repo }}"
            dest: "{{ ssh_askpass_checkout_dir }}"
            version: "{{ ssh_askpass_ref }}"
            force: false
            verify_commit: "{{ ssh_askpass_verify_commit }}"
            gpg_allowlist: "{{ ssh_askpass_signing_keys if ssh_askpass_verify_commit else [] }}"
          register: ssh_askpass_git_result
      rescue:
        - name: Explain a failed signature check
          ansible.builtin.fail:
            msg: >-
              Couldn't check out {{ ssh_askpass_repo }}
              ({{ ssh_askpass_ref }}) with a verified GPG signature:
              {{ ansible_failed_result.msg | default('unknown error') }}.
              ssh_askpass_ref must be a release tag signed with one of
              ssh_askpass_signing_keys (the Yubikey's OpenPGP key). A branch
              like main won't do, because its merges are signed by GitHub.
              If the key is missing from the keyring, import it with
              `just gpg-yubikey` (token plugged in). Set
              ssh_askpass_verify_commit=false only for an unsigned fork.

    - name: Check whether Rust (cargo) is already installed
      ansible.builtin.stat:
        path: "{{ ssh_askpass_cargo_bin_dir }}/cargo"
      register: ssh_askpass_cargo_stat

    - name: Install Rust (omarchy-install-dev-env rust)
      ansible.builtin.command: omarchy-install-dev-env rust
      when: not ssh_askpass_cargo_stat.stat.exists

    - name: Build the ssh-askpass-omarchy binary
      ansible.builtin.command:
        cmd: cargo build --release --locked
        chdir: "{{ ssh_askpass_checkout_dir }}"
      environment: "{{ ssh_askpass_cargo_env }}"
      register: ssh_askpass_build_result

    - name: Create system directories for ssh-askpass-omarchy
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /usr/bin
        - "{{ ssh_askpass_plugin_dir }}"
      become: true

    - name: Install the binary to /usr/bin
      ansible.builtin.copy:
        src: "{{ ssh_askpass_checkout_dir }}/target/release/ssh-askpass-omarchy"
        dest: "{{ ssh_askpass_program }}"
        mode: "0755"
        remote_src: true
      become: true

    - name: Install the plugin to /usr/share
      ansible.builtin.copy:
        src: "{{ ssh_askpass_checkout_dir }}/plugin/"
        dest: "{{ ssh_askpass_plugin_dir }}/"
        mode: preserve
        remote_src: true
      become: true
      register: ssh_askpass_copy_result

    - name: Create ~/.config/omarchy/plugins
      ansible.builtin.file:
        path: "{{ ssh_askpass_plugin_link | dirname }}"
        state: directory
        mode: "0755"

    - name: "Link the packaged shell plugin ({{ ssh_askpass_plugin_link }})"
      ansible.builtin.file:
        src: "{{ ssh_askpass_plugin_dir }}"
        dest: "{{ ssh_askpass_plugin_link }}"
        state: link
        force: true
      register: ssh_askpass_link_result

    - name: Read the shell config
      ansible.builtin.slurp:
        src: "{{ ssh_askpass_shell_json }}"
      register: ssh_askpass_shell_json_raw
      failed_when: false

    - name: Work out whether the plugin is already enabled
      ansible.builtin.set_fact:
        ssh_askpass_plugin_enabled: >-
          {{ (ssh_askpass_shell_json_raw.content is defined)
             and (((ssh_askpass_shell_json_raw.content | b64decode | from_json).plugins | default([]))
                  | selectattr('id', 'equalto', ssh_askpass_plugin_id) | list | length > 0) }}

    - name: "Enable the {{ ssh_askpass_plugin_id }} shell plugin"
      ansible.builtin.command:
        argv: [omarchy-shell, shell, enablePlugin, "{{ ssh_askpass_plugin_id }}", "{}"]
      register: ssh_askpass_enable_result
      failed_when: ssh_askpass_enable_result.rc != 0 or ssh_askpass_enable_result.stdout | trim != 'ok'
      when: not ssh_askpass_plugin_enabled

    # A keepLoaded service doesn't reload when its files change, so new
    # plugin code (not just a new link) needs a restart too.
    - name: Restart the shell to load the new plugin code
      ansible.builtin.command: omarchy-restart-shell
      when: >-
        (ssh_askpass_link_result is changed or ssh_askpass_copy_result is changed)
        and ssh_askpass_enable_result is skipped
      changed_when: true

    - name: Create ~/.config/environment.d
      ansible.builtin.file:
        path: "{{ ssh_askpass_environment_conf | dirname }}"
        state: directory
        mode: "0755"

    - name: "Configure SSH to use ssh-askpass-omarchy ({{ ssh_askpass_environment_conf }})"
      ansible.builtin.copy:
        content: |
          SSH_ASKPASS={{ ssh_askpass_program }}
          SSH_ASKPASS_REQUIRE=prefer
        dest: "{{ ssh_askpass_environment_conf }}"
        mode: "0644"

# Replaces Omarchy's polkit agent (omarchy.polkit) with polkit-omarchy
# (lbssousa.polkit), which adds a "Touch your security key" prompt for
# pam_u2f instead of a password field whose Enter does nothing.
#
# The plugin (https://github.com/lbssousa/polkit-omarchy) is deployed from
# a release tag (polkit_agent_ref), checked out in polkit_agent_checkout_dir
# only after the tag's GPG signature verifies and comes from one of
# polkit_agent_signing_keys: it runs inside the shell as the authentication
# agent, and a copy of it is installed as root. Releases are signed tags
# made on the merged commit; main only holds GitHub-signed squash merges.
# The plugin is copied to /usr/share and linked into
# ~/.config/omarchy/plugins. Its manifest declares clonedFrom:
# omarchy.polkit, so enabling it disables the built-in agent (and
# `omarchy plugin disable lbssousa.polkit` brings it back). The last two
# tasks re-read the shell's plugin list and fail the run unless that swap
# actually took, since a plugin that is merely linked stays inert.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags polkit-agent
- name: polkit-omarchy (polkit agent with security key touch prompt)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [polkit-agent]

  tasks:
    - name: Install git and gnupg (the signature check needs both)
      community.general.pacman:
        name:
          - git
          - gnupg
        state: present
      become: true

    - name: Check that the release signing key is in the GPG keyring
      ansible.builtin.command: "gpg --list-keys --with-colons {{ item }}"
      loop: "{{ polkit_agent_signing_keys }}"
      register: polkit_agent_key_check
      changed_when: false
      failed_when: false
      when: polkit_agent_verify_commit

    - name: Fail early if the signing key is missing (run `just gpg-yubikey`)
      ansible.builtin.fail:
        msg: >-
          polkit-omarchy is deployed from a release tag whose GPG signature is
          verified, and the signing key isn't in your keyring yet
          ({{ polkit_agent_signing_keys | join(', ') }}). Import it first with
          `just gpg-yubikey` (Yubikey plugged in): that playbook is a
          dependency of this one. Set polkit_agent_verify_commit=false only
          for an unsigned fork.
      when: >-
        polkit_agent_verify_commit
        and (polkit_agent_key_check.results | selectattr('rc', 'ne', 0) | list | length) > 0

    - name: "Check out the polkit-omarchy release ({{ polkit_agent_ref }}), verifying its signed tag"
      block:
        - name: "Check out the polkit-omarchy release ({{ polkit_agent_ref }}), verifying its signed tag"
          ansible.builtin.git:
            repo: "{{ polkit_agent_repo }}"
            dest: "{{ polkit_agent_checkout_dir }}"
            version: "{{ polkit_agent_ref }}"
            force: false
            verify_commit: "{{ polkit_agent_verify_commit }}"
            gpg_allowlist: "{{ polkit_agent_signing_keys if polkit_agent_verify_commit else [] }}"
          register: polkit_agent_git_result
      rescue:
        - name: Explain a failed signature check
          ansible.builtin.fail:
            msg: >-
              Couldn't check out {{ polkit_agent_repo }}
              ({{ polkit_agent_ref }}) with a verified GPG signature:
              {{ ansible_failed_result.msg | default('unknown error') }}.
              polkit_agent_ref must be a release tag signed with one of
              polkit_agent_signing_keys (the Yubikey's OpenPGP key). A branch
              like main won't do, because its merges are signed by GitHub.
              If the key is missing from the keyring, import it with
              `just gpg-yubikey` (token plugged in). Set
              polkit_agent_verify_commit=false only for an unsigned fork.

    - name: Install the plugin to /usr/share
      ansible.builtin.copy:
        src: "{{ polkit_agent_checkout_dir }}/plugin/"
        dest: "{{ polkit_agent_plugin_dir }}/"
        mode: preserve
        remote_src: true
      become: true
      register: polkit_agent_copy_result

    - name: Create ~/.config/omarchy/plugins
      ansible.builtin.file:
        path: "{{ polkit_agent_plugin_link | dirname }}"
        state: directory
        mode: "0755"

    - name: "Link the shell plugin ({{ polkit_agent_plugin_link }})"
      ansible.builtin.file:
        src: "{{ polkit_agent_plugin_dir }}"
        dest: "{{ polkit_agent_plugin_link }}"
        state: link
        force: true
      register: polkit_agent_link_result

    - name: Let the shell discover the plugin
      # Not conditional on the link having changed: omarchy-plugin-enable
      # fails outright ("plugin '<id>' is not known; run: omarchy-shell
      # shell rescanPlugins") when the registry hasn't seen the link yet,
      # which is exactly the state a run that died between the two tasks
      # above leaves behind. A rescan is cheap and idempotent.
      ansible.builtin.command:
        argv: [omarchy-shell, shell, rescanPlugins]
      changed_when: false

    - name: List the shell plugins
      ansible.builtin.command:
        argv: [omarchy-plugin-list, --json]
      register: polkit_agent_plugin_list
      changed_when: false

    - name: "Enable {{ polkit_agent_plugin_id }} (disables {{ polkit_agent_replaces_id }})"
      ansible.builtin.command:
        argv: [omarchy-plugin-enable, "{{ polkit_agent_plugin_id }}"]
      register: polkit_agent_enable_result
      when: >-
        not (polkit_agent_plugin_list.stdout | from_json
             | selectattr('id', 'equalto', polkit_agent_plugin_id)
             | selectattr('enabled') | list | length > 0)

    - name: Restart the shell to load the new agent code
      ansible.builtin.command: omarchy-restart-shell
      when: >-
        polkit_agent_copy_result is changed
        or polkit_agent_link_result is changed
        or polkit_agent_enable_result is changed
      changed_when: true

    # The swap is only real if both halves hold: ours loaded, Omarchy's
    # not. A clone that merely got linked is silently inert (the shell
    # keeps running omarchy.polkit), and neither task above fails in that
    # case, so assert it here rather than trusting the exit status.
    - name: List the shell plugins again (after the restart)
      ansible.builtin.command:
        argv: [omarchy-plugin-list, --json]
      register: polkit_agent_plugin_list_final
      changed_when: false

    - name: Assert {{ polkit_agent_plugin_id }} replaced {{ polkit_agent_replaces_id }}
      vars:
        final_plugins: "{{ polkit_agent_plugin_list_final.stdout | from_json }}"
        clone: "{{ final_plugins | selectattr('id', 'equalto', polkit_agent_plugin_id) | first | default({}) }}"
        replaced: "{{ final_plugins | selectattr('id', 'equalto', polkit_agent_replaces_id) | first | default({}) }}"
      ansible.builtin.fail:
        msg: >-
          {{ polkit_agent_plugin_id }} did not take over from
          {{ polkit_agent_replaces_id }}: ours is
          {{ 'enabled' if clone.enabled | default(false) else 'missing or disabled' }},
          the built-in is
          {{ 'disabled' if not (replaced.enabled | default(false)) else 'still enabled' }}.
          Check `omarchy-plugin-list` and
          `~/.config/omarchy/shell.json` (disabledPlugins); enable it by
          hand with `omarchy plugin enable {{ polkit_agent_plugin_id }}`,
          which also disables {{ polkit_agent_replaces_id }} again.
      when: >
        not (clone.enabled | default(false))
        or (replaced.enabled | default(false))
