---
# PDF viewer, per user: shadows the Zathura Flatpak's exported desktop
# entry with a file-forwarding (`@@ %F @@`) copy so relative paths from
# `xdg-open` work, sets Zathura as the default for application/pdf in
# ~/.config/mimeapps.list, and writes its font into the sandbox's own
# config dir (~/.var/app/org.pwmt.zathura/config/zathura/zathurarc). The
# packages themselves are installed by system/pdf-viewer.yml.
#
# Why the desktop-entry shadow is needed: the exported entry's Exec is
# `--file-forwarding … @@u %U @@`. In @@u (URI) mode flatpak only portals
# file:// URIs and absolute paths, and xdg-open's generic backend (the one
# Hyprland gets) substitutes %U with the argument verbatim, never as a
# URI. So `xdg-open doc.pdf` from a directory the sandbox can't see passes
# a bare `doc.pdf` into a sandbox whose cwd is ~ — an empty Zathura,
# "could not open document". @@ (file) mode resolves relative paths before
# portalling them, so this play writes a user-level copy of the entry
# (same id, which shadows the export) with `@@ %F @@` instead. Rewritten
# from the export on every run, so it follows upstream changes to the rest
# of the entry.
#
# Usage: just pdf-viewer
- name: PDF viewer (Zathura default, Papers optional, Evince removed) (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pdf-viewer]

  tasks:
    - name: Look for Zathura's exported desktop entry
      ansible.builtin.stat:
        path: "{{ flatpak_system_exports_dir }}/applications/{{ pdf_viewer_zathura_desktop_id }}"
      register: pdf_viewer_zathura_exported_entry

    - name: Expect the Flatpak to still export the desktop id the default points at
      ansible.builtin.assert:
        that: pdf_viewer_zathura_exported_entry.stat.exists
        fail_msg: >-
          {{ flatpak_system_exports_dir }}/applications/{{ pdf_viewer_zathura_desktop_id }}
          is missing, so {{ pdf_viewer_mimeapps_path }} would point at
          nothing and double-clicking a PDF would fall back to another
          viewer. Run `just pdf-viewer` as an administrator (or fix
          pdf_viewer_zathura_desktop_id in group_vars/all/main.yml).
        quiet: true

    - name: Read the exported desktop entry
      ansible.builtin.slurp:
        src: "{{ flatpak_system_exports_dir }}/applications/{{ pdf_viewer_zathura_desktop_id }}"
      register: pdf_viewer_zathura_exported_content

    - name: Expect its Exec to still forward files as URIs
      # The rewrite below targets exactly this string; if upstream
      # changes it, check whether the relative-path bug still applies
      # before adapting the rewrite.
      ansible.builtin.assert:
        that: "'@@u %U @@' in (pdf_viewer_zathura_exported_content.content | b64decode)"
        fail_msg: >-
          The Exec line of
          {{ flatpak_system_exports_dir }}/applications/{{ pdf_viewer_zathura_desktop_id }}
          no longer contains `@@u %U @@`, so the `@@ %F @@` rewrite into
          {{ pdf_viewer_zathura_user_desktop_path }} has nothing to replace.
        quiet: true

    - name: Create the user applications dir
      ansible.builtin.file:
        path: "{{ pdf_viewer_zathura_user_desktop_path | dirname }}"
        state: directory
        mode: "0755"

    - name: "Shadow the exported entry with a file-forwarding copy ({{ pdf_viewer_zathura_user_desktop_path }})"
      ansible.builtin.copy:
        content: |
          # Managed by playbooks/user/pdf-viewer.yml — copy of the Flatpak's
          # export with `@@ %F @@` instead of `@@u %U @@`, so relative paths
          # from xdg-open reach the sandbox (see the play's header).
          {{ pdf_viewer_zathura_exported_content.content | b64decode | replace('@@u %U @@', '@@ %F @@') | trim }}
        dest: "{{ pdf_viewer_zathura_user_desktop_path }}"
        mode: "0644"

    - name: "Set Zathura as the default PDF viewer ({{ pdf_viewer_mimeapps_path }})"
      community.general.ini_file:
        path: "{{ pdf_viewer_mimeapps_path }}"
        section: Default Applications
        option: application/pdf
        value: "{{ pdf_viewer_zathura_desktop_id }}"
        no_extra_spaces: true
        create: true
        mode: "0644"

    - name: Create the Flatpak config dir Zathura actually reads
      # XDG_CONFIG_HOME inside the sandbox is ~/.var/app/<id>/config, so
      # this is the path Zathura itself looks in, not ~/.config/zathura
      # (which the sandbox doesn't expose at all).
      ansible.builtin.file:
        path: "{{ pdf_viewer_zathurarc_path | dirname }}"
        state: directory
        mode: "0755"

    - name: "Set the statusbar/inputbar font ({{ pdf_viewer_zathurarc_path }})"
      ansible.builtin.copy:
        content: |
          # Managed by playbooks/user/pdf-viewer.yml — statusbar/inputbar font.
          set font "{{ pdf_viewer_zathura_font }}"
        dest: "{{ pdf_viewer_zathurarc_path }}"
        mode: "0644"
