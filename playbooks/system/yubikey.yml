---
# Yubikey helpers, neither part of site.yml/`just setup` (both depend on
# the physical token being connected):
#
#   GPG public key      tags: yubikey, gpg-yubikey   (`just gpg-yubikey`)
#
# The resident SSH keys are not here: importing them needs the FIDO2 PIN
# on a real terminal, which Ansible can't relay, so they have their own
# standalone script — scripts/ssh-yubikey.sh (`just ssh-yubikey`).
#
# The GPG public key is a dependency of the pinentry, ssh-askpass and
# polkit-agent plays of playbooks/plugins.yml: they deploy
# release tags and refuse to build unless the tag's signature verifies
# against this key, so run `just gpg-yubikey` before them.
#
# Here only gnupg itself (system phase); the import, trust and git signing
# setup are per user, in user/yubikey.yml. The key the plugin plays check
# signatures against only has to be in the keyring of the administrator who
# runs the system phase.
#
# Usage: just gpg-yubikey

- name: Yubikey GPG public key — gnupg
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [yubikey, gpg-yubikey]

  tasks:
    - name: Ensure gnupg is installed
      community.general.pacman:
        name: gnupg
        state: present
      become: true
