---
# abutre's own settings, loaded by scripts/run-phase.sh (-e @users/abutre.yml)
# in both phases. Extra vars: these win over group_vars/all/*.

# Omarchy's web apps, rebuilt with the default browser (Firefox Taskbar Tabs
# or Chrome/Brave/Chromium PWAs), each in its own container where supported
# (see webapps in group_vars/all/main.yml for the fields). pwa: Chrome's own
# installability check (2026-11-12, signed out) passed for YouTube, Teams,
# Maps and Messages; X serves a valid manifest. WhatsApp's and Photos'
# policy installs (2026-11-12, signed in) got their manifests and icons,
# the real PWAs.
webapps:
  - label: YouTube
    desktop_name: YouTube
    url: https://www.youtube.com
    pwa: true
    # www.youtube.com redirects Chrome's installer to a sign-in prompt, which
    # leaves only a placeholder; this is the page Chrome's own preinstalled
    # YouTube app installs from.
    pwa_install_url: https://www.youtube.com/s/notifications/manifest/cr_install.html
    container: Google
    keybind: "SUPER + SHIFT + Y"
  - label: WhatsApp
    desktop_name: WhatsApp Web
    url: https://web.whatsapp.com
    pwa: true
    container: Facebook
    keybind: "SUPER + SHIFT + ALT + G"
  - label: Microsoft Teams
    desktop_name: Microsoft Teams (PWA)
    url: https://teams.microsoft.com
    pwa: true
    container: Microsoft
    keybind: "SUPER + SHIFT + ALT + T"
  - label: Google Maps
    desktop_name: Google Maps
    url: https://www.google.com/maps
    pwa: true
    container: Google
    keybind: "SUPER + SHIFT + S"
  - label: Google Photos
    desktop_name: Google Photos
    url: https://photos.google.com
    pwa: true
    container: Google
    keybind: "SUPER + SHIFT + P"
  - label: Google Messages
    desktop_name: Google Messages
    url: https://messages.google.com/web
    pwa: true
    container: Google
    keybind: "SUPER + SHIFT + CTRL + G"
  - label: X
    desktop_name: X
    url: https://x.com
    pwa: true
    keybind: "SUPER + SHIFT + X"
