---
# Omaraptor — three personal Omarchy themes modeled on Omadwaita
# (omadwaita-themes.yml), with the classic GNOME color palette
# (developer.gnome.org/hig/reference/palette.html: Blue, Green, Yellow,
# Orange, Red, Purple, Light, Dark; five tiers each) and Project Bluefin's
# default wallpapers instead of Adwaita's accent colors and the devotional
# paintings:
#
#   Omaraptor        TUI dark, GTK light  (default)
#   Omaraptor Light  everything light
#   Omaraptor Dark   everything dark
#
# As with Omadwaita, Omarchy never recolors GTK: it only switches between
# `Adwaita` and `Adwaita-dark` from colors.toml's `mode`, so GTK/libadwaita
# apps keep the stock Adwaita look. Two colors.toml palettes cover the three
# themes:
#
#   files/omaraptor/dark/colors.toml   Omaraptor, Omaraptor Dark
#   files/omaraptor/light/colors.toml  Omaraptor Light
#
# The Hyprland active window border is slate too (hyprland_active_border =
# rgba(6f8396ee) in colors.toml, #6f8396 being libadwaita's slate), matching
# the GTK accent instead of the blue `accent`.
#
# The shell's polkit dialogs (polkit-omarchy, omaskpass,
# omapin) take their border from the Hyprland border above and
# their lock-icon accent from shell.polkit.toml, a [polkit] section override
# that sets it to the same slate.
#
# Surfaces are the palette's Dark 4/Dark 3 (dark) and Light 1-4 (light); the
# accent is Blue 3 (#3584e4); normal/bright colors are tier 3/tier 1 (dark)
# or tier 5/tier 3 (light), lifted in OKLab lightness only as far as needed
# for 4.5:1 on the background. Terminals have a cyan slot the GNOME palette
# lacks: it is the OKLab midpoint of Blue and Green.
#
# Neither GTK's scheme nor its accent comes from a palette, so a theme-set
# hook (files/omaraptor/omaraptor-light-apps.sh) handles both: it sets the
# libadwaita accent to slate (Bluefin's default gray, instead of GNOME blue)
# for all three themes -- via gsettings and a ~/.config/gtk-4.0/gtk.css
# override, since xdg-desktop-portal-gtk does not pass accent-color on to
# libadwaita -- and for "Omaraptor" also flips GTK back to light
# after Omarchy has set it dark from `mode = "dark"`. Flatpak sandboxes don't
# see ~/.config/gtk-{3,4}.0, so a user-wide Flatpak override exposes them
# read-only; without it Bazaar, Firefox, ... keep the stock blue accent.
#
# Wallpapers are Bluefin's default set (projectbluefin/artwork,
# wallpapers/01-bluefin .. 12-bluefin, Apache-2.0), each in a day and a night
# variant, converted from JXL/SVG to 2560x1440 JPEG:
#
#   files/omaraptor/backgrounds/day/    Omaraptor Light (+ Omaraptor)
#   files/omaraptor/backgrounds/night/  Omaraptor Dark  (+ Omaraptor)
#
# Omaraptor gets both sets since it mixes a dark TUI with light apps.
#
# The default wallpaper of each theme is the one that sorts first, which is
# what Omarchy picks when the previous background isn't one of the theme's:
# 00-bluefin-day.jpg (Bluefin's 08, renamed) for Omaraptor and Omaraptor
# Light, 00-bluefin-night.jpg (its night variant) for Omaraptor Dark. For
# Omaraptor, which has both sets, the day one sorts first.
#
# Chromium-family browsers take their whole palette from the theme's
# chromium.theme seed; the GNOME Blue 3 accent has the same hue (~214°) as
# Adwaita blue, so Omadwaita's near-neutral seeds are reused (see the header
# of omadwaita-themes.yml): light 229,235,250, dark 29,31,35.
#
# All three use the Adwaita icon theme (icons.theme).
#
# Installs the themes only; apply one with `omarchy-theme-set "Omaraptor"`
# (or pick it in the theme menu).
- name: Omaraptor Omarchy themes
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [omaraptor-themes]

  vars:
    omaraptor_themes_dir: "{{ target_home }}/.config/omarchy/themes"
    omaraptor_hooks_dir: "{{ target_home }}/.config/omarchy/hooks/theme-set.d"
    omaraptor_icon_theme: Adwaita
    omaraptor_browser_light: "229,235,250"
    omaraptor_browser_dark: "29,31,35"
    # backgrounds: which variants of files/omaraptor/backgrounds/ to install.
    omaraptor_themes:
      - { dir: omaraptor, palette: dark, backgrounds: [day, night], browser: "{{ omaraptor_browser_light }}" }
      - { dir: omaraptor-light, palette: light, backgrounds: [day], browser: "{{ omaraptor_browser_light }}" }
      - { dir: omaraptor-dark, palette: dark, backgrounds: [night], browser: "{{ omaraptor_browser_dark }}" }

  tasks:
    - name: Look for the Adwaita icon theme
      ansible.builtin.stat:
        path: "/usr/share/icons/{{ omaraptor_icon_theme }}"
      register: omaraptor_icons

    - name: Fail if it is missing
      ansible.builtin.assert:
        that: omaraptor_icons.stat.exists
        fail_msg: "/usr/share/icons/{{ omaraptor_icon_theme }} not found"
        quiet: true

    - name: Create the theme directories
      ansible.builtin.file:
        path: "{{ omaraptor_themes_dir }}/{{ item.dir }}/backgrounds"
        state: directory
        mode: "0755"
      loop: "{{ omaraptor_themes }}"
      loop_control:
        label: "{{ item.dir }}"

    - name: Install the palettes
      ansible.builtin.copy:
        src: "omaraptor/{{ item.palette }}/colors.toml"
        dest: "{{ omaraptor_themes_dir }}/{{ item.dir }}/colors.toml"
        mode: "0644"
      loop: "{{ omaraptor_themes }}"
      loop_control:
        label: "{{ item.dir }} ({{ item.palette }})"

    - name: Install the slate accent for the polkit/askpass/pinentry dialogs
      ansible.builtin.copy:
        src: "omaraptor/{{ item.palette }}/shell.polkit.toml"
        dest: "{{ omaraptor_themes_dir }}/{{ item.dir }}/shell.polkit.toml"
        mode: "0644"
      loop: "{{ omaraptor_themes }}"
      loop_control:
        label: "{{ item.dir }} ({{ item.palette }})"

    - name: Install the Bluefin wallpapers
      ansible.builtin.copy:
        src: "omaraptor/backgrounds/{{ item.1 }}/"
        dest: "{{ omaraptor_themes_dir }}/{{ item.0.dir }}/backgrounds/"
        mode: "0644"
        directory_mode: "0755"
      loop: "{{ omaraptor_themes | subelements('backgrounds') }}"
      loop_control:
        label: "{{ item.0.dir }} ({{ item.1 }})"

    - name: Use the Adwaita icon theme
      ansible.builtin.copy:
        content: "{{ omaraptor_icon_theme }}\n"
        dest: "{{ omaraptor_themes_dir }}/{{ item.dir }}/icons.theme"
        mode: "0644"
      loop: "{{ omaraptor_themes }}"
      loop_control:
        label: "{{ item.dir }}"

    - name: Set the browser seed color (blue accent, neutral frame)
      ansible.builtin.copy:
        content: "{{ item.browser }}\n"
        dest: "{{ omaraptor_themes_dir }}/{{ item.dir }}/chromium.theme"
        mode: "0644"
      loop: "{{ omaraptor_themes }}"
      loop_control:
        label: "{{ item.dir }} ({{ item.browser }})"

    - name: Create ~/.config/omarchy/hooks/theme-set.d
      ansible.builtin.file:
        path: "{{ omaraptor_hooks_dir }}"
        state: directory
        mode: "0755"

    - name: Install the theme-set hook (slate GTK accent, light GTK under Omaraptor)
      ansible.builtin.copy:
        src: omaraptor/omaraptor-light-apps.sh
        dest: "{{ omaraptor_hooks_dir }}/omaraptor-light-apps"
        mode: "0755"

    - name: Let Flatpak apps read the GTK CSS override (slate accent)
      community.general.ini_file:
        path: "{{ target_home }}/.local/share/flatpak/overrides/global"
        section: Context
        option: filesystems
        value: "xdg-config/gtk-3.0:ro;xdg-config/gtk-4.0:ro;"
        mode: "0644"
        no_extra_spaces: true
        create: true

    - name: Say how to apply them
      ansible.builtin.debug:
        msg: >-
          Installed. Apply one with omarchy-theme-set "Omaraptor" (or
          "Omaraptor Light" / "Omaraptor Dark").
