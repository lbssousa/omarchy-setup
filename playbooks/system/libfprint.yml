# libfprint (goodix538d) — builds and installs the
# https://github.com/lbssousa/libfprint fork (goodixtls53xd driver, for
# the Goodix 27c6:538d fingerprint reader) as an Arch package, replacing
# the official libfprint (and Omarchy's libfprint-git, if present).
#
# The package is built with makepkg from templates/libfprint-goodix538d.PKGBUILD.j2
# on the host, as the user (makepkg refuses to run as root), and
# installed with `pacman -U`. It `provides=(libfprint libfprint-2.so=2-64)`
# and `conflicts=(libfprint libfprint-git ...)` (the AUR libfprint forks too), so fprintd's dependencies
# stay satisfied and pacman removes the stock package in the same
# transaction (--ask=4: conflicting packages are removed without a
# prompt, which --noconfirm alone would answer "no" to). The fork is
# installed into /usr like the official one, so nothing needs
# LD_LIBRARY_PATH.
#
# The package is called libfprint-git so that Omarchy's
# omarchy-setup-security-fingerprint, which tests `pacman -Q libfprint-git`,
# finds it installed and leaves it alone (epoch 2 outranks the omarchy
# repo's libfprint-git).
#
# Rebuilds only when the installed libfprint-git doesn't match
# the version derived from libfprint_ref. A later `pacman -Syu` never
# swaps it for the official package (it provides libfprint); bump
# libfprint_ref and rerun to move to a newer fork release.
#
# The driver's SIGFM matcher is self-contained C since
# v1.94.10-goodix538d.2 (earlier builds vendored and statically linked
# an OpenCV subset through cmake), so the build needs nothing beyond
# the regular libfprint toolchain.
#
# The driver learns the sensor's fixed pattern from enrollment sessions
# and keeps it in fprintd's state directory
# (/var/lib/fprint/goodixtls53xd-fpn.bin); enroll at least 2 fingers so
# each one is calibrated from the others. Prints enrolled with builds
# before v1.94.10-goodix538d.2 are refused and must be re-enrolled.
#
# Usage: just libfprint
- name: libfprint (goodix538d)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Find the installed libfprint-git version
      ansible.builtin.command: pacman -Q libfprint-git
      register: libfprint_installed
      changed_when: false
      failed_when: false

    - name: Work out whether the package is already up to date
      ansible.builtin.set_fact:
        libfprint_pkg_current: >-
          {{ libfprint_installed.rc == 0
             and libfprint_installed.stdout.split()[1] == libfprint_epoch ~ ':' ~ libfprint_pkgver ~ '-' ~ libfprint_pkgrel }}

    - name: Build and install the libfprint-git package (this fork)
      when: not libfprint_pkg_current
      block:
        - name: Install the build dependencies
          community.general.pacman:
            name: "{{ libfprint_makedepends }}"
            state: present
          become: true

        - name: Create the build directory
          ansible.builtin.file:
            path: "{{ libfprint_build_dir }}"
            state: directory
            mode: "0755"

        - name: Write the PKGBUILD
          ansible.builtin.template:
            src: libfprint-goodix538d.PKGBUILD.j2
            dest: "{{ libfprint_build_dir }}/PKGBUILD"
            mode: "0644"

        - name: Build the package (makepkg)
          ansible.builtin.command:
            cmd: makepkg -f --noconfirm
            chdir: "{{ libfprint_build_dir }}"

        - name: Locate the built package
          ansible.builtin.command:
            cmd: makepkg --packagelist
            chdir: "{{ libfprint_build_dir }}"
          register: libfprint_packagelist
          changed_when: false

        - name: Install the package (replacing libfprint / libfprint-git)
          ansible.builtin.command:
            cmd: >-
              pacman -U --noconfirm --ask=4
              {{ libfprint_packagelist.stdout_lines | reject('search', '-debug-') | first }}
          become: true
          notify:
            - reload udev rules
            - restart fprintd

    - name: Host configuration (privileged)
      become: true
      block:
        - name: "Install udev rule — disable USB autosuspend for the reader ({{ libfprint_goodix_usb_vendor_id }}:{{ libfprint_goodix_usb_product_id }})"
          ansible.builtin.template:
            src: 71-goodix-no-autosuspend.rules.j2
            dest: /etc/udev/rules.d/71-goodix-no-autosuspend.rules
            mode: "0644"
          notify:
            - reload udev rules
            - trigger udev rule for goodix fingerprint reader
            - restart fprintd

        - name: Install the fprintd desync watchdog script
          # The goodix538d driver can desync its protocol with the
          # sensor's MCU after a verify cancel, leaving fprintd failing
          # every verify instantly: restart it the moment that shows up.
          # The lock screen's retry storm it used to catch too is handled
          # by Omarchy 4.5 (backoff + fprintd-resume sleep hook).
          ansible.builtin.copy:
            src: fprintd-desync-watchdog.sh
            dest: /usr/local/bin/fprintd-desync-watchdog
            mode: "0755"
          notify:
            - reload systemd
            - enable and start fprintd-desync-watchdog

        - name: Install the fprintd desync watchdog service
          ansible.builtin.copy:
            src: fprintd-desync-watchdog.service
            dest: /etc/systemd/system/fprintd-desync-watchdog.service
            mode: "0644"
          notify:
            - reload systemd
            - enable and start fprintd-desync-watchdog

  handlers:
    # Handlers don't inherit `become: true` from the block that
    # notifies them — each needs its own.
    - name: reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
      become: true
      listen: reload udev rules

    - name: trigger udev rule for goodix fingerprint reader
      # The reader is internal and never replugged, so a rule change
      # needs an explicit trigger to apply without a reboot.
      ansible.builtin.command: >-
        udevadm trigger --subsystem-match=usb
        --attr-match=idVendor={{ libfprint_goodix_usb_vendor_id }}
      changed_when: false
      become: true
      listen: trigger udev rule for goodix fingerprint reader

    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      listen: reload systemd

    - name: Check if fprintd.service exists
      ansible.builtin.command: systemctl cat fprintd.service
      become: true
      register: fprintd_service_check
      changed_when: false
      failed_when: false
      listen: restart fprintd

    - name: restart fprintd
      ansible.builtin.systemd:
        name: fprintd.service
        state: restarted
      become: true
      listen: restart fprintd
      when: fprintd_service_check.rc == 0

    - name: enable and start fprintd-desync-watchdog
      ansible.builtin.systemd:
        name: fprintd-desync-watchdog.service
        daemon_reload: true
        enabled: true
        state: restarted
      become: true
      listen: enable and start fprintd-desync-watchdog
