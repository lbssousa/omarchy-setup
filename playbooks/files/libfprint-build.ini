# Declarative build container for the libfprint fork
# (https://github.com/lbssousa/libfprint), native distrobox assemble
# format — distrobox owns the container lifecycle, not reimplemented in
# Ansible.
#
# No opencv package here on purpose: the driver's SIGFM matcher needs
# OpenCV, but if it finds one via pkg-config it links against it
# (external runtime dependency). Leaving it out forces meson.build's
# fallback path, which vendors and statically links the small OpenCV
# subset it needs from upstream source — cmake is required for that
# build; curl/tar/sha256sum (source fetch/extract/verify) already ship
# in the base image.
[libfprint-build]
image=archlinux:latest
pull=true
additional_packages="meson ninja cmake gcc pkgconf git glib2 glib2-devel gobject-introspection libgusb libgudev openssl pixman"
