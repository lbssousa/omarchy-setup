---
# Local connection become timeout. Under run-empowered.sh the run0 inside
# returns at once; the generous value only matters for a playbook run without
# it, where each run0 waits on a polkit dialog that can take longer than
# Ansible's 10s default.
ansible_local_become_success_timeout: 60

# polkit authentication cache window (seconds) — playbooks/polkit.yml. Set
# for pkexec/graphical tools; see the playbook for what it does and doesn't
# cover.
polkit_expiration_seconds: 1800

# Firefox (playbooks/firefox.yml) — runs before pt-BR localization, which
# depends on Firefox already being installed.
firefox_package: firefox
firefox_taskbar_tabs_pref_name: browser.taskbarTabs.enabled
firefox_taskbar_tabs_pref_dest: /usr/lib/firefox/browser/defaults/preferences/omarchy-setup.js

# Firefox Taskbar Tabs replacing Omarchy's preinstalled web apps
# (playbooks/taskbar-tab-webapps.yml, tasks/taskbar-tab-webapp-swap.yml).
# One entry per swap: removes the Omarchy web app launcher named
# omarchy_webapp_name (~/.local/share/applications/<name>.desktop —
# preinstalled or `omarchy webapp install`ed, both work) and rebinds
# hypr_keybind to `gtk-launch` the Firefox Taskbar Tab whose start URL
# contains taskbar_tab_hostname instead. The Taskbar Tab has to already
# exist — create it first in Firefox (page menu → "Save as Taskbar
# Tab...", needs firefox_taskbar_tabs_pref_name above enabled) — and its
# app id is a random UUID assigned at creation, so the playbook looks it
# up by hostname in the Taskbar Tabs registry
# (~/.config/mozilla/firefox/<profile>/taskbartabs/taskbartabs.json)
# rather than taking a hardcoded id.
taskbar_tab_webapp_swaps:
  - omarchy_webapp_name: WhatsApp
    taskbar_tab_hostname: web.whatsapp.com
    hypr_keybind: "SUPER + SHIFT + ALT + G"
    hypr_description: "WhatsApp Web"
  - omarchy_webapp_name: YouTube
    taskbar_tab_hostname: www.youtube.com
    hypr_keybind: "SUPER + SHIFT + Y"
    hypr_description: "YouTube"

# Brand-new Firefox Taskbar Tabs, created directly by
# tasks/taskbar-tab-webapp-create.yml — no Omarchy launcher to swap out,
# no manual "Save as Taskbar Tab..." step first (unlike
# taskbar_tab_webapp_swaps above). One entry per Taskbar Tab:
# container_name, if set, must already exist as a Firefox container
# (Settings → General → Tabs → "Enable Container Tabs", or the Firefox
# Multi-Account Containers extension) — omit it to open with no
# container. hypr_keybind is a brand-new binding, not one taken over from
# an Omarchy default.
taskbar_tab_webapp_creates:
  - name: Microsoft Teams
    url: "https://teams.cloud.microsoft/"
    hostname: teams.cloud.microsoft
    container_name: Microsoft
    hypr_keybind: "SUPER + SHIFT + ALT + T"
    hypr_description: "Microsoft Teams"

# Zed editor (playbooks/zed.yml) — installed via Omarchy's own packages
# so the Omarchy theme integration (omazed) comes along.
zed_package: zed
zed_omazed_package: omazed
# px. Zed sizes are in logical pixels, so at the 100% monitor scale
# (omarchy_monitor_scale) this is the previous 20 times the old 1.25 scale,
# which keeps the same apparent size.
zed_font_size: 25

# Same family Omarchy sets as the system-wide monospace default (see
# /usr/share/omarchy/default/fontconfig/conf.avail/50-omarchy.conf) —
# note it's the Nerd Font build ("JetBrainsMono Nerd Font"), not plain
# "JetBrains Mono", which isn't installed on its own.
zed_buffer_font_family: "JetBrainsMono Nerd Font"

# This repo's container engine is rootless Podman (playbooks/containers.yml),
# not Docker — Zed's Dev Containers feature needs to be told that, or it
# shells out to `docker` and fails. See
# https://zed.dev/docs/dev-containers.
zed_dev_container_use_podman: true

# Gregorio (playbooks/tex.yml) — the GABC engraver + GregorioTeX,
# built from the user's own fork at the same commit pinned by every
# AISCGre-BR project's devcontainer gregorio feature (as of
# 2026-09-08: Eugene-Cardine-Primeiro-Ano-de-Semiologia-Gregoriana and
# darezzo). Keep gregorio_ref in sync with those devcontainer.json
# files rather than bumping it independently.
gregorio_repo: https://github.com/lbssousa/gregorio.git
gregorio_ref: bdb4eedbc2eb0521c3e040811f7d70a99b6fa639
gregorio_checkout_dir: "{{ ansible_facts.env.HOME }}/src/gregorio"
gregorio_configure_prefix: /usr/local
gregorio_binary_path: "{{ gregorio_configure_prefix }}/bin/gregorio"
gregorio_build_deps:
  - autoconf
  - automake
  - libtool
  - gcc
  - make
  - flex
  - bison
  - python
  - fontforge
  - pkgconf

# gregorio-lsp (playbooks/gregorio-lsp.yml) — LSP server, grelint and
# grefmt for GABC/NABC (Gregorian chant notation), built from source
# with cargo. Pinned to a tag for reproducibility — bump when a newer
# release is needed.
gregorio_lsp_repo: https://github.com/aiscgre-br/gregorio-lsp.git
gregorio_lsp_ref: v0.11.0
gregorio_lsp_checkout_dir: "{{ ansible_facts.env.HOME }}/src/gregorio-lsp"
gregorio_lsp_cargo_bin_dir: "{{ ansible_facts.env.HOME }}/.cargo/bin"
gregorio_lsp_server_crate: crates/gregorio-server
gregorio_lsp_cli_crate: crates/gregorio-cli
gregorio_lsp_binaries:
  - gregorio-lsp
  - grelint
  - grefmt

# pinentry-omarchy (playbooks/pinentry.yml) — GnuPG prompts in the
# polkit-style omarchy-shell dialog. Built as an Arch package from the
# repo's own packaging/PKGBUILD with rustup's cargo.
pinentry_omarchy_repo: https://github.com/lbssousa/pinentry-omarchy.git
pinentry_omarchy_ref: main
pinentry_omarchy_checkout_dir: "{{ ansible_facts.env.HOME }}/src/pinentry-omarchy"
# Refuse to build a checkout whose commit isn't GPG-signed by a key in the
# user's keyring (the releases are signed with the Yubikey's key).
pinentry_omarchy_verify_commit: true
pinentry_omarchy_cargo_bin_dir: "{{ ansible_facts.env.HOME }}/.cargo/bin"
pinentry_omarchy_program: /usr/bin/pinentry-omarchy
# Third-party shell plugin ids may not start with "omarchy." (reserved for
# first-party plugins by the shell's PluginRegistry).
pinentry_omarchy_plugin_id: lbssousa.pinentry
pinentry_omarchy_plugin_dir: /usr/share/pinentry-omarchy/plugin
pinentry_omarchy_plugin_link: "{{ ansible_facts.env.HOME }}/.config/omarchy/plugins/{{ pinentry_omarchy_plugin_id }}"
pinentry_omarchy_shell_json: "{{ ansible_facts.env.HOME }}/.config/omarchy/shell.json"
pinentry_omarchy_gpg_agent_conf: "{{ ansible_facts.env.HOME }}/.gnupg/gpg-agent.conf"

# LazyVim (playbooks/lazyvim.yml) — Omarchy's default Neovim distro,
# already installed at ~/.config/nvim; this only adds the LaTeX language
# extra and a personal plugin on top of it.
lazyvim_config_dir: "{{ ansible_facts.env.HOME }}/.config/nvim"
lazyvim_json_path: "{{ lazyvim_config_dir }}/lazyvim.json"
lazyvim_plugins_dir: "{{ lazyvim_config_dir }}/lua/plugins"
# LazyVim's LaTeX extra module is named "lang.tex", not "lang.latex" —
# see lua/lazyvim/plugins/extras/lang/tex.lua in the LazyVim plugin
# itself (installs vimtex + texlab + LaTeX treesitter).
lazyvim_latex_extra: lazyvim.plugins.extras.lang.tex

# gregorio.nvim (playbooks/lazyvim.yml) — GABC/NABC (Gregorian chant
# notation) support, pairs with gregorio_lsp_* above.
gregorio_nvim_repo: AISCGre-BR/gregorio.nvim
gregorio_nvim_plugin_file: "{{ lazyvim_plugins_dir }}/gregorio.lua"

# TeX Live (playbooks/tex.yml) — installed via the AUR
# texlive-installer package (upstream's own install-tl, tricking pacman
# into thinking texlive-core/texlive-bin/etc. are satisfied).
texlive_release: "2026"
texlive_aur_package: texlive-installer
texlive_aur_git_url: "https://aur.archlinux.org/{{ texlive_aur_package }}.git"
texlive_aur_build_dir: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/aur/{{ texlive_aur_package }}"
texlive_aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info?arg[]={{ texlive_aur_package }}"
texlive_aur_build_deps:
  - wget
  - xz
texlive_installer_bin: /opt/texlive-installer/install-tl

# Same CTAN mirror the AISCGre-BR devcontainer texlive feature uses
# (its "mirror" setting expects the tlnet path appended, as install-tl
# itself does via --repository).
texlive_mirror: https://linorg.usp.br
texlive_repository: "{{ texlive_mirror }}/CTAN/systems/texlive/tlnet"

texlive_texdir: "/usr/local/texlive/{{ texlive_release }}"
# Omarchy only targets x86_64.
texlive_platform: x86_64-linux
texlive_tlmgr_bin: "{{ texlive_texdir }}/bin/{{ texlive_platform }}/tlmgr"
texlive_profile_path: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/texlive.profile"

texlive_scheme: scheme-minimal

# Union of the "packages" list from every AISCGre-BR project's
# devcontainer texlive feature, as of 2026-09-08:
#   - Eugene-Cardine-Primeiro-Ano-de-Semiologia-Gregoriana/.devcontainer/devcontainer.json
#   - darezzo/.devcontainer/devcontainer.json
# Re-sync by hand if those projects' package selections change.
texlive_extra_packages:
  - babel-latin
  - babel-portuges
  - booktabs
  - csquotes
  - ebgaramond
  - enumitem
  - epstopdf-pkg
  - float
  - fontspec
  - geometry
  - gregoriotex
  - hyperref
  - hyphen-latin
  - hyphen-portuguese
  - iftex
  - l3packages
  - latex-bin
  - latexindent
  - latexmk
  - libertine
  - listings
  - luacolor
  - luamplib
  - luatex85
  - luatexbase
  - memoir
  - metapost
  - metre
  - microtype
  - musixtex
  - musixtex-fonts
  - paracol
  - pgf
  - quoting
  - relsize
  - stackengine
  - standalone
  - subfiles
  - texcount
  - textcase
  - tikzmark
  - tools
  - varwidth
  - xcolor
  - xetex
  - xkeyval
  - xpatch
  - xstring

# PDF viewer (playbooks/pdf-viewer.yml) — Zathura becomes the default
# PDF viewer; Papers is installed as an extra, non-default viewer; Evince
# is kept installed (Nautilus's sushi previewer depends on it).
pdf_viewer_papers_package: papers
pdf_viewer_zathura_package: zathura
pdf_viewer_zathura_backend_package: zathura-pdf-mupdf
pdf_viewer_zathura_desktop_id: org.pwmt.zathura.desktop
pdf_viewer_mimeapps_path: "{{ ansible_facts.env.HOME }}/.config/mimeapps.list"

# Zathura's statusbar/inputbar/notification font (playbooks/pdf-viewer.yml).
# Zathura has a single `font` option covering all three; there's no
# statusbar-only setting. Reuses omarchy_system_ui_font_pt so it matches
# the rest of the desktop instead of Zathura's own default ("monospace
# normal 9").
pdf_viewer_zathurarc_path: "{{ ansible_facts.env.HOME }}/.config/zathura/zathurarc"
pdf_viewer_zathura_font: "monospace normal {{ omarchy_system_ui_font_pt }}"

# GTK4 file chooser dialogs (playbooks/file-chooser.yml) — the GTK4/
# libadwaita xdg-desktop-portal backend (its FileChooser is Nautilus's),
# and the per-desktop portals.conf that routes the FileChooser interface
# to it under XDG_CURRENT_DESKTOP=Hyprland. qt5ct/qt6ct are the Qt platform
# themes that both ask that portal for dialogs and set the Qt UI font.
file_chooser_portal_package: xdg-desktop-portal-gnome
file_chooser_qt_packages:
  - qt5ct
  - qt6ct
file_chooser_portals_conf: "{{ ansible_facts.env.HOME }}/.config/xdg-desktop-portal/hyprland-portals.conf"
file_chooser_portal_dropin: "{{ ansible_facts.env.HOME }}/.config/systemd/user/xdg-desktop-portal-gnome.service.d/no-forced-gdk-backend.conf"

# pt-BR localization (playbooks/ptbr.yml)
ptbr_locale: pt_BR.UTF-8
ptbr_locale_gen_line: "pt_BR.UTF-8 UTF-8"
ptbr_language_fallback: "pt_BR:pt:en"

ptbr_xdg_user_dirs:
  # "default" is the stock (pre-translation) English folder name — used
  # to find and fix file-manager sidebar bookmarks still pointing at it
  # (see the GTK bookmarks task below).
  - { name: DESKTOP, default: "Desktop", translated: "Área de Trabalho" }
  - { name: DOWNLOAD, default: "Downloads", translated: "Downloads" }
  - { name: TEMPLATES, default: "Templates", translated: "Modelos" }
  - { name: PUBLICSHARE, default: "Public", translated: "Público" }
  - { name: DOCUMENTS, default: "Documents", translated: "Documentos" }
  - { name: MUSIC, default: "Music", translated: "Música" }
  - { name: PICTURES, default: "Pictures", translated: "Imagens" }
  - { name: VIDEOS, default: "Videos", translated: "Vídeos" }
  - { name: PROJECTS, default: "Projects", translated: "Projetos" }

ptbr_firefox_i18n_package: firefox-i18n-pt-br
ptbr_firefox_requested_locale:
  - pt-BR
  - en-US

# Accept-Language for Chromium-family web apps (affects page content
# language, not the browser's own UI language).
ptbr_chromium_accept_languages: "pt-BR,pt,en-US,en"

# Profile directories (relative to ~/.config) fixed by
# playbooks/tasks/ptbr-chromium-family-browser.yml. Opera and Helium are
# excluded: unconfirmed profile layout on this machine.
ptbr_chromium_family_config_dirs:
  - chromium
  - BraveSoftware/Brave-Browser
  - BraveSoftware/Brave-Origin
  - google-chrome
  - microsoft-edge
  - vivaldi

# "libreoffice-fresh-pt" is European Portuguese; pt-BR needs the -br suffix.
ptbr_libreoffice_i18n_package: libreoffice-fresh-pt-br
ptbr_man_pages_package: man-pages-pt_br

# OCR languages for omarchy-capture-text (tesseract "+" syntax).
ptbr_tesseract_data_package: tesseract-data-por
ptbr_ocr_langs: "por+eng"

# OpenSSH agent (playbooks/keepassxc.yml, the play that runs before KeePassXC's) —
# enables the standard user-scope agent (socket + service) at the session
# runtime socket and exports SSH_AUTH_SOCK session-wide via environment.d
# so IDEs, CLI tools and KeePassXC can reach the same agent.
ssh_agent_socket: "/run/user/{{ ansible_facts.user_uid }}/ssh-agent.socket"
ssh_agent_units:
  - ssh-agent.socket
  - ssh-agent.service

# KeePassXC (playbooks/keepassxc.yml — optional password manager
# alternative, not part of `just setup`) — open-source password manager
# with browser integration (Firefox/Chromium/Brave), SSH agent support
# (needs the ssh-agent playbook) and system tray integration.
keepassxc_package: keepassxc
# The extra-repo keepassxc is a Qt5 build; Omarchy's Wayland session exports
# QT_QPA_PLATFORM=wayland;xcb, so the Qt5 Wayland QPA plugin is required for
# KeePassXC to start at all. Without it the autostart aborts at login with
# "qt.qpa.plugin: Could not find the Qt platform plugin \"wayland\"".
keepassxc_wayland_plugin_package: qt5-wayland
keepassxc_config_dir: "{{ ansible_facts.env.HOME }}/.config/keepassxc"
keepassxc_config_ini: "{{ keepassxc_config_dir }}/keepassxc.ini"
# Upstream schema version — KeePassXC bumps this on migration.
keepassxc_config_version: "2"
# "colorful" = full-color tray icon matching KeePassXC's branding.
keepassxc_tray_icon_appearance: colorful
# KeeShare active-set XML (escaped for storage in keepassxc.ini). The
# secret KeeShare "Own" identity key is machine-specific, so it is left
# out of version control and configured interactively.
keepassxc_keepshare_active: '<?xml version=\"1.0\"?><KeeShare><Active/></KeeShare>\n'
# KeePassXC acts as a client for the OpenSSH agent; its override pins the
# socket provided by playbooks/keepassxc.yml.
keepassxc_ssh_agent_socket: "{{ ssh_agent_socket }}"
# Reuses Omarchy's default "Passwords" keybinding (originally bound to
# 1Password, which this setup doesn't install).
keepassxc_hypr_keybind: "SUPER + SHIFT + SLASH"
# KeePassXC's "Launch KeePassXC at system startup" checkbox only writes the
# XDG autostart entry when the settings dialog is saved, so the playbook
# deploys the same file itself to make autostart deterministic on fresh
# installs (see keepassxc.yml).
keepassxc_autostart_desktop: "{{ ansible_facts.env.HOME }}/.config/autostart/org.keepassxc.KeePassXC.desktop"
# systemd's XDG autostart fires desktop entries before the tray and theme
# are up, so the autostart Exec runs this readiness wrapper instead: it
# waits for the shell's StatusNotifierHost and for Omarchy's gsettings
# color-scheme before exec'ing KeePassXC (see keepassxc.yml).
keepassxc_autostart_wrapper: "{{ ansible_facts.env.HOME }}/.local/bin/keepassxc-autostart"

# Auto-lock KeePassXC when the YubiKey is unplugged (udev rule, ported from
# lbssousa/nix-config's modules/system/security/keepassxc-yubikey-lock.nix).
# ENV{PRODUCT} format is vendor/product/revision in hex, no leading zeros
# (`lsusb`: ID 1050:0407 -> "1050/407/*") — the raw PRODUCT field is used
# instead of ATTR{idVendor}/ATTR{idProduct} because on "remove" events the
# device's sysfs attributes are already gone, while PRODUCT is still set.
keepassxc_yubikey_usb_product_match: "1050/407/*"
keepassxc_yubikey_lock_script: /usr/local/bin/keepassxc-lock-on-yubikey-remove
keepassxc_yubikey_lock_udev_rule: /etc/udev/rules.d/72-keepassxc-yubikey-lock.rules

# Browser integration: KeePassXC checks a browser's native messaging
# host manifest to decide whether it's supported. The playbook deploys
# the manifests directly ("isBrowserEnabled" is just file existence), so
# no GUI clicking is needed; the browser extension still has to be
# installed and connected by the user.
keepassxc_proxy_path: /usr/bin/keepassxc-proxy
keepassxc_browser_manifests:
  - name: Firefox
    src: keepassxc-browser-firefox.json.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/mozilla/native-messaging-hosts/org.keepassxc.keepassxc_browser.json"
  - name: Chromium
    src: keepassxc-browser-chromium.json.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/chromium/NativeMessagingHosts/org.keepassxc.keepassxc_browser.json"
  - name: Brave
    src: keepassxc-browser-chromium.json.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/BraveSoftware/Brave-Browser/NativeMessagingHosts/org.keepassxc.keepassxc_browser.json"
  # Brave-Origin is a separate Brave profile directory (not the stable
  # Brave-Browser one) — it keeps its own NativeMessagingHosts folder, so
  # it needs its own manifest entry or the extension can't reach
  # keepassxc-proxy.
  - name: Brave Origin
    src: keepassxc-browser-chromium.json.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/BraveSoftware/Brave-Origin/NativeMessagingHosts/org.keepassxc.keepassxc_browser.json"

# Bitwarden (playbooks/bitwarden.yml — optional, not part of `just
# setup`).  Prefers the AUR package, which tracks upstream releases
# faster than the official Arch package.
bitwarden_official_package: bitwarden
bitwarden_aur_package: bitwarden-bin
bitwarden_aur_git_url: "https://aur.archlinux.org/{{ bitwarden_aur_package }}.git"
bitwarden_aur_build_dir: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/aur/{{ bitwarden_aur_package }}"
bitwarden_aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info?arg[]={{ bitwarden_aur_package }}"

# Runtime deps not already covered by the Omarchy base package set.
bitwarden_aur_runtime_deps:
  - alsa-lib
  - gtk3
  - libnotify
  - libxtst
  - libxss
  - libnss_nis
  - nss

bitwarden_ssh_agent_socket: "{{ ansible_facts.env.HOME }}/.bitwarden-ssh-agent.sock"
bitwarden_ssh_agent_units:
  - bitwarden-ssh-agent.path
  - bitwarden-ssh-agent-env.service

# Reuses Omarchy's default "Passwords" keybinding (originally bound to
# 1Password, which this setup doesn't install).
bitwarden_hypr_keybind: "SUPER + SHIFT + SLASH"

# gcr-ssh-agent competes for SSH_AUTH_SOCK and must be masked for
# Bitwarden's own agent to take over.
gcr_ssh_agent_units:
  - gcr-ssh-agent.socket
  - gcr-ssh-agent.service

# Homebrew for Linux (playbooks/homebrew.yml) — installed per upstream to
# /home/linuxbrew/.linuxbrew and exposed via a launcher script in
# /usr/local/bin so `brew` is on PATH without shell-profile edits.
homebrew_install_url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
homebrew_install_script_path: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/homebrew-install.sh"
homebrew_prefix: /home/linuxbrew/.linuxbrew
homebrew_bin: "{{ homebrew_prefix }}/bin/brew"
homebrew_symlink: /usr/local/bin/brew
homebrew_runtime_deps:
  - base-devel
  - curl
  - git
# bbrew — TUI for managing Homebrew and Flatpak packages (bold-brew).
homebrew_bbrew_package: bbrew
# homebrew_env_file is deployed to ~/.config/environment.d so every
# Homebrew-installed binary reaches the session on PATH — see the
# header comment in playbooks/homebrew.yml.
homebrew_env_file: 42-homebrew.conf

# Proton Pass (playbooks/proton-pass.yml — optional password manager
# alternative to KeePassXC/Bitwarden, not part of `just setup`).
#
# Desktop client: installed from Flathub — the official build, no AUR
# package to track.
proton_pass_flatpak_id: me.proton.Pass

# Reuses Omarchy's default "Passwords" keybinding (originally bound to
# 1Password, which this setup doesn't install).
proton_pass_hypr_keybind: "SUPER + SHIFT + SLASH"

# CLI: the AUR packages (proton-pass-cli, proton-pass-cli-bin) are
# unreliable upstream (checksum failures / AUR pushes disabled), and
# Proton's own official installer script has no update mechanism of its
# own — `proton-pass-cli` is an official Homebrew (homebrew-core)
# formula instead, with a prebuilt x86_64_linux bottle (depends on
# homebrew_bin/homebrew_symlink/homebrew_prefix, group_vars above).
# Points straight at Homebrew's Cellar bin — playbooks/homebrew.yml
# already puts {{ homebrew_prefix }}/bin on PATH session-wide (via
# ~/.config/environment.d), so nothing needs mirroring into ~/.local/bin.
proton_pass_cli_bin: "{{ homebrew_prefix }}/bin/pass-cli"

# Proton Pass CLI SSH agent — a systemd --user service runs `pass-cli
# ssh-agent start` as the long-running agent (the desktop app's own "Use
# Proton Pass as SSH agent" toggle is a separate, GUI-only setup flow that
# defaults to a different socket, ~/.ssh/proton-pass-ssh-agent.sock — see
# the header comment above the CLI play). Socket path here matches
# pass-cli's own upstream default ($HOME/.ssh/proton-pass-agent.sock), so
# ad-hoc CLI calls agree with the systemd-managed agent.
proton_pass_ssh_agent_socket: "{{ ansible_facts.env.HOME }}/.ssh/proton-pass-agent.sock"

# pass-cli's local encryption key backend. Defaults to the Linux kernel
# keyring, which is wiped on every reboot — so the session persisted at
# `pass-cli login` time silently becomes unreadable on the next boot
# (ssh-agent.service logs "there is no session" and never recovers on
# its own; a fresh interactive `pass-cli login` is required every time).
# "dbus" stores it in the D-Bus Secret Service (GNOME Keyring here)
# instead, which survives reboots as long as the keyring is unlocked —
# true here even under SDDM autologin (no password reaches PAM, so
# gnome-keyring's own auto-unlock fails, but this account's default
# collection has no passphrase set, so it still ends up unlocked moments
# after the daemon starts). Applied to both the systemd service and
# interactive shells (below) so `pass-cli login` and the ssh-agent daemon
# agree on where the key lives.
proton_pass_cli_linux_keyring: dbus

# Podman rootless (playbooks/containers.yml) — subuid/subgid range, same
# default useradd already allocates.
podman_subuid_start: 100000
podman_subuid_count: 65536

# Flatpak (playbooks/flatpak.yml) — enables Flatpak support plus the
# Flathub remote (the default cross-distro app source). Omarchy doesn't
# include Flatpak by default.
flatpak_package: flatpak
flatpak_flathub_remote: flathub
flatpak_flathub_repo_url: https://flathub.org/repo/flathub.flatpakrepo
# Bazaar — a Flathub app-store frontend (io.github.kolunmi.Bazaar).
flatpak_bazaar_package: io.github.kolunmi.Bazaar

# Flatpak desktop entries are exported to these dirs; Quickshell's
# DesktopEntries (the Omarchy app library) only scans the dirs named in
# XDG_DATA_DIRS, which the graphical session doesn't get from
# /etc/profile.d/flatpak.sh. flatpak_env_file is deployed to
# ~/.config/environment.d so the session sees flatpak apps.
flatpak_system_exports_dir: /var/lib/flatpak/exports/share
flatpak_user_exports_dir: "{{ ansible_facts.env.HOME }}/.local/share/flatpak/exports/share"
flatpak_env_file: 40-flatpak.conf

# libfprint (goodix538d, playbooks/libfprint.yml) — built in a distrobox
# container, installed to /usr/local on the host.
libfprint_container_name: libfprint-build
libfprint_distrobox_ini_file: "{{ playbook_dir }}/files/libfprint-build.ini"
libfprint_repo: https://github.com/lbssousa/libfprint.git
libfprint_ref: goodix-538d-sigfm-gtls
libfprint_checkout_dir: "{{ ansible_facts.env.HOME }}/src/libfprint-goodix538d"
libfprint_stage_dir: "{{ ansible_facts.env.HOME }}/src/libfprint-goodix538d-stage"

libfprint_usrlocal_prefix: /usr/local
libfprint_usrlocal_libdir: "{{ libfprint_usrlocal_prefix }}/lib"

# Runtime deps for the built library on the host (the container only
# needs the build toolchain). No opencv here: the SIGFM matcher's
# OpenCV subset is vendored and statically linked at build time (see
# playbooks/libfprint.yml), so the host never needs it installed.
libfprint_runtime_deps:
  - openssl
  - glib2
  - libgusb
  - libgudev
  - pixman

# udev rule disabling USB autosuspend for the fingerprint reader. Kept
# even though it didn't fix the real bug (see fprintd_desync_* below) —
# harmless and may still help.
libfprint_goodix_usb_vendor_id: "27c6"
libfprint_goodix_usb_product_id: "538d"

# Secure Boot (Limine + sbctl, playbooks/secureboot.yml — not part of
# `just setup`, run explicitly).
secureboot_esp_path: /boot
secureboot_limine_binary: "{{ secureboot_esp_path }}/EFI/limine/limine_x64.efi"
secureboot_limine_conf: "{{ secureboot_esp_path }}/limine.conf"
secureboot_default_limine_conf: /etc/default/limine
secureboot_kernel_cmdline_file: /etc/kernel/cmdline

# BGRT-derived boot theme (playbooks/bgrt-theme.yml — not part of
# `just setup`, run explicitly). Builds an Omarchy desktop theme and a
# standalone Plymouth theme, both derived from this machine's own UEFI
# BGRT boot logo (/sys/firmware/acpi/bgrt/*), so the same picture stays
# on screen from firmware through Plymouth to the Hyprlock lock screen.
bgrt_sysfs_dir: /sys/firmware/acpi/bgrt
bgrt_sysfs_image: "{{ bgrt_sysfs_dir }}/image"
bgrt_sysfs_yoffset: "{{ bgrt_sysfs_dir }}/yoffset"
bgrt_imagemagick_package: imagemagick
bgrt_omarchy_theme_name: bgrt
bgrt_omarchy_theme_dir: "{{ ansible_facts.env.HOME }}/.config/omarchy/themes/{{ bgrt_omarchy_theme_name }}"
bgrt_plymouth_theme_name: omarchy-bgrt
bgrt_plymouth_theme_dir: "/usr/share/plymouth/themes/{{ bgrt_plymouth_theme_name }}"
# The stock "omarchy" Plymouth theme template Omarchy itself ships —
# read-only source for the assets that just need recoloring.
bgrt_plymouth_stock_dir: /usr/share/omarchy/default/plymouth
bgrt_wordmark_width: 320
# Gaps around the (hidden, until unlocking starts) password entry
# field, same values omarchy-bgrt.script itself uses to place the
# entry field below the logo and the wordmark below the entry field.
bgrt_entry_gap_above: 40
bgrt_entry_gap_below: 30
# Style > Unlock menu preview canvas — same size every Omarchy theme's
# own preview-unlock.png uses.
bgrt_preview_width: 1920
bgrt_preview_height: 1080

# Hyprland scrolling-layout column resize step (playbooks/desktop.yml).
hypr_scrolling_colresize_step: 0.1

# EPSON L4160 printer (playbooks/printer.yml) — driverless CUPS queue.
printer_l4160_name: L4160
printer_l4160_location: "Wi-Fi"
printer_l4160_description: "EPSON L4160 Series"
printer_l4160_hostname: EPSONE0321F.local
printer_l4160_device_uri: "ipp://{{ printer_l4160_hostname }}:631/ipp/print"
printer_l4160_error_policy: abort-job
printer_l4160_set_default: true

# Shell bar + terminal text size (playbooks/desktop.yml), px. The GTK
# text-scaling factor this command would otherwise leave in place is always
# reset — the desktop's default UI font size is set directly instead, via
# omarchy_system_ui_font_pt below.
#
# The monitor scale is 100%, so text is sized to make up for it: 20px is
# the previous 16px times the old 1.25 scale, and the top of the 9–20 range
# omarchy-display-text-size accepts. It also sets the terminal font
# (px * 9/12 = 15pt).
omarchy_text_size_px: 20

# Hyprland monitor scale factor (playbooks/desktop.yml) — the
# compositor-level "screen scale" applied to everything on screen. Fed
# straight into hl.monitor({ scale = ... }) in
# ~/.config/hypr/monitors.lua's omarchy_monitor_scale.
#
# 1.0 (100%): at 1.25 a 1920px-wide screen is only 1536 logical px, so a
# half-screen dwindle tile (749px) is narrower than KeePassXC's ~800px
# minimum width; Hyprland then squeezes the window's image to fit, which
# also skews where the mouse lands on its buttons. At 100% the tile is
# ~950px. omarchy_text_size_px compensates for the smaller scale.
omarchy_monitor_scale: 1.0

# GDK_SCALE (playbooks/desktop.yml) — the integer factor GTK/Electron read
# under XWayland, where Hyprland doesn't scale windows
# (xwayland.force_zero_scaling). Same rule as `omarchy hyprland monitor
# scaling`: the monitor scale rounded to a whole number, so it follows
# omarchy_monitor_scale. Written to ~/.config/hypr/monitors.lua's
# omarchy_gdk_scale.
omarchy_gdk_scale: "{{ omarchy_monitor_scale | float | round | int }}"

# Default GTK system UI font point size
# (playbooks/desktop.yml). Applied directly to
# org.gnome.desktop.interface font-name, keeping whatever font family is
# already configured there. Deliberately smaller than the 15pt that would
# match the old 1.25 monitor scale (12pt * 1.25), unlike the shell bar and
# terminals, which stay compensated.
omarchy_system_ui_font_pt: 12

# Caps Lock via keyd (playbooks/capslock.yml). Key that takes over Compose
# from Caps Lock — must not be a hardware modifier (Ctrl/Alt/Win keep
# acting as modifiers even after their symbol changes; "menu" doesn't have
# that problem and is the natural Compose key already).
capslock_compose_key: menu
keyd_config_dest: /etc/keyd/default.conf

# Night light synced to real sunrise/sunset (playbooks/desktop.yml).
# hyprsunset only supports fixed HH:MM profile times, so a daily timer
# recomputes them.
nightlight_solar_night_temperature: 4000
nightlight_solar_geoip_url: "http://ip-api.com/json/"
nightlight_solar_oncalendar: "*-*-* 00:05:00"

# Inkscape (playbooks/inkscape.yml) — official repo. svg2tikz (an
# Inkscape extension exporting SVG paths as TikZ/PGF for LaTeX,
# https://github.com/xyz2tex/svg2tikz) has no official Arch package, so
# it's built from the AUR the same way as texlive_* / bitwarden_aur_*
# above (unprivileged clone+makepkg+pacman -U). xclip is an optional
# runtime dependency the extension uses for its "copy to clipboard"
# output mode.
inkscape_package: inkscape
inkscape_svg2tikz_aur_package: python-svg2tikz
inkscape_svg2tikz_aur_git_url: "https://aur.archlinux.org/{{ inkscape_svg2tikz_aur_package }}.git"
inkscape_svg2tikz_aur_build_dir: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/aur/{{ inkscape_svg2tikz_aur_package }}"
inkscape_svg2tikz_aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info?arg[]={{ inkscape_svg2tikz_aur_package }}"
inkscape_svg2tikz_aur_build_deps:
  - python-build
  - python-installer
  - python-setuptools
  - python-wheel
  - python-poetry
inkscape_svg2tikz_runtime_deps:
  - xclip

# fontconfig drop-in pointing Inkscape (and every other fontconfig/Pango
# app) at TeX Live's own font tree (playbooks/inkscape.yml), which lives
# outside fontconfig's default search dirs (/usr/share/fonts,
# /usr/local/share/fonts, ~/.fonts, $XDG_DATA_HOME/fonts).
inkscape_texlive_fontconfig_conf: /etc/fonts/conf.d/09-texlive-fonts.conf

# Limine silent boot (playbooks/limine-silent-boot.yml) — hide the boot
# menu for a flicker-free boot. quiet: yes keeps Limine from clearing the
# framebuffer, so the firmware logo stays up while Limine holds the
# display; it only takes effect in the config header (before the first
# entry). timeout: 1 keeps a 1-second key window (any key reveals the menu)
# — with quiet effective nothing is drawn during it; 0 boots instantly with
# no key window. firmware_logo is intentionally not set (the playbook
# removes it): Limine skips it while quiet is effective, and otherwise it
# recentres the BGRT logo away from the position omarchy-bgrt hardcodes.
# /boot/limine.conf is regenerated by
# limine-entry-tool on every kernel/UKI rebuild, but the config header
# (these global options) is preserved, so the settings survive
# `limine-update`.
limine_silent_boot_conf: /boot/limine.conf
limine_silent_boot_quiet: "yes"
limine_silent_boot_timeout: "1"

# ble.sh (playbooks/blesh.yml) — Bash Line Editor: fish-style
# autosuggestions + syntax highlighting. Built from the AUR (unprivileged
# clone+makepkg+pacman -U, same as texlive_* / inkscape_svg2tikz_*).
# blesh-git (0.4.0-devel) rather than the stable `blesh` (0.3.4): 0.3.4
# predates Bash 5.3 and prints "unsupported readline function" warnings
# on every shell start against Omarchy's inputrc (menu-complete-backward,
# emacs-editing-mode, vi-editing-mode); 0.4 loads cleanly.
blesh_aur_package: blesh-git
blesh_aur_git_url: "https://aur.archlinux.org/{{ blesh_aur_package }}.git"
blesh_aur_build_dir: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/aur/{{ blesh_aur_package }}"
blesh_aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info?arg[]={{ blesh_aur_package }}"
blesh_aur_build_deps:
  - git
  - make
  - gawk
blesh_script: /usr/share/blesh/ble.sh
blesh_bashrc: "{{ ansible_facts.env.HOME }}/.bashrc"
blesh_blerc: "{{ ansible_facts.env.HOME }}/.blerc"

# Starship prompt inside distrobox (playbooks/containers.yml).
starship_distrobox_config: "{{ ansible_facts.env.HOME }}/.config/starship.toml"
starship_distrobox_omarchy_default_config: /usr/share/omarchy/config/starship.toml
starship_distrobox_bashrc: "{{ ansible_facts.env.HOME }}/.bashrc"
# Look of the container-name segment in the prompt.
starship_distrobox_symbol: "⬢"
starship_distrobox_style: bold yellow

# snapd (playbooks/snap.yml) — daemon and tools for snap packages. No
# official Arch package, so it's built from the AUR (unprivileged
# clone+makepkg+pacman -U, same as blesh_* / texlive_* above). The build
# deps are the PKGBUILD's makedepends; the runtime deps (squashfs-tools,
# apparmor, ...) are resolved by `pacman -U`.
snapd_aur_package: snapd
snapd_aur_git_url: "https://aur.archlinux.org/{{ snapd_aur_package }}.git"
snapd_aur_build_dir: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/aur/{{ snapd_aur_package }}"
snapd_aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info?arg[]={{ snapd_aur_package }}"
snapd_aur_build_deps:
  - git
  - go
  - go-tools
  - libseccomp
  - libcap
  - systemd
  - xfsprogs
  - python-docutils
  - apparmor
  - autoconf-archive
  - m4
snapd_socket_unit: snapd.socket
snapd_apparmor_unit: snapd.apparmor.service

# The Arch package mounts snaps under /var/lib/snapd/snap; classic snaps
# expect /snap, so it's symlinked there.
snapd_mount_dir: /var/lib/snapd/snap
snapd_bin_dir: "{{ snapd_mount_dir }}/bin"
# Snap desktop entries are exported here; Quickshell's DesktopEntries (the
# Omarchy app library) only scans the dirs named in XDG_DATA_DIRS.
# snapd_env_file is deployed to ~/.config/environment.d so the graphical
# session sees snap apps and the `snap` bin dir (same idea as flatpak_*).
snapd_desktop_dir: /var/lib/snapd/desktop
snapd_env_file: 41-snapd.conf

# Visual Studio Code (playbooks/snap.yml) — Microsoft's official snap
# (classic confinement), so depends on snapd above.
vscode_snap_name: code
# Electron doesn't detect a keyring under Hyprland; argv.json's
# "password-store" forces the libsecret backend (Secret Service: gnome-keyring,
# KeePassXC, ...).
vscode_argv_file: "{{ ansible_facts.env.HOME }}/.vscode/argv.json"
vscode_password_store: gnome-libsecret
# The snap always runs under XWayland (electron-launch hardcodes
# --ozone-platform=x11), where Hyprland doesn't scale the window, so the
# UI size comes from the device scale factor the wrapper passes to
# Electron. It is fixed at 1.25 rather than following omarchy_monitor_scale
# (now 1.0): that is the size VS Code had under the old 1.25 monitor scale,
# so it keeps the same apparent size next to the text sizes raised in
# omarchy_text_size_px / zed_font_size.
vscode_scale_factor: 1.25
vscode_snap_bin: "{{ snapd_bin_dir }}/code"
vscode_wrapper: "{{ ansible_facts.env.HOME }}/.local/bin/code"
vscode_snap_desktop_dir: "{{ snapd_desktop_dir }}/applications"
vscode_desktop_dir: "{{ ansible_facts.env.HOME }}/.local/share/applications"
vscode_desktop_entries:
  - code_code.desktop
  - code_code-url-handler.desktop

# AppArmor (playbooks/apparmor.yml — not part of `just setup`, run
# explicitly; needs a reboot). The kernel is built with AppArmor but
# leaves it out of the default LSM list; `lsm=` on the kernel command line
# (a limine-entry-tool drop-in) replaces that list, so it repeats the
# default one ("landlock,lockdown,yama,integrity,bpf") with apparmor added.
# apparmor_load_profiles picks the variant: false = kernel LSM only, no
# distro profiles loaded (apparmor.service disabled); true = also enable
# apparmor.service, which loads /etc/apparmor.d's profiles (unix-chkpwd,
# avahi-daemon, ping, ... — see the playbook header). Override on the
# command line with `-e apparmor_load_profiles=true` (or `just
# apparmor-profiles`).
apparmor_package: apparmor
apparmor_lsm: landlock,lockdown,yama,integrity,apparmor,bpf
apparmor_limine_dropin: /etc/limine-entry-tool.d/apparmor.conf
apparmor_service: apparmor.service
apparmor_active_lsm_file: /sys/kernel/security/lsm
apparmor_load_profiles: false
