---
# Caps Lock, per user: Compose moves from Shift+Caps Lock (Omarchy 4.5's
# omarchy:shift_caps_compose) to capslock_compose_key in
# ~/.config/hypr/input.lua, so the machine-wide keyd remap
# (system/capslock.yml, which explains it) can produce a real Caps Lock.
# Every user needs this. The layout-switch option Omarchy adds for
# non-Latin layouts (grp:alts_toggle) is kept.
#
# Usage: just capslock
- name: Caps Lock via keyd (tap=Esc / hold=Ctrl / Shift+CapsLock=CapsLock) (user)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: "Move Compose off Caps Lock, onto {{ capslock_compose_key }}"
      block:
        - name: Create ~/.config/hypr
          ansible.builtin.file:
            path: "{{ target_home }}/.config/hypr"
            state: directory
            mode: "0755"

        - name: Create ~/.config/hypr/input.lua from the Omarchy template, if missing
          # The right source is /etc/skel, not
          # /usr/share/omarchy/default/hypr/input.lua (a different
          # internal file with the same basename).
          ansible.builtin.copy:
            src: /etc/skel/.config/hypr/input.lua
            dest: "{{ target_home }}/.config/hypr/input.lua"
            remote_src: true
            force: false
            mode: "0644"

        - name: "Set kb_options = compose:{{ capslock_compose_key }}"
          ansible.builtin.blockinfile:
            path: "{{ target_home }}/.config/hypr/input.lua"
            marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/user/capslock.yml — Compose on {{ capslock_compose_key }})"
            block: |
              local capslock_kb_options = "compose:{{ capslock_compose_key }}"
              local omarchy_kb_options = hl.get_config("input.kb_options")
              if type(omarchy_kb_options) == "string" and omarchy_kb_options:find("grp:alts_toggle", 1, true) then
                capslock_kb_options = capslock_kb_options .. ",grp:alts_toggle"
              end
              hl.config({
                input = {
                  kb_options = capslock_kb_options,
                },
              })
          notify: reload Hyprland

  handlers:
    - name: reload Hyprland
      # Only has an effect inside a real Hyprland session; kb_options
      # still applies on next login either way.
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      listen: reload Hyprland
