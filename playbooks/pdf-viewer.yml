---
# Makes Zathura the default PDF viewer instead of Omarchy's default
# (Evince), and installs Papers (Evince's GNOME successor) as an extra,
# non-default viewer — both still reachable from a file manager's "Open
# With", just not what double-clicking a PDF opens.
#
# Zathura comes from the Arch packages (zathura + the MuPDF backend,
# pdf_viewer_zathura_native_packages). It used to be the Flathub build;
# the sandbox only reached ~/Documents and ~/Downloads, which got in the
# way of PDFs from project trees and removable media, so this play
# moves it back and removes the Flatpak (and its per-app config dir)
# if it finds one.
#
# Evince itself is left installed: Nautilus's quick-previewer (sushi)
# hard-depends on it at the package level (`pacman -Si sushi` lists
# evince under "Depends On"), so removing evince would cascade into
# removing sushi and losing Space-to-preview for every file type, not
# just PDFs. Papers stays native too.
#
# The default-application mapping is set in the user's own
# ~/.config/mimeapps.list rather than
# /usr/share/applications/mimeapps.list, which is owned by the
# omarchy-settings package (see `pacman -Qo`) and would be reverted by
# a future package update. A per-user mimeapps.list already takes
# precedence over the system-wide one (XDG Desktop Entry spec), so this
# doesn't need to touch the package-owned file at all.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags pdf-viewer
- name: PDF viewer (Zathura default, Papers optional, Evince kept for sushi)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Install Zathura and its MuPDF backend
      community.general.pacman:
        name: "{{ pdf_viewer_zathura_native_packages }}"
        state: present
      become: true

    - name: Look for the Zathura Flatpak this play used to install
      ansible.builtin.command:
        cmd: flatpak info --system {{ pdf_viewer_zathura_flatpak_id }}
      register: pdf_viewer_zathura_flatpak_info
      changed_when: false
      failed_when: false

    - name: Remove the Zathura Flatpak
      # Same desktop-entry id as the native build, so leaving both
      # installed would make the launcher's entry ambiguous.
      community.general.flatpak:
        name: "{{ pdf_viewer_zathura_flatpak_id }}"
        state: absent
        method: system
      become: true
      when: pdf_viewer_zathura_flatpak_info.rc == 0

    - name: Look for the Flatpak's per-app data dir
      ansible.builtin.stat:
        path: "{{ pdf_viewer_flatpak_data_dir }}"
      register: pdf_viewer_flatpak_data

    - name: Remove the Flatpak's per-app data dir
      # Holds only the zathurarc this play wrote plus Zathura's own
      # history/bookmarks cache for the sandboxed build; the native
      # build keeps its own under ~/.config and ~/.local/share.
      ansible.builtin.file:
        path: "{{ pdf_viewer_flatpak_data_dir }}"
        state: absent
      when: pdf_viewer_flatpak_data.stat.exists

    - name: Look for Zathura's installed desktop entry
      ansible.builtin.stat:
        path: "/usr/share/applications/{{ pdf_viewer_zathura_desktop_id }}"
      register: pdf_viewer_zathura_installed_entry

    - name: Expect the package to still ship the desktop id the default points at
      ansible.builtin.assert:
        that: pdf_viewer_zathura_installed_entry.stat.exists
        fail_msg: >-
          /usr/share/applications/{{ pdf_viewer_zathura_desktop_id }} is
          missing, so {{ pdf_viewer_mimeapps_path }} would point at
          nothing and double-clicking a PDF would fall back to another
          viewer. Fix pdf_viewer_zathura_desktop_id in
          group_vars/all/main.yml to the package's new id.
        quiet: true

    - name: "Set Zathura as the default PDF viewer ({{ pdf_viewer_mimeapps_path }})"
      community.general.ini_file:
        path: "{{ pdf_viewer_mimeapps_path }}"
        section: Default Applications
        option: application/pdf
        value: "{{ pdf_viewer_zathura_desktop_id }}"
        no_extra_spaces: true
        create: true
        mode: "0644"

    - name: Install Papers (extra, non-default viewer)
      community.general.pacman:
        name: "{{ pdf_viewer_papers_package }}"
        state: present
      become: true

    - name: Create the Zathura config dir
      ansible.builtin.file:
        path: "{{ pdf_viewer_zathurarc_path | dirname }}"
        state: directory
        mode: "0755"

    - name: "Set the statusbar/inputbar font ({{ pdf_viewer_zathurarc_path }})"
      ansible.builtin.copy:
        content: |
          # Managed by playbooks/pdf-viewer.yml — statusbar/inputbar font.
          set font "{{ pdf_viewer_zathura_font }}"
        dest: "{{ pdf_viewer_zathurarc_path }}"
        mode: "0644"
