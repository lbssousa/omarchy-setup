---
# Creates the Firefox Taskbar Tabs ("tab apps") listed in
# firefox_taskbar_apps (users/<name>.yml / group_vars/all/main.yml) — sites
# that open as their own app-like window — and points the webapp keybinds at
# them instead of Omarchy's omarchy-launch-webapp, which only knows the
# Chromium family's --app= flag. Everything lives in the user's home, so no
# root.
#
# Firefox pins a tab through the DynamicLauncher portal, with a
# confirmation dialog per site. files/firefox-taskbar-apps.py writes the
# same registry entries and launchers directly instead (see its docstring),
# so Firefox has to be closed while it runs.
#
# Usage: just firefox-taskbar-apps
- name: Firefox web apps as Taskbar Tabs (create, remove Omarchy launchers, wire keybinds)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [firefox-taskbar-apps]

  tasks:
    - name: Create ~/.local/bin
      ansible.builtin.file:
        path: "{{ target_home }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Deploy omarchy-setup-launch-firefox-taskbar-app
      ansible.builtin.template:
        src: launch-firefox-taskbar-app.sh.j2
        dest: "{{ firefox_taskbar_app_launcher }}"
        mode: "0755"

    - name: Ensure the Firefox Flatpak is installed
      ansible.builtin.command: "flatpak info --show-ref {{ firefox_flatpak_id }}"
      changed_when: false

    # Firefox reads taskbartabs.json once at startup and rewrites it whole on
    # every change, so editing it under a running Firefox gets clobbered.
    # Worse, a launcher whose -taskbar-tab uuid the running instance doesn't
    # know makes it recreate the app under a fresh uuid
    # (TaskbarTabsCmd.sys.mjs), and the window's class then matches no
    # .desktop file.
    - name: Check that Firefox isn't running
      ansible.builtin.command: flatpak ps --columns=application
      register: firefox_running_check
      changed_when: false
      when: firefox_taskbar_apps | length > 0

    # A warning and a skip rather than a failure, which would also stop
    # every play after this one in a full user.yml / site.yml run.
    - name: Warn that Firefox is running
      ansible.builtin.debug:
        msg: &firefox_running_warning >-
          SKIPPED: {{ firefox_flatpak_id }} is running, and Firefox keeps
          the Taskbar Tabs registry in memory, overwriting any change.
          Close it (or `flatpak kill {{ firefox_flatpak_id }}`) and run
          `just firefox-taskbar-apps`.
      when:
        - firefox_taskbar_apps | length > 0
        - firefox_flatpak_id in firefox_running_check.stdout_lines

    - name: Skip the rest of this play while Firefox is running
      ansible.builtin.meta: end_host
      when:
        - firefox_taskbar_apps | length > 0
        - firefox_flatpak_id in firefox_running_check.stdout_lines

    # Writes the registry entries, launchers and icons, and removes
    # Omarchy's launchers for the same sites plus anything orphaned — see
    # the script. It prints one line per change.
    - name: Create the Taskbar Tabs and clean up stale launchers
      ansible.builtin.script:
        cmd: >-
          firefox-taskbar-apps.py {{ {
            'apps': firefox_taskbar_apps,
            'flatpak_id': firefox_flatpak_id,
            'profiles_dirs': firefox_profiles_dirs,
            'desktop_dir': firefox_webapp_desktop_dir,
            'portal_dir': target_home ~ '/.local/share/xdg-desktop-portal',
            'backup_dir': target_home ~ '/.cache/omarchy-setup/firefox-taskbar-removed-launchers',
          } | to_json | quote }}
        executable: python3
      register: firefox_taskbar_apps_result
      when: firefox_taskbar_apps | length > 0
      # 3: Firefox was started while the script ran; it wrote nothing.
      failed_when: firefox_taskbar_apps_result.rc not in [0, 3]
      changed_when: firefox_taskbar_apps_result.stdout | trim | length > 0
      notify: refresh the applications database

    - name: Warn that Firefox was started while the Taskbar Tabs were prepared
      ansible.builtin.debug:
        msg: *firefox_running_warning
      when:
        - firefox_taskbar_apps | length > 0
        - firefox_taskbar_apps_result.rc == 3

    - name: Skip the rest of this play when Firefox was started meanwhile
      ansible.builtin.meta: end_host
      when:
        - firefox_taskbar_apps | length > 0
        - firefox_taskbar_apps_result.rc == 3

    - name: Create ~/.config/hypr
      ansible.builtin.file:
        path: "{{ target_home }}/.config/hypr"
        state: directory
        mode: "0755"

    - name: Create ~/.config/hypr/bindings.lua from the Omarchy default, if missing
      ansible.builtin.copy:
        src: /usr/share/omarchy/default/hypr/bindings.lua
        dest: "{{ target_home }}/.config/hypr/bindings.lua"
        remote_src: true
        force: false
        mode: "0644"

    # Every tab app's window class is org.mozilla.firefox.webapp-<uuid>. The
    # uuid is per-install, so the rule matches the whole family: any site
    # pinned later opens the same way.
    - name: Open the Firefox Taskbar Tabs in tiled fullscreen
      ansible.builtin.blockinfile:
        path: "{{ target_home }}/.config/hypr/bindings.lua"
        marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/user/firefox-taskbar-apps.yml — Firefox Taskbar Tabs tiled fullscreen)"
        block: |
          o.window("^{{ firefox_desktop_prefix | replace('.', '\\.') }}\\.webapp-.*$", { fullscreen_state = "0 2" })
      notify: reload Hyprland

    - name: Rebind the webapp keys to the Taskbar Tabs
      ansible.builtin.blockinfile:
        path: "{{ target_home }}/.config/hypr/bindings.lua"
        marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/user/firefox-taskbar-apps.yml — Firefox Taskbar Tabs keybindings)"
        state: "{{ 'present' if (firefox_taskbar_apps | selectattr('keybind', 'defined') | list | length > 0) else 'absent' }}"
        block: |
          {% for app in firefox_taskbar_apps if app.keybind is defined and app.keybind %}
          hl.unbind("{{ app.keybind }}")
          o.bind("{{ app.keybind }}", "{{ app.label }}", { launch = "{{ firefox_taskbar_app_launcher }} {{ app.desktop_name | quote }}" })
          {% endfor %}
      notify: reload Hyprland

  handlers:
    # Best effort: lets launchers show up without a session restart.
    - name: refresh the applications database
      ansible.builtin.command: update-desktop-database {{ firefox_webapp_desktop_dir }}
      changed_when: false
      failed_when: false

    - name: reload Hyprland
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
