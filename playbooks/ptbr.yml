---
# pt-BR localization, covering seven independent areas (each with its own
# sub-tag to run or skip on its own):
#
#   - locale + LANG/LANGUAGE (ptbr-locale): enables pt_BR.UTF-8 without
#     removing other locales, and sets LANG/LANGUAGE in /etc/locale.conf.
#   - xdg-user-dirs (ptbr-xdg-user-dirs): renames personal folders
#     (~/Downloads, etc.) to their pt-BR translations, only for folders
#     that are already enabled.
#   - Firefox (ptbr-firefox): installs the pt-BR language pack and forces
#     RequestedLocale via policies.json, since a profile created before
#     LANG was pt_BR never renegotiates its language on its own.
#   - Chromium and variants (ptbr-chromium): fixes each browser's
#     Preferences (intl.accept_languages), which controls the page
#     language web apps like WhatsApp Web see — frozen at en-US since
#     profile creation, with no official policy for this in Chromium.
#   - LibreOffice (ptbr-libreoffice): installs the pt-BR language pack.
#   - Man pages (ptbr-man-pages): installs man-pages-pt_br.
#   - OCR (ptbr-ocr): installs tesseract-data-por and sets
#     OMARCHY_OCR_LANGS for omarchy-capture-text.
#
# Doesn't touch keyboard layout or timezone — both are already asked by
# the Omarchy installer. Doesn't touch apps that ship pt_BR translations
# in their own package (GNOME, GTK, KDE) — those already follow LANG.
#
# A logout (or reboot) is needed after the locale step for LANG to apply
# to the whole graphical session.
- name: pt-BR localization
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: pt_BR.UTF-8 locale (locale.gen + system LANG/LANGUAGE)
      become: true
      block:
        - name: Ensure pt_BR.UTF-8 UTF-8 is enabled in /etc/locale.gen
          ansible.builtin.lineinfile:
            path: /etc/locale.gen
            regexp: '^#?\s*{{ ptbr_locale_gen_line | regex_escape }}\s*$'
            line: "{{ ptbr_locale_gen_line }}"
          register: locale_gen_conf

        - name: Generate locales (locale-gen)
          ansible.builtin.command: locale-gen
          when: locale_gen_conf.changed

        - name: "Set LANG={{ ptbr_locale }} in /etc/locale.conf"
          ansible.builtin.lineinfile:
            path: /etc/locale.conf
            regexp: '^LANG='
            line: "LANG={{ ptbr_locale }}"
            create: true

        - name: Set LANGUAGE (gettext fallback chain) in /etc/locale.conf
          ansible.builtin.lineinfile:
            path: /etc/locale.conf
            regexp: '^LANGUAGE='
            line: "LANGUAGE={{ ptbr_language_fallback }}"
            create: true

        - name: Note that logout/reboot is needed for the graphical session
          ansible.builtin.debug:
            msg: >-
              LANG/LANGUAGE updated in /etc/locale.conf. Log out (or
              reboot) for Hyprland and already-open apps to pick up the
              new language.
      tags: [ptbr-locale]

    - name: Personal folders (xdg-user-dirs) in pt-BR
      block:
        - name: Ensure xdg-user-dirs is installed
          community.general.pacman:
            name: xdg-user-dirs
            state: present
          become: true

        - name: Look up the current path for each XDG folder
          ansible.builtin.command: "xdg-user-dir {{ item.name }}"
          loop: "{{ ptbr_xdg_user_dirs }}"
          loop_control:
            label: "{{ item.name }}"
          register: xdg_current
          changed_when: false

        - name: Rename enabled folders and update user-dirs.dirs
          vars:
            # A disabled folder is stored as "$HOME/" (trailing slash) —
            # normalize before comparing, or this tries to move $HOME
            # into itself.
            current_path: "{{ result.stdout | regex_replace('/+$', '') }}"
            desired_path: "{{ ansible_facts.env.HOME }}/{{ result.item.translated }}"
          ansible.builtin.shell: >-
            mv "{{ current_path }}" "{{ desired_path }}" &&
            xdg-user-dirs-update --set {{ result.item.name }} "{{ desired_path }}"
          loop: "{{ xdg_current.results }}"
          loop_control:
            loop_var: result
            label: "{{ result.item.name }}"
          when:
            - current_path != (ansible_facts.env.HOME | regex_replace('/+$', ''))
            - current_path != desired_path
          changed_when: true
      tags: [ptbr-xdg-user-dirs]

    - name: Firefox pt-BR language pack
      block:
        - name: Check whether Firefox is installed
          ansible.builtin.command: pacman -Q firefox
          register: firefox_check
          changed_when: false
          failed_when: false

        - name: Install the Firefox pt-BR language pack
          community.general.pacman:
            name: "{{ ptbr_firefox_i18n_package }}"
            state: present
          become: true
          when: firefox_check.rc == 0

        - name: Check whether Firefox's policies.json already exists
          ansible.builtin.stat:
            path: /usr/lib/firefox/distribution/policies.json
          register: firefox_policies_stat
          when: firefox_check.rc == 0

        - name: Load the current policies.json (or an empty object)
          when: firefox_check.rc == 0
          block:
            - name: Try parsing the current policies.json
              ansible.builtin.set_fact:
                firefox_policies_current: >-
                  {{
                    (lookup('file', '/usr/lib/firefox/distribution/policies.json') | from_json)
                    if firefox_policies_stat.stat.exists
                    else {'policies': {}}
                  }}
          rescue:
            - name: Existing policies.json isn't valid JSON — treat as empty
              ansible.builtin.set_fact:
                firefox_policies_current: { "policies": {} }

            - name: Warn about the corrupted policies.json
              ansible.builtin.debug:
                msg: >-
                  /usr/lib/firefox/distribution/policies.json exists but
                  isn't valid JSON — treated as empty and will be
                  overwritten now. Any policy that only existed in that
                  file was lost.

        - name: "Force RequestedLocale={{ ptbr_firefox_requested_locale }} in policies.json"
          ansible.builtin.copy:
            content: >-
              {{
                (firefox_policies_current
                  | combine({'policies': {'RequestedLocale': ptbr_firefox_requested_locale}}, recursive=True)
                  | to_nice_json)
              }}
            dest: /usr/lib/firefox/distribution/policies.json
            mode: "0644"
          become: true
          when: firefox_check.rc == 0

        - name: Note that Firefox wasn't found (no action taken)
          ansible.builtin.debug:
            msg: >-
              Firefox not found via pacman — {{ ptbr_firefox_i18n_package }}
              not installed, policies.json untouched.
          when: firefox_check.rc != 0
      tags: [ptbr-firefox]

    - name: "Chromium and variants — web app language ({{ ptbr_chromium_accept_languages }})"
      ansible.builtin.include_tasks: tasks/ptbr-chromium-family-browser.yml
      loop: "{{ ptbr_chromium_family_config_dirs }}"
      loop_control:
        loop_var: browser_config_dir
      tags: [ptbr-chromium]

    - name: LibreOffice pt-BR language pack
      block:
        - name: Check whether LibreOffice Fresh is installed
          ansible.builtin.command: pacman -Q libreoffice-fresh
          register: libreoffice_check
          changed_when: false
          failed_when: false

        - name: Install the LibreOffice Fresh pt-BR language pack
          community.general.pacman:
            name: "{{ ptbr_libreoffice_i18n_package }}"
            state: present
          become: true
          when: libreoffice_check.rc == 0

        - name: Note that LibreOffice Fresh wasn't found (no action taken)
          ansible.builtin.debug:
            msg: >-
              libreoffice-fresh not found via pacman —
              {{ ptbr_libreoffice_i18n_package }} not installed.
          when: libreoffice_check.rc != 0
      tags: [ptbr-libreoffice]

    - name: pt-BR man pages
      community.general.pacman:
        name: "{{ ptbr_man_pages_package }}"
        state: present
      become: true
      tags: [ptbr-man-pages]

    - name: "OCR (omarchy-capture-text) — pt-BR tesseract data + OMARCHY_OCR_LANGS={{ ptbr_ocr_langs }}"
      block:
        - name: Check whether tesseract is installed
          ansible.builtin.command: pacman -Q tesseract
          register: tesseract_check
          changed_when: false
          failed_when: false

        - name: Install Portuguese OCR data (tesseract-data-por)
          community.general.pacman:
            name: "{{ ptbr_tesseract_data_package }}"
            state: present
          become: true
          when: tesseract_check.rc == 0

        - name: Create ~/.config/environment.d
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/environment.d"
            state: directory
            mode: "0755"
          when: tesseract_check.rc == 0

        - name: "Set OMARCHY_OCR_LANGS={{ ptbr_ocr_langs }} for omarchy-capture-text"
          ansible.builtin.copy:
            content: "OMARCHY_OCR_LANGS={{ ptbr_ocr_langs }}\n"
            dest: "{{ ansible_facts.env.HOME }}/.config/environment.d/20-omarchy-ocr-langs.conf"
            mode: "0644"
          when: tesseract_check.rc == 0

        - name: Note that tesseract wasn't found (no action taken)
          ansible.builtin.debug:
            msg: >-
              tesseract not found via pacman — Portuguese OCR data not
              installed, OMARCHY_OCR_LANGS not set.
          when: tesseract_check.rc != 0
      tags: [ptbr-ocr]
