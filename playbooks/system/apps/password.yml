---
# Password managers, system phase (apps: password). The packages come from
# apps/packages.yml; this adds:
#
#   Bitwarden (Flatpak)  the D-Bus names its tray icon needs, and how it
#                        copies passwords: with the clipboard-portal feature,
#                        native Wayland without its X11 socket, so it takes
#                        the Clipboard portal (xdg-desktop-portal-omarchy);
#                        without, XWayland (see bitwarden_flatpak_own_names /
#                        bitwarden_flatpak_env_*). What an earlier setup left
#                        (an unfiltered Wayland socket link) is undone.
#   Bitwarden (either)   the polkit action its biometric unlock needs, from
#                        https://bitwarden.com/help/biometrics/ (removed when
#                        neither build is installed)
#   KeePassXC (Flatpak)  the D-Bus names its tray icon needs
#
# The keybind, autostart and SSH agent are per user, for the default one
# (user/apps/password.yml).
- name: Apps — password managers
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [apps]

  vars:
    bitwarden_any_on: "{{ apps.password.installed | intersect(['bitwarden-flatpak', 'bitwarden']) | length > 0 }}"
    bitwarden_flatpak_on: "{{ 'bitwarden-flatpak' in apps.password.installed }}"
    bitwarden_portal_on: "{{ features['clipboard-portal'] | default(true) }}"
    bitwarden_legacy_unit_dest: "/etc/systemd/user/{{ bitwarden_legacy_wayland_link_unit }}"

  tasks:
    - name: Read the Bitwarden Flatpak's overrides
      ansible.builtin.command:
        cmd: flatpak override --system --show {{ bitwarden_flatpak_id }}
      register: bitwarden_override_current
      changed_when: false
      when: bitwarden_flatpak_on | bool

    # The overrides task only adds, and this one gave the sandbox an
    # unfiltered Wayland socket.
    - name: Reset the Bitwarden Flatpak's overrides left by the Wayland socket link
      ansible.builtin.command:
        cmd: flatpak override --system --reset {{ bitwarden_flatpak_id }}
      when:
        - bitwarden_flatpak_on | bool
        - bitwarden_legacy_wayland_override_marks | select('in', bitwarden_override_current.stdout) | list | length > 0
      changed_when: true
      become: true

    - name: Check whether the Wayland socket link unit is enabled for every user
      ansible.builtin.command: systemctl --global is-enabled {{ bitwarden_legacy_wayland_link_unit }}
      register: bitwarden_legacy_unit_enabled
      changed_when: false
      failed_when: false

    - name: Disable the Wayland socket link unit
      ansible.builtin.command: systemctl --global disable {{ bitwarden_legacy_wayland_link_unit }}
      when: bitwarden_legacy_unit_enabled.stdout | trim == 'enabled'
      changed_when: true
      become: true

    - name: Remove the Wayland socket link unit
      ansible.builtin.file:
        path: "{{ bitwarden_legacy_unit_dest }}"
        state: absent
      become: true

    - name: Bitwarden (Flatpak) overrides
      ansible.builtin.include_tasks: tasks/flatpak-overrides.yml
      vars:
        override_app: "{{ bitwarden_flatpak_id }}"
        override_own_names: "{{ bitwarden_flatpak_own_names }}"
        override_env: "{{ bitwarden_flatpak_env_portal if bitwarden_portal_on | bool else bitwarden_flatpak_env_xwayland }}"
        override_nosockets: "{{ bitwarden_flatpak_portal_nosockets if bitwarden_portal_on | bool else [] }}"
        override_sockets: "{{ [] if bitwarden_portal_on | bool else bitwarden_flatpak_portal_nosockets }}"
      when: bitwarden_flatpak_on | bool

    - name: Install the Bitwarden polkit action (biometric unlock)
      ansible.builtin.copy:
        src: com.bitwarden.Bitwarden.policy
        dest: "{{ bitwarden_polkit_action_dest }}"
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: restart polkit
      when: bitwarden_any_on | bool

    - name: Remove the Bitwarden polkit action (no Bitwarden installed)
      ansible.builtin.file:
        path: "{{ bitwarden_polkit_action_dest }}"
        state: absent
      become: true
      notify: restart polkit
      when: not bitwarden_any_on | bool

    - name: KeePassXC (Flatpak) overrides
      ansible.builtin.include_tasks: tasks/flatpak-overrides.yml
      vars:
        override_app: "{{ keepassxc_flatpak_id }}"
        override_own_names: "{{ keepassxc_flatpak_own_names }}"
      when: "'keepassxc-flatpak' in apps.password.installed"

  handlers:
    - name: restart polkit
      ansible.builtin.systemd:
        name: polkit
        state: restarted
      become: true
      listen: restart polkit
