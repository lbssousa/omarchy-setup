---
# NVIDIA (proprietary driver) — installs the right package for the
# detected GPU, reusing Omarchy's own hardware-detection tools
# (omarchy-hw-nvidia-gsp / omarchy-hw-nvidia-without-gsp) instead of
# reimplementing PCI device ID ranges. Also replicates the boot tweaks
# the Omarchy installer applies (early KMS via modprobe + mkinitcpio) and
# installs the matching kernel headers for dkms. Depends on Omarchy's own
# tools, unlike the rest of this repo, which only needs Arch + pacman.
- name: NVIDIA (proprietary driver)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Detect GSP firmware support (Turing or newer)
      ansible.builtin.command: omarchy-hw-nvidia-gsp
      register: nvidia_gsp_check
      changed_when: false
      failed_when: false

    - name: Detect Maxwell/Pascal/Volta (no GSP)
      ansible.builtin.command: omarchy-hw-nvidia-without-gsp
      register: nvidia_without_gsp_check
      changed_when: false
      failed_when: false

    - name: Pick the packages to install for this GPU
      ansible.builtin.set_fact:
        nvidia_packages: >-
          {{ nvidia_gsp_packages
             if nvidia_gsp_check.rc == 0
             else (nvidia_without_gsp_packages if nvidia_without_gsp_check.rc == 0 else []) }}

    - name: Warn and skip if no compatible NVIDIA GPU was found
      ansible.builtin.debug:
        msg: >-
          No compatible NVIDIA GPU detected — nothing to install. See
          https://wiki.archlinux.org/title/NVIDIA.
      when: nvidia_packages | length == 0

    - name: NVIDIA (driver + boot configuration)
      when: nvidia_packages | length > 0
      become: true
      block:
        - name: Find the running kernel package
          ansible.builtin.command: "pacman -Qqs '{{ nvidia_kernel_pkg_regex }}'"
          register: nvidia_kernel_pkg
          changed_when: false

        - name: Install the matching kernel headers
          community.general.pacman:
            name: "{{ nvidia_kernel_pkg.stdout_lines | first }}-headers"
            state: present

        - name: Install the NVIDIA driver
          community.general.pacman:
            name: "{{ nvidia_packages }}"
            state: present

        - name: Enable early KMS via modprobe (nvidia_drm modeset=1)
          ansible.builtin.copy:
            content: |
              options nvidia_drm modeset=1
            dest: "{{ nvidia_modprobe_conf_dest }}"
            mode: "0644"

        - name: Enable early KMS via mkinitcpio (initramfs modules)
          ansible.builtin.copy:
            content: |
              MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
            dest: "{{ nvidia_mkinitcpio_conf_dest }}"
            mode: "0644"
          register: nvidia_mkinitcpio_conf

        - name: Rebuild the initramfs (mkinitcpio -P)
          ansible.builtin.command: mkinitcpio -P
          when: nvidia_mkinitcpio_conf.changed

        - name: Check whether the driver is already loaded
          ansible.builtin.command: nvidia-smi --query-gpu=name --format=csv,noheader
          register: nvidia_smi_check
          changed_when: false
          failed_when: false
          become: false

        - name: Warn if a reboot is needed for the driver to load
          ansible.builtin.debug:
            msg: >-
              The driver was installed/configured but doesn't appear to
              be loaded yet. Reboot to pick up the new kernel module and
              initramfs.
          when: nvidia_smi_check.rc != 0
