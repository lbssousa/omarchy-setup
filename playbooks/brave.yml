---
# Installs Brave from Flathub (com.brave.Browser) — a stock,
# Brave-maintained build available on any distro — replacing the AUR
# brave-origin-bin package (a de-Googled fork this repo previously had
# to track manually, driving playbooks/brave-pwa-webapps.yml, removed).
#
# Bootstraps Flatpak + the Flathub remote itself (same tasks as
# playbooks/flatpak.yml, system-wide) so `just brave` keeps working
# standalone, with no ordering dependency on that playbook — same
# approach as playbooks/firefox.yml.
#
# Uninstalls brave-origin-bin and its leftover WebAppInstallForceList
# policy (/etc/brave/policies/managed/omarchy-setup-webapps.json,
# written by the now-removed playbooks/brave-pwa-webapps.yml). Doesn't
# touch ~/.config/BraveSoftware/Brave-Origin (392MB+ of real profile
# data as of 2026-09-25) — that's left in place in case anything still
# needs it. Brave containers and PWAs that pointed at brave-origin had
# to be recreated by hand in the new Flathub profile (done manually,
# 2026-09-25) — not tracked by this repo, same as the Firefox Taskbar
# Tabs web apps playbooks/brave-pwa-webapps.yml itself replaced.
# Hyprland keybinds left over from that playbook (bindings.lua, marker
# "playbooks/brave-pwa-webapps.yml — ... keybinding") now point at the
# launcher names removed below — rebind those by hand too, same
# precedent (see the Firefox Taskbar Tabs commit).
#
# The second play below fixes up the .desktop files the Flathub Brave
# PWA installer itself writes (see
# playbooks/templates/fix-brave-pwa-desktop.sh.j2 for the bugs), and
# wires any PWA listed in brave_pwa_containers to its Brave container
# (see that variable in group_vars/all/main.yml). The third play wires
# Omarchy's *own* web app launchers (the --app= ones, see
# playbooks/templates/fix-brave-omarchy-webapp-containers.sh.j2 and
# brave_omarchy_webapp_containers) to the same containers.
- name: Brave
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Ensure Flatpak is installed
      community.general.pacman:
        name: "{{ flatpak_package }}"
        state: present
      become: true

    - name: Ensure the Flathub remote is configured (system-wide)
      community.general.flatpak_remote:
        name: "{{ flatpak_flathub_remote }}"
        state: present
        method: system
        flatpakrepo_url: "{{ flatpak_flathub_repo_url }}"
      become: true

    - name: Install Brave from Flathub
      community.general.flatpak:
        name: "{{ brave_flatpak_id }}"
        state: present
        method: system
      become: true

    - name: Remove the AUR brave-origin-bin package, if present
      community.general.pacman:
        name: brave-origin-bin
        state: absent
      become: true

    - name: Remove the leftover Brave web app force-install policy
      ansible.builtin.file:
        path: /etc/brave/policies/managed/omarchy-setup-webapps.json
        state: absent
      become: true

    # Omarchy's native web apps (YouTube, WhatsApp, Google Maps, ...,
    # ~/.local/share/applications/<Name>.desktop) are deliberately left
    # alone: with Brave the default browser they run through
    # omarchy-launch-webapp on the Flathub build (see
    # playbooks/default-browser.yml). Older versions of this play
    # deleted them in favour of the Brave PWAs below.

# Brave's Flatpak PWA installer ("flextop") writes .desktop files that
# violate the freedesktop.org spec, are missing StartupNotify, have the
# wrong StartupWMClass for Wayland window matching, point Icon= at a
# path Brave never actually writes to, and never wire a PWA to a Brave
# container (brave://settings/containers) — see
# playbooks/templates/fix-brave-pwa-desktop.sh.j2 for the six specific
# bugs (the container one is opt-in, via brave_pwa_containers). A
# systemd --user path unit watches ~/.local/share/applications and
# reruns the fix whenever Brave installs or updates a PWA; the fix
# itself is idempotent, so repeated triggers (including the one caused
# by the fix writing its own backup file into that same directory) are
# harmless and self-limiting.
- name: Brave Flatpak PWA .desktop fixup
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [brave, brave-pwa-desktop-fix]

  tasks:
    - name: Create ~/.local/bin
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0755"
      tags: [brave, brave-pwa-desktop-fix]

    - name: Deploy fix-brave-pwa-desktop
      ansible.builtin.template:
        src: fix-brave-pwa-desktop.sh.j2
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/fix-brave-pwa-desktop"
        mode: "0755"
      tags: [brave, brave-pwa-desktop-fix]

    - name: Create ~/.config/systemd/user
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
        state: directory
        mode: "0755"
      tags: [brave, brave-pwa-desktop-fix]

    - name: Install the fix-brave-pwa-desktop systemd --user units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/{{ item }}"
        mode: "0644"
      loop:
        - fix-brave-pwa-desktop.service
        - fix-brave-pwa-desktop.path
      notify: reload systemd --user
      tags: [brave, brave-pwa-desktop-fix]

    - name: Enable the fix-brave-pwa-desktop path unit
      ansible.builtin.systemd:
        name: fix-brave-pwa-desktop.path
        scope: user
        daemon_reload: true
        enabled: true
        state: started
      tags: [brave, brave-pwa-desktop-fix]

    - name: Run fix-brave-pwa-desktop now
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/fix-brave-pwa-desktop"
      register: fix_brave_pwa_desktop_result
      changed_when: "fix_brave_pwa_desktop_result.stdout is search('Result: [1-9]')"
      tags: [brave, brave-pwa-desktop-fix]

  handlers:
    - name: reload systemd --user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      listen: reload systemd --user

# Omarchy's native web apps (YouTube, WhatsApp, Google Maps, ...; see
# ~/.local/share/applications) are launchers whose Exec runs
# `omarchy-launch-webapp <url>`. With Brave the default browser that
# opens a Brave --app= window in the profile's default (non-container)
# partition. Brave supports `--container=<name>` together with `--app=`
# since 1.95.x (brave/brave-browser#58019 landed via brave-core#38964),
# so a launcher can opt into a storage-isolated container by appending
# --container=<name> to its Exec=. This play converges the launchers
# mapped in brave_omarchy_webapp_containers (group_vars/all/main.yml) on
# their container, idempotently, and installs a systemd --user path unit
# that reruns the fix whenever a web app launcher appears or is rewritten
# (e.g. by omarchy-webapp-install) — the same wiring pattern the PWA
# fixup below/above uses. Container names must already exist in Brave
# (brave://settings/containers).
- name: Brave Omarchy web app container wiring
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [brave, brave-webapp-containers]

  tasks:
    - name: Create ~/.local/bin
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0755"
      tags: [brave, brave-webapp-containers]

    - name: Deploy fix-brave-omarchy-webapp-containers
      ansible.builtin.template:
        src: fix-brave-omarchy-webapp-containers.sh.j2
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/fix-brave-omarchy-webapp-containers"
        mode: "0755"
      tags: [brave, brave-webapp-containers]

    - name: Create ~/.config/systemd/user
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
        state: directory
        mode: "0755"
      tags: [brave, brave-webapp-containers]

    - name: Install the fix-brave-omarchy-webapp-containers systemd --user units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/{{ item }}"
        mode: "0644"
      loop:
        - fix-brave-omarchy-webapp-containers.service
        - fix-brave-omarchy-webapp-containers.path
      notify: reload systemd --user
      tags: [brave, brave-webapp-containers]

    - name: Enable the fix-brave-omarchy-webapp-containers path unit
      ansible.builtin.systemd:
        name: fix-brave-omarchy-webapp-containers.path
        scope: user
        daemon_reload: true
        enabled: true
        state: started
      tags: [brave, brave-webapp-containers]

    - name: Run fix-brave-omarchy-webapp-containers now
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/fix-brave-omarchy-webapp-containers"
      register: fix_brave_omarchy_webapp_containers_result
      changed_when: "fix_brave_omarchy_webapp_containers_result.stdout is search('Result: [1-9]')"
      tags: [brave, brave-webapp-containers]

  handlers:
    - name: reload systemd --user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      listen: reload systemd --user
