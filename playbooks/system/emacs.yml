---
# GNU Emacs, system phase: the packages Omarchy's installer
# (omarchy-install-editor-emacs, then omarchy-install-emacs) puts in —
# omarchy-emacs (from Omarchy's pacman repo) and emacs-wayland. The Omarchy
# integration, the Emacs packages, the theme and emacs.service are per user, in
# user/emacs.yml, which explains them.
#
# Usage: just emacs
- name: Emacs (omarchy-emacs) + AUCTeX, yasnippet, lsp-mode (classic theme)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # omarchy-emacs moved from the AUR to Omarchy's own pacman repo, so
    # plain pacman installs it (omarchy-pkg-aur-add would have yay call
    # sudo, which has no terminal to ask for the password here).
    # emacs-wayland is omarchy-install-emacs's own `omarchy-pkg-add
    # emacs-wayland`, done here so the user phase needs no root.
    - name: Install omarchy-emacs and emacs-wayland
      community.general.pacman:
        name:
          - "{{ emacs_package }}"
          - emacs-wayland
        state: present
      become: true
