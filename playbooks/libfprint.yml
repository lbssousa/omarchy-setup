---
# libfprint (goodix538d) — builds and installs the
# https://github.com/lbssousa/libfprint fork (goodixtls53xd driver, for
# the Goodix 27c6:538d fingerprint reader) into /usr/local.
#
# Builds in a distrobox container, keeping the build toolchain
# (meson/gcc/headers) off the host and disposable (`distrobox rm -f
# libfprint-build`). The build stages into DESTDIR and gets copied to
# the host manually, since the container doesn't share /usr with the
# host (only $HOME).
#
# The driver's SIGFM matcher is self-contained C since
# v1.94.10-goodix538d.2 (earlier builds vendored and statically linked
# an OpenCV subset through cmake), so the build needs nothing beyond
# the regular libfprint toolchain.
#
# The driver learns the sensor's fixed pattern from enrollment sessions
# and keeps it in fprintd's state directory
# (/var/lib/fprint/goodixtls53xd-fpn.bin); enroll at least 2 fingers so
# each one is calibrated from the others. Prints enrolled with builds
# before v1.94.10-goodix538d.2 are refused and must be re-enrolled.
#
# fprintd.service gets an LD_LIBRARY_PATH drop-in pointing at
# /usr/local/lib, since the official fprintd package already depends on
# the official libfprint (same soname, no goodixtls53xd driver).
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags libfprint
# (needs podman + distrobox already set up).
- name: libfprint (goodix538d)
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Ensure distrobox is available
      ansible.builtin.command: distrobox --version
      register: libfprint_distrobox_check
      changed_when: false
      failed_when: false

    - name: Fail with guidance if distrobox wasn't found
      ansible.builtin.fail:
        msg: >-
          distrobox not found. Run `./run-empowered.sh ansible-playbook
          site.yml --tags distrobox` (or `just distrobox`, which sets
          Podman up first) first.
      when: libfprint_distrobox_check.rc != 0

  tasks:
    - name: Create/update the distrobox build container
      # distrobox-assemble refuses to run whenever SUDO_USER/DOAS_USER is
      # set, to stop people from accidentally creating a root-owned
      # container via sudo/doas. This isn't that: it's an unprivileged
      # task, but run-empowered.sh's run0 --empower sets SUDO_USER on the
      # whole process tree for sudo-compatibility, so it trips the same
      # check. Blank both for this task only.
      ansible.builtin.command:
        cmd: "distrobox assemble create --file {{ libfprint_distrobox_ini_file }}"
      environment:
        SUDO_USER: ""
        DOAS_USER: ""
      register: libfprint_assemble_result
      changed_when: "'already exists' not in libfprint_assemble_result.stderr"

    - name: Install host runtime dependencies
      community.general.pacman:
        name: "{{ libfprint_runtime_deps }}"
        state: present
      become: true

    - name: Clone/update the libfprint fork
      ansible.builtin.git:
        repo: "{{ libfprint_repo }}"
        dest: "{{ libfprint_checkout_dir }}"
        version: "{{ libfprint_ref }}"
        force: false
      register: libfprint_git_result

    - name: Check whether the build is already configured
      ansible.builtin.stat:
        path: "{{ libfprint_checkout_dir }}/builddir/build.ninja"
      register: libfprint_builddir_stat

    - name: Configure the build (meson setup)
      ansible.builtin.shell: >
        distrobox enter {{ libfprint_container_name }} -- bash -c
        "cd {{ libfprint_checkout_dir }} &&
        meson setup builddir --prefix={{ libfprint_usrlocal_prefix }}
        -Ddoc=false -Dinstalled-tests=false"
      when: not libfprint_builddir_stat.stat.exists

    - name: Reconfigure the build if the fork changed
      ansible.builtin.shell: >
        distrobox enter {{ libfprint_container_name }} -- bash -c
        "cd {{ libfprint_checkout_dir }} &&
        meson setup builddir --prefix={{ libfprint_usrlocal_prefix }}
        -Ddoc=false -Dinstalled-tests=false --reconfigure"
      when: libfprint_builddir_stat.stat.exists and libfprint_git_result.changed

    - name: Build with ninja
      ansible.builtin.shell: >
        distrobox enter {{ libfprint_container_name }} -- bash -c
        "ninja -C {{ libfprint_checkout_dir }}/builddir"
      register: libfprint_ninja_result
      changed_when: "'ninja: no work to do.' not in libfprint_ninja_result.stdout"

    - name: Stage the install (DESTDIR)
      ansible.builtin.shell: >
        distrobox enter {{ libfprint_container_name }} -- bash -c
        "rm -rf {{ libfprint_stage_dir }} &&
        DESTDIR={{ libfprint_stage_dir }} ninja -C {{ libfprint_checkout_dir }}/builddir install"

    - name: Verify the built library's runtime dependencies resolve
      ansible.builtin.shell: >
        ldd {{ libfprint_stage_dir }}{{ libfprint_usrlocal_libdir }}/libfprint-2.so.2.0.0
        | grep -q "not found" && exit 1 || exit 0
      changed_when: false

    - name: Host install (privileged) — /usr/local, udev, systemd drop-in only
      become: true
      block:
        - name: Ensure the /usr/local destination directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ libfprint_usrlocal_libdir }}"
            - "{{ libfprint_usrlocal_prefix }}/include"
            - "{{ libfprint_usrlocal_prefix }}/share"

        - name: Copy library, headers, pkgconfig and gir/typelib to /usr/local
          # `cp -a` preserves the libfprint-2.so{,.2} symlinks that
          # ansible.builtin.copy would drop — without them, the linker
          # falls back to the official libfprint-2.so.2 (no
          # goodixtls53xd driver) and fprintd stops seeing the reader.
          ansible.builtin.command:
            cmd: >-
              cp -a
              {{ libfprint_stage_dir }}{{ libfprint_usrlocal_prefix }}/{{ item }}/.
              {{ libfprint_usrlocal_prefix }}/{{ item }}/
          loop:
            - lib
            - include
            - share
          changed_when: true

        - name: Install the udev rule
          ansible.builtin.copy:
            src: "{{ libfprint_stage_dir }}/usr/lib/udev/rules.d/70-libfprint-2.rules"
            dest: /etc/udev/rules.d/70-libfprint-2.rules
            remote_src: true
            mode: "0644"
          notify: reload udev rules

        - name: "Install udev rule — disable USB autosuspend for the reader ({{ libfprint_goodix_usb_vendor_id }}:{{ libfprint_goodix_usb_product_id }})"
          ansible.builtin.template:
            src: 71-goodix-no-autosuspend.rules.j2
            dest: /etc/udev/rules.d/71-goodix-no-autosuspend.rules
            mode: "0644"
          notify:
            - reload udev rules
            - trigger udev rule for goodix fingerprint reader
            - restart fprintd

        - name: Install the fprintd desync watchdog script
          # Two independent detectors: the goodix538d driver desyncing
          # its protocol with the sensor's MCU after a verify cancel
          # (leaves fprintd stuck failing every verify instantly), and
          # the Omarchy lock screen's fingerprint retry loop hammering
          # fprintd with no backoff for as long as the screen stays
          # locked (upstream omacom/omarchy#7176, #7172 — open,
          # unfixed as of Omarchy 4.0.1). Both get the same fix:
          # restart fprintd the moment the signature shows up, instead
          # of waiting for a manual restart.
          ansible.builtin.copy:
            src: fprintd-desync-watchdog.sh
            dest: /usr/local/bin/fprintd-desync-watchdog
            mode: "0755"
          notify:
            - reload systemd
            - enable and start fprintd-desync-watchdog

        - name: Install the fprintd desync watchdog service
          ansible.builtin.copy:
            src: fprintd-desync-watchdog.service
            dest: /etc/systemd/system/fprintd-desync-watchdog.service
            mode: "0644"
          notify:
            - reload systemd
            - enable and start fprintd-desync-watchdog

        - name: Create the fprintd.service drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/fprintd.service.d
            state: directory
            mode: "0755"

        - name: Point fprintd.service at /usr/local
          ansible.builtin.template:
            src: fprintd-override.conf.j2
            dest: /etc/systemd/system/fprintd.service.d/override.conf
            mode: "0644"
          notify:
            - reload systemd
            - restart fprintd

  handlers:
    # Handlers don't inherit `become: true` from the block that
    # notifies them — each needs its own.
    - name: reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
      become: true
      listen: reload udev rules

    - name: trigger udev rule for goodix fingerprint reader
      # The reader is internal and never replugged, so a rule change
      # needs an explicit trigger to apply without a reboot.
      ansible.builtin.command: >-
        udevadm trigger --subsystem-match=usb
        --attr-match=idVendor={{ libfprint_goodix_usb_vendor_id }}
      changed_when: false
      become: true
      listen: trigger udev rule for goodix fingerprint reader

    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      listen: reload systemd

    - name: Check if fprintd.service exists
      ansible.builtin.command: systemctl cat fprintd.service
      become: true
      register: fprintd_service_check
      changed_when: false
      failed_when: false
      listen: restart fprintd

    - name: restart fprintd
      ansible.builtin.systemd:
        name: fprintd.service
        state: restarted
      become: true
      listen: restart fprintd
      when: fprintd_service_check.rc == 0

    - name: enable and start fprintd-desync-watchdog
      ansible.builtin.systemd:
        name: fprintd-desync-watchdog.service
        daemon_reload: true
        enabled: true
        state: restarted
      become: true
      listen: enable and start fprintd-desync-watchdog
