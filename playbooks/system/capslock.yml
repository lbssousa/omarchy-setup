---
# Caps Lock remapped at the evdev level via keyd: tap = Esc, hold = Ctrl,
# Shift+Caps Lock = literal Caps Lock. Works the same in TTY and
# Wayland, unlike setxkbmap/GNOME "Input Sources".
#
# Omarchy 4.5 makes Shift+Caps Lock the Compose key
# (`omarchy:shift_caps_compose`, defined in /etc/xkb). keyd's
# Shift+CapsLock = CapsLock reaches XKB as exactly that chord, so it would
# type Compose instead of toggling Caps Lock — the XKB layer acts on the
# keycode regardless of which device sent it. user/capslock.yml therefore
# moves Compose to another key. It must be a non-hardware-modifier key: Ctrl/Alt/Win stay wired
# into XKB's modifier_map by keycode regardless of their assigned
# symbol, so they'd keep acting as both the modifier and Compose at
# once. The Menu key works cleanly and is already the natural Compose
# key on keyboards that have one.
#
# See playbooks/files/keyd-default.conf for the full remap config,
# including the caveat that Shift+CapsLock only works with Shift
# pressed before Caps Lock.
#
# Panic sequence if a bad config locks up the keyboard:
# backspace+esc+enter (kills keyd).
#
# keyd is machine-wide and applies to every user's keyboard, but Compose
# lives in each user's ~/.config/hypr/input.lua: user/capslock.yml moves it
# off Caps Lock, and every user needs it (`just user`), or keyd swallows
# their Compose key.
#
# Usage: just apply capslock
- name: Caps Lock via keyd (tap=Esc / hold=Ctrl / Shift+CapsLock=CapsLock)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [capslock]

  vars:
    feature_on: "{{ features['capslock'] | default(true) }}"

  tasks:
    - name: Caps Lock via keyd
      become: true
      when: feature_on | bool
      block:
        - name: Install keyd via pacman
          community.general.pacman:
            name: keyd
            state: present

        - name: Ensure /etc/keyd exists
          ansible.builtin.file:
            path: "{{ keyd_config_dest | dirname }}"
            state: directory
            mode: "0755"

        - name: Install the Caps Lock config
          ansible.builtin.copy:
            src: keyd-default.conf
            dest: "{{ keyd_config_dest }}"
            mode: "0644"
          notify: restart keyd

        - name: Enable and start keyd
          ansible.builtin.systemd:
            name: keyd
            enabled: true
            state: started

    - name: Caps Lock back to Omarchy's
      become: true
      when: not feature_on | bool
      block:
        - name: Stop and disable keyd
          ansible.builtin.systemd:
            name: keyd
            enabled: false
            state: stopped
          failed_when: false

        - name: Remove the Caps Lock config and keyd
          ansible.builtin.file:
            path: "{{ keyd_config_dest }}"
            state: absent

        - name: Uninstall keyd
          community.general.pacman:
            name: keyd
            state: absent

  handlers:
    - name: restart keyd
      ansible.builtin.systemd:
        name: keyd
        state: restarted
      become: true
      listen: restart keyd
