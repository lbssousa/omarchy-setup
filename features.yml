---
# The feature catalog: every automation this repository can apply, what it
# does to a stock Omarchy 4.5 and whether it is on by default. The single
# source of truth for `just configure` (scripts/configure.sh, the gum menu),
# scripts/run-phase.sh (which plays run, which revert), `just check` and
# docs/features.md (generated from this file: `just docs`).
#
# Choices live in ~/.config/omarchy-setup/features.yml (written by
# `just configure`); anything not chosen there takes the default below.
#
# features: individual toggles. Each id is the tag of the plays that
#   implement it, in both phases.
#     effect    adds / modifies / removes (relative to stock Omarchy) and what
#     phases    system, user or both
#     default   on (true) or off (false) until chosen otherwise
#     revert    true: turning it off undoes it on the next run; false: off
#               only stops managing it (what it did stays)
#     requires  other feature ids it needs on
#     hidden    always applied, not offered in the menu
#
# apps: user apps by category, each with its installation alternatives.
#   Several options of a category can be installed; categories with a
#   `role` also have a default app, which must be among those installed.
#   Options are always declarative: an option left out is uninstalled
#   (including Omarchy's own, marked stock). Options with `keep: true`
#   can't be removed (something else depends on them) but can still be
#   the default. Options with `omarchy: true` are apps Omarchy installs and
#   removes itself as its releases change (Nautilus on 4.5.0, Files after
#   it): never installed or removed here, installed wherever pacman has
#   them, and the default app only there (a default that isn't falls back
#   to the first installed option of the category).
#     source    pacman | aur | flatpak (Flathub, system-wide) | bundle
#               (a release's .flatpak, see the artcraft option)
#     min_version      pacman, one package: the oldest version accepted, upgraded
#                      to when older (tasks/app-package-min-version.yml)
#     min_version_url  the signed package to install while the configured repos
#                      (Omarchy's mirror can lag behind Arch) don't have it yet
#     desktop   desktop-entry id, for categories with a default app
#     chooser   file managers: the xdg-desktop-portal FileChooser backend it
#               ships (its .portal name). The file-chooser feature routes
#               the Open/Save dialogs to the default file manager's; one
#               without a chooser leaves them to Omarchy's portal config
#     browser   omarchy-default-browser's name for it (browsers)
#     engine    how Omarchy's web apps are rebuilt when it is the default:
#               firefox (Taskbar Tabs), chrome, brave or chromium (PWAs), none.
#               `just configure` asks for the web apps engine separately and
#               saves it as webapps.engine in the choices file; unchosen, the
#               default browser's engine applies.
#
# cursor: the mouse cursor themes the bibata-cursor feature offers (the
#   Bibata release's own, ful1e5/Bibata_Cursor). `just configure` asks which
#   one when the feature is on and saves it as cursor.theme in the choices
#   file; unchosen, `default` applies.
#     package   the AUR package that installs them all (system phase)
#     themes    id (the theme's folder in /usr/share/icons) and menu label

groups:
  accounts: Accounts and login
  base: Base
  shell: Shell and prompt
  desktop: Desktop
  themes: Themes
  plugins: Omarchy shell plugins and prompts
  dev: Development
  locale: Portuguese (Brazil)
  hardware: Hardware
  security: Boot and security (opt-in)
  extras: Extras (opt-in)

features:
  - id: users
    group: accounts
    title: User accounts
    effect: adds the accounts in group_vars/all/users.yml (fish as login shell, wheel, omarchy-users or omarchy-child, subuid ranges)
    phases: [system]
    default: false
    revert: false

  - id: omarchy-multiuser
    group: accounts
    title: omarchy-multiuser
    effect: adds forks of Omarchy's single-owner tools (a LUKS key per person that picks them at boot, a password-only greeter, per-user FIDO2/fingerprint, migrations, child accounts and blocked apps); modifies SDDM (autologin only for whoever unlocked the disk, greeter scale 100%) and the initramfs
    phases: [system, user]
    default: false
    revert: false

  - id: pam-auth-order
    group: accounts
    title: PAM order
    effect: modifies the sudo and polkit PAM stacks (fingerprint, then FIDO2/U2F, then password)
    phases: [system]
    default: true
    revert: false

  - id: polkit
    group: accounts
    title: polkit authentication cache
    effect: modifies polkitd's ExpirationSeconds
    phases: [system]
    default: true
    revert: false

  - id: shared-checkout
    group: accounts
    title: Shared checkout
    effect: adds /opt/omarchy-setup and omarchy-setup-user, so every user can run their own phase
    phases: [system]
    default: false
    revert: false

  - id: flatpak
    group: base
    title: Flatpak + Flathub + Bazaar
    effect: adds Flatpak, the Flathub remote, Bazaar and the installation's languages; required by every Flatpak app option
    phases: [system, user]
    default: true
    revert: false

  - id: git-identity
    group: base
    title: git identity
    effect: modifies ~/.gitconfig (user.name, user.email from the untracked local.yml)
    phases: [user]
    default: true
    revert: false

  - id: git-dir-identity
    group: base
    title: git identity by folder
    effect: asks in the terminal for an e-mail and folders; adds ~/.config/git/identities/<e-mail> (user.email, and user.signingkey from the GPG key with that e-mail) and an includeIf per folder to ~/.gitconfig, so repositories there commit and sign with it (`just git-dir-identity` runs it alone)
    phases: [user]
    default: false
    revert: false

  - id: starship
    group: shell
    title: Starship extras
    effect: modifies ~/.config/starship.toml (Nix dev shell badge, commits ahead of/behind)
    phases: [user]
    default: true
    revert: false

  - id: starship-distrobox
    group: shell
    title: Starship inside distrobox
    effect: modifies ~/.config/starship.toml and ~/.bashrc (container name in the prompt)
    phases: [user]
    default: true
    revert: false
    requires: [distrobox]

  - id: file-chooser
    group: desktop
    title: File dialogs from the default file manager
    effect: modifies the FileChooser portal (the default file manager's picker, Flea's or Files'; Omarchy's for one without) and the Qt platform theme (qt6ct); adds qt5ct/qt6ct
    phases: [system, user]
    default: true
    revert: true

  - id: hypr-scrolling-resize
    group: desktop
    title: Column resize keys (scrolling layout)
    effect: adds SUPER+[ and SUPER+] to ~/.config/hypr/bindings.lua
    phases: [user]
    default: true
    revert: true

  - id: hypr-vertical-workspaces
    group: desktop
    title: Vertical workspace switch animation
    effect: modifies ~/.config/hypr/looknfeel.lua (switching workspaces scrolls vertically, slidevert, instead of snapping)
    phases: [user]
    default: true
    revert: true

  - id: text-size
    group: desktop
    title: Screen scale + text size
    effect: modifies the monitor scale (100%, the login screen's too), GDK_SCALE, the shell/terminal text size and the GNOME font sizes
    phases: [system, user]
    default: true
    revert: false

  - id: nightlight-solar
    group: desktop
    title: Night light at sunset/sunrise
    effect: adds a timer that follows the real sunset/sunrise with hyprsunset
    phases: [user]
    default: true
    revert: true

  - id: screensaver-bar-guard
    group: desktop
    title: Bar stays hidden under the screensaver
    effect: adds a watcher to ~/.config/hypr/autostart.lua that re-applies the screensaver's fullscreen when the bar or dock remaps, so they don't show over it (Omarchy 4.5; 4.6's native screensaver doesn't need it, and the watcher is removed there)
    phases: [user]
    default: true
    revert: true

  - id: omafox
    group: desktop
    title: Firefox follows the Omarchy theme
    effect: adds the Omafox add-on to Firefox's policies, its native messaging host and a theme-set hook; the add-on stays in the profile when reverted
    phases: [system, user]
    default: true
    revert: true

  - id: capslock
    group: desktop
    title: Caps Lock as Esc
    effect: modifies the keyboard options (Caps Lock = Esc, Shift+Caps Lock = Caps Lock, Compose on the Menu key instead of Shift+Caps Lock)
    phases: [user]
    default: true
    revert: true

  - id: superwhisper-hold-key
    group: desktop
    title: Superwhisper hold-to-talk on the right Ctrl
    effect: modifies Superwhisper's hold-to-talk key (RightAlt, which is AltGr on ABNT2 keyboards) to the right Ctrl
    phases: [user]
    default: true
    revert: true

  - id: omadwaita-themes
    group: themes
    title: Omadwaita themes
    effect: adds three Adwaita-based Omarchy themes
    phases: [user]
    default: true
    revert: false

  - id: omaraptor-themes
    group: themes
    title: Omaraptor themes
    effect: adds three Omarchy themes on the GNOME palette with Bluefin wallpapers; modifies the Flatpak global override (GTK config read-only)
    phases: [user]
    default: true
    revert: false

  - id: omaraptor-theme-auto
    group: themes
    title: Omaraptor day/night switching
    effect: adds a timer switching the Omaraptor theme at sunrise/sunset
    phases: [user]
    default: true
    revert: true
    requires: [omaraptor-themes]

  - id: osaka-jade-theme
    group: themes
    title: Osaka Jade theme
    effect: adds the Osaka Jade theme (git, omacom/omarchy-osaka-jade-theme), over Omarchy's bundled copy
    phases: [user]
    default: false
    revert: false

  - id: piedmont-gold-theme
    group: themes
    title: Piedmont Gold themes
    effect: adds the Piedmont Gold and Piedmont Gold Light themes (git, wesleygrimes/omarchy-piedmont-gold-theme and -light-theme)
    phases: [user]
    default: false
    revert: false

  - id: bibata-cursor
    group: themes
    title: Bibata mouse cursor
    effect: adds the Bibata cursor themes (AUR bibata-cursor-theme-bin); modifies your mouse cursor to the one chosen in `just configure` (XCURSOR_THEME in ~/.config/environment.d, the GNOME cursor-theme setting, Hyprland's cursor). Turned off, Omarchy's cursor comes back; the package stays, for other accounts
    phases: [system, user]
    default: false
    revert: true

  - id: plugins
    group: plugins
    title: Omarchy shell plugins
    effect: adds the shell plugins in omarchy_plugins (and their dependencies), and SHIFT+ALT+SPACE for the omacast launcher to ~/.config/hypr/bindings.lua
    phases: [system, user]
    default: true
    revert: false

  - id: pinentry
    group: plugins
    title: omapin (GnuPG prompt)
    effect: adds omapin and makes it gpg-agent's pinentry
    phases: [system, user]
    default: true
    revert: false

  - id: ssh-askpass
    group: plugins
    title: omaskpass (SSH prompt)
    effect: adds omaskpass and makes it the SSH key/FIDO2 prompt (SSH_ASKPASS); removes ssh-askpass-omarchy
    phases: [system, user]
    default: true
    revert: false

  - id: polkit-agent
    group: plugins
    title: polkit-omarchy
    effect: modifies the polkit agent (replaces Omarchy's omarchy.polkit plugin)
    phases: [system, user]
    default: true
    revert: false

  - id: clipboard-portal
    group: plugins
    title: xdg-desktop-portal-omarchy (clipboard portal)
    effect: adds the RemoteDesktop/Clipboard portals (clipboard only, after a shell dialog), so the Bitwarden Flatpak copies natively on Wayland; off, it runs under XWayland
    phases: [system, user]
    default: true
    revert: false

  - id: fingerprint
    group: plugins
    title: fingerprint-omarchy (fingerprint overlay)
    effect: adds an overlay from the Omarchy plugin marketplace to enroll, test and delete your fingerprints (fprintd), opened from Setup › Security; removes the fingerprint-omarchy package
    phases: [system, user]
    default: true
    revert: false

  - id: security-key
    group: plugins
    title: security-key-omarchy (security key overlay)
    effect: adds the security-key-omarchy package and an overlay from the Omarchy plugin marketplace to register your FIDO2 keys for sudo/polkit in /etc/fido2/fido2 and import their OpenPGP and SSH keys, opened from Setup › Security; adds pam_u2f to the sudo and polkit PAM stacks, asking for the PIN and a touch of the key (the overlay's switch can drop the PIN; later runs keep that choice)
    phases: [system, user]
    default: true
    revert: false

  - id: openssh-askpass
    group: plugins
    title: openssh with askpass touch notifications
    effect: modifies the openssh package (rebuilt with a patch)
    phases: [system]
    default: true
    revert: false

  - id: gregorio-lsp
    group: dev
    title: gregorio-lsp
    effect: adds clang, rustup and the Gregorio language server, grelint and grefmt
    phases: [system, user]
    default: true
    revert: false

  - id: lazyvim
    group: dev
    title: LazyVim extras
    effect: modifies LazyVim (LaTeX extra, gregorio.nvim)
    phases: [user]
    default: true
    revert: false

  - id: podman
    group: dev
    title: Podman
    effect: adds rootless Podman (alongside Omarchy's Docker)
    phases: [system, user]
    default: true
    revert: false

  - id: distrobox
    group: dev
    title: Distrobox
    effect: adds Distrobox
    phases: [system, user]
    default: true
    revert: false
    requires: [podman]

  - id: nix
    group: dev
    title: Nix
    effect: adds Nix (multi-user, flakes) on its own btrfs subvolume, and nix-direnv
    phases: [system, user]
    default: true
    revert: false

  - id: direnv
    group: dev
    title: direnv
    effect: adds direnv, hooked into fish and bash
    phases: [system, user]
    default: true
    revert: false

  - id: homebrew
    group: extras
    title: Homebrew
    effect: adds Homebrew for Linux (/home/linuxbrew) and bbrew
    phases: [system, user]
    default: false
    revert: false

  - id: ptbr-locale
    group: locale
    title: pt-BR language
    effect: modifies Omarchy's language (omarchy-language pt-BR) and /etc/locale.conf
    phases: [system, user]
    default: true
    revert: false

  - id: ptbr-xdg-user-dirs
    group: locale
    title: Folders in Portuguese
    effect: modifies the personal folders (Documents → Documentos, Pictures → Imagens, ...)
    phases: [user]
    default: true
    revert: false

  - id: ptbr-browsers
    group: locale
    title: Browsers in Portuguese
    effect: modifies Firefox's RequestedLocale and the Chromium family's page language
    phases: [system, user]
    default: true
    revert: false

  - id: ptbr-man-pages
    group: locale
    title: man pages in Portuguese
    effect: adds man-pages-pt_br
    phases: [system]
    default: true
    revert: false

  - id: ptbr-ocr
    group: locale
    title: OCR in Portuguese
    effect: adds tesseract-data-por; modifies OMARCHY_OCR_LANGS
    phases: [system, user]
    default: true
    revert: false

  - id: libfprint
    group: hardware
    title: Goodix 538d fingerprint reader
    effect: modifies libfprint (goodix538d fork); adds a desync watchdog and a pacman hook that pins the fork
    phases: [system]
    default: true
    revert: false

  - id: printer
    group: hardware
    title: EPSON L4160 printer
    effect: adds the driverless L4160 queue as the default printer
    phases: [system, user]
    default: true
    revert: false

  - id: secureboot
    group: security
    title: Secure Boot (sbctl)
    effect: adds sbctl keys; modifies Limine (checksums, hash_mismatch_panic) or, after Omarchy's switch to systemd-boot, signs its loader and has omarchy-boot-sync sign the boot images (signing=required)
    phases: [system]
    default: false
    revert: false


  - id: gpg-yubikey
    group: security
    title: Yubikey GPG key
    effect: adds pcscd (scdaemon through it), the card's public key (ultimate trust) and git commit signing
    phases: [system, user]
    default: false
    revert: false

  - id: security-key-wizard
    group: security
    title: Security key wizard (FIDO2, OpenPGP, SSH)
    effect: asks in the terminal what to do with the key plugged in, with the security-key-omarchy overlay's options - registers it and a backup key for sudo/polkit and sets whether they ask for its PIN; imports and trusts its OpenPGP key, signs git commits with it; imports or makes resident SSH keys and sets up their git hosts (`just security-key` runs it alone)
    phases: [user]
    default: false
    revert: false
    requires: [security-key]

  - id: bgrt-theme
    group: extras
    title: BGRT boot theme
    effect: adds Omarchy, Plymouth and SDDM themes from the firmware logo
    phases: [system, user]
    default: false
    revert: false

  - id: rclone-gdrive
    group: extras
    title: Google Drive (rclone)
    effect: adds rclone mounts of Google Drive (systemd --user)
    phases: [system, user]
    default: false
    revert: false

apps:
  - id: browser
    title: Web browsers
    role: default browser (omarchy-default-browser); the menu also asks whether to keep Omarchy's native web apps or rebuild them with an installed browser
    default: google-chrome
    options:
      - { id: chromium, label: Chromium, source: pacman, package: chromium, stock: true, installed: true, engine: chromium, browser: chromium }
      - { id: google-chrome, label: Google Chrome, source: aur, package: google-chrome, installed: true, engine: chrome, browser: chrome, desktop: google-chrome.desktop }
      - { id: firefox, label: Firefox, source: pacman, package: firefox, engine: firefox, browser: firefox }
      - { id: firefox-flatpak, label: Firefox, source: flatpak, flatpak: org.mozilla.firefox, engine: firefox, browser: firefox }
      - { id: brave-origin, label: Brave Origin, source: aur, package: brave-origin-bin, engine: brave, browser: brave-origin }
      - { id: brave-flatpak, label: Brave, source: flatpak, flatpak: com.brave.Browser, engine: none, desktop: com.brave.Browser.desktop, note: "Omarchy's web apps stay as they are: PWA install through machine policy is unverified inside its sandbox" }

  - id: password
    title: Password managers
    role: default password manager (SUPER+SHIFT+SLASH, autostart, SSH agent)
    default: bitwarden-flatpak
    options:
      - { id: bitwarden-flatpak, label: Bitwarden, source: flatpak, flatpak: com.bitwarden.desktop, installed: true, note: "copies passwords through the clipboard portal (clipboard-portal feature); without that feature it runs under XWayland" }
      - { id: bitwarden, label: Bitwarden, source: pacman, package: bitwarden }
      - { id: keepassxc-flatpak, label: KeePassXC, source: flatpak, flatpak: org.keepassxc.KeePassXC }
      - { id: keepassxc, label: KeePassXC, source: pacman, package: keepassxc, min_version: "2.8.0", min_version_url: "https://archive.archlinux.org/packages/k/keepassxc/keepassxc-2.8.0-3-x86_64.pkg.tar.zst" }

  - id: office
    title: Office suites
    options:
      - { id: libreoffice, label: LibreOffice, source: pacman, package: libreoffice-fresh, stock: true }
      - { id: libreoffice-flatpak, label: LibreOffice, source: flatpak, flatpak: org.libreoffice.LibreOffice }
      - { id: onlyoffice-flatpak, label: ONLYOFFICE, source: flatpak, flatpak: org.onlyoffice.desktopeditors, installed: true }
      - { id: onlyoffice, label: ONLYOFFICE, source: aur, package: onlyoffice-bin }
      - { id: artcraft, label: "ArtCraft: WordCraft, GridCraft, DeckCraft", source: bundle, bundle: artcraft-launcher, note: "early alpha; the apps are picked in the ArtCraft Launcher, which installs them as host Flatpaks (its sandbox may talk to org.freedesktop.Flatpak)" }

  - id: graphics
    title: Graphics
    options:
      - { id: pinta, label: Pinta, source: pacman, package: pinta, stock: true }
      - { id: pinta-flatpak, label: Pinta, source: flatpak, flatpak: com.github.PintaProject.Pinta, installed: true }
      - { id: inkscape, label: Inkscape (+ svg2tikz), source: pacman, package: inkscape, installed: true }
      - { id: inkscape-flatpak, label: Inkscape, source: flatpak, flatpak: org.inkscape.Inkscape }
      - { id: gimp, label: GIMP, source: pacman, package: gimp }
      - { id: gimp-flatpak, label: GIMP, source: flatpak, flatpak: org.gimp.GIMP }
      - { id: krita, label: Krita, source: pacman, package: krita }
      - { id: krita-flatpak, label: Krita, source: flatpak, flatpak: org.kde.krita }
      - { id: artcraft, label: "ArtCraft: PhotoCraft, VectorCraft, LightCraft, DesignCraft, FigCraft", source: bundle, bundle: artcraft-launcher, note: "early alpha; the apps are picked in the ArtCraft Launcher, which installs them as host Flatpaks (its sandbox may talk to org.freedesktop.Flatpak)" }

  - id: pdf
    title: Document viewers (PDF)
    role: default PDF viewer
    default: zathura-flatpak
    options:
      - { id: evince, label: Evince, source: pacman, package: evince, stock: true, desktop: org.gnome.Evince.desktop, note: "Omarchy 4.5.0's; later releases replace it with Papers" }
      - { id: papers, label: Papers, source: pacman, package: papers, installed: true, keep: true, desktop: org.gnome.Papers.desktop, note: "Omarchy's document viewer after 4.5.0; on 4.5.0, Nautilus's previewer (sushi) depends on it" }
      - { id: zathura-flatpak, label: Zathura, source: flatpak, flatpak: org.pwmt.zathura, installed: true, desktop: org.pwmt.zathura.desktop }
      - { id: zathura, label: Zathura, source: pacman, package: [zathura, zathura-pdf-mupdf], desktop: org.pwmt.zathura.desktop }

  - id: torrent
    title: Torrent clients
    role: default handler for magnet links (x-scheme-handler/magnet)
    default: qbittorrent-flatpak
    options:
      - { id: qbittorrent-flatpak, label: qBittorrent, source: flatpak, flatpak: org.qbittorrent.qBittorrent, installed: true, desktop: org.qbittorrent.qBittorrent.desktop }
      - { id: qbittorrent, label: qBittorrent, source: pacman, package: qbittorrent, desktop: org.qbittorrent.qBittorrent.desktop }

  - id: video
    title: Video and streaming
    options:
      - { id: kdenlive-flatpak, label: Kdenlive, source: flatpak, flatpak: org.kde.kdenlive, installed: true }
      - { id: kdenlive, label: Kdenlive, source: pacman, package: kdenlive }
      - { id: obs-flatpak, label: OBS Studio, source: flatpak, flatpak: com.obsproject.Studio, installed: true }
      - { id: obs, label: OBS Studio, source: pacman, package: obs-studio }
      - { id: artcraft, label: "ArtCraft: FilmCraft, EffectCraft", source: bundle, bundle: artcraft-launcher, note: "early alpha; the apps are picked in the ArtCraft Launcher, which installs them as host Flatpaks (its sandbox may talk to org.freedesktop.Flatpak)" }

  - id: notes
    title: Notes and handwriting
    options:
      - { id: xournalpp-flatpak, label: Xournal++, source: flatpak, flatpak: com.github.xournalpp.xournalpp, installed: true }
      - { id: xournalpp, label: Xournal++, source: pacman, package: xournalpp }

  - id: editor
    title: Editors
    options:
      - { id: emacs, label: Emacs (AUCTeX, lsp-mode, classic theme), source: pacman, package: [omarchy-emacs, emacs-wayland], installed: true }
      - { id: zed, label: Zed (Omazed theme), source: pacman, package: [zed, omazed], installed: true }

  - id: terminal
    title: Terminal workspaces
    options:
      - { id: herdr-app, label: Herdr desktop app, source: pacman, package: herdr-app, installed: true, note: "pulls in herdr-core (the hc server); Omarchy's Herdr TUI (SUPER+CTRL+RETURN) stays as it is" }

  - id: file_manager
    title: File managers
    role: default file manager (inode/directory)
    default: flea
    options:
      - { id: folio, label: Files (Folio), source: pacman, package: folio, omarchy: true, desktop: folio.desktop, chooser: folio, note: "Omarchy's file manager after 4.5.0, which replaces Nautilus; Super+Shift+F opens it, and it is Omarchy's Open/Save dialog" }
      - { id: nautilus, label: Nautilus, source: pacman, package: nautilus, omarchy: true, desktop: org.gnome.Nautilus.desktop, note: "Omarchy 4.5.0's file manager; later releases remove it. No picker of its own: the dialogs stay Omarchy's (GTK on 4.5.0)" }
      - { id: flea, label: Flea, source: pacman, package: flea, installed: true, desktop: com.thisisgm.flea.desktop, chooser: flea }

cursor:
  package: bibata-cursor-theme-bin
  default: Bibata-Modern-Classic
