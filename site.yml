---
# Every automation: the system phase, then the user phase. What `just setup`
# runs (system.yml and user.yml say what each one does).
#
# Usage: ./run-empowered.sh ansible-playbook site.yml   (just setup)
- name: System phase
  ansible.builtin.import_playbook: system.yml

- name: User phase
  ansible.builtin.import_playbook: user.yml
