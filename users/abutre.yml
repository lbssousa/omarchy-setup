---
# abutre's own settings, loaded by scripts/run-phase.sh (-e @users/abutre.yml)
# in both phases. Extra vars: these win over group_vars/all/*.

# Omarchy's web apps, rebuilt with the default browser (Firefox Taskbar Tabs
# or Brave PWAs), each in its own container (see webapps in
# group_vars/all/main.yml for the fields).
webapps:
  - label: YouTube
    desktop_name: YouTube
    url: https://www.youtube.com
    container: Google
    keybind: "SUPER + SHIFT + Y"
  - label: WhatsApp
    desktop_name: WhatsApp Web
    url: https://web.whatsapp.com
    container: Facebook
    keybind: "SUPER + SHIFT + ALT + G"
  - label: Microsoft Teams
    desktop_name: Microsoft Teams (PWA)
    url: https://teams.microsoft.com
    container: Microsoft
    keybind: "SUPER + SHIFT + ALT + T"
  - label: Google Maps
    desktop_name: Google Maps
    url: https://www.google.com/maps
    container: Google
    keybind: "SUPER + SHIFT + S"
  - label: Google Photos
    desktop_name: Google Photos
    url: https://photos.google.com
    container: Google
    keybind: "SUPER + SHIFT + P"
  - label: Google Messages
    desktop_name: Google Messages
    url: https://messages.google.com/web
    container: Google
    keybind: "SUPER + SHIFT + CTRL + G"
  - label: X
    desktop_name: X
    url: https://x.com
    keybind: "SUPER + SHIFT + X"
