---
# The login screen for several users: omarchy-multiuser's greeter, a password
# box that finds the account by its password. Omarchy logs its single owner in
# automatically — for good on encrypted installs — through
# /etc/sddm.conf.d/autologin.conf, which omarchy-provision-owner and
# omarchy-upgrade-to-quattro write. omarchy-mu-sddm-guard (run here, and by a
# path unit and a pacman hook whenever Omarchy writes the file back) removes it,
# and checks that the effective theme is the multi-user one and that nothing
# else still names an autologin user. The package logs in, once, only whoever's
# password unlocked the disk at this boot, or the only account on an encrypted
# disk.
#
# sddm is never restarted from here (it would end every open session): the
# greeter takes over at the next login screen.
#
# Usage: just apply omarchy-multiuser (this is part of that feature)
- name: SDDM — multi-user greeter, autologin only for whoever unlocked the disk
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [omarchy-multiuser]

  tasks:
    - name: Expect the multi-user greeter theme (system/omarchy-multiuser.yml)
      ansible.builtin.stat:
        path: "/usr/share/sddm/themes/{{ omarchy_multiuser_theme }}/Main.qml"
      register: sddm_theme
      failed_when: not sddm_theme.stat.exists

    - name: Remove autologin and check what SDDM will show
      ansible.builtin.command: omarchy-mu-sddm-guard
      register: sddm_guard
      changed_when: "'Removed' in sddm_guard.stdout"
      become: true

    - name: Note when the greeter takes over
      ansible.builtin.debug:
        msg: >-
          SDDM now shows the multi-user greeter, which finds the account by
          its password; it takes over at the next login screen (log out or
          reboot). Each person needs a password of their own: run
          `just users`.
      when: sddm_guard.changed

    # The greeter's compositor starts from Omarchy's /usr/share/sddm/hyprland.lua,
    # which sets no monitor rule, so Hyprland picks the scale from the panel's
    # density: 1.5 above 140 PPI, which covers a 14" 1080p laptop. That file
    # belongs to omarchy-settings, so it is wrapped rather than edited: updates
    # to its keyboard setup still reach the greeter.
    - name: Create /etc/sddm
      ansible.builtin.file:
        path: /etc/sddm
        state: directory
        mode: "0755"
      become: true

    - name: "Set the greeter's monitor scale to {{ omarchy_greeter_monitor_scale }}"
      ansible.builtin.copy:
        dest: /etc/sddm/hyprland.lua
        mode: "0644"
        content: |
          -- Managed by omarchy-setup (playbooks/system/sddm.yml).
          dofile("/usr/share/sddm/hyprland.lua")
          hl.monitor({ output = "", mode = "preferred", position = "auto", scale = {{ omarchy_greeter_monitor_scale }} })
      become: true

    # Sorts after Omarchy's 10-wayland.conf, which sets the same key; SDDM reads
    # /etc/sddm.conf.d in name order and the last value wins.
    - name: Start the greeter's compositor from that file
      ansible.builtin.copy:
        dest: /etc/sddm.conf.d/zz-omarchy-setup-greeter.conf
        mode: "0644"
        content: |
          # Managed by omarchy-setup (playbooks/system/sddm.yml).
          [Wayland]
          CompositorCommand=start-hyprland -- --config /etc/sddm/hyprland.lua
      become: true
