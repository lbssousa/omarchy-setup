---
# Order of the authentication methods in the sudo and polkit (pkexec) PAM
# stacks: fingerprint (pam_fprintd), then FIDO2/U2F key (pam_u2f), then the
# password (pam_unix, via system-auth for sudo).
#
# Omarchy's omarchy-setup-security-fingerprint and
# omarchy-setup-security-fido2 each insert their line at the top of
# /etc/pam.d/sudo and /etc/pam.d/polkit-1 (`sed -i '1i ...'`), so the stack
# ends up with whichever script ran last first. Both modules are
# `sufficient`, and PAM tries them one after the other: with the key first,
# pam_u2f blocks until it is touched and the reader is never offered, with
# the fingerprint first, the key only prompts after pam_fprintd gives up.
# This play pins the order, whichever script ran last.
#
# It forces the order rather than only repairing it: pam_fprintd (with
# Omarchy's clamshell gate in front of it) is added at the top of each stack
# when missing, and the pam_u2f line, if there is one, is moved to just after
# it (keeping its options). Without an enrolled print pam_fprintd is
# skipped, so adding it before enrolling is harmless. A stack already in
# order is left alone, so it is safe to run again after re-running either
# Omarchy script. The password stays last: sudo's falls through to
# `auth include system-auth`, and so does polkit-1's (Omarchy 4.5; it only
# exists in /usr/lib/pam.d, so it is copied to /etc/pam.d first).
#
# It also caps how long pam_fprintd may hold the stack before the key is
# asked for (max-tries / timeout below): the default is 3 tries within 30 s,
# during which touching the key does nothing. A failed or timed-out
# fingerprint falls through to the key, then to the password.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags pam-auth-order
- name: PAM auth order (fingerprint, then FIDO2/U2F, then password)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pam-auth-order]

  vars:
    pam_auth_order_files:
      - /etc/pam.d/sudo
      - /etc/pam.d/polkit-1
    # pam_fprintd's own defaults are max-tries=3, timeout=30.
    pam_auth_order_fprintd_max_tries: 3
    pam_auth_order_fprintd_timeout: 10

  tasks:
    - name: Put pam_u2f after pam_fprintd in each stack
      ansible.builtin.include_tasks: tasks/pam-auth-order-file.yml
      loop: "{{ pam_auth_order_files }}"
      loop_control:
        loop_var: pam_file

    # The Omarchy lock screen offers the fingerprint only when
    # /etc/pam.d/omarchy-lock-fingerprint exists. Omarchy's
    # omarchy-apply-lock decides that from one user's prints, so a second
    # user without any turned it off for everyone; omarchy-multiuser's fork
    # keeps it while ANY user has prints (and its path unit and pacman hook
    # keep it that way). Ask it, when it is installed.
    - name: Check for omarchy-multiuser's lock screen helper
      ansible.builtin.stat:
        path: /usr/bin/omarchy-mu-apply-lock
      register: pam_auth_order_mu_apply_lock

    - name: Keep fingerprint unlock while any user has prints
      ansible.builtin.command: omarchy-mu-apply-lock --quiet
      when: pam_auth_order_mu_apply_lock.stat.exists
      changed_when: false
      become: true
