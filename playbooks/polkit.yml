---
# Polkit side of privilege escalation. This repo escalates with run0
# (ansible.cfg's become_method), which authenticates through polkit.
#
# Raises polkitd's authentication cache window (ExpirationSeconds,
# default 300s), so polkit-based desktop tools (pkexec and friends) don't
# re-prompt every few minutes. It doesn't help run0: checked on this
# machine, polkit doesn't carry a run0 authorization over to the next run0
# process, which is why playbooks run under run-empowered.sh.
- name: polkitd ExpirationSeconds
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [polkit]

  tasks:
    - name: "Set ExpirationSeconds={{ polkit_expiration_seconds }} in /etc/polkit-1/polkitd.conf"
      community.general.ini_file:
        path: /etc/polkit-1/polkitd.conf
        section: Polkitd
        option: ExpirationSeconds
        value: "{{ polkit_expiration_seconds }}"
        create: true
        mode: "0644"
      become: true
      notify: reload polkit

  handlers:
    - name: reload polkit
      ansible.builtin.systemd:
        name: polkit
        state: reloaded
      become: true
      listen: reload polkit
