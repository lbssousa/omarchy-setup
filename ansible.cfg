[defaults]
inventory = inventory.ini
host_key_checking = False
stdout_callback = default
display_skipped_hosts = False

[privilege_escalation]
# sudo, no padrão de fábrica do Ansible ("-H -S -n"), COM
# `--ask-become-pass` (ver Justfile) de novo. Duas voltas atrás deste
# arquivo até chegar aqui, registradas porque o motivo de cada volta
# importa:
#
#   1. `community.general.run0` (become_method) — tentativa de resolver
#      o fingerprint reader (goodix538d, habilitado como login do sudo
#      fora deste repositório: `auth sufficient pam_fprintd.so` em
#      /etc/pam.d/sudo, antes do pam_unix) fugindo do sudo de vez.
#      Revertido: cada tarefa do Ansible sobe um processo `run0` novo,
#      e a autorização temporária do polkit nunca é reaproveitada entre
#      processos diferentes (confirmado no journal: uma autenticação
#      completa por tarefa, não por sessão) — nenhum ajuste de
#      `ExpirationSeconds` (playbooks/polkit.yml) resolve isso, porque
#      não é questão de janela de tempo.
#   2. `become_flags = -H` (tirando o "-S -n", sem `--ask-become-pass`)
#      — teoria de que "-S" (que faz o Ansible alimentar a senha via um
#      pipe) seria incompatível com um módulo PAM interativo como o
#      pam_fprintd. Também revertido: sem "-S" nem senha pré-fornecida,
#      o `sudo` não tem NENHUMA senha pra usar como retaguarda se o
#      fingerprint falhar — só o próprio scan. Resultado real (visto no
#      journal): `pam_unix(sudo:auth): conversation failed` toda vez
#      que o `pam_fprintd` não conseguia autenticar sozinho (inclusive
#      por um bug à parte, capturado no journal como
#      `fprintd: ... Device was already claimed` — um claim anterior
#      do sensor ficando pendurado, provavelmente porque o
#      `become_success_timeout` do Ansible, 10s por padrão, desiste da
#      tarefa antes do pam_fprintd terminar de negociar) — sem senha
#      nenhuma disponível, a tarefa simplesmente falhava, sem prompt
#      visível de tela nenhum.
#
# Com `--ask-become-pass`, "-n" é removido automaticamente do
# become_flags pelo próprio plugin sudo do Ansible sempre que há uma
# become_pass configurada (ver
# ansible/plugins/become/sudo.py:build_become_command) — não precisa
# mexer em become_flags aqui. E "-S" volta a ser necessário: é o que
# permite o Ansible alimentar a senha, via um pty que ele aloca só
# quando há become_pass, no momento em que o `sudo` pedir (se o
# pam_fprintd, tentado primeiro, não resolver sozinho). O `pam_fprintd`
# continua sendo tentado silenciosamente antes da senha — tocar o
# sensor por acaso ainda funciona, só que sem nenhum aviso na tela
# (limitação de arquitetura: o Ansible bufferiza toda a conversa do
# become internamente, só mostra o conteúdo se a tarefa falhar — isso
# valeria pra qualquer become_method, não é exclusivo do sudo). O que
# muda de verdade é que agora sempre existe uma senha real como
# retaguarda, então uma falha do fingerprint não é mais fatal.
#
# O timestamp do próprio sudo (padrão ~15 min, renovado a cada uso
# bem-sucedido) segue valendo por usuário/terminal, não por processo —
# é a "memória" que o run0 não tinha.
