# Firefox Taskbar Tabs (page menu → "Save as Taskbar Tab..." pins a site
# to the taskbar as its own app-like window, with its own launcher and
# Wayland window class — see playbooks/firefox.yml, which enables the
# feature; off by default on Linux), driven by two independent lists in
# group_vars/all/main.yml:
#
# - taskbar_tab_webapp_swaps: swaps an Omarchy preinstalled web app
#   launcher for an ALREADY-EXISTING Taskbar Tab, removing the Omarchy
#   launcher (`omarchy webapp remove`) and rebinding the Hyprland keybind
#   it used to `gtk-launch` the Taskbar Tab instead — see
#   tasks/taskbar-tab-webapp-swap.yml. The Taskbar Tab has to already
#   exist — create it first in Firefox (page menu → "Save as Taskbar
#   Tab...") — a missing one fails with guidance rather than silently
#   skipping.
#
# - taskbar_tab_webapp_creates: creates a brand-new Taskbar Tab from
#   scratch (no Omarchy launcher to swap out, no Firefox UI step) and
#   binds a new Hyprland keybind to it — see
#   tasks/taskbar-tab-webapp-create.yml, whose header explains why this
#   is more fragile than the swap path (it pokes Firefox's on-disk
#   registry directly) and what to do if a created entry stops opening.
#   Firefox must be closed while this runs.
#
# Usage: ./run-empowered.sh ansible-playbook playbooks/taskbar-tab-webapps.yml
# (or `just taskbar-tab-webapps`). Not part of `just setup` — every entry
# here reflects a personal preference for one specific site, not a
# fresh-install default. Neither list needs root (`omarchy webapp
# remove` and Firefox's own profile files are both user-owned), so this
# playbook doesn't either.
- name: Firefox Taskbar Tabs replacing Omarchy preinstalled web apps
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [taskbar-tab-webapps]

  pre_tasks:
    - name: Check whether any Firefox profile exists
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.config/mozilla/firefox"
      register: firefox_profiles_root
      tags: [taskbar-tab-webapps]

    - name: Fail with guidance if Firefox hasn't been run yet
      ansible.builtin.fail:
        msg: >-
          ~/.config/mozilla/firefox not found. Run `./run-empowered.sh
          ansible-playbook site.yml --tags firefox` (or `just firefox`)
          and open Firefox at least once first.
      when: not firefox_profiles_root.stat.exists
      tags: [taskbar-tab-webapps]

    - name: Find every Firefox Taskbar Tabs registry
      ansible.builtin.find:
        paths: "{{ ansible_facts.env.HOME }}/.config/mozilla/firefox"
        patterns: taskbartabs.json
        recurse: true
      register: taskbar_tab_registries
      tags: [taskbar-tab-webapps]

    - name: Read each Taskbar Tabs registry
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: taskbar_tab_registry_contents
      loop: "{{ taskbar_tab_registries.files }}"
      loop_control:
        label: "{{ item.path }}"
      tags: [taskbar-tab-webapps]

    - name: Flatten every registry into one list of Taskbar Tabs
      ansible.builtin.set_fact:
        all_taskbar_tabs: >-
          {{
            taskbar_tab_registry_contents.results
              | map(attribute='content') | map('b64decode') | map('from_json')
              | map(attribute='taskbarTabs') | sum(start=[])
          }}
      tags: [taskbar-tab-webapps]

    # Everything below only matters for taskbar_tab_webapp_creates, which
    # pokes the registry file directly — skip it entirely for a
    # swaps-only run (no need to fail on a missing registry, a running
    # Firefox, or containers.json for a play that never touches them).
    - name: Fail if no Taskbar Tabs registry exists yet
      ansible.builtin.fail:
        msg: >-
          No taskbartabs.json found under ~/.config/mozilla/firefox. Taskbar
          Tabs has to run at least once before this playbook can create one
          on your behalf — open Firefox, enable Taskbar Tabs (`just
          firefox`), and save any site as a Taskbar Tab once (page menu →
          "Save as Taskbar Tab...") to initialize the registry, then rerun.
      when:
        - (taskbar_tab_webapp_creates | default([])) | length > 0
        - taskbar_tab_registries.files | length == 0
      tags: [taskbar-tab-webapps]

    - name: Determine the Taskbar Tabs registry's directory
      ansible.builtin.set_fact:
        taskbar_tab_registry_dir: "{{ taskbar_tab_registries.files[0].path | dirname }}"
      when: (taskbar_tab_webapp_creates | default([])) | length > 0
      tags: [taskbar-tab-webapps]

    # Short-circuit before any real work (favicon download, id
    # generation, ...) if a create entry names a container but Multi-
    # Account Containers isn't there to have made it — containers.json
    # alone can't tell "no extension" apart from "extension present, no
    # containers made yet", so check the extension directly instead of
    # waiting for the per-entry container lookup (tasks/taskbar-tab-
    # webapp-create.yml) to fail on the first such entry.
    - name: Determine whether any new Taskbar Tab needs a named container
      ansible.builtin.set_fact:
        taskbar_tab_creates_need_container: >-
          {{
            (
              (taskbar_tab_webapp_creates | default([]))
                | map(attribute='container_name', default='')
                | select('ne', '')
                | list
            ) | length > 0
          }}
      tags: [taskbar-tab-webapps]

    - name: Read the installed extensions list
      ansible.builtin.slurp:
        src: "{{ taskbar_tab_registry_dir }}/../extensions.json"
      register: taskbar_tab_extensions_raw
      when: taskbar_tab_creates_need_container
      tags: [taskbar-tab-webapps]

    - name: Determine whether Multi-Account Containers is installed and enabled
      ansible.builtin.set_fact:
        taskbar_tab_containers_addon_active: >-
          {{
            (
              (taskbar_tab_extensions_raw.content | b64decode | from_json).addons
                | selectattr('id', 'equalto', '@testpilot-containers')
                | selectattr('active', 'equalto', true)
                | list
            ) | length > 0
          }}
      when: taskbar_tab_creates_need_container
      tags: [taskbar-tab-webapps]

    - name: Fail if Multi-Account Containers isn't installed and enabled
      ansible.builtin.fail:
        msg: >-
          taskbar_tab_webapp_creates has an entry with container_name set,
          but the Firefox Multi-Account Containers extension isn't
          installed and enabled in
          {{ taskbar_tab_registry_dir | dirname }}. Install it
          (https://addons.mozilla.org/firefox/addon/multi-account-containers/)
          and create the container(s) named in container_name (toolbar →
          containers icon → "Manage Containers" → "New Container"), then
          rerun. Drop container_name from an entry instead if you want that
          Taskbar Tab to open with no container.
      when:
        - taskbar_tab_creates_need_container
        - not taskbar_tab_containers_addon_active
      tags: [taskbar-tab-webapps]

    - name: Check whether Firefox is currently running
      ansible.builtin.command: pgrep -x firefox
      register: taskbar_tab_firefox_running
      failed_when: false
      changed_when: false
      when: (taskbar_tab_webapp_creates | default([])) | length > 0
      tags: [taskbar-tab-webapps]

    - name: Fail if Firefox is running
      ansible.builtin.fail:
        msg: >-
          Firefox is running. taskbar_tab_webapp_creates writes directly to
          taskbartabs.json, which a running Firefox holds cached in memory
          and can overwrite on quit — close Firefox first, then rerun.
      when:
        - (taskbar_tab_webapp_creates | default([])) | length > 0
        - taskbar_tab_firefox_running.rc == 0
      tags: [taskbar-tab-webapps]

    - name: Read the Firefox containers registry
      ansible.builtin.slurp:
        src: "{{ taskbar_tab_registry_dir }}/../containers.json"
      register: taskbar_tab_containers_raw
      when: (taskbar_tab_webapp_creates | default([])) | length > 0
      tags: [taskbar-tab-webapps]

    - name: Parse the Firefox containers registry
      ansible.builtin.set_fact:
        taskbar_tab_containers: "{{ taskbar_tab_containers_raw.content | b64decode | from_json }}"
      when: (taskbar_tab_webapp_creates | default([])) | length > 0
      tags: [taskbar-tab-webapps]

  tasks:
    - name: Swap each configured web app
      ansible.builtin.include_tasks: tasks/taskbar-tab-webapp-swap.yml
      loop: "{{ taskbar_tab_webapp_swaps | default([]) }}"
      loop_control:
        loop_var: webapp_swap
        label: "{{ webapp_swap.omarchy_webapp_name }}"
      tags: [taskbar-tab-webapps]

    - name: Create each configured new Taskbar Tab
      ansible.builtin.include_tasks: tasks/taskbar-tab-webapp-create.yml
      loop: "{{ taskbar_tab_webapp_creates | default([]) }}"
      loop_control:
        loop_var: webapp_create
        label: "{{ webapp_create.name }}"
      tags: [taskbar-tab-webapps]

  handlers:
    - name: reload Hyprland
      # Only has an effect inside a real Hyprland session; the bind
      # still applies on next login either way.
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      listen: reload Hyprland
