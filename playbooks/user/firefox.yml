---
# Firefox (Flatpak), per user:
#   - Hidden ~/.local/share/applications/firefox.desktop shim whose Exec= is
#     /usr/local/bin/firefox (a single token), so Omarchy's own
#     `omarchy-default-browser firefox`, `omarchy-cmd-default-browser` and
#     `omarchy-launch-browser` all resolve `firefox.desktop` to the Flathub
#     build without showing a duplicate Firefox icon in the app launcher
#   - One-time profile migration from ~/.config/mozilla/firefox (or legacy
#     ~/.mozilla/firefox) into ~/.var/app/org.mozilla.firefox/ when the
#     sandbox has no profile of its own yet, so an existing native profile
#     (containers, extensions, logins) carries over to the Flatpak.
#
# The Flatpak itself and its default preferences are installed by
# system/firefox.yml; making it the default browser is
# user/default-browser.yml, and its Taskbar Tabs are managed by
# user/firefox-taskbar-apps.yml.
#
# Usage: just firefox
- name: Firefox (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [firefox]

  tasks:
    - name: Create ~/.local/share/applications
      ansible.builtin.file:
        path: "{{ target_home }}/.local/share/applications"
        state: directory
        mode: "0755"

    # Omarchy's browser scripts (omarchy-default-browser,
    # omarchy-cmd-default-browser, omarchy-launch-browser) only know the
    # native id `firefox.desktop` and take the first whitespace-separated
    # token of its Exec= as the command to run. NoDisplay=true keeps the
    # app launcher showing only the Flatpak's own org.mozilla.firefox.desktop.
    - name: "Install the hidden {{ firefox_desktop_id }} shim for Omarchy's browser helpers"
      ansible.builtin.copy:
        content: |
          [Desktop Entry]
          Type=Application
          Name=Firefox
          Icon={{ firefox_flatpak_id }}
          TryExec={{ firefox_command_link }}
          Exec={{ firefox_command_link }} %u
          NoDisplay=true
          MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          StartupWMClass={{ firefox_flatpak_id }}
        dest: "{{ target_home }}/.local/share/applications/{{ firefox_desktop_id }}"
        mode: "0644"

    - name: Check whether the Firefox Flatpak already has a profile
      ansible.builtin.stat:
        path: "{{ item }}/profiles.ini"
      loop: "{{ firefox_profiles_dirs }}"
      register: firefox_sandbox_profiles

    - name: Check whether a native Firefox profile exists to migrate
      ansible.builtin.stat:
        path: "{{ item }}/profiles.ini"
      loop: "{{ firefox_native_profiles_dirs }}"
      register: firefox_native_profiles
      when: firefox_sandbox_profiles.results | selectattr('stat.exists') | list | length == 0

    - name: Seed the Firefox Flatpak profile from the native profile (first run only)
      vars:
        native_idx: >-
          {{ (firefox_native_profiles.results
              | map(attribute='stat.exists')
              | list).index(true) }}
        src_dir: "{{ firefox_native_profiles_dirs[native_idx | int] }}"
        dest_dir: "{{ firefox_profiles_dirs[native_idx | int] }}"
      when:
        - firefox_sandbox_profiles.results | selectattr('stat.exists') | list | length == 0
        - firefox_native_profiles.results | selectattr('stat.exists') | list | length > 0
      block:
        - name: Create the Firefox Flatpak parent config directory
          ansible.builtin.file:
            path: "{{ dest_dir | dirname }}"
            state: directory
            mode: "0755"

        - name: Copy the native Firefox profile tree into the Flatpak sandbox
          ansible.builtin.command:
            argv:
              - cp
              - -a
              - "{{ src_dir }}"
              - "{{ dest_dir }}"
          changed_when: true
