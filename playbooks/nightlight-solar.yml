---
# Night light (hyprsunset) synced to real sunrise/sunset, instead of two
# hand-picked fixed times.
#
# hyprsunset only understands fixed HH:MM profile times — there's no
# native "sunrise/sunset" concept. A script
# (~/.local/bin/nightlight-solar-sync) resolves the location (Omarchy's
# weather location if set, otherwise IP geolocation), queries Open-Meteo
# for today's sunrise/sunset, and rewrites hyprsunset.conf with two
# profiles: identity at sunrise, night temperature at sunset. A daily
# systemd --user timer keeps it in sync, since the times shift every day.
- name: Night light synced to sunrise/sunset (hyprsunset + systemd --user timer)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Ensure hyprsunset and jq are installed via pacman
      community.general.pacman:
        name:
          - hyprsunset
          - jq
        state: present
      become: true

    - name: Create ~/.local/bin
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Create ~/.config/systemd/user
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Install the sync script (nightlight-solar-sync)
      ansible.builtin.template:
        src: nightlight-solar-sync.sh.j2
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/nightlight-solar-sync"
        mode: "0755"

    - name: Install the systemd --user unit (service)
      ansible.builtin.copy:
        src: nightlight-solar-sync.service
        dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/nightlight-solar-sync.service"
        mode: "0644"
      notify: reload systemd --user

    - name: Install the systemd --user unit (timer)
      ansible.builtin.template:
        src: nightlight-solar-sync.timer.j2
        dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/nightlight-solar-sync.timer"
        mode: "0644"
      notify: reload systemd --user

    - name: Enable and start the daily nightlight-solar-sync timer
      ansible.builtin.systemd:
        name: nightlight-solar-sync.timer
        scope: user
        daemon_reload: true
        enabled: true
        state: started

    - name: Create ~/.config/hypr
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr"
        state: directory
        mode: "0755"

    - name: Create ~/.config/hypr/autostart.lua from the Omarchy template, if missing
      # The right source is /etc/skel (the real placeholder the Omarchy
      # installer copies into the user's home), NOT
      # /usr/share/omarchy/default/hypr/autostart.lua — that's a
      # different internal file (the omarchy.lua startup loader) with
      # the same basename but unrelated content.
      ansible.builtin.copy:
        src: /etc/skel/.config/hypr/autostart.lua
        dest: "{{ ansible_facts.env.HOME }}/.config/hypr/autostart.lua"
        remote_src: true
        force: false
        mode: "0644"

    - name: Launch hyprsunset automatically with Hyprland
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr/autostart.lua"
        marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/nightlight-solar.yml — hyprsunset autostart)"
        block: |
          o.launch_on_start("hyprsunset")

    - name: Sync now (today's sunrise/sunset) and start hyprsunset
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/nightlight-solar-sync"
      changed_when: true

  handlers:
    - name: reload systemd --user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      listen: reload systemd --user
