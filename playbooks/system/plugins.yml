---
# Third-party Omarchy shell plugins, system phase (an administrator, once):
#
#   plugins       runtime dependencies of the omarchy_plugins list
#   pinentry      omapin: signed release tag verified, built, pacman -U
#   ssh-askpass   ssh-askpass-omarchy: signed release tag verified, built,
#                 installed to /usr/bin and /usr/share
#   polkit-agent  polkit-omarchy: signed release tag verified, copied to
#                 /usr/share
#   clipboard-portal  xdg-desktop-portal-omarchy: signed release tag
#                 verified, built, pacman -U; its config.toml
#
# The release signing key only needs to be in the keyring of the
# administrator running this (`just apply gpg-yubikey`). Linking and enabling the
# plugins in each user's shell, and their per-user configuration, happen in
# user/plugins.yml, which explains the plugin list.
#
# Usage: just apply plugins (or just apply pinentry / ssh-askpass / polkit-agent /
# clipboard-portal)
- name: Omarchy shell plugins (omarchy_plugins runtime dependencies)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [plugins]

  tasks:
    - name: Collect the runtime dependencies of every plugin in the list
      ansible.builtin.set_fact:
        plugins_packages: "{{ omarchy_plugins | map(attribute='packages', default=[]) | flatten | unique }}"

    - name: "Check which of them pacman is missing ({{ plugins_packages | join(', ') }})"
      # `pacman -T` prints the targets it can't find and exits 127, so probing
      # first keeps the privileged install out of the run on a stock Omarchy,
      # where every plugin's dependencies already ship.
      ansible.builtin.command:
        argv: [pacman, -T, "{{ item }}"]
      loop: "{{ plugins_packages }}"
      register: plugins_dep_probe
      changed_when: false
      failed_when: false

    - name: Install the missing runtime dependencies
      community.general.pacman:
        name: "{{ plugins_dep_probe.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | list }}"
        state: present
      become: true
      when: plugins_dep_probe.results | selectattr('rc', 'ne', 0) | list | length > 0

# omapin — GnuPG's PIN/passphrase prompts (Yubikey card PIN, key
# passphrases) in the same overlay dialog as Omarchy's polkit agent,
# instead of the stock gtk/qt/curses pinentry
# (https://github.com/lbssousa/omapin). It was called pinentry-omarchy
# until 0.2.1.
#
# It has two halves: a Rust pinentry binary that gpg-agent runs, and a
# third-party omarchy-shell plugin (lbssousa.omapin) that draws the
# dialog. They talk over $XDG_RUNTIME_DIR/omapin.sock. Without a
# Wayland session or with the shell down, the binary execs
# pinentry-gnome3/pinentry-curses instead, so gpg keeps working over SSH
# or from a TTY.
#
# The repo's own PKGBUILD (packaging/) builds the package, which is then
# installed with pacman:
# - makepkg runs with --nodeps, because cargo comes from rustup in
#   ~/.cargo (installed like playbooks/system/gregorio-lsp.yml does, via
#   `omarchy-install-dev-env rust`), which pacman doesn't know about.
# - It runs as the user, never with become: makepkg refuses to run as root.
# - A rebuild happens only when the checkout changed or the package is
#   missing.
#
# Third-party shell plugins are only discovered in
# ~/.config/omarchy/plugins/, so the packaged plugin
# (/usr/share/omapin/plugin) is symlinked there. It is then
# enabled through the shell's IPC, which records it in
# ~/.config/omarchy/shell.json. That step needs omarchy-shell running (run
# the playbook from inside the graphical session).
#
# The package is built, and installed as root, from whatever the checkout
# holds. So the playbook checks out a release tag (omapin_ref),
# never main, and requires that tag's GPG signature to verify and to come
# from one of omapin_signing_keys:
# - verify_commit makes the git module run `git verify-tag` for an
#   annotated tag.
# - gpg_allowlist pins the signer.
# The releases are signed with the Yubikey's OpenPGP key, which
# playbooks/user/yubikey.yml imports (`just apply gpg-yubikey`). main itself only
# holds squash merges signed by GitHub's key, so it isn't deployable.
#
# The plugin is a keepLoaded service, and those survive the shell's plugin
# hot-reload. So after the package changes, the shell is restarted to load
# the new QML.
#
# An install from before the rename (package pinentry-omarchy, plugin
# lbssousa.pinentry) is migrated on the way. The old package is removed
# just before omapin is installed: omapin conflicts with it, and pacman -U
# --noconfirm answers no to removing a conflicting package. The old plugin
# is then disabled (the shell drops its shell.json entry even with the
# plugin's files gone) and its dangling link removed.
#
# Usage: just apply pinentry
- name: omapin (GnuPG prompts in the polkit-style shell dialog)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pinentry]

  vars:
    omapin_cargo_env:
      PATH: "{{ omapin_cargo_bin_dir }}:{{ target_path }}"

  tasks:
    - name: Install build/runtime dependencies (gnupg, stock pinentry for the fallback)
      community.general.pacman:
        name:
          - base-devel
          - git
          - gnupg
          - pinentry
        state: present
      become: true

    - name: Check whether Rust (cargo) is already installed
      ansible.builtin.stat:
        path: "{{ omapin_cargo_bin_dir }}/cargo"
      register: omapin_cargo_stat

    - name: Install Rust (omarchy-install-dev-env rust)
      ansible.builtin.command: omarchy-install-dev-env rust
      when: not omapin_cargo_stat.stat.exists

    - name: "Check out the omapin release ({{ omapin_ref }}), verifying its signed tag"
      ansible.builtin.include_tasks: tasks/signed-git-checkout.yml
      vars:
        signed_checkout_name: omapin
        signed_checkout_repo: "{{ omapin_repo }}"
        signed_checkout_ref: "{{ omapin_ref }}"
        signed_checkout_dest: "{{ omapin_checkout_dir }}"
        signed_checkout_verify: "{{ omapin_verify_commit }}"
        signed_checkout_keys: "{{ omapin_signing_keys }}"

    - name: Keep the checkout's result under this play's name
      ansible.builtin.set_fact:
        omapin_git_result: "{{ signed_checkout_result }}"

    - name: Check whether the package is installed
      ansible.builtin.command: "pacman -Q {{ omapin_package }}"
      register: omapin_installed
      changed_when: false
      failed_when: false

    - name: Build and install the package
      when: omapin_git_result.changed or omapin_installed.rc != 0
      block:
        - name: Build the package (makepkg)
          ansible.builtin.command:
            cmd: makepkg -f --nodeps --noconfirm
            chdir: "{{ omapin_checkout_dir }}/packaging"
          environment: "{{ omapin_cargo_env }}"

        - name: Locate the built package
          ansible.builtin.command:
            cmd: makepkg --packagelist
            chdir: "{{ omapin_checkout_dir }}/packaging"
          register: omapin_packagelist
          changed_when: false

        - name: Install the package
          community.general.pacman:
            name: "{{ omapin_packagelist.stdout_lines | first }}"
            state: present
          become: true

# Installs ssh-askpass-omarchy (https://github.com/lbssousa/ssh-askpass-omarchy)
# from a release tag (ssh_askpass_ref), checked out in
# ssh_askpass_checkout_dir only after the tag's GPG signature verifies and
# comes from one of ssh_askpass_signing_keys: the build runs as the user,
# and the result is installed as root. Releases are signed tags made on the
# merged commit (see the "Releases" section of its README); main only holds
# GitHub-signed squash merges, so it isn't deployable.
# This compiles the Rust binary (--locked, from the repo's Cargo.lock),
# installs it to /usr/bin,
# links the shell plugin, enables it via omarchy-shell IPC,
# and configures SSH to use it.
#
# Usage: just apply ssh-askpass
- name: ssh-askpass-omarchy (SSH prompts in the polkit-style shell dialog)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [ssh-askpass]

  vars:
    ssh_askpass_cargo_env:
      PATH: "{{ ssh_askpass_cargo_bin_dir }}:{{ target_path }}"

  tasks:
    - name: Install git and gnupg (the signature check needs both)
      community.general.pacman:
        name:
          - git
          - gnupg
        state: present
      become: true

    - name: "Check out the ssh-askpass-omarchy release ({{ ssh_askpass_ref }}), verifying its signed tag"
      ansible.builtin.include_tasks: tasks/signed-git-checkout.yml
      vars:
        signed_checkout_name: ssh-askpass-omarchy
        signed_checkout_repo: "{{ ssh_askpass_repo }}"
        signed_checkout_ref: "{{ ssh_askpass_ref }}"
        signed_checkout_dest: "{{ ssh_askpass_checkout_dir }}"
        signed_checkout_verify: "{{ ssh_askpass_verify_commit }}"
        signed_checkout_keys: "{{ ssh_askpass_signing_keys }}"

    - name: Check whether Rust (cargo) is already installed
      ansible.builtin.stat:
        path: "{{ ssh_askpass_cargo_bin_dir }}/cargo"
      register: ssh_askpass_cargo_stat

    - name: Install Rust (omarchy-install-dev-env rust)
      ansible.builtin.command: omarchy-install-dev-env rust
      when: not ssh_askpass_cargo_stat.stat.exists

    - name: Build the ssh-askpass-omarchy binary
      ansible.builtin.command:
        cmd: cargo build --release --locked
        chdir: "{{ ssh_askpass_checkout_dir }}"
      environment: "{{ ssh_askpass_cargo_env }}"

    - name: Create the ssh-askpass-omarchy plugin directory
      ansible.builtin.file:
        path: "{{ ssh_askpass_plugin_dir }}"
        state: directory
        mode: "0755"
      become: true

    - name: Install the binary to /usr/bin
      ansible.builtin.copy:
        src: "{{ ssh_askpass_checkout_dir }}/target/release/ssh-askpass-omarchy"
        dest: "{{ ssh_askpass_program }}"
        mode: "0755"
        remote_src: true
      become: true

    - name: Install the plugin to /usr/share
      ansible.builtin.copy:
        src: "{{ ssh_askpass_checkout_dir }}/plugin/"
        dest: "{{ ssh_askpass_plugin_dir }}/"
        mode: preserve
        remote_src: true
      become: true

# Replaces Omarchy's polkit agent (omarchy.polkit) with polkit-omarchy
# (lbssousa.polkit), which adds a "Touch your security key" prompt for
# pam_u2f instead of a password field whose Enter does nothing.
#
# The plugin (https://github.com/lbssousa/polkit-omarchy) is deployed from
# a release tag (polkit_agent_ref), checked out in polkit_agent_checkout_dir
# only after the tag's GPG signature verifies and comes from one of
# polkit_agent_signing_keys: it runs inside the shell as the authentication
# agent, and a copy of it is installed as root. Releases are signed tags
# made on the merged commit; main only holds GitHub-signed squash merges.
# The plugin is copied to /usr/share and linked into
# ~/.config/omarchy/plugins. Its manifest declares clonedFrom:
# omarchy.polkit, so enabling it disables the built-in agent (and
# `omarchy plugin disable lbssousa.polkit` brings it back). The last two
# tasks re-read the shell's plugin list and fail the run unless that swap
# actually took, since a plugin that is merely linked stays inert.
#
- name: polkit-omarchy (polkit agent with security key touch prompt)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [polkit-agent]

  tasks:
    - name: Install git and gnupg (the signature check needs both)
      community.general.pacman:
        name:
          - git
          - gnupg
        state: present
      become: true

    - name: "Check out the polkit-omarchy release ({{ polkit_agent_ref }}), verifying its signed tag"
      ansible.builtin.include_tasks: tasks/signed-git-checkout.yml
      vars:
        signed_checkout_name: polkit-omarchy
        signed_checkout_repo: "{{ polkit_agent_repo }}"
        signed_checkout_ref: "{{ polkit_agent_ref }}"
        signed_checkout_dest: "{{ polkit_agent_checkout_dir }}"
        signed_checkout_verify: "{{ polkit_agent_verify_commit }}"
        signed_checkout_keys: "{{ polkit_agent_signing_keys }}"

    - name: Install the plugin to /usr/share
      ansible.builtin.copy:
        src: "{{ polkit_agent_checkout_dir }}/plugin/"
        dest: "{{ polkit_agent_plugin_dir }}/"
        mode: preserve
        remote_src: true
      become: true

# xdg-desktop-portal-omarchy — the RemoteDesktop and Clipboard portals, for
# the clipboard only (https://github.com/lbssousa/xdg-desktop-portal-omarchy).
# Hyprland hides its data-control protocols from Flatpak apps, so apps that
# copy without a focused window of their own (Bitwarden copies passwords
# that way) can't reach the clipboard; on GNOME they use the Clipboard
# portal, which xdg-desktop-portal-hyprland doesn't implement. This backend
# does, next to xdph: it asks in a shell dialog (the lbssousa.portal plugin,
# linked per user by user/plugins.yml, which also routes the two portals to
# it) and never grants input devices.
#
# Built and installed like omapin (above): the repo's packaging/PKGBUILD,
# makepkg as the user with rustup's cargo, pacman -U, only when the
# checkout of the signed release tag changed or the package is missing.
#
# Usage: just apply clipboard-portal
- name: xdg-desktop-portal-omarchy (clipboard portal)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [clipboard-portal]

  vars:
    clipboard_portal_cargo_env:
      PATH: "{{ omapin_cargo_bin_dir }}:{{ target_path }}"

  tasks:
    - name: Install build dependencies
      community.general.pacman:
        name:
          - base-devel
          - git
          - gnupg
        state: present
      become: true

    - name: Check whether Rust (cargo) is already installed
      ansible.builtin.stat:
        path: "{{ omapin_cargo_bin_dir }}/cargo"
      register: clipboard_portal_cargo_stat

    - name: Install Rust (omarchy-install-dev-env rust)
      ansible.builtin.command: omarchy-install-dev-env rust
      when: not clipboard_portal_cargo_stat.stat.exists

    - name: "Check out the xdg-desktop-portal-omarchy release ({{ clipboard_portal_ref }}), verifying its signed tag"
      ansible.builtin.include_tasks: tasks/signed-git-checkout.yml
      vars:
        signed_checkout_name: xdg-desktop-portal-omarchy
        signed_checkout_repo: "{{ clipboard_portal_repo }}"
        signed_checkout_ref: "{{ clipboard_portal_ref }}"
        signed_checkout_dest: "{{ clipboard_portal_checkout_dir }}"
        signed_checkout_verify: "{{ clipboard_portal_verify_commit }}"
        signed_checkout_keys: "{{ clipboard_portal_signing_keys }}"

    - name: Keep the checkout's result under this play's name
      ansible.builtin.set_fact:
        clipboard_portal_git_result: "{{ signed_checkout_result }}"

    - name: Check whether the package is installed
      ansible.builtin.command: "pacman -Q {{ clipboard_portal_package }}"
      register: clipboard_portal_installed
      changed_when: false
      failed_when: false

    - name: Build and install the package
      when: clipboard_portal_git_result.changed or clipboard_portal_installed.rc != 0
      block:
        - name: Build the package (makepkg)
          ansible.builtin.command:
            cmd: makepkg -f --nodeps --noconfirm
            chdir: "{{ clipboard_portal_checkout_dir }}/packaging"
          environment: "{{ clipboard_portal_cargo_env }}"

        - name: Locate the built package
          ansible.builtin.command:
            cmd: makepkg --packagelist
            chdir: "{{ clipboard_portal_checkout_dir }}/packaging"
          register: clipboard_portal_packagelist
          changed_when: false

        - name: Install the package
          community.general.pacman:
            name: "{{ clipboard_portal_packagelist.stdout_lines | first }}"
            state: present
          become: true

    - name: "Create {{ clipboard_portal_config | dirname }}"
      ansible.builtin.file:
        path: "{{ clipboard_portal_config | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    # Read at the backend's start; each user's backend picks it up at the
    # next login (or `systemctl --user restart xdg-desktop-portal-omarchy`).
    - name: "Mark the password managers' clipboard content as secret ({{ clipboard_portal_config }})"
      ansible.builtin.copy:
        content: |
          # Managed by omarchy-setup (playbooks/system/plugins.yml).
          # Apps whose clipboard content is a password: their selections also
          # offer x-kde-passwordManagerHint, which clipboard histories skip.
          sensitive_apps = {{ clipboard_portal_sensitive_apps | to_json }}
        dest: "{{ clipboard_portal_config }}"
        owner: root
        group: root
        mode: "0644"
      become: true
