---
# Replaces Omarchy's pre-installed native LibreOffice
# (omarchy-base.packages: libreoffice-fresh) with ONLYOFFICE Desktop
# Editors (org.onlyoffice.desktopeditors) from Flathub. Unlike LibreOffice's
# own Flatpak build, ONLYOFFICE ships as a single desktop application, so
# there are no secondary components to hide from the app launcher and no
# mimeapps re-curation on top of what Omarchy already curates.
#
# Bootstraps Flatpak + the Flathub remote itself (system-wide), same
# approach as playbooks/firefox.yml / playbooks/brave.yml, so `just
# onlyoffice` keeps working standalone.
#
# Removes libreoffice-fresh and its pt-BR language pack
# (ptbr_libreoffice_i18n_package) — the language pack becomes pure
# leftover cruft once the native package is gone. Doesn't touch shared
# libraries libreoffice-fresh pulled in (e.g. libcdr) — pacman leaves
# those alone too unless something else also depends on them.
#
# Omarchy's default Hyprland keybinds (checked across
# /usr/share/omarchy/default/hypr/bindings/*.lua) don't bind anything
# to LibreOffice, so there's normally nothing to reassign — the last
# play below checks for one anyway (including this user's own
# ~/.config/hypr/bindings.lua overrides) and warns instead of silently
# doing nothing, in case a keybind was added by hand since. A reference
# found there targets the (now removed) native binary and must be
# reassigned by hand to `flatpak run {{ onlyoffice_flatpak_id }}`.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags onlyoffice
- name: ONLYOFFICE Desktop Editors (Flatpak, replacing the pre-installed native LibreOffice)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Ensure Flatpak is installed
      community.general.pacman:
        name: "{{ flatpak_package }}"
        state: present
      become: true

    - name: Ensure the Flathub remote is configured (system-wide)
      community.general.flatpak_remote:
        name: "{{ flatpak_flathub_remote }}"
        state: present
        method: system
        flatpakrepo_url: "{{ flatpak_flathub_repo_url }}"
      become: true

    - name: Remove any previous LibreOffice Flatpak install
      community.general.flatpak:
        name: org.libreoffice.LibreOffice
        state: absent
        method: system
      become: true

    - name: Install ONLYOFFICE Desktop Editors from Flathub
      community.general.flatpak:
        name: "{{ onlyoffice_flatpak_id }}"
        state: present
        method: system
      become: true

    - name: "Remove the pre-installed native LibreOffice package and its pt-BR language pack"
      # Both in one transaction — removing libreoffice-fresh on its own
      # fails ("breaks dependency ... required by
      # libreoffice-fresh-pt-br") whenever the language pack is
      # installed, since it depends on the base package.
      community.general.pacman:
        name:
          - libreoffice-fresh
          - "{{ ptbr_libreoffice_i18n_package }}"
        state: absent
      become: true

    - name: Reassign any LibreOffice keybind to the Flatpak
      block:
        - name: Check Omarchy's default keybinds for a LibreOffice reference
          ansible.builtin.shell: grep -ril libreoffice /usr/share/omarchy/default/hypr/bindings/*.lua || true
          register: omarchy_libreoffice_binding_check
          changed_when: false

        - name: Check this user's own bindings.lua for a LibreOffice reference
          ansible.builtin.shell: >-
            grep -il libreoffice "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua" 2>/dev/null || true
          register: user_libreoffice_binding_check
          changed_when: false

        - name: Warn that a LibreOffice keybind needs reassigning by hand
          ansible.builtin.debug:
            msg: >-
              A LibreOffice reference was found in:
              {{ (omarchy_libreoffice_binding_check.stdout_lines + user_libreoffice_binding_check.stdout_lines) | join(', ') }}
              — reassign it to the Flatpak by hand, the same
              hl.unbind()/o.bind() pattern playbooks/bitwarden.yml uses
              for its own keybind, launching "flatpak run
              {{ onlyoffice_flatpak_id }}" (ONLYOFFICE is a single
              desktop application, so there is no component suffix).
          when: (omarchy_libreoffice_binding_check.stdout_lines | length > 0) or (user_libreoffice_binding_check.stdout_lines | length > 0)

        - name: No LibreOffice keybind found — nothing to reassign
          ansible.builtin.debug:
            msg: >-
              Checked Omarchy's default keybinds and this user's
              ~/.config/hypr/bindings.lua: neither binds anything to
              LibreOffice, so there's nothing to reassign to the
              Flatpak.
          when: (omarchy_libreoffice_binding_check.stdout_lines | length == 0) and (user_libreoffice_binding_check.stdout_lines | length == 0)