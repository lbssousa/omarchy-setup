---
# System phase: everything that needs root or is shared by every user —
# packages, /etc, PAM, SDDM, udev, system services, signed plugin builds,
# user accounts. Run once by an administrator (a wheel member), under
# run-empowered.sh, after each change here and after adding a user.
#
# Each automation keeps its tag; a tag that names a feature runs that
# feature's system part (user.yml has the other half under the same tag).
#
# Usage: just system   (./run-empowered.sh ansible-playbook system.yml)

# Fish shell as the default login shell, with the same Starship prompt as
# Omarchy (see playbooks/{system,user}/fish.yml). Runs before users.yml — and
# shares the `users` tag — because omarchy_users sets shell: /usr/bin/fish,
# which users.yml checks against /etc/shells.
- name: Fish shell
  ansible.builtin.import_playbook: playbooks/system/fish.yml
  tags: [fish, users]

# The accounts in omarchy_users (group_vars/all/users.yml): full names (the
# greeter lists them), login shells, wheel or omarchy-users, subuid ranges.
- name: User accounts
  ansible.builtin.import_playbook: playbooks/system/users.yml
  tags: [users]

# The forks of Omarchy's single-owner tools, from a signed release tag:
# greeter, per-user FIDO2/fingerprint, migrations for non-admins, helpers.
- name: omarchy-multiuser
  ansible.builtin.import_playbook: playbooks/system/omarchy-multiuser.yml
  tags: [omarchy-multiuser]

# The login screen: the multi-user greeter and no autologin.
- name: SDDM (multi-user greeter, no autologin)
  ansible.builtin.import_playbook: playbooks/system/sddm.yml
  tags: [sddm]

- name: polkitd ExpirationSeconds
  ansible.builtin.import_playbook: playbooks/system/polkit.yml
  tags: [polkit]

# Fingerprint, then FIDO2/U2F key, then password, in the sudo and polkit PAM
# stacks (Omarchy's setup scripts each insert at the top, so the order
# otherwise depends on which ran last). A no-op when either is not set up.
- name: PAM auth order (fingerprint, then FIDO2/U2F, then password)
  ansible.builtin.import_playbook: playbooks/system/pam-auth-order.yml
  tags: [pam-auth-order]

- name: Flatpak + Flathub + Bazaar
  ansible.builtin.import_playbook: playbooks/system/flatpak.yml
  tags: [flatpak]

- name: Firefox (Flatpak)
  ansible.builtin.import_playbook: playbooks/system/firefox.yml
  tags: [firefox]

# The password manager: KeePassXC, its browser native messaging manifests,
# autostart, Omarchy's "Passwords" keybind (SUPER+SHIFT+SLASH) and a udev
# rule that locks every open database when the YubiKey is unplugged. The
# file's OpenSSH agent play stays off (keepassxc_ssh_agent_enabled).
- name: KeePassXC (default password manager, YubiKey auto-lock)
  ansible.builtin.import_playbook: playbooks/system/keepassxc.yml
  tags: [keepassxc]

- name: ONLYOFFICE Desktop Editors (Flatpak)
  ansible.builtin.import_playbook: playbooks/system/onlyoffice.yml
  tags: [onlyoffice]

- name: Emacs + AUCTeX, yasnippet, lsp-mode (classic teal theme)
  ansible.builtin.import_playbook: playbooks/system/emacs.yml
  tags: [emacs]

- name: Zed editor
  ansible.builtin.import_playbook: playbooks/system/zed.yml
  tags: [zed]

- name: gregorio-lsp
  ansible.builtin.import_playbook: playbooks/system/gregorio-lsp.yml
  tags: [gregorio-lsp]

- name: PDF viewer (Zathura default, Papers optional, Evince kept for sushi)
  ansible.builtin.import_playbook: playbooks/system/pdf-viewer.yml
  tags: [pdf-viewer]

- name: File manager (Flea default)
  ansible.builtin.import_playbook: playbooks/system/file-manager.yml
  # file-chooser routes the portal to Flea's picker, so it needs Flea first.
  tags: [file-manager, file-chooser]

- name: Flea file chooser dialogs for non-GNOME apps
  ansible.builtin.import_playbook: playbooks/system/file-chooser.yml
  tags: [file-chooser]

- name: pt-BR localization
  ansible.builtin.import_playbook: playbooks/system/ptbr.yml
  tags: [ptbr]

# Plays: Podman (tag podman), Distrobox (tag distrobox, which also runs
# Podman first), starship prompt inside distrobox (tag starship-distrobox).
- name: Containers (Podman, Distrobox, starship in distrobox)
  ansible.builtin.import_playbook: playbooks/system/containers.yml
  tags: [containers]

# Plays: Nix (tag nix), direnv with bash + fish hooks (tag direnv),
# nix-direnv for cached `use flake` (tag nix-direnv). The nix tag runs
# all three.
- name: Nix + direnv
  ansible.builtin.import_playbook: playbooks/system/nix.yml
  tags: [nix]

- name: libfprint (goodix538d)
  ansible.builtin.import_playbook: playbooks/system/libfprint.yml
  tags: [libfprint]

- name: EPSON L4160 printer (driverless)
  ansible.builtin.import_playbook: playbooks/system/printer.yml
  tags: [printer]

# Plays: scrolling column resize (tag hypr-scrolling-resize), screen scale +
# text size (tag text-size), night light (tag nightlight-solar).
- name: Desktop tuning (Hyprland resize, text size, night light)
  ansible.builtin.import_playbook: playbooks/system/desktop.yml
  tags: [desktop]

- name: Caps Lock via keyd
  ansible.builtin.import_playbook: playbooks/system/capslock.yml
  tags: [capslock]

- name: Inkscape + svg2tikz (SVG to TikZ/PGF export extension)
  ansible.builtin.import_playbook: playbooks/system/inkscape.yml
  tags: [inkscape]

- name: Limine silent boot (quiet + 1s timeout)
  ansible.builtin.import_playbook: playbooks/system/limine-silent-boot.yml
  tags: [limine-silent-boot]

- name: ble.sh (Bash autosuggestions + syntax highlighting)
  ansible.builtin.import_playbook: playbooks/system/blesh.yml
  tags: [blesh]

- name: openssh with askpass touch notifications (SSH_ASKPASS_REQUIRE in notify_start)
  ansible.builtin.import_playbook: playbooks/system/openssh-askpass.yml
  tags: [openssh-askpass]

# Third-party shell plugins: this desktop's own list (omarchy_plugins in
# group_vars/all/main.yml — Radio Atlas first) plus omapin,
# ssh-askpass-omarchy and polkit-omarchy. No tags here on purpose: each play
# in the file carries its own (plugins, pinentry, ssh-askpass, polkit-agent),
# and a tag on the import would be inherited by all of them.
- name: Omarchy shell plugins
  ansible.builtin.import_playbook: playbooks/system/plugins.yml

# Google Drive (Meu Drive + Compartilhados Comigo) mounted with rclone. Tag "never":
# needs the Google OAuth credentials, so it only runs on
# request (--tags rclone-gdrive / `just rclone-gdrive`).
- name: rclone — Google Drive mounts
  ansible.builtin.import_playbook: playbooks/system/rclone-gdrive.yml
  tags: [rclone-gdrive, never]

# A world-readable copy of this repository's HEAD in /opt/omarchy-setup and
# `omarchy-setup-user`, so every user can run their own phase.
- name: Shared checkout (omarchy-setup-user)
  ansible.builtin.import_playbook: playbooks/system/shared-checkout.yml
  tags: [shared-checkout]
