# Definição declarativa do container de build do fork do libfprint
# (https://github.com/lbssousa/libfprint) — formato nativo do próprio
# distrobox (`distrobox assemble create --file ...`), não reimplementado
# em Ansible: o distrobox já é dono do ciclo de vida do container.
#
# Imagem Arch (mesma distro do host) — mesmos nomes de pacote, sem
# tradução Fedora→Arch a cada dependência nova. O container só existe
# para isolar o toolchain de build (meson, gcc, headers de
# desenvolvimento) do host: $HOME é compartilhado por padrão pelo
# distrobox (é onde o fork é clonado e onde o DESTDIR do build fica),
# mas /usr do container é do container — não do host. Por isso o
# playbook ainda faz o "stage" da instalação e copia para o host
# separadamente, mesmo não estando mais num sistema imutável.
[libfprint-build]
image=archlinux:latest
pull=true
additional_packages="meson ninja gcc pkgconf git glib2 glib2-devel gobject-introspection libgusb libgudev opencv openssl pixman"
