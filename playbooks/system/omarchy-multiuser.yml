---
# omarchy-multiuser (https://github.com/lbssousa/omarchy-multiuser): forks of
# the Omarchy tools that assume one owner, under their own omarchy-mu-*
# names — the SDDM greeter listing every user by full name with an optional
# username field, no autologin, per-user FIDO2 keys and fingerprints with the
# lock screen's fingerprint PAM kept while anyone has prints, migrations for
# users outside wheel, account, administrator-rights and LUKS keyslot
# helpers, and menu entries pointing at all of that. For users outside wheel
# it also takes the update icon off their bar and has polkit refuse them the
# browsers' theme color policy without a password dialog.
#
# Deployed like omapin (system/plugins.yml): a release tag whose GPG
# signature must verify against omarchy_multiuser_signing_keys, built with
# makepkg into an Arch package and installed with pacman. Then this play
# turns on what the package leaves off:
#
#   - the path units that remove a recreated autologin.conf, copy Style >
#     Unlock's colors to the greeter and recompute the lock screen's PAM;
#   - omarchy-mu-migrate-record@<admin>.path for every administrator, which
#     tells non-admins' migrations what an admin has already run;
#   - omarchy-mu-login.service for every user (systemctl --global): the
#     menu entries, the update icon (administrators only) and the
#     fingerprint invitation at each login;
#   - root's password locked while there are several accounts
#     (omarchy-mu-accounts root-sync);
#
# and runs each once. SDDM itself is handled by system/sddm.yml.
#
# Usage: just apply omarchy-multiuser
- name: omarchy-multiuser (multi-user forks of Omarchy's tools)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [omarchy-multiuser]

  tasks:
    - name: Install build dependencies
      community.general.pacman:
        name:
          - base-devel
          - git
          - gnupg
          - nodejs
          - fakeroot
        state: present
      become: true

    - name: "Check out the omarchy-multiuser release ({{ omarchy_multiuser_ref }}), verifying its signed tag"
      ansible.builtin.include_tasks: tasks/signed-git-checkout.yml
      vars:
        signed_checkout_name: omarchy-multiuser
        signed_checkout_repo: "{{ omarchy_multiuser_repo }}"
        signed_checkout_ref: "{{ omarchy_multiuser_ref }}"
        signed_checkout_dest: "{{ omarchy_multiuser_checkout_dir }}"
        signed_checkout_verify: "{{ omarchy_multiuser_verify_commit }}"
        signed_checkout_keys: "{{ omarchy_multiuser_signing_keys }}"

    - name: Keep the checkout's result under this play's name
      ansible.builtin.set_fact:
        omarchy_multiuser_git_result: "{{ signed_checkout_result }}"

    - name: Check whether the package is installed
      ansible.builtin.command: "pacman -Q {{ omarchy_multiuser_package }}"
      register: omarchy_multiuser_installed
      changed_when: false
      failed_when: false

    # Compared with what is installed rather than relying on the checkout
    # having changed: after a failed install the checkout is already at the
    # tag, and the next run would otherwise leave the old package in place.
    - name: Read the release's package version
      ansible.builtin.shell: |
        set -o pipefail
        makepkg --printsrcinfo | awk '$1 == "pkgver" { v = $3 } $1 == "pkgrel" { r = $3 } END { print v "-" r }'
      args:
        chdir: "{{ omarchy_multiuser_checkout_dir }}/packaging"
        executable: /bin/bash
      register: omarchy_multiuser_release_version
      changed_when: false

    - name: Build and install the package
      when: >-
        omarchy_multiuser_git_result.changed
        or omarchy_multiuser_installed.rc != 0
        or (omarchy_multiuser_installed.stdout.split() | last) != omarchy_multiuser_release_version.stdout
      block:
        - name: Build the package (makepkg, runs the tests in check())
          ansible.builtin.command:
            cmd: "{{ unprivileged_build }} makepkg -f --cleanbuild --nodeps --noconfirm"
            chdir: "{{ omarchy_multiuser_checkout_dir }}/packaging"
          # run0/run-empowered sets SUDO_USER, which makes fakeroot in check()
          # think omarchy-mu-fido2-authfile was called through sudo as root,
          # clearing OMU_ROOT. Clear SUDO_* so check() can test against a fake tree.
          environment:
            SUDO_USER: ""
            SUDO_UID: ""
            SUDO_GID: ""
          changed_when: true

        - name: Locate the built package
          ansible.builtin.command:
            cmd: makepkg --packagelist
            chdir: "{{ omarchy_multiuser_checkout_dir }}/packaging"
          register: omarchy_multiuser_packagelist
          changed_when: false

        - name: Install the package
          community.general.pacman:
            name: "{{ omarchy_multiuser_packagelist.stdout_lines | first }}"
            state: present
          become: true

    - name: Enable the watchers (autologin guard, greeter colors, lock screen PAM)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ omarchy_multiuser_path_units }}"
      become: true

    - name: Record the migrations every administrator runs
      ansible.builtin.systemd_service:
        name: "omarchy-mu-migrate-record@{{ item.name }}.path"
        enabled: true
        state: started
      loop: "{{ omarchy_users | selectattr('admin', 'defined') | selectattr('admin') | list }}"
      loop_control:
        label: "{{ item.name }}"
      become: true

    - name: Record what the administrators have already run
      ansible.builtin.command: "omarchy-mu-migrate-record {{ item.name | quote }}"
      loop: "{{ omarchy_users | selectattr('admin', 'defined') | selectattr('admin') | list }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      become: true

    - name: Check whether the per-login unit is enabled for every user
      ansible.builtin.command: systemctl --global is-enabled omarchy-mu-login.service
      register: omarchy_multiuser_login_unit
      changed_when: false
      failed_when: false

    - name: Enable the per-login unit for every user (menu entries, update icon, fingerprint invitation)
      ansible.builtin.command: systemctl --global enable omarchy-mu-login.service
      when: omarchy_multiuser_login_unit.stdout | trim != 'enabled'
      changed_when: true
      become: true

    - name: Lock root's password while there are several accounts
      ansible.builtin.command: omarchy-mu-accounts root-sync
      register: omarchy_multiuser_root_sync
      changed_when: omarchy_multiuser_root_sync.stdout | length > 0
      become: true

    - name: Bring the lock screen PAM and greeter colors in line now
      ansible.builtin.command: "{{ item }}"
      loop:
        - omarchy-mu-apply-lock --quiet
        - omarchy-mu-sddm-sync
      changed_when: false
      become: true
