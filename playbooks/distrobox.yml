---
# Distrobox depends on Podman (playbooks/podman.yml) — fails early with
# guidance if it's missing, instead of installing distrobox and only
# discovering the problem on the first `distrobox create`.
- name: Distrobox
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Check that Podman is available
      ansible.builtin.command: podman --version
      register: distrobox_podman_check
      changed_when: false
      failed_when: false

    - name: Fail with guidance if Podman wasn't found
      ansible.builtin.fail:
        msg: >-
          Podman not found. Distrobox depends on it — run
          `ansible-playbook site.yml --ask-become-pass --tags podman`
          (or `just podman`) first.
      when: distrobox_podman_check.rc != 0

  tasks:
    - name: Install distrobox via pacman
      community.general.pacman:
        name: distrobox
        state: present
      become: true
