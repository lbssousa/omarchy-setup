# Static layer for IDEs and every systemd session process. Read by
# systemd --user at startup; inherited by Hyprland, terminals, VSCode,
# Zed, etc. Points at bitwarden-ssh-agent.socket, which launches Bitwarden
# on first use and proxies to its sandboxed agent socket.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/bitwarden-ssh-agent.sock
