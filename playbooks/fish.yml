# Fish shell, with the same Starship prompt as Omarchy, set as the
# default login shell so every terminal opens in it.
#
# Omarchy's default shell is Bash and its prompt (see
# /usr/share/omarchy/config/starship.toml, copied to ~/.config/starship.toml
# on first use) comes from `starship init bash` in
# $OMARCHY_PATH/default/bash/rc. Fish can't source that rc file, but it
# doesn't need to for the prompt: Starship is shell-agnostic and reads the
# SAME ~/.config/starship.toml, so once fish runs `starship init fish |
# source` its prompt is identical to Omarchy's.
#
# The rest of that rc is ported to fish so the shell behaves the same,
# from playbooks/files/fish/ into fish's per-user vendor directories
# (~/.local/share/fish/vendor_{conf,functions,completions}.d/):
# environment, aliases and tool setup in conf.d/omarchy.fish; every
# function from $OMARCHY_PATH/default/bash/fns/ (tmux and herdr layouts,
# the reconnecting ssh wrapper, rsync watchers, port forwards, worktrees,
# drives), the lazy `try` and the `omarchy` completion as autoloaded
# files. fish reads ~/.config/fish/ first, so your own function,
# completion or conf.d file of the same name wins, config.fish (which
# runs after conf.d) can override any setting, and the play never writes
# to ~/.config/fish. The ports keep what the bash code means to do: where
# it has an obvious bug (tdl focusing a pane it never set), the fish file
# says so and does the intended thing. fish's "Welcome to fish" banner is turned
# off, since bash shows none.
#
# On top of Omarchy's defaults, fzf.fish (PatrickF1, pinned release) adds
# fzf searches for directories, git log/status, history with preview,
# processes and variables (see the task below for the keys).
#
# Left out because fish can't do them: hiding the omarchy-* binaries from
# first-word completion (bash's `complete -I -X`) and fzf's `**<Tab>`
# completion (fzf ships key bindings only for fish; those are enabled).
# History options, `set +h` and inputrc are fish's defaults or don't apply.
#
# Omarchy changes its bash files from time to time, so the play warns
# (without failing) when they no longer match playbooks/files/fish/
# UPSTREAM.sha256 or define a name fish lacks. Review the port, then
# `just fish-upstream-hash` to record the new versions.
#
# This play also makes sure ~/.config/starship.toml exists (seeded from
# Omarchy's default when missing, never overwriting a customized one),
# and warns if the omarchy-fish package (another port of the same
# defaults, with system-wide vi key bindings) is installed. The default shell is
# changed through /etc/passwd (chsh equivalent), which is what Ghostty,
# Alacritty, Foot and Kitty all use when they have no explicit `command`.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags fish
#        (or: just fish)
- name: Fish shell (Starship prompt, default login shell)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [fish]

  vars:
    fish_starship_config: "{{ target_home }}/.config/starship.toml"
    fish_starship_seed: /usr/share/omarchy/config/starship.toml
    fish_vendor_dir: "{{ target_xdg_data_home }}/fish"
    fzf_fish_repo: https://github.com/PatrickF1/fzf.fish
    fzf_fish_version: v11.0
    fzf_fish_checkout_dir: "{{ target_home }}/.cache/omarchy-setup/fzf.fish"

  tasks:
    - name: Install fish (and starship, in case it is missing)
      community.general.pacman:
        name:
          - fish
          - starship
        state: present
      become: true

    - name: Make sure /usr/bin/fish is a valid login shell
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: /usr/bin/fish
      become: true

    - name: Seed ~/.config/starship.toml from Omarchy's default, if missing
      ansible.builtin.copy:
        src: "{{ fish_starship_seed }}"
        dest: "{{ fish_starship_config }}"
        remote_src: true
        force: false
        mode: "0644"

    - name: Install fzf.fish's dependencies (fzf, fd, bat)
      community.general.pacman:
        name:
          - fzf
          - fd
          - bat
        state: present
      become: true

    # Everything this play manages goes in fish's per-user vendor
    # directories, which fish reads after ~/.config/fish/: a function,
    # completion or conf.d file of yours with the same name wins, and
    # rerunning the play never touches ~/.config/fish.
    - name: Create fish's per-user vendor directories
      ansible.builtin.file:
        path: "{{ fish_vendor_dir }}/vendor_{{ item }}.d"
        state: directory
        mode: "0755"
      loop: [functions, completions, conf]

    - name: Install the Omarchy defaults for fish (functions, completions, conf.d)
      ansible.builtin.copy:
        src: "fish/{{ item }}/"
        dest: "{{ fish_vendor_dir }}/vendor_{{ item | replace('conf.d', 'conf') }}.d/"
        mode: "0644"
        # Without it, copying a directory applies `mode` to the
        # directories too, and 0644 leaves them unreadable to fish.
        directory_mode: "0755"
      loop: [functions, completions, conf.d]

    - name: Find Omarchy-defaults files this play no longer ships
      ansible.builtin.find:
        paths:
          - "{{ fish_vendor_dir }}/vendor_functions.d"
          - "{{ fish_vendor_dir }}/vendor_completions.d"
          - "{{ fish_vendor_dir }}/vendor_conf.d"
        patterns: "*.fish"
        contains: "^# Managed by omarchy-setup \\(playbooks/fish\\.yml\\)"
        read_whole_file: true
      register: fish_vendor_managed

    - name: Remove Omarchy-defaults files this play no longer ships
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ fish_vendor_managed.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: >-
        (item.path | basename) not in
        (lookup('ansible.builtin.fileglob', 'fish/functions/*.fish', wantlist=True)
         + lookup('ansible.builtin.fileglob', 'fish/completions/*.fish', wantlist=True)
         + lookup('ansible.builtin.fileglob', 'fish/conf.d/*.fish', wantlist=True))
        | map('basename') | list

    # fzf.fish (PatrickF1): Ctrl+Alt+F directories, Ctrl+Alt+L git log,
    # Ctrl+Alt+S git status, Ctrl+R history with preview, Ctrl+Alt+P
    # processes, Ctrl+V variables. Beyond what Omarchy's bash has; fzf's
    # own Ctrl+T and Alt+C stay. Pinned to a release tag.
    - name: "Clone/update fzf.fish ({{ fzf_fish_version }})"
      ansible.builtin.git:
        repo: "{{ fzf_fish_repo }}"
        dest: "{{ fzf_fish_checkout_dir }}"
        version: "{{ fzf_fish_version }}"
        depth: 1
        force: true

    - name: Install fzf.fish into fish's per-user vendor directories
      ansible.builtin.copy:
        src: "{{ fzf_fish_checkout_dir }}/{{ item }}/"
        dest: "{{ fish_vendor_dir }}/vendor_{{ item | replace('conf.d', 'conf') }}.d/"
        remote_src: true
        mode: "0644"
        directory_mode: "0755"
      loop: [functions, completions, conf.d]

    # The omarchy-fish package is another port of the same defaults: its
    # system-wide conf.d turns on vi key bindings and its functions differ
    # from these.
    - name: Check whether the omarchy-fish package is installed
      ansible.builtin.command: pacman -Q omarchy-fish
      register: fish_omarchy_fish_pkg
      changed_when: false
      failed_when: false

    - name: Warn about the omarchy-fish package
      ansible.builtin.debug:
        msg: >-
          The omarchy-fish package is installed. Its system-wide conf.d
          (vi key bindings, its own fzf.fish setup) runs alongside this
          play's, and its functions are shadowed by these. Remove it with
          `sudo pacman -R omarchy-fish` unless you want both.
      when: fish_omarchy_fish_pkg.rc == 0

    # Drift check: warn, never fail, when Omarchy's bash files differ from
    # the versions the fish port follows, or define a name fish lacks.
    - name: Compare Omarchy's bash files with the versions the fish port follows
      ansible.builtin.command:
        cmd: sha256sum --check --quiet -
        chdir: /usr/share/omarchy/default/bash
        stdin: "{{ lookup('ansible.builtin.file', 'fish/UPSTREAM.sha256') }}"
      register: fish_upstream_files
      changed_when: false
      failed_when: false

    - name: Find Omarchy bash aliases and functions with no fish counterpart
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          bash_names=$(bash -c '
            if [ -f /etc/omarchy.conf ]; then . /etc/omarchy.conf; fi
            : "${OMARCHY_PATH:=/usr/share/omarchy}"
            source "$OMARCHY_PATH/default/bash/aliases"
            source "$OMARCHY_PATH/default/bash/functions"
            compgen -a
            compgen -A function' | sort -u)
          fish_names=$(fish -c 'functions -an' | tr ',' '\n' | sort -u)
          comm -23 <(printf '%s\n' "$bash_names") <(printf '%s\n' "$fish_names")
        executable: /bin/bash
      register: fish_missing_names
      changed_when: false
      failed_when: false

    - name: Warn when the fish port may be out of date
      ansible.builtin.debug:
        msg: >-
          Omarchy's bash setup changed since the fish port was written.
          {% if fish_upstream_files.rc != 0 %}Files that differ from
          playbooks/files/fish/UPSTREAM.sha256: {{ fish_upstream_files.stdout_lines
          | map('regex_replace', ':.*$', '') | join(', ') }}.{% endif %}
          {% if fish_missing_names.stdout | length > 0 %}Names with no fish
          counterpart: {{ fish_missing_names.stdout_lines | join(', ') }}.{% endif %}
          Review /usr/share/omarchy/default/bash against playbooks/files/fish/,
          then record the new versions with `just fish-upstream-hash`.
      when: fish_upstream_files.rc != 0 or fish_missing_names.stdout | length > 0

    - name: Set fish as the default login shell
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /usr/bin/fish
      become: true

    - name: Remind about picking the new shell up
      ansible.builtin.debug:
        msg: >-
          Fish is installed and is now your default login shell. Open a new
          terminal (or log out and back in) to use it; existing terminals
          keep running Bash. The Starship prompt reads ~/.config/starship.toml,
          the same one Omarchy uses.
