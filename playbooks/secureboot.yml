---
# Secure Boot (Limine + sbctl) — not part of site.yml/`just setup`,
# deliberately: touches firmware/boot, so it only runs when called
# explicitly (`just secureboot`).
#
# Limine's own limine-entry-tool already re-signs its binary
# automatically whenever sbctl has keys configured (enroll_config()
# calls sb_sign() unconditionally) — this playbook relies on that
# instead of manually signing on every kernel update.
#
# Two-step flow (two reboots) — changing the firmware's Secure Boot
# state requires going into the BIOS manually, nothing in Linux can do
# that for you:
#   1st run (Secure Boot off, not in Setup Mode): installs sbctl,
#   creates keys, configures limine-entry-tool to embed and verify a
#   checksum of limine.conf, and signs the Limine binary. Detects the
#   firmware isn't in Setup Mode and stops, with instructions to enter
#   it (BIOS → Secure Boot → clear the existing keys).
#   2nd run (after entering Setup Mode): enrolls the keys into the
#   firmware (`sbctl enroll-keys --microsoft`). Reboot again and enable
#   Secure Boot in the BIOS.
#
# Worth knowing before running:
#   - hash_mismatch_panic=yes (enabled here) halts boot on a
#     kernel/initrd checksum mismatch — real integrity protection, but
#     it means editing boot files by hand without going through
#     limine-entry-tool afterward breaks boot.
#   - Plymouth ("splash" on the cmdline) is incompatible with Secure
#     Boot in this setup — this playbook warns if found, but doesn't
#     remove it.
#   - If this machine uses LUKS with TPM2 auto-unlock (PCR 7 = Secure
#     Boot state), enabling Secure Boot for the first time changes PCR7
#     and breaks auto-unlock until the TPM2 enrollment is redone — the
#     password fallback keeps working in the meantime.
- name: Secure Boot (Limine + sbctl)
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Check the bootloader is Limine with limine-entry-tool
      ansible.builtin.command: pacman -Qi limine limine-mkinitcpio-hook
      register: secureboot_limine_check
      changed_when: false
      failed_when: false

    - name: Fail if the bootloader isn't Limine + limine-entry-tool
      ansible.builtin.fail:
        msg: >-
          This playbook only covers Limine + limine-entry-tool
          (limine-mkinitcpio-hook) — its auto-signing mechanism
          (enroll_config/sb_sign) is specific to that tool. Doesn't
          apply to GRUB/systemd-boot.
      when: secureboot_limine_check.rc != 0

  tasks:
    - name: Install sbctl
      community.general.pacman:
        name: sbctl
        state: present
      become: true

    - name: Check for "splash" on the kernel cmdline (incompatible here)
      ansible.builtin.command: "grep -l splash {{ secureboot_default_limine_conf }} {{ secureboot_kernel_cmdline_file }}"
      register: secureboot_splash_check
      changed_when: false
      failed_when: false

    - name: Warn if "splash" is present
      ansible.builtin.debug:
        msg: >-
          "splash" found in {{ secureboot_splash_check.stdout_lines }}.
          Plymouth (splash) breaks boot with Secure Boot enabled in this
          setup — consider removing it before enabling Secure Boot in
          firmware. Not removed automatically.
      when: secureboot_splash_check.rc == 0

    - name: Check whether sbctl already has keys configured
      ansible.builtin.command: sbctl status --json
      become: true
      register: secureboot_sbctl_state
      changed_when: false

    - name: Create sbctl keys (only if missing)
      ansible.builtin.command: sbctl create-keys
      become: true
      when: "'\"installed\": true' not in secureboot_sbctl_state.stdout"

    - name: Enable limine.conf checksum embedding and verification
      ansible.builtin.lineinfile:
        path: "{{ secureboot_default_limine_conf }}"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: ENABLE_ENROLL_LIMINE_CONFIG, value: "yes" }
        - { key: ENABLE_VERIFICATION, value: "yes" }
      become: true
      register: secureboot_limine_default_conf

    - name: Halt boot on a checksum mismatch (hash_mismatch_panic)
      ansible.builtin.lineinfile:
        path: "{{ secureboot_limine_conf }}"
        regexp: "^hash_mismatch_panic:"
        line: "hash_mismatch_panic: yes"
      become: true
      register: secureboot_limine_conf_edit

    - name: Apply (limine-update) — rebuilds and signs the Limine binary
      ansible.builtin.command: limine-update
      become: true
      changed_when: true

    - name: Check the current sbctl state (keys, signed binaries)
      ansible.builtin.command: sbctl status
      register: secureboot_sbctl_status
      changed_when: false
      failed_when: false

    - name: Show sbctl status
      ansible.builtin.debug:
        var: secureboot_sbctl_status.stdout_lines

    - name: Check which EFI binaries are still unsigned
      ansible.builtin.command: sbctl verify
      register: secureboot_sbctl_verify
      changed_when: false
      failed_when: false

    - name: Show sbctl verify
      ansible.builtin.debug:
        var: secureboot_sbctl_verify.stdout_lines

    - name: Read the EFI SetupMode variable
      ansible.builtin.shell: >-
        od -An -t u1 -j4 -N1
        /sys/firmware/efi/efivars/SetupMode-8be4df61-93ca-11d2-aa0d-00e098032b8c
        | tr -d ' '
      register: secureboot_setup_mode_byte
      changed_when: false
      failed_when: false

    - name: "Warn and stop: firmware isn't in Setup Mode"
      ansible.builtin.debug:
        msg: >-
          Firmware is NOT in Setup Mode (SetupMode={{ secureboot_setup_mode_byte.stdout | default('?') }}) —
          keys were created and the Limine binary is signed, but keys
          can't be enrolled yet. Reboot, enter the BIOS/UEFI, go to
          Secure Boot, clear the existing keys (this enables Setup
          Mode), save and reboot again — then run this playbook once
          more to enroll the keys.
      when: secureboot_setup_mode_byte.stdout != "1"

    - name: Enroll keys into firmware (only in Setup Mode)
      when: secureboot_setup_mode_byte.stdout == "1"
      become: true
      block:
        - name: Unlock immutable EFI variables (some firmware sets this even in Setup Mode)
          ansible.builtin.shell: >-
            chattr -i /sys/firmware/efi/efivars/PK-* /sys/firmware/efi/efivars/KEK-*
            /sys/firmware/efi/efivars/db-* /sys/firmware/efi/efivars/dbx-* 2>/dev/null || true
          changed_when: false

        - name: "sbctl enroll-keys --microsoft (includes Microsoft's keys, for their-signed drivers/firmware)"
          ansible.builtin.command: sbctl enroll-keys --microsoft
          register: secureboot_enroll_result

        - name: Show the enrollment result
          ansible.builtin.debug:
            var: secureboot_enroll_result.stdout_lines

        - name: Note the next steps
          ansible.builtin.debug:
            msg: >-
              Keys enrolled into firmware. Next: reboot, enter the
              BIOS/UEFI and ENABLE Secure Boot, save and reboot again.
              Then check with `sbctl status` (should show "Secure Boot:
              enabled") and `bootctl status`. If this machine uses LUKS
              with TPM2 auto-unlock, PCR7 changed — run `sudo
              systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=0+2+7
              /dev/<luks-partition>` again to restore it (the password
              still works as a fallback in the meantime).
