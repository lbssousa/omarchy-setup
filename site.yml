---
# Every automation: the system phase, then the user phase for whoever runs
# it. What `just setup` runs for an administrator setting up their own
# account; other users run only `just user` (system.yml says who does what).
#
# Usage: ./run-empowered.sh ansible-playbook site.yml   (just setup)
- name: System phase
  ansible.builtin.import_playbook: system.yml

- name: User phase
  ansible.builtin.import_playbook: user.yml
