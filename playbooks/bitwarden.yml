---
# Bitwarden desktop client — the default password manager of this setup,
# installed the way Omarchy's own menu does it (Install > Service >
# Bitwarden: `omarchy-pkg-add bitwarden bitwarden-cli`, the Arch packages
# from extra). KeePassXC (playbooks/keepassxc.yml) and Proton Pass
# (playbooks/proton-pass.yml) stay available as opt-in alternatives,
# outside site.yml.
#
# Wires SSH_AUTH_SOCK to the Bitwarden SSH agent's socket — a static
# export via ~/.config/environment.d/ (reaches IDEs and other session
# apps) plus a `.path` unit that reacts once Bitwarden actually creates
# the socket (only happens after unlock). The native build puts it at
# ~/.bitwarden-ssh-agent.sock (https://bitwarden.com/help/ssh-agent/).
# gcr-ssh-agent is masked so it doesn't compete for the same
# variable. Takes effect at the next login (or once the path unit fires).
#
# Installs the polkit action Bitwarden's biometric unlock needs to even
# offer the option in its own settings — without it the toggle doesn't
# appear at all, and the Arch package doesn't ship it (see
# bitwarden_polkit_action_dest in group_vars/all/main.yml).
#
# Starts Bitwarden with the session the Omarchy way, with
# o.launch_on_start() in ~/.config/hypr/autostart.lua (the file Omarchy
# reserves for extra startup processes). Bitwarden's own "Start
# automatically at login" checkbox relies on Electron's
# app.setLoginItemSettings(), which Electron only implements on
# Windows/macOS — on Linux it's a silent no-op.
#
# Finally, makes Bitwarden the "Passwords" app: Omarchy binds
# SUPER+SHIFT+SLASH to 1Password (omarchy-launch-1password, which offers
# to install 1Password when it's missing), and this rebinds it to
# Bitwarden, focusing the running window instead of opening a second one.
- name: Bitwarden + SSH agent + polkit (biometric unlock)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Check whether Bitwarden is installed
      ansible.builtin.command: pacman -Q {{ bitwarden_packages | join(' ') }}
      register: bitwarden_check
      changed_when: false
      failed_when: false

    - name: Install Bitwarden with Omarchy's package helper
      ansible.builtin.command: omarchy-pkg-add {{ bitwarden_packages | join(' ') }}
      when: bitwarden_check.rc != 0
      become: true

    - name: Bitwarden SSH agent — session-wide SSH_AUTH_SOCK
      block:
        - name: Create ~/.config/environment.d
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/environment.d"
            state: directory
            mode: "0755"

        - name: "Set a static SSH_AUTH_SOCK for IDEs and session apps ({{ bitwarden_ssh_agent_socket }})"
          ansible.builtin.copy:
            src: 20-bitwarden-ssh-agent.conf
            dest: "{{ ansible_facts.env.HOME }}/.config/environment.d/20-bitwarden-ssh-agent.conf"
            mode: "0644"

        - name: Create ~/.config/systemd/user
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
            state: directory
            mode: "0755"

        - name: Install the Bitwarden SSH agent's systemd --user units
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/{{ item }}"
            mode: "0644"
          loop: "{{ bitwarden_ssh_agent_units }}"
          notify: reload systemd --user

        - name: Mask gcr-ssh-agent (avoids competing for SSH_AUTH_SOCK)
          ansible.builtin.systemd:
            name: "{{ item }}"
            scope: user
            masked: true
          loop: "{{ gcr_ssh_agent_units }}"

        - name: Enable the Bitwarden SSH agent's path unit
          ansible.builtin.systemd:
            name: bitwarden-ssh-agent.path
            scope: user
            daemon_reload: true
            enabled: true
            state: started

    - name: Install the Bitwarden polkit action (biometric unlock)
      ansible.builtin.copy:
        src: com.bitwarden.Bitwarden.policy
        dest: "{{ bitwarden_polkit_action_dest }}"
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: restart polkit

    - name: Create ~/.config/hypr
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr"
        state: directory
        mode: "0755"

    - name: Start Bitwarden with the session
      block:
        - name: Create ~/.config/hypr/autostart.lua from the Omarchy template, if missing
          # /etc/skel, not /usr/share/omarchy/default/hypr/autostart.lua —
          # see the same task in playbooks/desktop.yml.
          ansible.builtin.copy:
            src: /etc/skel/.config/hypr/autostart.lua
            dest: "{{ ansible_facts.env.HOME }}/.config/hypr/autostart.lua"
            remote_src: true
            force: false
            mode: "0644"

        - name: Launch Bitwarden automatically with Hyprland
          ansible.builtin.blockinfile:
            path: "{{ ansible_facts.env.HOME }}/.config/hypr/autostart.lua"
            marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/bitwarden.yml — Bitwarden autostart)"
            block: |
              o.launch_on_start("{{ bitwarden_command }}")

    - name: "Bitwarden keybinding ({{ bitwarden_hypr_keybind }}, inherited from 1Password's default)"
      block:
        - name: Create ~/.config/hypr/bindings.lua from the Omarchy default, if missing
          ansible.builtin.copy:
            src: /usr/share/omarchy/default/hypr/bindings.lua
            dest: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
            remote_src: true
            force: false
            mode: "0644"

        - name: "Rebind {{ bitwarden_hypr_keybind }} from 1Password to Bitwarden"
          ansible.builtin.blockinfile:
            path: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
            marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/bitwarden.yml — Bitwarden keybinding)"
            block: |
              hl.unbind("{{ bitwarden_hypr_keybind }}")
              o.bind("{{ bitwarden_hypr_keybind }}", "Passwords", { launch = "{{ bitwarden_command }}", focus = "^{{ bitwarden_window_class }}$" })
          notify: reload Hyprland

  handlers:
    - name: reload systemd --user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      listen: reload systemd --user

    - name: restart polkit
      ansible.builtin.systemd:
        name: polkit
        state: restarted
      become: true
      listen: restart polkit

    - name: reload Hyprland
      # Only has an effect inside a real Hyprland session; the bind
      # still applies on next login either way.
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      listen: reload Hyprland
