---
# The people who use this machine (playbooks/system/users.yml, `just users`).
#
#   name       login name
#   admin      true: in wheel, can run the system phase and sudo; false: in
#              omarchy-users, which omarchy-multiuser lets register their
#              own FIDO2 key and fingerprints. Turning it off takes the
#              account out of wheel along with its sudo grants (or by hand:
#              omarchy-mu-user-admin <name> off)
#   child      true: in omarchy-users and omarchy-child (no extra groups);
#              starts with omarchy-multiuser's default blocked apps, and an
#              administrator's password also opens their lock screen
#   groups     extra groups, on top of omarchy-users / wheel (not for child)
#
# Every account logs into fish (fish_login_shell, playbooks/system/fish.yml).
#
# Accounts are updated by `just users` when already present on the machine;
# to create new accounts from this list, run `just users <name>...` (or
# `just users --all`). Accounts are never removed by this automation: remove one
# with omarchy-mu-user-remove (Setup > Users in the Omarchy menu). New accounts
# start locked; `just users <name>` then asks for their password, which on an
# encrypted disk is also their own key to it.
# Personal settings (rclone account, PWAs, plugins, ...) go in
# users/<name>.yml.
#
# Full names (GECOS, shown in Setup > Users and the switch-user menu) are kept out of the
# repository: set omarchy_user_full_names in the administrator's
# ~/.config/omarchy-setup/local.yml (see users/local.example.yml). An
# account without one keeps whatever GECOS it already has.
omarchy_users:
  - name: abutre
    admin: true
  - name: surubi
    admin: false
  - name: coruja
    admin: false
  - name: camelo
    admin: false
  - name: cavalo
    admin: false
  - name: macaco
    admin: false
  - name: gorila
    admin: false
  - name: coelho
    admin: false

# login → full name; filled in by the untracked local.yml.
omarchy_user_full_names: {}
