---
# GNU Emacs, installed the way Omarchy's own installer does it
# (/usr/share/omarchy/bin/omarchy-install-editor-emacs): the AUR
# omarchy-emacs package via omarchy-pkg-aur-add, then omarchy-install-emacs
# (emacs-wayland, Omarchy theme/font integration, emacs.service). On top of
# that: AUCTeX, yasnippet and lsp-mode (emacs_packages) and the "classic" theme (light beige on dark
# slate, from emacs-jp/replace-colorthemes) as Emacs' theme, replacing
# Omarchy's color theme (font syncing is kept).
#
# These packages aren't in the Arch repos, so they're installed with
# package.el in batch mode (emacs -Q: independent of the user's init), only
# the missing ones. AUCTeX and yasnippet come from GNU ELPA, lsp-mode from
# MELPA (emacs_package_archives).
#
# The user's own init file is never overwritten: everything lives in a
# managed omarchy-setup.el next to it, loaded by a blockinfile-managed
# stanza appended to init.el (which also loads omarchy.el, since an init.el
# created earlier doesn't have Omarchy's own load line). omarchy-emacs always uses ~/.config/emacs.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags emacs
- name: Emacs (omarchy-emacs) + AUCTeX, yasnippet, lsp-mode (classic theme)
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    emacs_config_dir: "{{ ansible_facts.env.HOME }}/.config/emacs"

  tasks:
    - name: Check whether omarchy-emacs is already installed
      ansible.builtin.command: pacman -Q {{ emacs_aur_package }}
      register: emacs_aur_check
      changed_when: false
      failed_when: false

    - name: Install omarchy-emacs (AUR) with Omarchy's own helper
      ansible.builtin.command: omarchy-pkg-aur-add {{ emacs_aur_package }}
      when: emacs_aur_check.rc != 0

    - name: Find which Emacs packages are missing
      ansible.builtin.command:
        argv:
          - emacs
          - -Q
          - --batch
          - --eval
          - >-
            (progn (package-initialize)
            (princ (mapconcat #'symbol-name
            (seq-remove #'package-installed-p
            '({{ emacs_packages | join(' ') }})) " ")))
      register: emacs_packages_check
      changed_when: false

    - name: Install the missing Emacs packages ({{ emacs_packages | join(', ') }})
      ansible.builtin.command:
        argv:
          - emacs
          - -Q
          - --batch
          - --eval
          - >-
            (progn (require 'package)
            (setq package-archives
            '({% for a in emacs_package_archives %}("{{ a.name }}" . "{{ a.url }}") {% endfor %}))
            (package-initialize) (package-refresh-contents)
            (dolist (p '({{ emacs_packages_check.stdout }})) (package-install p)))
      when: emacs_packages_check.stdout | trim | length > 0

    - name: Check whether Omarchy's Emacs integration is already set up
      ansible.builtin.stat:
        path: "{{ emacs_config_dir }}/omarchy.el"
      register: emacs_omarchy_shim

    # Idempotent (omarchy-emacs-setup only refreshes managed files and never
    # replaces an existing init.el). stdin is closed so its legacy
    # ~/.emacs{,.d} prompts take the safe "no" default.
    - name: Set up Emacs with Omarchy's installer
      ansible.builtin.command:
        cmd: omarchy-install-emacs
        stdin: ""
      changed_when: not emacs_omarchy_shim.stat.exists

    - name: Create the themes directory
      ansible.builtin.file:
        path: "{{ emacs_config_dir }}/themes"
        state: directory
        mode: "0755"

    - name: Deploy the classic theme
      ansible.builtin.copy:
        src: files/emacs-classic-theme.el
        dest: "{{ emacs_config_dir }}/themes/classic-theme.el"
        mode: "0644"
      register: emacs_classic_theme

    - name: Deploy the managed omarchy-setup.el (package archives, AUCTeX, yasnippet + classic theme)
      ansible.builtin.template:
        src: templates/emacs-omarchy-setup.el.j2
        dest: "{{ emacs_config_dir }}/omarchy-setup.el"
        mode: "0644"
      register: emacs_setup_el

    - name: Load omarchy-setup.el from init.el
      ansible.builtin.blockinfile:
        path: "{{ emacs_config_dir }}/init.el"
        create: true
        mode: "0644"
        marker: ";; {mark} omarchy-setup managed block"
        block: |
          (load (expand-file-name "omarchy" user-emacs-directory) t)
          (load (expand-file-name "omarchy-setup.el" user-emacs-directory) t)
      register: emacs_init_block

    - name: Restart the Emacs daemon to pick up the new configuration
      ansible.builtin.command: systemctl --user restart emacs.service
      when: emacs_classic_theme.changed or emacs_setup_el.changed or emacs_init_block.changed
