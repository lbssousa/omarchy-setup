---
# Proton Pass — end-to-end encrypted password manager from Proton AG.
# Optional alternative to KeePassXC (playbooks/keepassxc.yml) and
# Bitwarden (playbooks/bitwarden.yml); like both of those, this playbook
# is not imported by site.yml, so more than one password manager can be
# installed side by side without any of them being "the default".
#
#   Desktop client   tags: proton-pass, proton-pass-desktop
#   CLI (pass-cli)   tags: proton-pass, proton-pass-cli
#
# Usage: ./run-empowered.sh ansible-playbook playbooks/proton-pass.yml
#
# Desktop client: installed from Flathub (me.proton.Pass) — the official
# build, cross-distro, no AUR package to track. Needs Flatpak + Flathub
# already set up (playbooks/flatpak.yml; site.yml runs it in the right
# order, or `just flatpak`).
#
# The browser extension authenticates directly with a Proton account —
# unlike KeePassXC's, it doesn't talk to the desktop client over native
# messaging, so there's no manifest to deploy here.
#
# CLI: the AUR packages for it (proton-pass-cli, proton-pass-cli-bin) are
# unreliable upstream (checksum failures, disabled AUR pushes), and
# Proton's own official installer script has no update mechanism of its
# own. `proton-pass-cli` is an official Homebrew (homebrew-core) formula
# instead, with a prebuilt x86_64_linux bottle, so this needs Homebrew
# already set up (playbooks/homebrew.yml; site.yml runs it, or `just
# homebrew`). Homebrew's own binary mirroring into ~/.local/bin only
# happens on its own playbook run, so this play does that one symlink
# itself rather than depending on cross-playbook ordering.
#
# CLI SSH agent vs. the desktop app's: both speak the standard SSH agent
# protocol and read from the same account's synced vaults, so any SSH
# client (git, ssh, ...) works against either one — but they are two
# separate long-running processes with two different default sockets, not
# one shared agent. `pass-cli ssh-agent start` is scriptable (its own
# documented default socket at ~/.ssh/proton-pass-agent.sock,
# `--socket-path` override, a plain systemd --user service to run it) and
# is what this playbook wires up below. The desktop app's own "Use Proton
# Pass as SSH agent" toggle (Settings → General) instead generates a
# setup command interactively for the user to paste into a terminal,
# exporting SSH_AUTH_SOCK to a *different* default socket
# (~/.ssh/proton-pass-ssh-agent.sock) — Proton doesn't publish that
# command in its docs, so it can't be reproduced headlessly here, but it
# doesn't collide with the CLI's own socket either. Enabling both just
# means two independent agents exist side by side; only one path can be
# the session's SSH_AUTH_SOCK at a time (this playbook's environment.d
# layer points at the CLI's), so pick one — either override
# SSH_AUTH_SOCK to the desktop app's socket instead, or leave the desktop
# toggle off and stick with `systemctl --user disable --now
# proton-pass-ssh-agent.service` if you'd rather use the desktop app's
# agent exclusively.
#
# Session persistence across reboots: pass-cli's local encryption key
# defaults to the Linux kernel keyring, which is wiped on every reboot —
# so without proton_pass_cli_linux_keyring: dbus (group_vars/all/main.yml),
# `pass-cli login` would need to be repeated interactively after every
# single restart, forever. See that variable's comment for the fix and
# its SDDM-autologin caveat.
- name: Proton Pass desktop client (Flatpak)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [proton-pass, proton-pass-desktop]

  pre_tasks:
    - name: Check whether the Flathub remote is configured
      ansible.builtin.command: flatpak remote-list
      register: proton_pass_flatpak_check
      changed_when: false
      failed_when: false

    - name: Fail with guidance if Flatpak/Flathub wasn't found
      ansible.builtin.fail:
        msg: >-
          Flathub remote not found. Run `./run-empowered.sh
          ansible-playbook site.yml --tags flatpak` (or `just flatpak`)
          first.
      when: "'flathub' not in proton_pass_flatpak_check.stdout"

  tasks:
    - name: Install Proton Pass (Flatpak) system-wide
      community.general.flatpak:
        name: "{{ proton_pass_flatpak_id }}"
        state: present
        method: system
      become: true

    - name: "Proton Pass keybinding ({{ proton_pass_hypr_keybind }}, inherited from 1Password's default)"
      block:
        - name: Create ~/.config/hypr
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/hypr"
            state: directory
            mode: "0755"

        - name: Create ~/.config/hypr/bindings.lua from the Omarchy default, if missing
          ansible.builtin.copy:
            src: /usr/share/omarchy/default/hypr/bindings.lua
            dest: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
            remote_src: true
            force: false
            mode: "0644"

        - name: "Rebind {{ proton_pass_hypr_keybind }} from 1Password to Proton Pass"
          ansible.builtin.blockinfile:
            path: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
            marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/proton-pass.yml — Proton Pass keybinding)"
            # The flatpak's Hyprland window class is "me.proton.Pass"
            # (its window title is just "Proton"), not the "Proton Pass"
            # StartupWMClass its .desktop file advertises — checked with
            # `hyprctl clients` against a running instance. Escaped dots
            # so the class matches literally, not "me?proton?Pass".
            block: |
              hl.unbind("{{ proton_pass_hypr_keybind }}")
              o.bind("{{ proton_pass_hypr_keybind }}", "Proton Pass", { launch = "flatpak run {{ proton_pass_flatpak_id }}", focus = "^me\\.proton\\.Pass$" })
          notify: reload Hyprland

  handlers:
    - name: reload Hyprland
      # Only has an effect inside a real Hyprland session; the bind
      # still applies on next login either way.
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      listen: reload Hyprland

- name: Proton Pass CLI (pass-cli, Homebrew)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [proton-pass, proton-pass-cli]

  pre_tasks:
    - name: Check whether Homebrew is available
      ansible.builtin.stat:
        path: "{{ homebrew_bin }}"
      register: proton_pass_homebrew_check

    - name: Fail with guidance if Homebrew wasn't found
      ansible.builtin.fail:
        msg: >-
          Homebrew not found. Run `./run-empowered.sh ansible-playbook
          site.yml --tags homebrew` (or `just homebrew`) first.
      when: not proton_pass_homebrew_check.stat.exists

  tasks:
    - name: Install proton-pass-cli via Homebrew
      ansible.builtin.command: "{{ homebrew_symlink }} install proton-pass-cli"
      register: proton_pass_cli_brew_result
      changed_when: "'Pouring proton-pass-cli' in proton_pass_cli_brew_result.stdout"

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Symlink pass-cli into ~/.local/bin
      # Homebrew's own mirror (playbooks/homebrew.yml) only refreshes on
      # its own run, so this doesn't rely on cross-playbook ordering —
      # force: true also replaces any leftover binary from the old
      # official-installer approach.
      ansible.builtin.file:
        src: "{{ homebrew_prefix }}/bin/pass-cli"
        path: "{{ proton_pass_cli_bin }}"
        state: link
        force: true

    - name: Proton Pass CLI SSH agent — session-wide SSH_AUTH_SOCK
      block:
        - name: Create ~/.config/environment.d
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/environment.d"
            state: directory
            mode: "0755"

        - name: Set a static SSH_AUTH_SOCK for IDEs and session apps
          ansible.builtin.template:
            src: proton-pass-ssh-agent-env.conf.j2
            dest: "{{ ansible_facts.env.HOME }}/.config/environment.d/20-proton-pass-ssh-agent.conf"
            mode: "0644"

        - name: Create ~/.config/systemd/user
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
            state: directory
            mode: "0755"

        - name: Install the Proton Pass CLI SSH agent's systemd --user service
          ansible.builtin.template:
            src: proton-pass-ssh-agent.service.j2
            dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/proton-pass-ssh-agent.service"
            mode: "0644"
          notify: reload systemd --user

        - name: Enable the Proton Pass CLI SSH agent service
          ansible.builtin.systemd:
            name: proton-pass-ssh-agent.service
            scope: user
            daemon_reload: true
            enabled: true
            state: started

  handlers:
    - name: reload systemd --user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      listen: reload systemd --user
