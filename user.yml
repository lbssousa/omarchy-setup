---
# User phase: everything that lives in the user's home or session —
# ~/.config, systemctl --user, gsettings, the live omarchy-shell. Run by
# each user, inside their own graphical session, as themselves (never under
# run0): no task here becomes root. What it needs installed comes from
# system.yml, run by an administrator first.
#
# Each automation keeps its tag (the system half is under the same tag in
# system.yml). Per-user settings come from users/<user>.yml.
#
# Usage: just user   (ansible-playbook user.yml -e @users/$USER.yml)

- name: Preflight (as the user, inside the graphical session)
  ansible.builtin.import_playbook: playbooks/user/preflight.yml

# user.name and user.email from users/<name>.yml.
- name: git identity
  ansible.builtin.import_playbook: playbooks/user/git-identity.yml
  tags: [git-identity]

- name: Flatpak + Flathub (user session XDG_DATA_DIRS + Bazaar D-Bus mask)
  ansible.builtin.import_playbook: playbooks/user/flatpak.yml
  tags: [flatpak]

- name: Firefox (Flatpak)
  ansible.builtin.import_playbook: playbooks/user/firefox.yml
  tags: [firefox]

# The tab apps in firefox_taskbar_apps, with the webapp keybinds pointed at
# them instead of Omarchy's own web app launchers.
- name: Firefox Taskbar Tabs
  ansible.builtin.import_playbook: playbooks/user/firefox-taskbar-apps.yml
  tags: [firefox-taskbar-apps]

# Firefox as the default browser, set with omarchy-default-browser
# (Setup > Defaults > Browser in the Omarchy menu).
- name: Default browser (Firefox)
  ansible.builtin.import_playbook: playbooks/user/default-browser.yml
  tags: [default-browser]

# The password manager: KeePassXC, its browser native messaging manifests,
# autostart, Omarchy's "Passwords" keybind (SUPER+SHIFT+SLASH) and a udev
# rule that locks every open database when the YubiKey is unplugged. The
# file's OpenSSH agent play stays off (keepassxc_ssh_agent_enabled).
- name: KeePassXC (default password manager, YubiKey auto-lock)
  ansible.builtin.import_playbook: playbooks/user/keepassxc.yml
  tags: [keepassxc]

- name: Emacs + AUCTeX, yasnippet, lsp-mode (classic teal theme)
  ansible.builtin.import_playbook: playbooks/user/emacs.yml
  tags: [emacs]

- name: Zed editor
  ansible.builtin.import_playbook: playbooks/user/zed.yml
  tags: [zed]

- name: gregorio-lsp
  ansible.builtin.import_playbook: playbooks/user/gregorio-lsp.yml
  tags: [gregorio-lsp]

- name: PDF viewer (Zathura default, Papers optional, Evince kept for sushi)
  ansible.builtin.import_playbook: playbooks/user/pdf-viewer.yml
  tags: [pdf-viewer]

- name: File manager (Flea default)
  ansible.builtin.import_playbook: playbooks/user/file-manager.yml
  # file-chooser routes the portal to Flea's picker, so it needs Flea first.
  tags: [file-manager, file-chooser]

- name: Flea file chooser dialogs for non-GNOME apps
  ansible.builtin.import_playbook: playbooks/user/file-chooser.yml
  tags: [file-chooser]

- name: LazyVim plugin preferences (LaTeX extra + gregorio.nvim)
  ansible.builtin.import_playbook: playbooks/user/lazyvim.yml
  tags: [lazyvim]

- name: pt-BR localization
  ansible.builtin.import_playbook: playbooks/user/ptbr.yml
  tags: [ptbr]

# Plays: Podman (tag podman), Distrobox (tag distrobox, which also runs
# Podman first), starship prompt inside distrobox (tag starship-distrobox).
- name: Containers (Podman, Distrobox, starship in distrobox)
  ansible.builtin.import_playbook: playbooks/user/containers.yml
  tags: [containers]

# Plays: Nix (tag nix), direnv with bash + fish hooks (tag direnv),
# nix-direnv for cached `use flake` (tag nix-direnv). The nix tag runs
# all three.
- name: Nix + direnv
  ansible.builtin.import_playbook: playbooks/user/nix.yml
  tags: [nix]

- name: EPSON L4160 printer (driverless)
  ansible.builtin.import_playbook: playbooks/user/printer.yml
  tags: [printer]

# Plays: scrolling column resize (tag hypr-scrolling-resize), screen scale +
# text size (tag text-size), night light (tag nightlight-solar).
- name: Desktop tuning (Hyprland resize, text size, night light)
  ansible.builtin.import_playbook: playbooks/user/desktop.yml
  tags: [desktop]

- name: Caps Lock via keyd
  ansible.builtin.import_playbook: playbooks/user/capslock.yml
  tags: [capslock]

- name: Omadwaita Omarchy themes (Adwaita-based)
  ansible.builtin.import_playbook: playbooks/user/omadwaita-themes.yml
  tags: [omadwaita-themes]

- name: Omaraptor Omarchy themes (GNOME palette + Bluefin wallpapers)
  ansible.builtin.import_playbook: playbooks/user/omaraptor-themes.yml
  tags: [omaraptor-themes]

- name: Omaraptor day/night theme switching (systemd --user timer)
  ansible.builtin.import_playbook: playbooks/user/omaraptor-theme-auto.yml
  tags: [omaraptor-theme-auto]

- name: ble.sh (Bash autosuggestions + syntax highlighting)
  ansible.builtin.import_playbook: playbooks/user/blesh.yml
  tags: [blesh]

# Fish shell as the default login shell, with the same Starship prompt as
# Omarchy (see playbooks/{system,user}/fish.yml).
- name: Fish shell
  ansible.builtin.import_playbook: playbooks/user/fish.yml
  tags: [fish]

# Third-party shell plugins: this desktop's own list (omarchy_plugins in
# group_vars/all/main.yml — Radio Atlas first) plus omapin,
# ssh-askpass-omarchy and polkit-omarchy. No tags here on purpose: each play
# in the file carries its own (plugins, pinentry, ssh-askpass, polkit-agent),
# and a tag on the import would be inherited by all of them.
- name: Omarchy shell plugins
  ansible.builtin.import_playbook: playbooks/user/plugins.yml

# Google Drive (Meu Drive + Compartilhados Comigo) mounted with rclone. Tag "never":
# needs the Google OAuth credentials, so it only runs on
# request (--tags rclone-gdrive / `just rclone-gdrive`).
- name: rclone — Google Drive mounts
  ansible.builtin.import_playbook: playbooks/user/rclone-gdrive.yml
  tags: [rclone-gdrive, never]
