---
# Local connection become timeout. The fingerprint reader is tried before
# the sudo password on every privileged task, and can take longer than
# Ansible's 10s default to give up and fall back.
ansible_local_become_success_timeout: 60

# sudo prompt timeout (minutes) — guards against `become: true` left
# hanging in an unattended terminal.
sudo_passwd_timeout_minutes: 1

# polkit authentication cache window (seconds), for pkexec/graphical tools.
polkit_expiration_seconds: 1800

# pt-BR localization (playbooks/ptbr.yml)
ptbr_locale: pt_BR.UTF-8
ptbr_locale_gen_line: "pt_BR.UTF-8 UTF-8"
ptbr_language_fallback: "pt_BR:pt:en"

ptbr_xdg_user_dirs:
  - { name: DESKTOP, translated: "Área de Trabalho" }
  - { name: DOWNLOAD, translated: "Downloads" }
  - { name: TEMPLATES, translated: "Modelos" }
  - { name: PUBLICSHARE, translated: "Público" }
  - { name: DOCUMENTS, translated: "Documentos" }
  - { name: MUSIC, translated: "Música" }
  - { name: PICTURES, translated: "Imagens" }
  - { name: VIDEOS, translated: "Vídeos" }
  - { name: PROJECTS, translated: "Projetos" }

ptbr_firefox_i18n_package: firefox-i18n-pt-br
ptbr_firefox_requested_locale:
  - pt-BR
  - en-US

# Accept-Language for Chromium-family web apps (affects page content
# language, not the browser's own UI language).
ptbr_chromium_accept_languages: "pt-BR,pt,en-US,en"

# Profile directories (relative to ~/.config) fixed by
# playbooks/tasks/ptbr-chromium-family-browser.yml. Opera and Helium are
# excluded: unconfirmed profile layout on this machine.
ptbr_chromium_family_config_dirs:
  - chromium
  - BraveSoftware/Brave-Browser
  - BraveSoftware/Brave-Origin
  - google-chrome
  - microsoft-edge
  - vivaldi

# "libreoffice-fresh-pt" is European Portuguese; pt-BR needs the -br suffix.
ptbr_libreoffice_i18n_package: libreoffice-fresh-pt-br
ptbr_man_pages_package: man-pages-pt_br

# OCR languages for omarchy-capture-text (tesseract "+" syntax).
ptbr_tesseract_data_package: tesseract-data-por
ptbr_ocr_langs: "por+eng"

# Bitwarden (playbooks/bitwarden.yml) — prefers the AUR package, which
# tracks upstream releases faster than the official Arch package.
bitwarden_official_package: bitwarden
bitwarden_aur_package: bitwarden-bin
bitwarden_aur_git_url: "https://aur.archlinux.org/{{ bitwarden_aur_package }}.git"
bitwarden_aur_build_dir: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/aur/{{ bitwarden_aur_package }}"
bitwarden_aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info?arg[]={{ bitwarden_aur_package }}"

# Runtime deps not already covered by the Omarchy base package set.
bitwarden_aur_runtime_deps:
  - alsa-lib
  - gtk3
  - libnotify
  - libxtst
  - libxss
  - libnss_nis
  - nss

bitwarden_ssh_agent_socket: "{{ ansible_facts.env.HOME }}/.bitwarden-ssh-agent.sock"
bitwarden_ssh_agent_units:
  - bitwarden-ssh-agent.path
  - bitwarden-ssh-agent-env.service

# Reuses Omarchy's default "Passwords" keybinding (originally bound to
# 1Password, which this setup doesn't install).
bitwarden_hypr_keybind: "SUPER + SHIFT + SLASH"

# gcr-ssh-agent competes for SSH_AUTH_SOCK and must be masked for
# Bitwarden's own agent to take over.
gcr_ssh_agent_units:
  - gcr-ssh-agent.socket
  - gcr-ssh-agent.service

# Podman rootless (playbooks/podman.yml) — subuid/subgid range, same
# default useradd already allocates.
podman_subuid_start: 100000
podman_subuid_count: 65536

# libfprint (goodix538d, playbooks/libfprint.yml) — built in a distrobox
# container, installed to /usr/local on the host.
libfprint_container_name: libfprint-build
libfprint_distrobox_ini_file: "{{ playbook_dir }}/files/libfprint-build.ini"
libfprint_repo: https://github.com/lbssousa/libfprint.git
libfprint_ref: goodix-538d-sigfm-gtls
libfprint_checkout_dir: "{{ ansible_facts.env.HOME }}/src/libfprint-goodix538d"
libfprint_stage_dir: "{{ ansible_facts.env.HOME }}/src/libfprint-goodix538d-stage"

libfprint_usrlocal_prefix: /usr/local
libfprint_usrlocal_libdir: "{{ libfprint_usrlocal_prefix }}/lib"

# Runtime deps for the built library on the host (the container only
# needs the build toolchain).
libfprint_runtime_deps:
  - opencv
  - openssl
  - glib2
  - libgusb
  - libgudev
  - pixman

# pkg-config shim: the driver's meson.build looks for "opencv4", which
# Arch no longer ships (current package is opencv5, API-compatible for
# the modules this driver actually uses). Only used during the build via
# PKG_CONFIG_PATH, never installed system-wide.
libfprint_opencv4_shim_dir: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/libfprint-pkgconfig-shim"

# udev rule disabling USB autosuspend for the fingerprint reader. Kept
# even though it didn't fix the real bug (see fprintd_desync_* below) —
# harmless and may still help.
libfprint_goodix_usb_vendor_id: "27c6"
libfprint_goodix_usb_product_id: "538d"

# NVIDIA (playbooks/nvidia.yml) — package choice depends on GPU
# generation, detected via Omarchy's own helper scripts.
nvidia_kernel_pkg_regex: '^linux(-zen|-lts|-hardened|-t2|-ptl)?$'

# Turing or newer.
nvidia_gsp_packages:
  - nvidia-open-dkms
  - nvidia-utils
  - lib32-nvidia-utils
  - libva-nvidia-driver

# Maxwell/Pascal/Volta.
nvidia_without_gsp_packages:
  - nvidia-580xx-dkms
  - nvidia-580xx-utils
  - lib32-nvidia-580xx-utils

nvidia_modprobe_conf_dest: /etc/modprobe.d/nvidia.conf
nvidia_mkinitcpio_conf_dest: /etc/mkinitcpio.conf.d/nvidia.conf

# Secure Boot (Limine + sbctl, playbooks/secureboot.yml — not part of
# `just setup`, run explicitly).
secureboot_esp_path: /boot
secureboot_limine_binary: "{{ secureboot_esp_path }}/EFI/limine/limine_x64.efi"
secureboot_limine_conf: "{{ secureboot_esp_path }}/limine.conf"
secureboot_default_limine_conf: /etc/default/limine
secureboot_kernel_cmdline_file: /etc/kernel/cmdline

# Hyprland scrolling-layout column resize step (playbooks/hypr-scrolling-resize.yml).
hypr_scrolling_colresize_step: 0.1

# EPSON L4160 printer (playbooks/printer.yml) — driverless CUPS queue.
printer_l4160_name: L4160
printer_l4160_location: "Wi-Fi"
printer_l4160_description: "EPSON L4160 Series"
printer_l4160_hostname: EPSONE0321F.local
printer_l4160_device_uri: "ipp://{{ printer_l4160_hostname }}:631/ipp/print"
printer_l4160_error_policy: abort-job
printer_l4160_set_default: true

# Shell bar + terminal text size (playbooks/text-size.yml), px. GTK scale
# factor is always reset afterward, so this doesn't affect other apps.
omarchy_text_size_px: 20

# Caps Lock via keyd (playbooks/capslock.yml). Key that takes over Compose
# from Caps Lock — must not be a hardware modifier (Ctrl/Alt/Win keep
# acting as modifiers even after their symbol changes; "menu" doesn't have
# that problem and is the natural Compose key already).
capslock_compose_key: menu
keyd_config_dest: /etc/keyd/default.conf

# Night light synced to real sunrise/sunset (playbooks/nightlight-solar.yml).
# hyprsunset only supports fixed HH:MM profile times, so a daily timer
# recomputes them.
nightlight_solar_night_temperature: 4000
nightlight_solar_geoip_url: "http://ip-api.com/json/"
nightlight_solar_oncalendar: "*-*-* 00:05:00"
