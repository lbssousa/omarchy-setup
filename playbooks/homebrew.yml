---
# Homebrew for Linux — installed per upstream's official script
# (targets /home/linuxbrew/.linuxbrew). Omarchy doesn't ship it by
# default, but some tools only publish brew formulae. `brew` itself is
# exposed via a launcher script in /usr/local/bin (needed immediately,
# even non-interactively, right after this playbook runs — see the
# comment above that task for why a symlink doesn't work). Every other
# Homebrew-installed binary reaches the session the same way Flatpak's
# and snapd's binaries do (playbooks/flatpak.yml, playbooks/snap.yml):
# {{ homebrew_prefix }}/bin(+/sbin) is appended to PATH session-wide via
# ~/.config/environment.d, not mirrored one symlink at a time — that
# used to be the approach here, but it meant every playbook installing
# something via Homebrew (e.g. proton-pass-cli, playbooks/proton-pass.yml)
# needed its own bespoke symlinking task, and anything installed
# straight from a terminal (`brew install foo`) stayed invisible to the
# rest of the session until this playbook was rerun. New PATH entries
# apply to new sessions only (log out and back in to pick it up — same
# caveat already true for snapd's PATH export).
# bbrew is installed here as a TUI frontend for Homebrew/Flatpak.
- name: Homebrew
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Install Homebrew's runtime dependencies via pacman
      community.general.pacman:
        name: "{{ homebrew_runtime_deps }}"
        state: present
      become: true

    - name: Check whether brew is already installed
      ansible.builtin.stat:
        path: "{{ homebrew_bin }}"
      register: homebrew_brew_check

    - name: Download the official installer script
      ansible.builtin.get_url:
        url: "{{ homebrew_install_url }}"
        dest: "{{ homebrew_install_script_path }}"
        mode: "0700"
      when: not homebrew_brew_check.stat.exists

    # The installer only skips sudo when the prefix is already writable,
    # so create it owned by the current user beforehand.
    - name: Pre-create the Homebrew prefix owned by the current user
      ansible.builtin.file:
        path: "{{ homebrew_prefix }}"
        state: directory
        owner: "{{ ansible_facts.user_id }}"
        group: "{{ ansible_facts.user_id }}"
        mode: "0755"
      become: true
      when: not homebrew_brew_check.stat.exists

    # There is no TTY here, so real `sudo` calls (fingerprint/password auth)
    # can never succeed. The installer probes it via `sudo -l`, which this
    # machine answers successfully even without authentication, so we force
    # `have_sudo_access` to fail with a broken SUDO_ASKPASS; the installer
    # then runs its commands directly as the current user (allowed because
    # the prefix above is user-owned). INTERACTIVE keeps the probe in the
    # askpass path (NONINTERACTIVE would use `sudo -n` and ignore it), and
    # the piped newline answers its "Press RETURN" prompt.
    - name: Run the installer
      ansible.builtin.command:
        cmd: "{{ homebrew_install_script_path }}"
        stdin: "\n"
      environment:
        INTERACTIVE: "1"
        SUDO_ASKPASS: /bin/false
      when: not homebrew_brew_check.stat.exists

    - name: Ensure /usr/local/bin exists
      ansible.builtin.file:
        path: /usr/local/bin
        state: directory
      become: true

    # A symlink here breaks brew 7.x: it resolves only the first hop of the
    # /usr/local/bin/brew -> bin/brew -> Homebrew/bin/brew chain and then looks
    # up Library/Homebrew/brew.sh one level early, and its macOS x86_64 shim
    # additionally rewrites HOMEBREW_PREFIX to /usr/local. A plain launcher
    # script avoids both by exec'ing the real brew so it resolves its own path.
    - name: Remove any stale brew launcher
      ansible.builtin.file:
        path: "{{ homebrew_symlink }}"
        state: absent
      become: true

    - name: Install brew launcher into /usr/local/bin
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          exec "{{ homebrew_bin }}" "$@"
        dest: "{{ homebrew_symlink }}"
        mode: "0755"
        owner: root
        group: root
      become: true

    - name: Install bbrew (TUI for Homebrew/Flatpak) via brew
      ansible.builtin.command: "{{ homebrew_symlink }} install {{ homebrew_bbrew_package }}"

    - name: Create ~/.config/environment.d
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/environment.d"
        state: directory
        mode: "0755"

    - name: Put Homebrew's bin/sbin on PATH for the session
      ansible.builtin.template:
        src: homebrew-env.conf.j2
        dest: "{{ ansible_facts.env.HOME }}/.config/environment.d/{{ homebrew_env_file }}"
        mode: "0644"
