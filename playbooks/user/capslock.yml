---
# Caps Lock, per user: Compose moves from Caps Lock (Omarchy's
# compose:caps) to capslock_compose_key in ~/.config/hypr/input.lua, so the
# machine-wide keyd remap (system/capslock.yml, which explains it) can
# produce a real Caps Lock. Every user needs this.
#
# Usage: just capslock
- name: Caps Lock via keyd (tap=Esc / hold=Ctrl / Shift+CapsLock=CapsLock) (user)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: "Move Compose off Caps Lock, onto {{ capslock_compose_key }}"
      block:
        - name: Create ~/.config/hypr
          ansible.builtin.file:
            path: "{{ target_home }}/.config/hypr"
            state: directory
            mode: "0755"

        - name: Create ~/.config/hypr/input.lua from the Omarchy template, if missing
          # The right source is /etc/skel, not
          # /usr/share/omarchy/default/hypr/input.lua (a different
          # internal file with the same basename).
          ansible.builtin.copy:
            src: /etc/skel/.config/hypr/input.lua
            dest: "{{ target_home }}/.config/hypr/input.lua"
            remote_src: true
            force: false
            mode: "0644"

        - name: "Set kb_options = compose:{{ capslock_compose_key }}"
          ansible.builtin.blockinfile:
            path: "{{ target_home }}/.config/hypr/input.lua"
            marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/user/capslock.yml — Compose on {{ capslock_compose_key }})"
            block: |
              hl.config({
                input = {
                  kb_options = "compose:{{ capslock_compose_key }}",
                },
              })
          register: capslock_compose_key_binding
          notify: reload Hyprland

  handlers:
    - name: reload Hyprland
      # Only has an effect inside a real Hyprland session; kb_options
      # still applies on next login either way.
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      listen: reload Hyprland
