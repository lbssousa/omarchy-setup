# Caps Lock remapeado a nível evdev via keyd: tap = Esc, hold = Ctrl,
# Shift+Caps Lock = Caps Lock literal (liga/desliga o LED normalmente).
# Funciona igual em TTY e Wayland (ao contrário de setxkbmap/GNOME
# "Origens de entrada", que só cobrem X11/compositor).
#
# PRÉ-REQUISITO: o Compose do Omarchy precisa estar fora do Caps Lock
# (playbooks/capslock.yml cuida disso antes de instalar este config,
# movendo pra tecla Menu) — enquanto o Compose estiver no Caps Lock
# (`compose:caps`, padrão do Omarchy), nada aqui consegue produzir um
# Caps Lock de verdade, veja o cabeçalho do playbook para os detalhes.
#
# overload(control, esc): ativa o layer "control" (control = layer(control)
# já predefinido pelo keyd) enquanto a tecla é segurada; se for só um
# toque (sem outra tecla no meio), emite Esc.
#
# [shift] é o layer predefinido pra Shift; "capslock = capslock" nele
# sobrepõe SÓ a tecla Caps Lock enquanto Shift está pressionado, emitindo
# o Caps Lock de verdade em vez do overload.
#
# ATENÇÃO: ordem de teclas importa pro "capslock = capslock" acima —
# confirmado com `keyd monitor` nesta máquina (2026-08-28). overload()
# se compromete com o "segurar" (aqui, control) assim que QUALQUER outra
# tecla é pressionada enquanto Caps Lock está segurado — inclusive
# Shift. Ou seja: Shift-depois-Caps Lock emite Caps Lock literal, mas
# Caps Lock-depois-Shift (ordem comum, já que a mão costuma ir no Caps
# Lock primeiro) emite Ctrl+Shift, não Caps Lock — limitação estrutural
# do overload() do keyd, não um erro de config (não existe, nem via
# composite layers, um jeito de reinterpretar retroativamente uma tecla
# que overload() já comprometeu como "segurar").
#
# Gerenciado pelo playbooks/capslock.yml deste repositório — editar aqui
# é seguro, mas mudanças manuais são sobrescritas na próxima execução do
# playbook (ao contrário de configs pessoais como ~/.config/hypr/*.lua,
# este é um arquivo de sistema).
#
# ATENÇÃO: keyd só reconhece '#' como marcador de comentário — NÃO ';'.
# Um ';' não é ignorado silenciosamente: ele quebra o parser (confirmado
# com `keyd check`, "WARNING: Invalid config file (missing [ids]
# section)", mesmo com a seção [ids] presente mais abaixo), e nesse
# estado o keyd ignora TODOS os teclados, inclusive o interno — o Caps
# Lock volta a se comportar como de fábrica, sem nenhum erro visível na
# hora (só nos logs, `journalctl -u keyd`). Foi exatamente o que
# aconteceu nesta máquina: o arquivo original usava ';' (estilo INI) por
# semelhança com outros formatos, sem checar a sintaxe real do keyd
# primeiro.
#
# Sequência de pânico se um config quebrar o teclado: backspace+esc+enter
# (mata o keyd — ver `man keyd`).
[ids]
*

[main]
capslock = overload(control, esc)

[shift]
capslock = capslock
