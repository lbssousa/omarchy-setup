---
# Yubikey GPG public key — imports it, assigns ultimate trust, and
# configures git to sign commits/tags with it. Opt-in: depends on the
# physical token being connected (`just apply gpg-yubikey`; the
# security-key-omarchy overlay in Setup > Security also imports the
# OpenPGP key interactively).
#
# Runs in both phases so `just apply gpg-yubikey` (or opting in alongside
# `*_verify_commit: true` for the plugin checkouts) has the key in place
# before system/plugins.yml; the user phase's run is then a no-op. No task
# here becomes root, so in the system phase it still touches only the
# caller's keyring.
#
# Never uses `become: true` for GPG or git tasks — the keyring and
# ~/.gitconfig are personal user data. gnupg itself ships with Omarchy.
# Usage: just apply gpg-yubikey
- name: Yubikey GPG public key — import, trust, sign in git
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [gpg-yubikey]

  tasks:
    - name: Import the Yubikey's GPG public key and assign it ultimate trust
      ansible.builtin.import_tasks: tasks/yubikey-gpg-key.yml

    - name: "Configure git to sign commits/tags with the Yubikey key ({{ yubikey_gpg_signing_key | default('?') }})"
      when: yubikey_gpg_card_check.rc == 0
      block:
        - name: "git config --global user.signingkey"
          community.general.git_config:
            name: user.signingkey
            value: "{{ yubikey_gpg_signing_key }}"
            scope: global
            state: present

        - name: "git config --global commit.gpgsign true"
          community.general.git_config:
            name: commit.gpgsign
            value: "true"
            scope: global
            state: present

        - name: "git config --global tag.gpgsign true"
          community.general.git_config:
            name: tag.gpgsign
            value: "true"
            scope: global
            state: present

    - name: Note if no Yubikey/OpenPGP card was found (no action taken)
      ansible.builtin.debug:
        msg: >-
          No OpenPGP card found (gpg --card-status failed) — connect
          the Yubikey and rerun. Nothing was imported or configured.
      when: yubikey_gpg_card_check.rc != 0
