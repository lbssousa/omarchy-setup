---
# Bitwarden desktop client, per user (optional — not imported by user.yml,
# where KeePassXC is the default password manager): wires SSH_AUTH_SOCK to
# the Bitwarden SSH agent, deploys its XDG autostart entry and rebinds
# Omarchy's "Passwords" shortcut (SUPER+SHIFT+SLASH) to Bitwarden. The
# Flatpak itself and its biometric unlock polkit action are installed by
# playbooks/system/bitwarden.yml.
#
# The agent is socket-activated: Bitwarden can't take a listening socket
# from systemd, so SSH_AUTH_SOCK points at bitwarden-ssh-agent.socket
# ($XDG_RUNTIME_DIR/bitwarden-ssh-agent.sock) instead of Bitwarden's own
# sandboxed socket (~/.var/app/com.bitwarden.desktop/data/
# .bitwarden-ssh-agent.sock — https://bitwarden.com/help/ssh-agent/,
# "Flatpak Installation"). The first SSH client to connect starts
# bitwarden-ssh-agent-proxy.service, whose ExecStartPre
# (bitwarden_ssh_agent_launcher) launches Bitwarden — or raises its window
# to unlock — when that socket doesn't answer, and waits for it; then
# systemd-socket-proxyd forwards to it, exiting after
# bitwarden_ssh_agent_proxy_idle without traffic, so the next client
# checks again (and relaunches Bitwarden if it was closed in between).
# The .path unit pushes SSH_AUTH_SOCK into the running systemd --user
# manager too, so it takes effect without logging out; environment.d
# covers later logins. gcr-ssh-agent is masked so it doesn't compete for
# the same variable.
#
# Usage: just bitwarden
- name: Bitwarden (user — SSH agent, autostart, keybind)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [bitwarden]

  tasks:
    - name: Bitwarden SSH agent — session-wide SSH_AUTH_SOCK
      block:
        - name: Create ~/.config/environment.d
          ansible.builtin.file:
            path: "{{ target_home }}/.config/environment.d"
            state: directory
            mode: "0755"

        - name: Set a static SSH_AUTH_SOCK for IDEs and session apps
          ansible.builtin.copy:
            src: 20-bitwarden-ssh-agent.conf
            dest: "{{ target_home }}/.config/environment.d/20-bitwarden-ssh-agent.conf"
            mode: "0644"

        - name: Create ~/.config/systemd/user
          ansible.builtin.file:
            path: "{{ target_home }}/.config/systemd/user"
            state: directory
            mode: "0755"

        - name: Install the Bitwarden SSH agent's systemd --user units
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ target_home }}/.config/systemd/user/{{ item }}"
            mode: "0644"
          loop: "{{ bitwarden_ssh_agent_units }}"
          notify: reload systemd --user

        - name: Install the proxy the activation socket starts
          ansible.builtin.template:
            src: bitwarden-ssh-agent-proxy.service.j2
            dest: "{{ target_home }}/.config/systemd/user/bitwarden-ssh-agent-proxy.service"
            mode: "0644"
          notify: reload systemd --user

        - name: Create ~/.local/bin
          ansible.builtin.file:
            path: "{{ bitwarden_ssh_agent_launcher | dirname }}"
            state: directory
            mode: "0755"

        - name: "Deploy the proxy's Bitwarden launcher ({{ bitwarden_ssh_agent_launcher }})"
          ansible.builtin.template:
            src: bitwarden-ssh-agent-launch.sh.j2
            dest: "{{ bitwarden_ssh_agent_launcher }}"
            mode: "0755"

        - name: Mask gcr-ssh-agent (avoids competing for SSH_AUTH_SOCK)
          ansible.builtin.systemd:
            name: "{{ item }}"
            scope: user
            masked: true
          loop: "{{ gcr_ssh_agent_units }}"

        - name: Enable the Bitwarden SSH agent's activation socket and path unit
          ansible.builtin.systemd:
            name: "{{ item }}"
            scope: user
            daemon_reload: true
            enabled: true
            state: started
          loop:
            - bitwarden-ssh-agent.socket
            - bitwarden-ssh-agent.path

    - name: "Autostart Bitwarden at session login ({{ bitwarden_autostart_desktop }})"
      block:
        - name: Create ~/.config/autostart
          ansible.builtin.file:
            path: "{{ target_home }}/.config/autostart"
            state: directory
            mode: "0755"

        - name: Deploy the Bitwarden XDG autostart entry
          ansible.builtin.template:
            src: bitwarden-autostart.desktop.j2
            dest: "{{ bitwarden_autostart_desktop }}"
            mode: "0644"

    - name: "Bitwarden keybinding ({{ bitwarden_hypr_keybind }}, inherited from 1Password's default)"
      block:
        - name: Create ~/.config/hypr
          ansible.builtin.file:
            path: "{{ target_home }}/.config/hypr"
            state: directory
            mode: "0755"

        - name: Create ~/.config/hypr/bindings.lua from the Omarchy default, if missing
          ansible.builtin.copy:
            src: /usr/share/omarchy/default/hypr/bindings.lua
            dest: "{{ target_home }}/.config/hypr/bindings.lua"
            remote_src: true
            force: false
            mode: "0644"

        - name: "Rebind {{ bitwarden_hypr_keybind }} from 1Password to Bitwarden"
          ansible.builtin.blockinfile:
            path: "{{ target_home }}/.config/hypr/bindings.lua"
            marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/user/bitwarden.yml — Bitwarden keybinding)"
            # The Electron app runs under XWayland (checked with
            # `hyprctl clients` against a running instance — xwayland: 1),
            # so its window class is the plain X11 WM_CLASS "bitwarden",
            # not a Wayland xdg_toplevel.app_id derived from the flatpak
            # id.
            block: |
              hl.unbind("{{ bitwarden_hypr_keybind }}")
              o.bind("{{ bitwarden_hypr_keybind }}", "Bitwarden", { launch = "flatpak run {{ bitwarden_flatpak_id }}", focus = "^bitwarden$" })
          notify: reload Hyprland

  handlers:
    - name: reload systemd --user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      listen: reload systemd --user

    - name: reload Hyprland
      # Only has an effect inside a real Hyprland session; the bind
      # still applies on next login either way.
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      listen: reload Hyprland
