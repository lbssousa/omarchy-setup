---
# Index of automations for a freshly installed Omarchy desktop. Run a
# single one with --tags <tag>, or skip one with --skip-tags <tag>.
#
# Usage: ansible-playbook site.yml --ask-become-pass
- name: sudo passwd_timeout
  ansible.builtin.import_playbook: playbooks/sudo.yml
  tags: [sudo]

- name: polkitd ExpirationSeconds
  ansible.builtin.import_playbook: playbooks/polkit.yml
  tags: [polkit]

- name: Firefox
  ansible.builtin.import_playbook: playbooks/firefox.yml
  tags: [firefox]

- name: Zed editor
  ansible.builtin.import_playbook: playbooks/zed.yml
  tags: [zed]

- name: gregorio-lsp
  ansible.builtin.import_playbook: playbooks/gregorio-lsp.yml
  tags: [gregorio-lsp]

- name: PDF viewer (Zathura default, Papers optional, Evince kept for sushi)
  ansible.builtin.import_playbook: playbooks/pdf-viewer.yml
  tags: [pdf-viewer]

- name: LazyVim plugin preferences (LaTeX extra + gregorio.nvim)
  ansible.builtin.import_playbook: playbooks/lazyvim.yml
  tags: [lazyvim]

- name: TeX Live (AUR texlive-installer, scheme-minimal + AISCGre-BR packages)
  ansible.builtin.import_playbook: playbooks/texlive.yml
  tags: [texlive]

- name: Gregorio (GABC engraver + GregorioTeX, from lbssousa/gregorio)
  ansible.builtin.import_playbook: playbooks/gregorio.yml
  tags: [gregorio]

- name: pt-BR localization
  ansible.builtin.import_playbook: playbooks/ptbr.yml
  tags: [ptbr]

- name: Bitwarden
  ansible.builtin.import_playbook: playbooks/bitwarden.yml
  tags: [bitwarden]

- name: Podman (rootless)
  ansible.builtin.import_playbook: playbooks/podman.yml
  tags: [podman]

- name: Distrobox
  ansible.builtin.import_playbook: playbooks/distrobox.yml
  tags: [distrobox]

- name: libfprint (goodix538d)
  ansible.builtin.import_playbook: playbooks/libfprint.yml
  tags: [libfprint]

- name: EPSON L4160 printer (driverless)
  ansible.builtin.import_playbook: playbooks/printer.yml
  tags: [printer]

- name: Hyprland scrolling-layout column resize
  ansible.builtin.import_playbook: playbooks/hypr-scrolling-resize.yml
  tags: [hypr-scrolling-resize]

- name: Shell bar + terminal text size
  ansible.builtin.import_playbook: playbooks/text-size.yml
  tags: [text-size]

- name: Night light synced to sunrise/sunset
  ansible.builtin.import_playbook: playbooks/nightlight-solar.yml
  tags: [nightlight-solar]

- name: Caps Lock via keyd
  ansible.builtin.import_playbook: playbooks/capslock.yml
  tags: [capslock]
