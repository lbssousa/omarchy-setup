---
# System phase: everything that needs root — packages, /etc, PAM, udev,
# system services, signed plugin builds. Run by the machine's owner (wheel),
# under run-empowered.sh, after each change.
#
# Which plays run is the feature selection (features.yml + the choices from
# `just configure`): scripts/run-phase.sh passes it and the matching --tags.
# Each play is tagged with its feature id (user.yml has the other half under
# the same id); the app plays (tag apps) and the always-tagged ones run
# every time.
#
# Usage: just system

- name: "Preflight: the selection came through scripts/run-phase.sh"
  ansible.builtin.import_playbook: playbooks/system/preflight.yml

- name: Fish, the owner's login shell (always)
  ansible.builtin.import_playbook: playbooks/system/fish.yml

- name: polkitd's authentication cache
  ansible.builtin.import_playbook: playbooks/system/polkit.yml

- name: "sudo/polkit PAM order: fingerprint, FIDO2/U2F, password"
  ansible.builtin.import_playbook: playbooks/system/pam-auth-order.yml

- name: Flatpak + Flathub + Bazaar, and the installation's languages
  ansible.builtin.import_playbook: playbooks/system/flatpak.yml

- name: "Apps: every option installed or removed as chosen"
  ansible.builtin.import_playbook: playbooks/system/apps/packages.yml

- name: "Apps: web browsers (Firefox defaults, Chromium/Chrome/Brave policies)"
  ansible.builtin.import_playbook: playbooks/system/apps/browser.yml

- name: "Apps: password managers (Flatpak overrides, polkit action)"
  ansible.builtin.import_playbook: playbooks/system/apps/password.yml

- name: "Apps: PDF viewers (Zathura sandbox paths)"
  ansible.builtin.import_playbook: playbooks/system/apps/pdf.yml

- name: "Apps: graphics (svg2tikz with the native Inkscape)"
  ansible.builtin.import_playbook: playbooks/system/apps/graphics.yml

- name: "Flea file dialogs: qt5ct/qt6ct"
  ansible.builtin.import_playbook: playbooks/system/file-chooser.yml

- name: "gregorio-lsp: clang"
  ansible.builtin.import_playbook: playbooks/system/gregorio-lsp.yml

- name: "Portuguese (Brazil): locale, folders, browsers, man pages, OCR (after the apps: the Firefox step looks for it)"
  ansible.builtin.import_playbook: playbooks/system/ptbr.yml

- name: "Omafox: the add-on in Firefox's policies (after the apps: it looks for the builds)"
  ansible.builtin.import_playbook: playbooks/system/omafox.yml

- name: Podman, Distrobox
  ansible.builtin.import_playbook: playbooks/system/containers.yml

- name: Nix, direnv
  ansible.builtin.import_playbook: playbooks/system/nix.yml

- name: Goodix 538d fingerprint reader
  ansible.builtin.import_playbook: playbooks/system/libfprint.yml

- name: EPSON L4160 queue
  ansible.builtin.import_playbook: playbooks/system/printer.yml

- name: Login screen scale
  ansible.builtin.import_playbook: playbooks/system/desktop.yml

- name: Caps Lock via keyd
  ansible.builtin.import_playbook: playbooks/system/capslock.yml

- name: openssh rebuilt with askpass touch notifications
  ansible.builtin.import_playbook: playbooks/system/openssh-askpass.yml

- name: "Yubikey GPG key, before the plugins: their signed release tags need it in your keyring (opt-in)"
  ansible.builtin.import_playbook: playbooks/user/yubikey.yml

- name: Omarchy shell plugins, omapin, omaskpass, polkit-omarchy, fingerprint and security key overlays
  ansible.builtin.import_playbook: playbooks/system/plugins.yml

- name: Homebrew (opt-in)
  ansible.builtin.import_playbook: playbooks/system/homebrew.yml

- name: Google Drive via rclone (opt-in)
  ansible.builtin.import_playbook: playbooks/system/rclone-gdrive.yml

- name: BGRT boot theme (opt-in)
  ansible.builtin.import_playbook: playbooks/system/bgrt-theme.yml

- name: Secure Boot (opt-in)
  ansible.builtin.import_playbook: playbooks/system/secureboot.yml
