---
# Makes Firefox (playbooks/{system,user}/firefox.yml) the default browser with
# Omarchy's own tool, `omarchy-default-browser firefox` — the same
# action as Setup > Defaults > Browser in the Omarchy menu. It runs
# `xdg-settings set default-web-browser firefox.desktop` the way
# Omarchy expects (BROWSER unset and XDG_CURRENT_DESKTOP cleared, so the
# browser lands in mimeapps.list rather than the desktop-specific list,
# which keeps routing links through omarchy-browser.desktop on 4.5).
#
# Only when it isn't already the default: `omarchy-default-browser` with
# no argument prints the current one by name, so a browser picked later in
# the menu isn't re-pinned on every run. The script ends by sending a
# desktop notification, which fails outside the graphical session (this
# play is often run over SSH), so the result is checked by reading the
# default back rather than by its exit code.
#
# Nothing else is needed for the browser keybinds: playbooks/system/firefox.yml
# links /usr/local/bin/firefox to the Flatpak's exported launcher and
# playbooks/user/firefox.yml installs a hidden firefox.desktop shim whose
# Exec= is /usr/local/bin/firefox, which omarchy-launch-browser reads as a
# single token. Web apps use Firefox Taskbar Tabs instead of
# omarchy-launch-webapp (see playbooks/user/firefox-taskbar-apps.yml).
- name: Default browser (Firefox)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read the current default browser
      ansible.builtin.command: omarchy-default-browser
      register: default_browser_current
      changed_when: false
      failed_when: false

    - name: "Make {{ default_browser }} the default browser"
      ansible.builtin.command: omarchy-default-browser {{ default_browser }}
      when: default_browser_current.stdout | trim != default_browser
      # See the header: the trailing notification can fail on its own.
      failed_when: false

    - name: Read the default browser back
      ansible.builtin.command: omarchy-default-browser
      register: default_browser_result
      changed_when: false
      failed_when: default_browser_result.stdout | trim != default_browser
      when: default_browser_current.stdout | trim != default_browser
