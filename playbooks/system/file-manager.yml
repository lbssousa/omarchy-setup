---
# Installs Flea (fast, keyboard-first file manager for Omarchy) and makes
# it the default file manager, instead of Nautilus.
#
# Flea comes from Omarchy's own package repo (`pacman -Si flea`), with an
# AUR build of the same name behind it; pacman picks the repo one.
# Nautilus stays installed (sushi, the previewer, depends on it).
#
# Making it the default is left to Flea's own `flea --default`, which
# does all of this in the user's home, undone together by
# `flea --default off`:
#   - inode/directory -> Flea in ~/.config/mimeapps.list (not
#     /usr/share/applications/mimeapps.list, which omarchy-settings owns
#     and a package update would revert);
#   - a user D-Bus service for org.freedesktop.FileManager1, so "Show in
#     folder" from browsers and other apps opens Flea;
#   - a block in ~/.config/hypr/bindings.lua rebinding Omarchy's "File
#     manager" keys, SUPER+SHIFT+F and SUPER+ALT+SHIFT+F (cwd), from
#     Nautilus to Flea;
#   - Flea's picker as the FileChooser portal backend
#     (~/.config/xdg-desktop-portal/hyprland-portals.conf, `flea;gtk`, the
#     same line playbooks/system/file-chooser.yml writes) and a window rule in
#     bindings.lua that floats it.
# It is idempotent: every part it already owns is reported as "already",
# which is how this play tells whether anything changed.
#
# Usage: just file-manager
- name: File manager (Flea default)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Install Flea
      community.general.pacman:
        name: "{{ file_manager_package }}"
        state: present
      become: true
