---
# Caps Lock remapped at the evdev level via keyd: tap = Esc, hold = Ctrl,
# Shift+Caps Lock = literal Caps Lock. Works the same in TTY and
# Wayland, unlike setxkbmap/GNOME "Input Sources".
#
# Omarchy defaults to `compose:caps` (Caps Lock doubles as the Compose
# key), which silently blocks any keyd remap from producing a real Caps
# Lock toggle — the XKB layer intercepts the keycode first, regardless of
# which device sent it. This playbook moves Compose to another key
# first. It must be a non-hardware-modifier key: Ctrl/Alt/Win stay wired
# into XKB's modifier_map by keycode regardless of their assigned
# symbol, so they'd keep acting as both the modifier and Compose at
# once. The Menu key works cleanly and is already the natural Compose
# key on keyboards that have one.
#
# See playbooks/files/keyd-default.conf for the full remap config,
# including the caveat that Shift+CapsLock only works with Shift
# pressed before Caps Lock.
#
# Panic sequence if a bad config locks up the keyboard:
# backspace+esc+enter (kills keyd).
- name: Caps Lock via keyd (tap=Esc / hold=Ctrl / Shift+CapsLock=CapsLock)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: "Move Compose off Caps Lock, onto {{ capslock_compose_key }}"
      block:
        - name: Create ~/.config/hypr
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/hypr"
            state: directory
            mode: "0755"

        - name: Create ~/.config/hypr/input.lua from the Omarchy template, if missing
          # The right source is /etc/skel, not
          # /usr/share/omarchy/default/hypr/input.lua (a different
          # internal file with the same basename).
          ansible.builtin.copy:
            src: /etc/skel/.config/hypr/input.lua
            dest: "{{ ansible_facts.env.HOME }}/.config/hypr/input.lua"
            remote_src: true
            force: false
            mode: "0644"

        - name: "Set kb_options = compose:{{ capslock_compose_key }}"
          ansible.builtin.blockinfile:
            path: "{{ ansible_facts.env.HOME }}/.config/hypr/input.lua"
            marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/capslock.yml — Compose on {{ capslock_compose_key }})"
            block: |
              hl.config({
                input = {
                  kb_options = "compose:{{ capslock_compose_key }}",
                },
              })
          register: capslock_compose_key_binding
          notify: reload Hyprland

    - name: Caps Lock via keyd
      become: true
      block:
        - name: Install keyd via pacman
          community.general.pacman:
            name: keyd
            state: present

        - name: Ensure /etc/keyd exists
          ansible.builtin.file:
            path: "{{ keyd_config_dest | dirname }}"
            state: directory
            mode: "0755"

        - name: Install the Caps Lock config
          ansible.builtin.copy:
            src: keyd-default.conf
            dest: "{{ keyd_config_dest }}"
            mode: "0644"
          notify: restart keyd

        - name: Enable and start keyd
          ansible.builtin.systemd:
            name: keyd
            enabled: true
            state: started

  handlers:
    - name: restart keyd
      ansible.builtin.systemd:
        name: keyd
        state: restarted
      become: true
      listen: restart keyd

    - name: reload Hyprland
      # Only has an effect inside a real Hyprland session; kb_options
      # still applies on next login either way.
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      listen: reload Hyprland
