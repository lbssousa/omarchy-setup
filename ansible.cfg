[defaults]
inventory = inventory.ini
host_key_checking = False
stdout_callback = default
display_skipped_hosts = False

[privilege_escalation]
# run0 (systemd's sudo replacement) is the become method. It authenticates
# through polkit, and Omarchy's shell registers a graphical polkit agent, so a
# bare run0 pops up a dialog per privileged task, and polkit doesn't retain
# the authorization between separate run0 processes. Playbooks therefore run
# under `run0 --empower` (see run-empowered.sh): one authentication up front,
# then this run0's own calls pass without prompting. No password is handed to
# run0, so --ask-become-pass is neither needed nor used, and no polkit rule
# granting passwordless root is installed.
become_method = community.general.run0
