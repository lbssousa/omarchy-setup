# Caps Lock remapped at the evdev level: tap = Esc, hold = Ctrl,
# Shift+Caps Lock = literal Caps Lock (toggles the LED normally). Works
# the same in TTY and Wayland, unlike setxkbmap/GNOME "Input Sources".
#
# PREREQUISITE: Omarchy's Compose key must not be on Caps Lock
# (playbooks/capslock.yml moves it to Menu first) — while Compose is on
# Caps Lock, nothing here can produce a real Caps Lock toggle.
#
# overload(control, esc): holding the key activates the "control" layer;
# a lone tap (no other key in between) emits Esc.
#
# [shift]'s "capslock = capslock" overrides Caps Lock while Shift is
# held, emitting a literal Caps Lock instead of the overload.
#
# Key order matters for that override: overload() commits to "hold"
# (control) as soon as any other key is pressed while Caps Lock is down —
# including Shift. So Shift-then-CapsLock emits a literal Caps Lock, but
# CapsLock-then-Shift emits Ctrl+Shift instead. This is a structural
# limitation of keyd's overload(), not a config bug.
#
# Managed by playbooks/capslock.yml — manual edits are overwritten on
# the next run.
#
# NOTE: keyd only recognizes '#' as a comment marker, not ';'. A stray
# ';' breaks the parser silently (keyd then ignores every keyboard,
# including the built-in one, with no visible error outside
# `journalctl -u keyd`).
#
# Panic sequence if a bad config locks up the keyboard:
# backspace+esc+enter (kills keyd).
[ids]
*

[main]
capslock = overload(control, esc)

[shift]
capslock = capslock
