---
# Point a stock Omarchy menu entry at another action, in the user's
# ~/.config/omarchy/extensions/omarchy-menu.jsonc.
#
# Vars: menu_override_id (e.g. setup.security.fingerprint),
#       menu_override_action (the shell command to run),
#       menu_override_label_catalog_dir and menu_override_label_key
#       (optional: take the label from the plugin's own i18n catalog,
#       <dir>/<language>.json then <dir>/en.json, for entries the Omarchy
#       catalog leaves untranslated, such as "Fido2").
#
# The menu fills in every field a user entry leaves out (label = the id,
# no icon, no `when`) before merging it over the stock one, so an entry
# with only an action loses the rest. The entry written here is therefore
# the whole stock one, with the action replaced and the label, title and
# description from the catalog of the user's language
# (~/.config/omarchy/language, English when missing). The menu translates
# only stock entries, so this one keeps that language until the next run.
#
# The menu hot-reloads the file. Its parser drops whole-line comments and
# tolerates trailing commas, so the entry is a line of its own, ending in a
# comma, just before the closing brace.
- name: Create ~/.config/omarchy/extensions
  ansible.builtin.file:
    path: "{{ target_home }}/.config/omarchy/extensions"
    state: directory
    mode: "0755"

- name: Create omarchy-menu.jsonc from the Omarchy default, if missing
  ansible.builtin.copy:
    src: /usr/share/omarchy/config/omarchy/extensions/omarchy-menu.jsonc
    dest: "{{ target_home }}/.config/omarchy/extensions/omarchy-menu.jsonc"
    remote_src: true
    force: false
    mode: "0644"

# One entry per line in the stock menu.
- name: "Read the stock {{ menu_override_id }} entry"
  ansible.builtin.slurp:
    src: /usr/share/omarchy/default/omarchy/omarchy-menu.jsonc
  register: menu_override_stock_raw

- name: Read the user's language
  ansible.builtin.slurp:
    src: "{{ target_home }}/.config/omarchy/language"
  register: menu_override_language_raw
  failed_when: false

- name: Work out the menu's language
  ansible.builtin.set_fact:
    menu_override_language: >-
      {{ (menu_override_language_raw.content | default('') | b64decode | trim) or 'en' }}

- name: Read that language's menu catalog
  ansible.builtin.slurp:
    src: "/usr/share/omarchy/default/i18n/{{ menu_override_language }}/menu.json"
  register: menu_override_catalog_raw
  failed_when: false

- name: Read the plugin's catalogs for the label
  ansible.builtin.slurp:
    src: "{{ menu_override_label_catalog_dir }}/{{ item }}.json"
  loop: "{{ [menu_override_language, 'en'] | unique }}"
  register: menu_override_label_catalogs
  failed_when: false
  when: menu_override_label_key is defined

# Facts outlive the include: start from none for every entry.
- name: Forget the labels found for another entry
  ansible.builtin.set_fact:
    menu_override_plugin_labels: []

# Indexed, not selectattr/map: the key has a dot ("securityKey.title"),
# which those filters would read as a nested path.
- name: Pick the plugin's labels, menu language first
  ansible.builtin.set_fact:
    menu_override_plugin_labels: "{{ menu_override_plugin_labels + [catalog[menu_override_label_key]] }}"
  vars:
    catalog: "{{ item.content | b64decode | from_json }}"
  loop: "{{ menu_override_label_catalogs.results | default([]) | selectattr('content', 'defined') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - menu_override_label_key is defined
    - menu_override_label_key in catalog

- name: "Build the {{ menu_override_id }} entry"
  vars:
    stock_line: >-
      {{ menu_override_stock_raw.content | b64decode
         | regex_search('^\s*"' ~ (menu_override_id | regex_escape) ~ '"\s*:\s*(\{.*\})\s*,?\s*$',
                        '\1', multiline=true) | first }}
    stock: "{{ stock_line | from_json }}"
    catalog: >-
      {{ (menu_override_catalog_raw.content | default('e30=') | b64decode | from_json)[menu_override_id]
         | default({}) }}
    # The plugin's label in the menu's language, else in English, else none.
    plugin_labels: "{{ menu_override_plugin_labels }}"
    english_plugin_label: >-
      {{ plugin_labels | last if plugin_labels | length > 0 else stock.label }}
    translated: >-
      {{ catalog | dict2items | selectattr('key', 'in', ['label', 'title', 'description']) | items2dict
         | combine({'label': plugin_labels | first} if plugin_labels | length > 0 else {}) }}
    label: "{{ translated.label | default(stock.label) }}"
    # As the menu does for stock entries: the English labels stay searchable
    # (the stock one, "Fido2", and the plugin's).
    search: "{{ [stock.label, english_plugin_label] | unique | reject('equalto', label) | list }}"
    search_terms: "{{ {'searchTerms': search} if search | length > 0 else {} }}"
  ansible.builtin.set_fact:
    menu_override_entry: >-
      {{ stock | combine(translated, search_terms, {'action': menu_override_action}) }}

- name: "Point the {{ menu_override_id }} menu entry at {{ menu_override_action }}"
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/omarchy/extensions/omarchy-menu.jsonc"
    regexp: '^\s*"{{ menu_override_id | regex_escape }}"\s*:'
    line: '  "{{ menu_override_id }}": {{ menu_override_entry | to_json(ensure_ascii=false) }},'
    insertbefore: '^\}\s*$'
