---
# One web app (pwa: true) as a PWA of a Chromium-family browser
# (playbooks/user/apps/webapps.yml): `webapp`, with `pwa_engine`
# (webapps_pwa_engines entry), `pwa_containers` (the browser's containers,
# Brave only) and `pwa_known` (the state file: label -> engine, app id, icon)
# in scope. The browser force-installed it (system/apps/browser.yml's policy)
# and wrote its own shortcut, named after the app id it assigned:
# <shortcut_prefix>-<app id>-<profile>.desktop. That id isn't predictable, so
# it is read back from the launcher an earlier run wrote, from the state file
# (that launcher may be gone: omarchy-refresh-applications copies Omarchy's
# own over it on upgrades), or else from the browser's shortcut. Omarchy's
# launcher for the site is removed and the PWA's launcher, under the web
# app's name, opens it in its container. Records the app in pwa_app_ids
# (keybinds) and pwa_known_new (the state file).
- name: "[{{ webapp.label }}] Expect its container to exist"
  ansible.builtin.fail:
    msg: >-
      No container named "{{ webapp.container }}" in the browser's
      Preferences. Create it (hamburger menu → Containers → New — there is
      no command line for it), then run this again.
  when:
    - pwa_engine.containers | bool
    - webapp.container is defined
    - webapp.container not in (pwa_containers | map(attribute='name') | list)

- name: "[{{ webapp.label }}] Read the launcher under its name, if any"
  ansible.builtin.command:
    argv: [grep, -m1, "^Exec=", "{{ webapps_desktop_dir }}/{{ webapp.label }}.desktop"]
  register: pwa_existing_exec
  changed_when: false
  failed_when: false

- name: "[{{ webapp.label }}] Reuse the app id an earlier run found"
  ansible.builtin.set_fact:
    pwa_app_id: >-
      {{ pwa_existing_exec.stdout | regex_replace('.*--app-id=([a-p]+).*', '\1')
         if (pwa_engine.binary in pwa_existing_exec.stdout and '--app-id=' in pwa_existing_exec.stdout)
         else pwa_known[webapp.label].app_id }}
    pwa_shortcut_icon: "{{ pwa_known[webapp.label].icon | default('') if webapp.label in pwa_known else '' }}"
  when: >-
    (pwa_engine.binary in pwa_existing_exec.stdout and '--app-id=' in pwa_existing_exec.stdout)
    or (pwa_known[webapp.label] | default({})).get('engine') == webapps_engine

- name: "[{{ webapp.label }}] Find the app id from the browser's own shortcut"
  when: pwa_app_id | default('') | length == 0
  block:
    - name: "[{{ webapp.label }}] Wait for the browser to install {{ webapp.url }}"
      ansible.builtin.shell: |
        set -o pipefail
        grep -il "^Name=\({{ webapp.manifest_hint | default(webapp.desktop_name | default(webapp.label)) }}\|{{ webapp.url }}\)$" \
          {{ webapps_desktop_dir | quote }}/{{ pwa_engine.shortcut_prefix }}-*-{{ webapps_pwa_profile_directory }}.desktop 2>/dev/null | head -1
      args:
        executable: /bin/bash
      register: pwa_shortcut
      changed_when: false
      until: pwa_shortcut.stdout | length > 0
      retries: 30
      delay: 2

    - name: "[{{ webapp.label }}] Read the app id and icon off it"
      ansible.builtin.set_fact:
        pwa_app_id: >-
          {{ pwa_shortcut.stdout | basename
             | regex_replace('^' ~ pwa_engine.shortcut_prefix ~ '-(.*)-' ~ webapps_pwa_profile_directory ~ '\.desktop$', '\1') }}
        pwa_shortcut_icon: "{{ lookup('ansible.builtin.ini', 'Icon', section='Desktop Entry', file=pwa_shortcut.stdout) }}"
  rescue:
    - name: "[{{ webapp.label }}] The browser never installed it"
      ansible.builtin.debug:
        msg: >-
          SKIPPED {{ webapp.label }}: no PWA shortcut for {{ webapp.url }}
          after 60s (is the browser open, and does its policy list the
          url?). Omarchy's launcher and keybind stay.
    - name: "[{{ webapp.label }}] Leave it out"
      ansible.builtin.set_fact:
        pwa_app_id: ""

- name: "[{{ webapp.label }}] Replace Omarchy's launcher with the PWA"
  when: pwa_app_id | default('') | length > 0
  vars:
    pwa_exec: >-
      {{ pwa_engine.binary }} --profile-directory={{ webapps_pwa_profile_directory }} --app-id={{ pwa_app_id }}{{
      (' --container=' ~ webapp.container) if (webapp.container is defined and pwa_engine.containers | bool) else '' }}
    pwa_omarchy_names: "{{ [webapp.omarchy_webapp_name | default(webapp.label), webapp.label] | unique }}"
  block:
    # Omarchy's launcher (Exec=omarchy-launch-webapp or a handler), under its
    # own name and under the web app's: it goes for good. It comes back from
    # omarchy_applications_dir when the engine changes or pwa is turned off
    # (tasks/webapps-restore-omarchy.yml).
    - name: "[{{ webapp.label }}] Look for Omarchy's launcher"
      ansible.builtin.command:
        argv: [grep, -lE, "^Exec=.*(omarchy-launch-webapp|omarchy-webapp-handler)", "{{ webapps_desktop_dir }}/{{ item }}.desktop"]
      loop: "{{ pwa_omarchy_names }}"
      register: pwa_omarchy_launchers
      changed_when: false
      failed_when: false

    - name: "[{{ webapp.label }}] Remove it"
      ansible.builtin.file:
        path: "{{ item.stdout }}"
        state: absent
      loop: "{{ pwa_omarchy_launchers.results | selectattr('rc', 'eq', 0) | list }}"
      loop_control:
        label: "{{ item.item }}.desktop"
      notify: refresh the applications database

    # Without --container= it would sit beside the launcher below as a
    # second, container-less way into the same app.
    - name: "[{{ webapp.label }}] Remove the browser's own shortcut"
      ansible.builtin.file:
        path: "{{ webapps_desktop_dir }}/{{ pwa_engine.shortcut_prefix }}-{{ pwa_app_id }}-{{ webapps_pwa_profile_directory }}.desktop"
        state: absent

    - name: "[{{ webapp.label }}] Write the PWA's launcher (omarchy-webapp-install)"
      ansible.builtin.command:
        argv:
          - omarchy-webapp-install
          - "{{ webapp.label }}"
          - "{{ webapp.url }}"
          - "{{ webapp.icon | default(pwa_shortcut_icon | default('', true) or pwa_engine.shortcut_prefix) }}"
          - "{{ pwa_exec }}"
      when: >-
        pwa_omarchy_launchers.results | selectattr('rc', 'eq', 0) | list | length > 0
        or ('Exec=' ~ pwa_exec) != pwa_existing_exec.stdout
      changed_when: true
      notify: refresh the applications database

    # The class of a PWA window under Wayland, which the dock and the
    # keybind's focus match by (omarchy-webapp-install derives it from the
    # url, the class of a plain omarchy-launch-webapp window).
    - name: "[{{ webapp.label }}] Point StartupWMClass at the PWA's window"
      ansible.builtin.lineinfile:
        path: "{{ webapps_desktop_dir }}/{{ webapp.label }}.desktop"
        regexp: "^StartupWMClass="
        line: "StartupWMClass={{ pwa_engine.shortcut_prefix }}-{{ pwa_app_id }}-{{ webapps_pwa_profile_directory }}"
        insertafter: "^Icon="

    - name: "[{{ webapp.label }}] Remember its app id"
      ansible.builtin.set_fact:
        pwa_app_ids: "{{ pwa_app_ids | default({}) | combine({webapp.label: pwa_app_id}) }}"
        pwa_known_new: >-
          {{ pwa_known_new | default({}) | combine({webapp.label: {
               'engine': webapps_engine, 'app_id': pwa_app_id,
               'icon': pwa_shortcut_icon | default('', true) or (pwa_known[webapp.label].icon | default('') if webapp.label in pwa_known else '')}}) }}

- name: "[{{ webapp.label }}] Forget this app's id before the next one"
  ansible.builtin.set_fact:
    pwa_app_id: ""
    pwa_shortcut_icon: ""
