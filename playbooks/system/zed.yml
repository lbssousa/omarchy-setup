---
# Zed editor, system phase: the "zed" and "omazed" packages. The theme
# (omazed setup), font sizes and use_podman are per user, in user/zed.yml,
# which explains them.
#
# Usage: just zed
- name: Zed editor (Omarchy theme + font size + buffer font)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Install Zed and omazed
      community.general.pacman:
        name:
          - "{{ zed_package }}"
          - "{{ zed_omazed_package }}"
        state: present
      become: true
