; Caps Lock remapeado a nível evdev via keyd: tap = Esc, hold = Ctrl,
; Shift+Caps Lock = Caps Lock literal (liga/desliga o LED normalmente).
; Funciona igual em TTY e Wayland (ao contrário de setxkbmap/GNOME
; "Origens de entrada", que só cobrem X11/compositor).
;
; overload(control, esc): ativa o layer "control" (control = layer(control)
; já predefinido pelo keyd) enquanto a tecla é segurada; se for só um
; toque (sem outra tecla no meio), emite Esc.
;
; [shift] é o layer predefinido pra Shift; "capslock = capslock" nele
; sobrepõe SÓ a tecla Caps Lock enquanto Shift está pressionado, emitindo
; o Caps Lock de verdade em vez do overload — mesmo mecanismo documentado
; no exemplo oficial do keyd (`keyd.scdoc`, "Tapping both shift keys will
; activate capslock").
;
; Gerenciado pelo playbooks/capslock.yml deste repositório — editar aqui
; é seguro, mas mudanças manuais são sobrescritas na próxima execução do
; playbook (ao contrário de configs pessoais como ~/.config/hypr/*.lua,
; este é um arquivo de sistema).
;
; Sequência de pânico se um config quebrar o teclado: backspace+esc+enter
; (mata o keyd — ver `man keyd`).
[ids]
*

[main]
capslock = overload(control, esc)

[shift]
capslock = capslock
