---
# Password managers, per user (apps: password). Only the default one gets
# SUPER+SHIFT+SLASH (Omarchy's "Passwords" key), autostart at login and the
# SSH agent; the others are just installed. Switching the default moves all
# three over.
#
#   Bitwarden (default)  SSH_AUTH_SOCK points at its own agent's socket:
#                        statically through environment.d (read at login),
#                        and through bitwarden-ssh-agent.path, which pushes
#                        it into the running systemd --user manager once
#                        Bitwarden creates the socket. gcr-ssh-agent is
#                        masked so it doesn't compete for the variable.
#   KeePassXC (default)  only an agent client, so SSH_AUTH_SOCK is Omarchy's
#                        own agent (what omarchy-setup-security-ssh-agent
#                        sets up: gcr-ssh-agent).
#   Either (default)     its autostart waits for the tray and the portal
#                        (password-autostart-wait), which both apps look
#                        for only once, at startup.
#   Bitwarden (Flatpak)  natively on Wayland (clipboard-portal), the extra
#                        Electron arguments in bitwarden_flatpak_wayland_args
#                        on every launch: the keybind and autostart, and a
#                        user-level copy of its exported desktop entry (same
#                        id, so it shadows the export for the app launcher).
#                        The copy goes when the Flatpak or the feature does.
#   Bitwarden (any)      with the Firefox Flatpak, the native messaging
#                        host directory Bitwarden fills but won't create,
#                        and a link to its manifest in Firefox's XDG one
#                        (bitwarden_firefox_flatpak_nmh_dir). A Bitwarden
#                        already running when the directory is created
#                        only fills it on its next start.
#   KeePassXC (any)      KeePassXC-Browser's native messaging host for each
#                        installed browser, through a relay to KeePassXC's
#                        browser socket (Flatpak or native); the Firefox
#                        Flatpak gets access to that socket. The browser
#                        extension itself is installed and connected by hand.
#
# Bitwarden's window tiles (Omarchy floats it) unless bitwarden_floating.
- name: Apps — password managers (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [apps]

  vars:
    password_default: "{{ apps.password.default }}"
    bitwarden_default: "{{ password_default in bitwarden_variants }}"
    bitwarden_variant: "{{ bitwarden_variants[password_default] | default({}) }}"
    bitwarden_ssh_agent_socket: "{{ bitwarden_variant.ssh_agent_socket | default('') }}"
    bitwarden_flatpak_wayland: >-
      {{ 'bitwarden-flatpak' in apps.password.installed
         and features['clipboard-portal'] | default(true) | bool }}
    bitwarden_command: >-
      {{ (bitwarden_variant.command | default(''))
         ~ ((' ' ~ bitwarden_flatpak_wayland_args | join(' '))
            if password_default == 'bitwarden-flatpak' and bitwarden_flatpak_wayland | bool else '') }}
    bitwarden_firefox_flatpak: >-
      {{ apps.password.installed | intersect(['bitwarden-flatpak', 'bitwarden']) | length > 0
         and 'firefox-flatpak' in apps.browser.installed }}
    keepassxc_on: "{{ apps.password.installed | intersect(['keepassxc-flatpak', 'keepassxc']) | length > 0 }}"
    keepassxc_default: "{{ password_default in keepassxc_variants }}"
    keepassxc_variant: "{{ keepassxc_variants[password_default] | default({}) }}"
    keepassxc_command: "{{ keepassxc_variant.command | default('') }}"
    gcr_ssh_agent_env_file: "{{ target_home }}/.config/environment.d/90-gcr-ssh-agent.conf"
    password_wait_script: "{{ target_home }}/.local/bin/password-autostart-wait"
    bitwarden_autostart_dropin_dir: >-
      {{ target_home }}/.config/systemd/user/app-{{ (bitwarden_autostart_desktop | basename | splitext)[0] }}@autostart.service.d
    keepassxc_autostart_dropin_dir: "{{ target_home }}/.config/systemd/user/app-{{ keepassxc_flatpak_id }}@autostart.service.d"
    password_command: >-
      {{ bitwarden_command if bitwarden_default | bool
         else keepassxc_command }}

  tasks:
    - name: Create the directories the agent and autostart files go in
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ target_home }}/.config/environment.d"
        - "{{ target_home }}/.config/systemd/user"
        - "{{ target_home }}/.config/autostart"

    # An earlier setup linked the compositor's socket into the runtime dir
    # for the Bitwarden Flatpak (system/apps/password.yml removes the unit).
    - name: Stop the Wayland socket link unit in this session
      ansible.builtin.systemd:
        name: "{{ bitwarden_legacy_wayland_link_unit }}"
        scope: user
        state: stopped
      failed_when: false

    - name: Remove the Wayland socket link
      ansible.builtin.file:
        path: "/run/user/{{ target_uid }}/bitwarden-wayland"
        state: absent

    - name: SSH agent — Bitwarden's
      when: bitwarden_default | bool
      block:
        - name: Drop Omarchy's own agent (gcr-ssh-agent) from the session
          ansible.builtin.file:
            path: "{{ gcr_ssh_agent_env_file }}"
            state: absent

        - name: Mask gcr-ssh-agent (avoids competing for SSH_AUTH_SOCK)
          ansible.builtin.systemd:
            name: "{{ item }}"
            scope: user
            masked: true
          loop: "{{ gcr_ssh_agent_units }}"

        - name: Set a static SSH_AUTH_SOCK for IDEs and session apps
          ansible.builtin.template:
            src: 20-bitwarden-ssh-agent.conf.j2
            dest: "{{ target_home }}/.config/environment.d/20-bitwarden-ssh-agent.conf"
            mode: "0644"

        - name: Install the units that export SSH_AUTH_SOCK once Bitwarden's socket exists
          ansible.builtin.template:
            src: "{{ item }}.j2"
            dest: "{{ target_home }}/.config/systemd/user/{{ item }}"
            mode: "0644"
          loop: "{{ bitwarden_ssh_agent_units }}"
          notify:
            - reload systemd --user
            - re-export SSH_AUTH_SOCK

        - name: Enable the Bitwarden SSH agent's path unit
          ansible.builtin.systemd:
            name: bitwarden-ssh-agent.path
            scope: user
            daemon_reload: true
            enabled: true
            state: started

    - name: SSH agent — not Bitwarden's
      when: not bitwarden_default | bool
      block:
        - name: Stop and disable the Bitwarden SSH agent's path unit
          ansible.builtin.systemd:
            name: bitwarden-ssh-agent.path
            scope: user
            enabled: false
            state: stopped
          failed_when: false

        - name: Remove Bitwarden's SSH_AUTH_SOCK and units
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: >-
            {{ [target_home ~ '/.config/environment.d/20-bitwarden-ssh-agent.conf']
               + bitwarden_ssh_agent_units | map('regex_replace', '^', target_home ~ '/.config/systemd/user/') | list }}
          notify: reload systemd --user

    - name: SSH agent — Omarchy's (gcr-ssh-agent), for KeePassXC
      when: keepassxc_default | bool
      block:
        - name: Unmask gcr-ssh-agent
          ansible.builtin.systemd:
            name: "{{ item }}"
            scope: user
            masked: false
          loop: "{{ gcr_ssh_agent_units }}"

        - name: Enable gcr-ssh-agent's socket
          ansible.builtin.systemd:
            name: gcr-ssh-agent.socket
            scope: user
            enabled: true
            state: started

        - name: Point SSH_AUTH_SOCK at it (as omarchy-setup-security-ssh-agent does)
          ansible.builtin.copy:
            content: "SSH_AUTH_SOCK=$XDG_RUNTIME_DIR/gcr/ssh\n"
            dest: "{{ gcr_ssh_agent_env_file }}"
            mode: "0644"

    # An earlier setup had this script for KeePassXC alone.
    - name: Remove the KeePassXC-only readiness script
      ansible.builtin.file:
        path: "{{ target_home }}/.local/bin/keepassxc-autostart-wait"
        state: absent

    - name: Readiness script (waits for the tray and the portal)
      when: bitwarden_default | bool or keepassxc_default | bool
      block:
        - name: Create ~/.local/bin
          ansible.builtin.file:
            path: "{{ password_wait_script | dirname }}"
            state: directory
            mode: "0755"

        - name: Deploy the readiness script
          ansible.builtin.template:
            src: password-autostart-wait.sh.j2
            dest: "{{ password_wait_script }}"
            mode: "0755"

    - name: Remove the readiness script
      ansible.builtin.file:
        path: "{{ password_wait_script }}"
        state: absent
      when: not (bitwarden_default | bool or keepassxc_default | bool)

    - name: Autostart — Bitwarden
      when: bitwarden_default | bool
      block:
        - name: Deploy Bitwarden's autostart entry
          ansible.builtin.template:
            src: bitwarden-autostart.desktop.j2
            dest: "{{ bitwarden_autostart_desktop }}"
            mode: "0644"

        - name: Create the autostart unit's drop-in directory
          ansible.builtin.file:
            path: "{{ bitwarden_autostart_dropin_dir }}"
            state: directory
            mode: "0755"

        # The script gives up after 60s and exits 0, inside TimeoutStartSec.
        - name: Hold the autostart unit until the tray and the portal are up
          ansible.builtin.copy:
            content: |
              # Managed by omarchy-setup (playbooks/user/apps/password.yml).
              [Service]
              ExecStartPre={{ password_wait_script }} Bitwarden
              TimeoutStartSec=90s
            dest: "{{ bitwarden_autostart_dropin_dir }}/50-wait-for-desktop.conf"
            mode: "0644"
          notify: reload systemd --user

    - name: Remove Bitwarden's autostart
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ bitwarden_autostart_desktop }}"
        - "{{ bitwarden_autostart_dropin_dir }}"
      when: not bitwarden_default | bool
      notify: reload systemd --user

    - name: Bitwarden (Flatpak) shadow entry
      when: bitwarden_flatpak_wayland | bool
      block:
        - name: Read the Flatpak's exported desktop entry
          ansible.builtin.slurp:
            src: "{{ flatpak_system_exports_dir }}/applications/{{ bitwarden_flatpak_desktop_id }}"
          register: bitwarden_flatpak_exported

        - name: Expect its Exec to still end in the forwarded URIs
          # The arguments go right after this string; if upstream changes
          # it, check where they belong now.
          ansible.builtin.assert:
            that: "'@@u %U @@' in (bitwarden_flatpak_exported.content | b64decode)"
            fail_msg: >-
              {{ bitwarden_flatpak_desktop_id }}'s Exec no longer contains
              `@@u %U @@`, so there is nowhere known to append
              {{ bitwarden_flatpak_wayland_args | join(' ') }}.
            quiet: true

        - name: Create ~/.local/share/applications
          ansible.builtin.file:
            path: "{{ bitwarden_flatpak_user_desktop_path | dirname }}"
            state: directory
            mode: "0755"

        - name: Shadow the exported entry with one that passes the Wayland arguments
          ansible.builtin.copy:
            content: |
              # Managed by omarchy-setup (playbooks/user/apps/password.yml): the
              # Flatpak's export, plus {{ bitwarden_flatpak_wayland_args | join(' ') }}.
              {{ bitwarden_flatpak_exported.content | b64decode
                 | replace('@@u %U @@', '@@u %U @@ ' ~ bitwarden_flatpak_wayland_args | join(' ')) | trim }}
            dest: "{{ bitwarden_flatpak_user_desktop_path }}"
            mode: "0644"

    - name: Remove the Bitwarden Flatpak's shadow entry
      ansible.builtin.file:
        path: "{{ bitwarden_flatpak_user_desktop_path }}"
        state: absent
      when: not bitwarden_flatpak_wayland | bool

    - name: Autostart — KeePassXC
      when: keepassxc_default | bool
      block:
        - name: Deploy KeePassXC's autostart entry
          ansible.builtin.copy:
            content: |
              [Desktop Entry]
              Type=Application
              Name=KeePassXC
              Exec={{ keepassxc_command }}
              Icon={{ keepassxc_variant.icon | default(keepassxc_flatpak_id) }}
              StartupWMClass=org.keepassxc.KeePassXC
              X-GNOME-Autostart-enabled=true
            dest: "{{ keepassxc_autostart_desktop }}"
            mode: "0644"

        - name: Create the autostart unit's drop-in directory
          ansible.builtin.file:
            path: "{{ keepassxc_autostart_dropin_dir }}"
            state: directory
            mode: "0755"

        # The script gives up after 60s and exits 0, inside TimeoutStartSec.
        - name: Hold the autostart unit until the tray and the portal are up
          ansible.builtin.copy:
            content: |
              # Managed by omarchy-setup (playbooks/user/apps/password.yml).
              [Service]
              ExecStartPre={{ password_wait_script }} KeePassXC
              TimeoutStartSec=90s
            dest: "{{ keepassxc_autostart_dropin_dir }}/50-wait-for-desktop.conf"
            mode: "0644"
          notify: reload systemd --user

    - name: Remove KeePassXC's autostart
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ keepassxc_autostart_desktop }}"
        - "{{ keepassxc_autostart_dropin_dir }}"
      when: not keepassxc_default | bool
      notify: reload systemd --user

    - name: Bitwarden browser integration — Firefox Flatpak
      when: bitwarden_firefox_flatpak | bool
      block:
        - name: Create the native messaging host directories Bitwarden fills
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ bitwarden_firefox_flatpak_nmh_dir }}"
            - "{{ bitwarden_firefox_flatpak_xdg_nmh_dir }}"

        - name: Link Bitwarden's manifest into the XDG directory
          ansible.builtin.file:
            src: "{{ bitwarden_firefox_flatpak_nmh_dir }}/{{ bitwarden_browser_manifest_name }}"
            dest: "{{ bitwarden_firefox_flatpak_xdg_nmh_dir }}/{{ bitwarden_browser_manifest_name }}"
            state: link
            force: true
            follow: false

    # Bitwarden removes its own files when browser integration is turned
    # off; the empty directory stays.
    - name: Remove the link to Bitwarden's manifest
      ansible.builtin.file:
        path: "{{ bitwarden_firefox_flatpak_xdg_nmh_dir }}/{{ bitwarden_browser_manifest_name }}"
        state: absent
      when: not bitwarden_firefox_flatpak | bool

    - name: KeePassXC-Browser native messaging hosts
      ansible.builtin.include_tasks: tasks/keepassxc-browser-host.yml
      loop: "{{ keepassxc_browser_hosts | dict2items }}"
      loop_control:
        loop_var: host
        label: "{{ host.key }}"
      vars:
        host_on: "{{ keepassxc_on | bool and host.key in apps.browser.installed }}"

    - name: Keybinding and window
      ansible.builtin.include_tasks: tasks/hypr-user-block.yml
      loop:
        - marker: password manager — keybinding
          state: "{{ 'present' if password_default else 'absent' }}"
          # The windows' classes: "bitwarden" (both builds, under XWayland
          # and native Wayland alike), org.keepassxc.KeePassXC.
          block: |
            o.rebind("{{ password_hypr_keybind }}", "{{ apps_catalog.password[password_default].label | default('') }}", { launch = "{{ password_command }}", focus = "{{ '^bitwarden$' if bitwarden_default | bool else '^org\\.keepassxc\\.KeePassXC$' }}" })
        # Dropping Omarchy's floating tag undoes its center and size, not
        # the float: that static rule already fired while the tag was on,
        # so tile it explicitly too, as Omarchy's apps/browser.lua does.
        - marker: Bitwarden tiled
          state: >-
            {{ 'present' if (apps.password.installed | intersect(['bitwarden-flatpak', 'bitwarden']) | length > 0
                             and not bitwarden_floating) else 'absent' }}
          block: |
            o.window("^([bB]itwarden)$", { tag = "-floating-window" })
            o.window("^([bB]itwarden)$", { tile = true })
      loop_control:
        label: "{{ item.marker }}"
      vars:
        hypr_file: bindings.lua
        hypr_marker: "{{ item.marker }}"
        hypr_block: "{{ item.block }}"
        hypr_state: "{{ item.state }}"

  handlers:
    - ansible.builtin.import_tasks: tasks/handlers-user.yml

    - name: re-export SSH_AUTH_SOCK
      # Stopping the oneshot unsets the variable an older unit exported; the
      # path unit starts it again with the new value once the socket exists.
      ansible.builtin.systemd:
        name: bitwarden-ssh-agent-env.service
        scope: user
        state: stopped
      listen: re-export SSH_AUTH_SOCK
