# Convert Omarchy's preinstalled web apps into Brave Origin PWAs, each
# opening in its own Brave container — driven by brave_pwa_webapps in
# group_vars/all/main.yml — and drop the leftover Firefox Taskbar Tab web
# app shortcuts (playbooks/taskbar-tab-webapps.yml, removed) now that
# Firefox is no longer where web apps live (see playbooks/firefox.yml,
# still installed and untouched — only its web app shortcuts move here).
#
# Brave containers (brave.containers in its Preferences) are a runtime
# feature with no CLI to create one — hamburger menu → Containers → New —
# so this playbook only ever looks one up by name; it never creates one.
#
# App ids are Brave-assigned at install time (not predictable up front,
# unlike Firefox's Taskbar Tabs where this repo generates the id itself):
# each entry in brave_pwa_webapps force-installs its url via the
# WebAppInstallForceList machine policy
# (/etc/brave/policies/managed/omarchy-setup-webapps.json), which needs
# root (this playbook needs `./run-empowered.sh`, unlike the old
# taskbar-tab-webapps.yml). Brave (already running or not — the policy
# loader watches that directory live) force-installs the app and, because
# the policy also asks for a desktop shortcut, drops one this playbook
# reads the app id from (tasks/brave-pwa-webapp-swap.yml) and then
# deletes, replacing it with the repo's own launcher pointed at the
# right container via `--container=`.
#
# Split in two phases. The policy is machine-wide (here, root): every
# profile on the machine — every user's Brave — gets the union of all
# users' brave_pwa_webapps (users/*.yml, plus the caller's current list).
# The launchers, containers and keybinds are per user, in
# user/brave-pwa-webapps.yml, run by each user with their own Brave open.
#
# Usage: just brave-pwa-webapps. Not part of `just setup` — like the
# taskbar-tab-webapps.yml it replaces, this reflects a personal container
# layout, not a fresh-install default.
- name: Brave PWAs — machine policy (union of every user's list)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [brave-pwa-webapps]

  tasks:
    - name: Find the per-user variable files
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../users"
        patterns: "*.yml"
      register: brave_pwa_user_files

    - name: Start from the caller's own list
      ansible.builtin.set_fact:
        brave_pwa_webapps_all: "{{ brave_pwa_webapps }}"

    - name: Add every user's brave_pwa_webapps
      ansible.builtin.set_fact:
        brave_pwa_webapps_all: >-
          {{ brave_pwa_webapps_all
             + ((lookup('ansible.builtin.file', item.path) | from_yaml | default({}, true))
                .brave_pwa_webapps | default([])) }}
      loop: "{{ brave_pwa_user_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: One policy entry per url
      ansible.builtin.set_fact:
        brave_pwa_webapps_all: "{{ brave_pwa_webapps_all | unique(attribute='url') }}"

    - name: Ensure /etc/brave/policies/managed exists
      ansible.builtin.file:
        path: /etc/brave/policies/managed
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true
      tags: [brave-pwa-webapps]

    - name: Force-install every configured Brave PWA via machine policy
      ansible.builtin.copy:
        dest: /etc/brave/policies/managed/omarchy-setup-webapps.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "WebAppInstallForceList": [
          {% for webapp in brave_pwa_webapps_all if webapp.policy_install | default(true) %}
              {
                "url": {{ webapp.url | to_json }},
                "default_launch_container": "window",
                "create_desktop_shortcut": true
              }{{ "," if not loop.last else "" }}
          {% endfor %}
            ]
          }
      become: true
      tags: [brave-pwa-webapps]
