---
# Localização pt-BR (playbooks/ptbr.yml)
ptbr_locale: pt_BR.UTF-8
ptbr_locale_gen_line: "pt_BR.UTF-8 UTF-8"

# Cadeia de fallback do gettext: tenta pt_BR, cai para pt genérico, e só
# então cai para inglês (em vez de C/POSIX) se um app não tiver nenhuma
# tradução em português.
ptbr_language_fallback: "pt_BR:pt:en"

# Nomes traduzidos oficiais do xdg-user-dirs (projeto freedesktop.org)
# para pt_BR. "Downloads" não muda — é a tradução real do projeto, não
# um esquecimento. Os 8 primeiros são os nomes padrão do xdg-user-dirs;
# PROJECTS é uma entrada extra do próprio Omarchy (declarada em
# /etc/xdg/user-dirs.defaults, fora do padrão upstream) — apesar de o
# manual do `xdg-user-dirs-update --set` listar só os 8 nomes padrão
# como NAME aceito, testamos e ele aceita qualquer nome presente em
# user-dirs.dirs (inclusive PROJECTS) sem reclamar, então incluímos.
ptbr_xdg_user_dirs:
  - { name: DESKTOP, translated: "Área de Trabalho" }
  - { name: DOWNLOAD, translated: "Downloads" }
  - { name: TEMPLATES, translated: "Modelos" }
  - { name: PUBLICSHARE, translated: "Público" }
  - { name: DOCUMENTS, translated: "Documentos" }
  - { name: MUSIC, translated: "Música" }
  - { name: PICTURES, translated: "Imagens" }
  - { name: VIDEOS, translated: "Vídeos" }
  - { name: PROJECTS, translated: "Projetos" }

# Firefox — pacote de idioma pt-BR (repositório [extra] do Arch,
# acompanha a versão do pacote firefox).
ptbr_firefox_i18n_package: firefox-i18n-pt-br

# Bitwarden (playbooks/bitwarden.yml) — instala preferencialmente o
# bitwarden-bin do AUR (repositório oficial do Arch costuma ficar meses
# atrás), voltando a usar o pacote oficial sozinho quando ele deixar de
# estar desatualizado em relação ao AUR (decidido em tempo de execução,
# via `vercmp` — veja o cabeçalho do playbook).
bitwarden_official_package: bitwarden
bitwarden_aur_package: bitwarden-bin
bitwarden_aur_git_url: "https://aur.archlinux.org/{{ bitwarden_aur_package }}.git"
bitwarden_aur_build_dir: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/aur/{{ bitwarden_aur_package }}"
bitwarden_aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info?arg[]={{ bitwarden_aur_package }}"

# Dependências de runtime do bitwarden-bin que não vêm garantidas pelo
# conjunto base do Omarchy — instaladas via pacman antes do build, para
# o makepkg nunca precisar chamar `sudo` sozinho (veja o cabeçalho do
# playbook). org.freedesktop.secrets (o outro dep do bitwarden-bin) é a
# exceção: já é satisfeito pelo gnome-keyring, que faz parte do
# omarchy-base.packages — não precisa ser instalado aqui.
bitwarden_aur_runtime_deps:
  - alsa-lib
  - gtk3
  - libnotify
  - libxtst
  - libxss
  - libnss_nis
  - nss

# Agente SSH do Bitwarden — instalação nativa (pacman/AUR, sem sandbox
# Flatpak), então o socket vive direto em $HOME, não em
# ~/.var/app/com.bitwarden.desktop/... como no
# lbssousa/bluefin-initial-setup (que instala via Flatpak). Confirmado
# pela documentação oficial (bitwarden.com/help/ssh-agent) — o próprio
# app expõe BITWARDEN_SSH_AUTH_SOCK como variável de override, caso o
# caminho padrão mude no futuro. Unidades systemd --user instaladas em
# ~/.config/systemd/user/ e camada estática em ~/.config/environment.d/
# (mesmo mecanismo do bluefin-initial-setup, só com o caminho do socket
# adaptado).
bitwarden_ssh_agent_socket: "{{ ansible_facts.env.HOME }}/.bitwarden-ssh-agent.sock"
bitwarden_ssh_agent_units:
  - bitwarden-ssh-agent.path
  - bitwarden-ssh-agent-env.service

# gcr-ssh-agent (pacote gcr-4) compete pela variável SSH_AUTH_SOCK da
# sessão: seu socket unit reexporta SSH_AUTH_SOCK via
# `systemctl --user set-environment` sempre que é ativado por socket
# (WantedBy=sockets.target, habilitado por padrão) — precisa ficar
# mascarado para o agente do Bitwarden prevalecer.
gcr_ssh_agent_units:
  - gcr-ssh-agent.socket
  - gcr-ssh-agent.service

# Podman rootless (playbooks/podman.yml) — faixa subuid/subgid usada
# apenas se o usuário ainda não tiver uma (o shadow-utils do Arch já
# aloca uma automaticamente na criação de usuários "normais" via
# useradd, então isto é só uma rede de segurança, não o caminho comum).
# 100000:65536 é o mesmo intervalo padrão que o useradd já usa.
podman_subuid_start: 100000
podman_subuid_count: 65536

# libfprint (goodix538d) — builda o fork em um container distrobox
# (ambiente de build isolado, sem instalar toolchain no host) e instala
# em /usr/local (playbooks/libfprint.yml). Repositório/branch do fork.
libfprint_container_name: libfprint-build
libfprint_distrobox_ini_file: "{{ playbook_dir }}/files/libfprint-build.ini"
libfprint_repo: https://github.com/lbssousa/libfprint.git
libfprint_ref: goodix-538d-sigfm-gtls
libfprint_checkout_dir: "{{ ansible_facts.env.HOME }}/src/libfprint-goodix538d"
libfprint_stage_dir: "{{ ansible_facts.env.HOME }}/src/libfprint-goodix538d-stage"

# Onde a lib cai no host. Diferente do bluefin-distrobox-libfprint
# (Fedora Atomic, /usr somente leitura, libdir "lib64"): aqui /usr já é
# gravável e o Arch usa "lib" (lib64 é só um symlink de compatibilidade
# para lib) — confirmado em /usr/lib64 -> lib nesta máquina.
libfprint_usrlocal_prefix: /usr/local
libfprint_usrlocal_libdir: "{{ libfprint_usrlocal_prefix }}/lib"

# Dependências de runtime no host (o container só tem o toolchain de
# build — a lib compilada roda no host, via fprintd, então essas libs
# precisam existir lá também). Nomes de pacote Arch; a maioria já vem
# via outras automações/apps, mas declaramos explicitamente para este
# playbook funcionar sozinho numa máquina limpa.
libfprint_runtime_deps:
  - opencv
  - openssl
  - glib2
  - libgusb
  - libgudev
  - pixman

# O meson.build do fork pede um pacote pkg-config chamado "opencv4"
# (>= 4.5.0) para o matcher SIGFM — nome que o Homebrew usava
# (opencv@4) no bluefin-distrobox-libfprint, mas que o Arch não tem
# mais: o pacote oficial `opencv` já é a série 5.x (pkg-config
# "opencv5"), e a série 4.x só existe no AUR (opencv4, ~50 dependências
# de build incluindo Java/Qt6/VTK, só para satisfazer esse nome — build
# de mais de uma hora por uma checagem de versão). Testado e confirmado
# nesta máquina: a API que o SIGFM realmente usa (core, imgproc,
# imgcodecs, features2d/flann) compila sem alterações contra o opencv5
# do Arch — só o *nome* do pacote pkg-config e da lib "features2d"
# mudaram (virou "features"). Este .pc é um shim: redireciona a busca
# por "opencv4" para o opencv5 real, linkando só os módulos que o
# libfprint de fato usa (não os ~60 módulos do opencv5.pc genérico,
# alguns dos quais — cvv/viz/hdf — têm symbols quebrados nesta
# instalação do Arch por causa de suas dependências opcionais
# Qt6/VTK/HDF5, e derrubam a geração do typelib/GIR se entrarem no
# link). Fica em $HOME (compartilhado com o container) e é referenciado
# via PKG_CONFIG_PATH só durante o build — não é instalado no sistema.
# Se o Arch mudar de versão major do opencv de novo no futuro, este
# shim precisa ser atualizado (nomes de include dir/módulos podem
# mudar outra vez).
libfprint_opencv4_shim_dir: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup/libfprint-pkgconfig-shim"
