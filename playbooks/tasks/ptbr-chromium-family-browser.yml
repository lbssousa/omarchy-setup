---
# One Chromium-family browser at a time — looped by playbooks/ptbr.yml
# (ptbr_chromium_family_config_dirs), var `browser_config_dir` = the
# profile directory relative to $HOME (~/.config/<dir> for native
# installs, ~/.var/app/<app-id>/config/<dir> for Flathub ones such as the
# Flathub Brave).
#
# Forces intl.accept_languages/selected_languages in the profile's
# Preferences file directly (no official policy covers this), only if
# the browser is closed — detected via the profile's own SingletonLock
# symlink rather than `pgrep`, since some Chromium forks run under a
# different process name than their package.
#
# `tags: [ptbr-chromium]` is repeated on every task here, not just on
# the include_tasks call — a looped include_tasks with a tag only on
# the call itself silently skips every inner task under --tags without
# any warning.
- name: "[{{ browser_config_dir }}] Resolve the profile directory"
  ansible.builtin.set_fact:
    browser_profile_base: "{{ ansible_facts.env.HOME }}/{{ browser_config_dir }}"
  tags: [ptbr-chromium]

- name: "[{{ browser_config_dir }}] Locate the Default profile's Preferences"
  ansible.builtin.stat:
    path: "{{ browser_profile_base }}/Default/Preferences"
  register: browser_prefs_stat
  tags: [ptbr-chromium]

- name: "[{{ browser_config_dir }}] Check whether it's running (profile SingletonLock)"
  ansible.builtin.stat:
    path: "{{ browser_profile_base }}/SingletonLock"
  register: browser_lock_stat
  when: browser_prefs_stat.stat.exists
  tags: [ptbr-chromium]

- name: "[{{ browser_config_dir }}] Load the current Preferences"
  ansible.builtin.set_fact:
    browser_prefs_current: "{{ lookup('file', browser_profile_base + '/Default/Preferences') | from_json }}"
  when:
    - browser_prefs_stat.stat.exists
    - not browser_lock_stat.stat.exists
  tags: [ptbr-chromium]

- name: "[{{ browser_config_dir }}] Force intl.accept_languages/selected_languages={{ ptbr_chromium_accept_languages }}"
  ansible.builtin.copy:
    content: >-
      {{
        (browser_prefs_current
          | combine({'intl': {'accept_languages': ptbr_chromium_accept_languages,
                               'selected_languages': ptbr_chromium_accept_languages}}, recursive=True)
          | to_json)
      }}
    dest: "{{ browser_profile_base }}/Default/Preferences"
    mode: "0600"
  register: browser_prefs_patched
  when:
    - browser_prefs_stat.stat.exists
    - not browser_lock_stat.stat.exists
  tags: [ptbr-chromium]

- name: "[{{ browser_config_dir }}] Note that already-used web apps may stay in English"
  ansible.builtin.debug:
    msg: >-
      [{{ browser_config_dir }}] intl.accept_languages/selected_languages
      updated. Web apps never opened before will now load in pt-BR. One
      you already used (e.g. a logged-in WhatsApp Web) may stay in
      English — its language is cached in that site's own
      IndexedDB/Service Worker. If so, clear that site's data manually
      (address bar lock icon → site data → clear) rather than
      automatically, since that would also drop the logged-in session.
  when:
    - browser_prefs_stat.stat.exists
    - not browser_lock_stat.stat.exists
    - browser_prefs_patched is defined and browser_prefs_patched is changed
  tags: [ptbr-chromium]

- name: "[{{ browser_config_dir }}] Note if it's running (Preferences untouched)"
  ansible.builtin.debug:
    msg: >-
      {{ browser_config_dir }} is running (profile at
      {{ browser_profile_base }}) — editing Preferences now would be
      overwritten on exit. Close all its windows (including
      omarchy-launch-webapp web apps) and rerun `just ptbr` (or
      `ansible-playbook playbooks/ptbr.yml --tags ptbr-chromium`).
  when:
    - browser_prefs_stat.stat.exists
    - browser_lock_stat.stat.exists
  tags: [ptbr-chromium]
