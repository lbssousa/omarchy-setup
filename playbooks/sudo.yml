---
# Lowers sudo's passwd_timeout so a `become: true` fired from an
# unattended terminal fails fast instead of hanging while waiting on the
# fingerprint reader.
- name: sudo passwd_timeout
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Install /etc/sudoers.d/omarchy-setup-passwd-timeout
      ansible.builtin.copy:
        content: |
          Defaults passwd_timeout={{ sudo_passwd_timeout_minutes }}
        dest: /etc/sudoers.d/omarchy-setup-passwd-timeout
        mode: "0440"
        validate: "visudo -cf %s"
      become: true
