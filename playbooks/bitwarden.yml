---
# Bitwarden desktop client — prefers the AUR bitwarden-bin package, and
# only falls back to the official Arch package once it's no longer
# outdated relative to the AUR (compared via `vercmp` on every run). The
# two packages conflict, so whichever loses gets removed.
#
# Doesn't shell out to yay: makepkg's own sudo (for syncing missing
# deps) needs an interactive password Ansible can't supply. Instead,
# each privileged step runs through Ansible's own `become: true`:
# install runtime deps via pacman, clone the AUR repo (no privilege
# needed), build with `makepkg --nodeps` as a normal user (makepkg
# refuses to run as root), then install the built package with
# `pacman -U`.
#
# Also wires SSH_AUTH_SOCK to the Bitwarden SSH agent's socket — a
# static export via ~/.config/environment.d/ (reaches IDEs and other
# session apps) plus a `.path` unit that reacts once Bitwarden actually
# creates the socket (only happens after unlock). gcr-ssh-agent is
# masked so it doesn't compete for the same variable.
#
# Finally, rebinds Omarchy's default "Passwords" shortcut
# (SUPER+SHIFT+SLASH, normally 1Password) to Bitwarden, since this setup
# doesn't install 1Password.
- name: Bitwarden (AUR bitwarden-bin or official, whichever is newer)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Check the bitwarden version in the official repo
      ansible.builtin.command: "pacman -Si {{ bitwarden_official_package }}"
      environment:
        LC_ALL: C
      register: bitwarden_official_info
      changed_when: false
      failed_when: false

    - name: Extract the official package version
      ansible.builtin.set_fact:
        bitwarden_official_version: >-
          {{ (bitwarden_official_info.stdout_lines | select('match', 'Version') | first).split(':')[1] | trim }}
      when: bitwarden_official_info.rc == 0

    - name: Check the bitwarden-bin version on the AUR
      ansible.builtin.uri:
        url: "{{ bitwarden_aur_rpc_url }}"
        return_content: true
      register: bitwarden_aur_info

    - name: Extract the AUR package version
      ansible.builtin.set_fact:
        bitwarden_aur_version: "{{ bitwarden_aur_info.json.results[0].Version }}"

    - name: Compare the AUR version against the official one
      ansible.builtin.command: "vercmp {{ bitwarden_aur_version }} {{ bitwarden_official_version | default('0') }}"
      register: bitwarden_vercmp
      changed_when: false
      when: bitwarden_official_version is defined

    - name: "Pick the package source: official only if not outdated vs. AUR"
      ansible.builtin.set_fact:
        bitwarden_source: >-
          {{ 'official'
             if (bitwarden_official_version is defined and (bitwarden_vercmp.stdout | int) <= 0)
             else 'aur' }}

    - name: "Install via pacman (official repo, version {{ bitwarden_official_version | default('?') }})"
      when: bitwarden_source == 'official'
      block:
        - name: Remove AUR bitwarden-bin, if installed
          community.general.pacman:
            name: "{{ bitwarden_aur_package }}"
            state: absent
          become: true

        - name: Install Bitwarden via pacman
          community.general.pacman:
            name: "{{ bitwarden_official_package }}"
            state: present
          become: true

    - name: "Install via AUR (bitwarden-bin, version {{ bitwarden_aur_version }})"
      when: bitwarden_source == 'aur'
      block:
        - name: Check the currently installed bitwarden-bin version, if any
          ansible.builtin.command: "pacman -Qi {{ bitwarden_aur_package }}"
          environment:
            LC_ALL: C
          register: bitwarden_aur_installed
          changed_when: false
          failed_when: false

        - name: Extract the installed bitwarden-bin version
          ansible.builtin.set_fact:
            bitwarden_aur_installed_version: >-
              {{ (bitwarden_aur_installed.stdout_lines | select('match', 'Version') | first).split(':')[1] | trim }}
          when: bitwarden_aur_installed.rc == 0

        - name: Build and install (only if missing or outdated)
          when: bitwarden_aur_installed.rc != 0 or bitwarden_aur_installed_version != bitwarden_aur_version
          block:
            - name: Remove the official package, if installed
              community.general.pacman:
                name: "{{ bitwarden_official_package }}"
                state: absent
              become: true

            - name: Install bitwarden-bin's runtime dependencies
              community.general.pacman:
                name: "{{ bitwarden_aur_runtime_deps }}"
                state: present
              become: true

            - name: Clone/update the bitwarden-bin AUR repo
              ansible.builtin.git:
                repo: "{{ bitwarden_aur_git_url }}"
                dest: "{{ bitwarden_aur_build_dir }}"
                update: true

            - name: Build the package (makepkg, no dep resolution, unprivileged)
              ansible.builtin.command: makepkg --nodeps --noconfirm --force
              args:
                chdir: "{{ bitwarden_aur_build_dir }}"

            - name: Install the built package
              ansible.builtin.shell: "pacman -U --noconfirm {{ bitwarden_aur_build_dir }}/*.pkg.tar.zst"
              become: true

    - name: Bitwarden SSH agent — session-wide SSH_AUTH_SOCK
      block:
        - name: Create ~/.config/environment.d
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/environment.d"
            state: directory
            mode: "0755"

        - name: Set a static SSH_AUTH_SOCK for IDEs and session apps
          ansible.builtin.copy:
            src: 20-bitwarden-ssh-agent.conf
            dest: "{{ ansible_facts.env.HOME }}/.config/environment.d/20-bitwarden-ssh-agent.conf"
            mode: "0644"
            force: false

        - name: Create ~/.config/systemd/user
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
            state: directory
            mode: "0755"

        - name: Install the Bitwarden SSH agent's systemd --user units
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/{{ item }}"
            mode: "0644"
            force: false
          loop: "{{ bitwarden_ssh_agent_units }}"
          notify: reload systemd --user

        - name: Mask gcr-ssh-agent (avoids competing for SSH_AUTH_SOCK)
          ansible.builtin.systemd:
            name: "{{ item }}"
            scope: user
            masked: true
          loop: "{{ gcr_ssh_agent_units }}"

        - name: Enable the Bitwarden SSH agent's path unit
          ansible.builtin.systemd:
            name: bitwarden-ssh-agent.path
            scope: user
            daemon_reload: true
            enabled: true
            state: started

    - name: "Bitwarden keybinding ({{ bitwarden_hypr_keybind }}, inherited from 1Password's default)"
      block:
        - name: Create ~/.config/hypr
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/hypr"
            state: directory
            mode: "0755"

        - name: Create ~/.config/hypr/bindings.lua from the Omarchy default, if missing
          ansible.builtin.copy:
            src: /usr/share/omarchy/default/hypr/bindings.lua
            dest: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
            remote_src: true
            force: false
            mode: "0644"

        - name: "Rebind {{ bitwarden_hypr_keybind }} from 1Password to Bitwarden"
          ansible.builtin.blockinfile:
            path: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
            marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/bitwarden.yml — Bitwarden keybinding)"
            block: |
              hl.unbind("{{ bitwarden_hypr_keybind }}")
              o.bind("{{ bitwarden_hypr_keybind }}", "Bitwarden", { launch = "bitwarden", focus = "^Bitwarden$" })
          register: bitwarden_hypr_binding
          notify: reload Hyprland

  handlers:
    - name: reload systemd --user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      listen: reload systemd --user

    - name: reload Hyprland
      # Only has an effect inside a real Hyprland session; the bind
      # still applies on next login either way.
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      listen: reload Hyprland
