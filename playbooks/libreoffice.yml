---
# Restores Omarchy's pre-installed native LibreOffice
# (omarchy-base.packages: libreoffice-fresh) and removes the Flathub build
# if it was installed. The pt-BR language pack is handled by playbooks/ptbr.yml.

- name: LibreOffice (Native)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Remove LibreOffice from Flathub if present
      community.general.flatpak:
        name: org.libreoffice.LibreOffice
        state: absent
        method: system
      become: true

    - name: Install native LibreOffice
      community.general.pacman:
        name: libreoffice-fresh
        state: present
      become: true
