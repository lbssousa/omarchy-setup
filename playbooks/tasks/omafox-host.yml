---
# Omafox's native messaging host for one Firefox build (omafox_hosts,
# `host` = {key, value}; playbooks/user/omafox.yml): with host_on, the
# manifest in each of the build's directories and the host it runs; without
# it, both go. The Flatpak also gets read access to the theme state.
- name: "[{{ host.key }}] Omafox host"
  when: host_on | bool
  block:
    - name: "[{{ host.key }}] Create the native messaging host directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ host.value.dirs }}"

    - name: "[{{ host.key }}] Deploy the host"
      ansible.builtin.copy:
        src: omafox/omafox-native-host.py
        dest: "{{ host.value.dirs[0] }}/{{ omafox_host_name }}"
        mode: "0755"

    - name: "[{{ host.key }}] Deploy the manifest"
      ansible.builtin.template:
        src: omafox-firefox.json.j2
        dest: "{{ item }}/{{ omafox_native_host_name }}.json"
        mode: "0644"
      vars:
        omafox_host_path: "{{ host.value.path }}"
      loop: "{{ host.value.dirs }}"

    - name: "[{{ host.key }}] Let the Firefox Flatpak read the theme state"
      ansible.builtin.command:
        argv: [flatpak, override, --user, "--filesystem={{ omafox_flatpak_state_grant }}", "{{ firefox_flatpak_id }}"]
      when: host.key == 'firefox-flatpak'
      changed_when: false

- name: "[{{ host.key }}] Remove the Omafox host"
  when: not host_on | bool
  block:
    - name: "[{{ host.key }}] Remove the manifests and the host"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ host.value.dirs | map('regex_replace', '$', '/' ~ omafox_native_host_name ~ '.json') | list
           + [host.value.dirs[0] ~ '/' ~ omafox_host_name] }}

    - name: "[{{ host.key }}] Look for the Firefox Flatpak's user overrides"
      ansible.builtin.stat:
        path: "{{ target_home }}/.local/share/flatpak/overrides/{{ firefox_flatpak_id }}"
      register: omafox_firefox_override
      when: host.key == 'firefox-flatpak'

    # Edited rather than `flatpak override --nofilesystem=`, which would
    # leave a negated grant behind instead of removing it.
    - name: "[{{ host.key }}] Take back the Firefox Flatpak's access to the theme state"
      ansible.builtin.replace:
        path: "{{ target_home }}/.local/share/flatpak/overrides/{{ firefox_flatpak_id }}"
        regexp: '(?<=[=;]){{ omafox_flatpak_state_grant | regex_escape }};'
        replace: ""
      when:
        - host.key == 'firefox-flatpak'
        - omafox_firefox_override.stat.exists | default(false)
