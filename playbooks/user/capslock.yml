---
# Caps Lock, per user: Compose moves from Shift+Caps Lock (Omarchy 4.5's
# omarchy:shift_caps_compose) to capslock_compose_key in
# ~/.config/hypr/input.lua, so the machine-wide keyd remap
# (system/capslock.yml, which explains it) can produce a real Caps Lock.
# Every user needs this; turning the feature off removes the block (and,
# in the system phase, keyd). The layout-switch option Omarchy adds for
# non-Latin layouts (grp:alts_toggle) is kept.
#
# Usage: just capslock
- name: Caps Lock via keyd (tap=Esc / hold=Ctrl / Shift+CapsLock=CapsLock) (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [capslock]

  vars:
    feature_on: "{{ features['capslock'] | default(true) }}"

  tasks:
    - name: "{{ 'Move Compose off Caps Lock, onto ' ~ capslock_compose_key if feature_on | bool else 'Give Compose back to Omarchy (Shift+Caps Lock)' }}"
      ansible.builtin.include_tasks: tasks/hypr-user-block.yml
      vars:
        hypr_file: input.lua
        hypr_marker: "playbooks/user/capslock.yml — Compose on {{ capslock_compose_key }}"
        hypr_state: "{{ 'present' if feature_on | bool else 'absent' }}"
        hypr_block: |
          local capslock_kb_options = "compose:{{ capslock_compose_key }}"
          local omarchy_kb_options = hl.get_config("input.kb_options")
          if type(omarchy_kb_options) == "string" and omarchy_kb_options:find("grp:alts_toggle", 1, true) then
            capslock_kb_options = capslock_kb_options .. ",grp:alts_toggle"
          end
          hl.config({
            input = {
              kb_options = capslock_kb_options,
            },
          })

  handlers:
    - ansible.builtin.import_tasks: tasks/handlers-user.yml
