---
# Yubikey helpers, neither part of site.yml/`just setup` (both depend on
# the physical token being connected):
#
#   GPG public key      tags: yubikey, gpg-yubikey   (`just gpg-yubikey`)
#   Resident SSH keys   tags: yubikey, ssh-yubikey   (`just ssh-yubikey`)
#
# Usage: ./run-empowered.sh ansible-playbook playbooks/yubikey.yml --tags gpg-yubikey

# Yubikey GPG public key — imports it, assigns ultimate trust, and
# configures git to sign commits/tags with it. Not part of
# site.yml/`just setup`: depends on the physical token being connected,
# so it runs on its own (`just gpg-yubikey`).
#
# Imports via `gpg --card-edit fetch`, which reads the URL stored on the
# card's OpenPGP applet and pulls the public key from there — no
# hardcoded keyserver or fingerprint. Only the public key ever leaves
# the card; the private key stays on the Yubikey.
#
# `--status-fd 1` is used instead of parsing gpg's normal (translatable,
# sometimes accented) output — `LC_ALL=C` isn't an option here since it
# corrupts UTF-8 in an accented cardholder name.
#
# Never uses `become: true` for GPG or git tasks — the keyring and
# ~/.gitconfig are personal user data. The only privileged step is
# ensuring the gnupg package is installed.
- name: Yubikey GPG public key — import, trust, sign in git
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [yubikey, gpg-yubikey]

  tasks:
    - name: Ensure gnupg is installed
      community.general.pacman:
        name: gnupg
        state: present
      become: true

    - name: Check for a connected OpenPGP card (Yubikey)
      ansible.builtin.command: gpg --card-status
      register: yubikey_gpg_card_check
      changed_when: false
      failed_when: false

    - name: Import the public key stored on the card (gpg --card-edit fetch)
      ansible.builtin.shell: |
        printf 'fetch\nquit\n' | gpg --batch --command-fd 0 --status-fd 1 --card-edit
      register: yubikey_gpg_fetch
      changed_when: (yubikey_gpg_fetch.stdout | regex_search('IMPORT_OK [1-9]')) is not none
      when: yubikey_gpg_card_check.rc == 0

    - name: Extract the card's signing key fingerprint
      ansible.builtin.set_fact:
        yubikey_gpg_signing_key: "{{ (yubikey_gpg_card_check.stdout | regex_search('Signature key\\s*\\.*:\\s*([0-9A-F ]+)', '\\1') | first) | replace(' ', '') }}"
      when: yubikey_gpg_card_check.rc == 0

    - name: Check the imported key's current ownertrust
      ansible.builtin.command: "gpg -k --with-colons {{ yubikey_gpg_signing_key }}"
      register: yubikey_gpg_trust_check
      changed_when: false
      when: yubikey_gpg_card_check.rc == 0

    - name: Assign ultimate trust to the Yubikey key
      ansible.builtin.shell: "echo '{{ yubikey_gpg_signing_key }}:6:' | gpg --import-ownertrust"
      changed_when: true
      when:
        - yubikey_gpg_card_check.rc == 0
        - "'pub:u:' not in yubikey_gpg_trust_check.stdout"

    - name: "Configure git to sign commits/tags with the Yubikey key ({{ yubikey_gpg_signing_key | default('?') }})"
      when: yubikey_gpg_card_check.rc == 0
      block:
        - name: "git config --global user.signingkey"
          community.general.git_config:
            name: user.signingkey
            value: "{{ yubikey_gpg_signing_key }}"
            scope: global
            state: present

        - name: "git config --global commit.gpgsign true"
          community.general.git_config:
            name: commit.gpgsign
            value: "true"
            scope: global
            state: present

        - name: "git config --global tag.gpgsign true"
          community.general.git_config:
            name: tag.gpgsign
            value: "true"
            scope: global
            state: present

    - name: Note if no Yubikey/OpenPGP card was found (no action taken)
      ansible.builtin.debug:
        msg: >-
          No OpenPGP card found (gpg --card-status failed) — connect
          the Yubikey and rerun. Nothing was imported or configured.
      when: yubikey_gpg_card_check.rc != 0

# Yubikey resident (discoverable) FIDO2 SSH keys — not part of
# site.yml/`just setup`: depends on the physical token being connected,
# so it runs on its own (`just ssh-yubikey`).
#
# Only prepares the ground (installs libfido2, ensures ~/.ssh exists)
# and asks you to run `ssh-keygen -K` yourself. Downloading a resident
# key always requires the FIDO2 PIN, and its prompt doesn't use a
# `/dev/tty` bypass like run0/gpg — run through Ansible, the prompt
# never appears and the task hangs forever with no way to supply the PIN.
#
# Never uses `become: true` beyond installing the package — SSH keys in
# ~/.ssh are personal user data.
- name: Yubikey resident SSH keys
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [yubikey, ssh-yubikey]

  tasks:
    - name: Ensure libfido2 is installed
      community.general.pacman:
        name: libfido2
        state: present
      become: true

    - name: Ensure ~/.ssh exists with the right permissions
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.ssh"
        state: directory
        mode: "0700"

    - name: Check for already-downloaded resident keys
      ansible.builtin.find:
        paths: "{{ ansible_facts.env.HOME }}/.ssh"
        patterns: "id_*_sk_rk*"
      register: yubikey_ssh_existing_keys

    - name: Point to downloading resident keys manually (FIDO2 PIN needs a real terminal)
      ansible.builtin.debug:
        msg: >-
          Ready (libfido2 installed, ~/.ssh exists). Downloading
          resident keys needs the FIDO2 PIN, which only works in a real
          terminal. Run it yourself: cd ~/.ssh && ssh-keygen -K
      when: yubikey_ssh_existing_keys.matched == 0

    - name: Note that resident keys already exist (no action taken)
      ansible.builtin.debug:
        msg: >-
          Resident keys already exist in ~/.ssh:
          {{ yubikey_ssh_existing_keys.files | map(attribute='path') | join(', ') }}
          — nothing downloaded. To fetch a newly enrolled key, run
          `cd ~/.ssh && ssh-keygen -K` manually.
      when: yubikey_ssh_existing_keys.matched > 0
