---
# Everything that puts a third-party plugin into the Omarchy shell, one play
# per source (each with its own tag, so `--tags pinentry` etc. still run
# alone). omapin, omaskpass, fingerprint-omarchy and security-key-omarchy
# come from the Omarchy plugin marketplace, where they are listed: `omarchy
# plugin add`, pinned to the release tag the marketplace approved
# (tasks/marketplace-plugin.yml); the binaries of the first two still come
# from the packages the system phase builds from the signed tags.
# polkit-omarchy and xdg-desktop-portal-omarchy, not listed, are linked
# from their packaged copy in /usr/share:
#
#   plugins       omarchy_plugins list, via `omarchy plugin add`
#   pinentry      omapin  (lbssousa.omapin)
#   ssh-askpass   omaskpass  (lbssousa.omaskpass)
#   polkit-agent  polkit-omarchy  (lbssousa.polkit)
#   clipboard-portal  xdg-desktop-portal-omarchy  (lbssousa.portal)
#   fingerprint   fingerprint-omarchy  (lbssousa.fingerprint)
#   security-key  security-key-omarchy  (lbssousa.security-key)
#
# Play 1 — installs this desktop's list of third-party Omarchy shell plugins:
# omarchy_plugins in group_vars/all/main.yml (Radio Atlas first). Each entry
# is cloned by `omarchy plugin add` into ~/.config/omarchy/plugins/<id>,
# pinned to its `ref`, enabled, and moved to the bar section the entry asks
# for: the icon's place in the bar is part of the setup, not something left
# to whichever defaultSection the manifest happens to declare.
#
# Why the play drives `omarchy plugin add` per entry instead of taking a URL
# to type:
# - add is the only supported installer: it clones, validates the manifest,
#   refuses an id another plugin already claims, moves the clone into place
#   and rescans. It runs no plugin code, no install hook, no sudo.
# - It refuses to continue when it isn't interactive unless --yes is passed,
#   so the play passes it: the repos and pins are listed (and reviewed) in
#   group_vars, which is the review add asks for.
# - --enable is deliberately not passed. With --yes, add skips its placement
#   prompt and lets the shell fall back to the manifest's defaultSection
#   ("left" for Radio Atlas). `omarchy plugin enable <id> --section <s>` below
#   both enables and moves — PluginRegistry.setEnabled calls moveBarEntry when
#   the widget is already on the bar — so it is idempotent and also pulls an
#   icon moved by hand back to where the list says. With a section and no
#   index, the shell anchors the widget right after omarchy.tray
#   (PluginRegistry.barTarget), i.e. first in the right-hand group.
# - add fails when the id's directory already exists, so the play only adds
#   what is missing — omarchy-plugin-catalog, which walks the plugin dirs, is
#   the authority on what's installed — and otherwise leaves the clone alone.
#   Updating is `omarchy plugin update <id>`, which fast-forwards a pinned
#   checkout off its tag; bump `ref` and re-run instead.
#
# The last tasks re-read the plugin list and the bar layout and fail unless
# every entry is enabled and sits in its section: a clone that only got
# installed, or a widget enabled without landing in the bar, stays inert and
# nothing above fails on it.
#
# Must run inside the graphical session — the shell is the IPC target.
#
# This is the user phase: each user installs (or links) and enables the
# plugins in their own shell. The plugin dependencies and the signed
# packages are installed by system/plugins.yml (an administrator); the
# fingerprint kept per user (tasks/plugin-code-stamp.yml) tells this phase
# when a packaged binary or plugin changed and needs a shell restart.
#
# Usage: just apply plugins
- name: Omarchy shell plugins (omarchy_plugins) (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [plugins]

  tasks:
    - name: Ping the shell (enabling a plugin is a call to the live shell)
      ansible.builtin.command: omarchy-shell shell ping
      register: plugins_ping
      changed_when: false
      failed_when: false

    - name: Fail early when omarchy-shell isn't running
      ansible.builtin.fail:
        msg: >-
          omarchy-shell didn't answer a ping (rc {{ plugins_ping.rc }}), so
          it isn't running: enabling and placing a plugin happens inside the
          live shell. Run this from inside the graphical session.
      when: plugins_ping.rc != 0

    - name: Read the plugin catalog (what is installed on disk)
      ansible.builtin.command: omarchy-plugin-catalog
      register: plugins_catalog
      changed_when: false

    - name: "Install the plugins that aren't on disk yet"
      ansible.builtin.command:
        argv: [omarchy-plugin-add, "{{ item.repo }}", --yes]
      loop: "{{ omarchy_plugins }}"
      loop_control:
        label: "{{ item.id }}"
      register: plugins_add_result
      failed_when: false
      when: item.id not in (plugins_catalog.stdout | from_json | map(attribute='id') | list)

    # Kept as its own task (instead of a block/rescue, which can't take a
    # loop here): omarchy plugin add's own message is the useful part, this
    # only adds what to do about the one case it can't explain.
    - name: "Explain a clone that omarchy plugin add refused"
      ansible.builtin.fail:
        msg: >-
          `omarchy plugin add {{ item.item.repo }}` failed (rc {{ item.rc }}):
          {{ item.stderr | default('unknown error') | trim }}. It refuses to
          install when another plugin already claims the id, and when the
          target directory exists — a directory left behind by a run that
          died before its manifest landed looks exactly like an installed
          plugin. Clear it (`omarchy plugin remove {{ item.item.id }}`, or
          delete {{ omarchy_plugins_dir }}/{{ item.item.id }}) and re-run.
      loop: "{{ plugins_add_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.id }}"
      when: item.rc | default(0) != 0

    - name: Let the shell discover the plugins
      # Not conditional on the adds having happened: a clone that was already
      # on disk but never rescanned (a run that died before add's own
      # rescanPlugins, or one added by hand) is unknown to the registry, and
      # omarchy-plugin-enable then fails with "plugin '<id>' is not known; run:
      # omarchy-shell shell rescanPlugins". A rescan is cheap and idempotent.
      ansible.builtin.command:
        argv: [omarchy-shell, shell, rescanPlugins]
      changed_when: false

    - name: Read the plugin catalog again (the adds are on disk now)
      ansible.builtin.command: omarchy-plugin-catalog
      register: plugins_catalog_final
      changed_when: false

    - name: "Assert each entry's id is the one its repo actually ships"
      ansible.builtin.fail:
        msg: >-
          {{ item.repo }} cloned fine, but no installed manifest declares the
          id {{ item.id }}, so nothing can enable it and the bar icon would
          never show up. Upstream must have renamed the plugin or moved it:
          the catalog lists these third-party ids —
          {{ plugins_catalog_final.stdout | from_json | rejectattr('firstParty') | map(attribute='id') | join(', ') }}.
          Fix `id` (and re-read the release) in
          group_vars/all/main.yml.
      loop: "{{ omarchy_plugins }}"
      loop_control:
        label: "{{ item.id }}"
      when: item.id not in (plugins_catalog_final.stdout | from_json | map(attribute='id') | list)

    - name: Pin each plugin to the ref its entry names
      # A detached checkout at the pin: for code that runs unsandboxed in the
      # shell, the pinned ref is the record of what was reviewed. `omarchy
      # plugin update` fast-forwards a pinned clone off its tag (a detached
      # HEAD still takes the fast-forward) and the next run pins it back;
      # bump `ref` to move forward on purpose.
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          dir={{ (omarchy_plugins_dir ~ '/' ~ item.id) | quote }}
          if ! target=$(git -C "$dir" rev-parse --verify --quiet {{ item.ref | quote }}^{commit}); then
            git -C "$dir" fetch --quiet origin {{ item.ref | quote }}
            target=$(git -C "$dir" rev-parse --verify {{ item.ref | quote }}^{commit})
          fi
          current=$(git -C "$dir" rev-parse HEAD)
          if [ "$target" = "$current" ]; then
            echo "already at $target"
            exit 0
          fi
          git -C "$dir" checkout --quiet --detach "$target"
          echo "checked out $target"
      register: plugins_pin_result
      loop: "{{ omarchy_plugins }}"
      loop_control:
        label: "{{ item.id }} ({{ item.ref }})"
      when: item.ref | default('') != ''
      changed_when: "'checked out' in plugins_pin_result.stdout | default('')"
      failed_when: false

    - name: "Explain a ref a checkout can't reach"
      ansible.builtin.fail:
        msg: >-
          Couldn't pin {{ item.item.id }} to {{ item.item.ref }}:
          {{ item.stderr | default('unknown error') | trim }}. The pin must be
          a tag, branch or commit the repo has (`git ls-remote --tags
          {{ item.item.repo }}`) — if it was renamed upstream, bump `ref` in
          group_vars/all/main.yml.
      loop: "{{ plugins_pin_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.id }}"
      when: item.rc | default(0) != 0

    - name: List the shell plugins
      ansible.builtin.command:
        argv: [omarchy-plugin-list, --json]
      register: plugins_list
      changed_when: false

    - name: Read the bar layout (which section each widget sits in)
      ansible.builtin.command:
        argv:
          - jq
          - -c
          - >-
            [.bar.layout | to_entries[] | .key as $section | .value[]
            | (if type == "object" then .id else . end) as $id
            | {key: $id, value: $section}] | from_entries
          - "{{ omarchy_shell_json }}"
      register: plugins_bar_layout
      changed_when: false

    - name: "Enable each plugin, in the bar section its entry asks for"
      ansible.builtin.command:
        argv: >-
          {{ ['omarchy-plugin-enable', item.id]
          + (['--section', item.section] if item.section | default('') else []) }}
      loop: "{{ omarchy_plugins }}"
      loop_control:
        label: "{{ item.id }}"
      register: plugins_enable_result
      vars:
        enabled_ids: "{{ plugins_list.stdout | from_json | selectattr('enabled') | map(attribute='id') | list }}"
        bar_sections: "{{ plugins_bar_layout.stdout | from_json }}"
      when: >-
        item.id not in enabled_ids
        or ((item.section | default('') != '')
        and (bar_sections[item.id] | default('')) != item.section)

    - name: Restart the shell so the new code and the bar layout take effect
      ansible.builtin.include_tasks: tasks/restart-shell.yml
      when: >-
        plugins_add_result is changed
        or plugins_pin_result is changed
        or plugins_enable_result is changed

    - name: List the shell plugins again (after the restart)
      ansible.builtin.command:
        argv: [omarchy-plugin-list, --json]
      register: plugins_list_after
      changed_when: false

    - name: Read the bar layout again (after the restart)
      ansible.builtin.command:
        argv:
          - jq
          - -c
          - >-
            [.bar.layout | to_entries[] | .key as $section | .value[]
            | (if type == "object" then .id else . end) as $id
            | {key: $id, value: $section}] | from_entries
          - "{{ omarchy_shell_json }}"
      register: plugins_bar_layout_after
      changed_when: false

    - name: "Assert each plugin is enabled, in its bar section"
      vars:
        entry: "{{ plugins_list_after.stdout | from_json | selectattr('id', 'equalto', item.id) | first | default({}) }}"
        sections: "{{ plugins_bar_layout_after.stdout | from_json }}"
      ansible.builtin.fail:
        msg: >-
          {{ item.name }} ({{ item.id }}) isn't in the state omarchy_plugins
          asks for: it is
          {{ 'enabled' if entry.enabled | default(false) else 'not enabled' }},
          and sits
          {{ 'in the ' + sections[item.id] + ' section of the bar' if sections[item.id] | default('') else 'nowhere in the bar layout' }}
          {{ '(expected ' + item.section + ')' if item.section | default('') }}.
          Check `omarchy plugin list` and
          {{ omarchy_shell_json }}, then enable it by hand with
          `omarchy plugin enable {{ item.id }}{{ ' --section ' + item.section if item.section | default('') }}`
          — that also moves an icon that is already on the bar.
      loop: "{{ omarchy_plugins }}"
      loop_control:
        label: "{{ item.id }}"
      when: >-
        not (entry.enabled | default(false))
        or (item.section | default('') != ''
        and (sections[item.id] | default('')) != item.section)

# omapin, per user: install the shell plugin from the marketplace (the
# binary comes from the package the system phase builds), enable it, and
# point gpg-agent at omapin.
- name: omapin (GnuPG prompts in the polkit-style shell dialog) (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pinentry]

  tasks:
    - name: Check whether the installed plugin code changed for this user
      ansible.builtin.include_tasks: tasks/plugin-code-stamp.yml
      vars:
        plugin_stamp_id: "{{ omapin_plugin_id }}"
        plugin_stamp_paths: ["{{ omapin_program }}"]

    - name: Keep the result under the name the tasks below use
      ansible.builtin.set_fact:
        omapin_package_result: "{{ plugin_stamp_result }}"

    - name: "Install omapin from the Omarchy plugin marketplace, at {{ omapin_ref }}"
      ansible.builtin.include_tasks: tasks/marketplace-plugin.yml
      vars:
        marketplace_plugin_id: "{{ omapin_plugin_id }}"
        marketplace_plugin_repo: "{{ omapin_repo }}"
        marketplace_plugin_ref: "{{ omapin_ref }}"

    - name: Keep the result under this play's name
      ansible.builtin.set_fact:
        omapin_plugin_changed: "{{ marketplace_plugin_changed }}"

    - name: Read the shell config
      ansible.builtin.slurp:
        src: "{{ omarchy_shell_json }}"
      register: omapin_shell_json_raw
      failed_when: false

    - name: Work out whether the plugin is already enabled
      ansible.builtin.set_fact:
        omapin_plugin_enabled: >-
          {{ (omapin_shell_json_raw.content is defined)
             and (((omapin_shell_json_raw.content | b64decode | from_json).plugins | default([]))
                  | selectattr('id', 'equalto', omapin_plugin_id) | list | length > 0) }}

    - name: "Enable the {{ omapin_plugin_id }} shell plugin"
      ansible.builtin.command:
        argv: [omarchy-shell, shell, enablePlugin, "{{ omapin_plugin_id }}", "{}"]
      register: omapin_enable_result
      failed_when: omapin_enable_result.rc != 0 or omapin_enable_result.stdout | trim != 'ok'
      when: not omapin_plugin_enabled

    - name: Restart the shell to load the new plugin code
      ansible.builtin.include_tasks: tasks/restart-shell.yml
      when: >-
        (omapin_package_result is changed or omapin_plugin_changed | bool)
        and omapin_enable_result is skipped

    - name: Create ~/.gnupg
      ansible.builtin.file:
        path: "{{ omapin_gpg_agent_conf | dirname }}"
        state: directory
        mode: "0700"

    - name: "Use omapin in gpg-agent ({{ omapin_gpg_agent_conf }})"
      ansible.builtin.lineinfile:
        path: "{{ omapin_gpg_agent_conf }}"
        regexp: '^\s*pinentry-program\s'
        line: "pinentry-program {{ omapin_program }}"
        create: true
        mode: "0600"
      register: omapin_agent_conf_result

    - name: Reload gpg-agent
      ansible.builtin.command: gpgconf --reload gpg-agent
      when: omapin_agent_conf_result.changed or omapin_package_result is changed
      changed_when: true

# omaskpass, per user: install the shell plugin from the marketplace (the
# binary comes from the package the system phase builds), enable it, and
# make omaskpass SSH_ASKPASS for the session (environment.d). An install
# from before the rename (ssh-askpass-omarchy, plugin lbssousa.ssh_askpass)
# is migrated on the way: the old plugin is disabled (the shell drops its
# shell.json entry even with the plugin's files gone) and its dangling link
# removed.
- name: omaskpass (SSH prompts in the polkit-style shell dialog) (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [ssh-askpass]

  tasks:
    - name: Check whether the installed plugin code changed for this user
      ansible.builtin.include_tasks: tasks/plugin-code-stamp.yml
      vars:
        plugin_stamp_id: "{{ omaskpass_plugin_id }}"
        plugin_stamp_paths: ["{{ omaskpass_program }}"]

    - name: Keep the result under the name the tasks below use
      ansible.builtin.set_fact:
        omaskpass_package_result: "{{ plugin_stamp_result }}"

    - name: "Install omaskpass from the Omarchy plugin marketplace, at {{ omaskpass_ref }}"
      ansible.builtin.include_tasks: tasks/marketplace-plugin.yml
      vars:
        marketplace_plugin_id: "{{ omaskpass_plugin_id }}"
        marketplace_plugin_repo: "{{ omaskpass_repo }}"
        marketplace_plugin_ref: "{{ omaskpass_ref }}"

    - name: Keep the result under this play's name
      ansible.builtin.set_fact:
        omaskpass_plugin_changed: "{{ marketplace_plugin_changed }}"

    - name: Read the shell config
      ansible.builtin.slurp:
        src: "{{ omarchy_shell_json }}"
      register: omaskpass_shell_json_raw
      failed_when: false

    - name: Work out whether the plugin (and the pre-rename one) is enabled
      ansible.builtin.set_fact:
        omaskpass_plugin_enabled: >-
          {{ (omaskpass_shell_json_raw.content is defined)
             and (((omaskpass_shell_json_raw.content | b64decode | from_json).plugins | default([]))
                  | selectattr('id', 'equalto', omaskpass_plugin_id) | list | length > 0) }}
        omaskpass_legacy_plugin_enabled: >-
          {{ (omaskpass_shell_json_raw.content is defined)
             and (((omaskpass_shell_json_raw.content | b64decode | from_json).plugins | default([]))
                  | selectattr('id', 'equalto', omaskpass_legacy_plugin_id) | list | length > 0) }}

    - name: "Disable the pre-rename {{ omaskpass_legacy_plugin_id }} shell plugin"
      ansible.builtin.command:
        argv: [omarchy-shell, shell, setPluginEnabled, "{{ omaskpass_legacy_plugin_id }}", "false"]
      register: omaskpass_legacy_disable_result
      failed_when: omaskpass_legacy_disable_result.rc != 0 or omaskpass_legacy_disable_result.stdout | trim != 'ok'
      when: omaskpass_legacy_plugin_enabled

    - name: "Remove the pre-rename plugin link ({{ omaskpass_legacy_plugin_link }})"
      ansible.builtin.file:
        path: "{{ omaskpass_legacy_plugin_link }}"
        state: absent

    # enablePlugin answers "unknown" for a plugin the running shell hasn't
    # scanned yet, which a freshly made link is.
    - name: Let the shell discover the plugin
      ansible.builtin.command:
        argv: [omarchy-shell, shell, rescanPlugins]
      changed_when: false
      when: not omaskpass_plugin_enabled

    - name: "Enable the {{ omaskpass_plugin_id }} shell plugin"
      ansible.builtin.command:
        argv: [omarchy-shell, shell, enablePlugin, "{{ omaskpass_plugin_id }}", "{}"]
      register: omaskpass_enable_result
      failed_when: omaskpass_enable_result.rc != 0 or omaskpass_enable_result.stdout | trim != 'ok'
      when: not omaskpass_plugin_enabled

    # A keepLoaded service doesn't reload when its files change, so new
    # plugin code (a new clone, a new pin or a new binary) needs a restart.
    - name: Restart the shell to load the new plugin code
      ansible.builtin.include_tasks: tasks/restart-shell.yml
      when: >-
        (omaskpass_plugin_changed | bool or omaskpass_package_result is changed)
        and omaskpass_enable_result is skipped

    - name: Create ~/.config/environment.d
      ansible.builtin.file:
        path: "{{ omaskpass_environment_conf | dirname }}"
        state: directory
        mode: "0755"

    # Read at login: a session started before this keeps the old
    # SSH_ASKPASS until the user logs in again.
    - name: "Configure SSH to use omaskpass ({{ omaskpass_environment_conf }})"
      ansible.builtin.copy:
        content: |
          SSH_ASKPASS={{ omaskpass_program }}
          SSH_ASKPASS_REQUIRE=prefer
        dest: "{{ omaskpass_environment_conf }}"
        mode: "0644"

# polkit-omarchy, per user: link the plugin and enable it, which disables
# Omarchy's built-in omarchy.polkit agent, then check that the swap took.
- name: polkit-omarchy (polkit agent with security key touch prompt) (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [polkit-agent]

  tasks:
    - name: Check whether the installed plugin code changed for this user
      ansible.builtin.include_tasks: tasks/plugin-code-stamp.yml
      vars:
        plugin_stamp_id: "{{ polkit_agent_plugin_id }}"
        plugin_stamp_paths: ["{{ polkit_agent_plugin_dir }}"]

    - name: Keep the result under the name the tasks below use
      ansible.builtin.set_fact:
        polkit_agent_copy_result: "{{ plugin_stamp_result }}"

    - name: Create ~/.config/omarchy/plugins
      ansible.builtin.file:
        path: "{{ polkit_agent_plugin_link | dirname }}"
        state: directory
        mode: "0755"

    - name: "Link the shell plugin ({{ polkit_agent_plugin_link }})"
      ansible.builtin.file:
        src: "{{ polkit_agent_plugin_dir }}"
        dest: "{{ polkit_agent_plugin_link }}"
        state: link
        force: true
      register: polkit_agent_link_result

    - name: Let the shell discover the plugin
      # Not conditional on the link having changed: omarchy-plugin-enable
      # fails outright ("plugin '<id>' is not known; run: omarchy-shell
      # shell rescanPlugins") when the registry hasn't seen the link yet,
      # which is exactly the state a run that died between the two tasks
      # above leaves behind. A rescan is cheap and idempotent.
      ansible.builtin.command:
        argv: [omarchy-shell, shell, rescanPlugins]
      changed_when: false

    - name: List the shell plugins
      ansible.builtin.command:
        argv: [omarchy-plugin-list, --json]
      register: polkit_agent_plugin_list
      changed_when: false

    - name: "Enable {{ polkit_agent_plugin_id }} (disables {{ polkit_agent_replaces_id }})"
      ansible.builtin.command:
        argv: [omarchy-plugin-enable, "{{ polkit_agent_plugin_id }}"]
      register: polkit_agent_enable_result
      when: >-
        not (polkit_agent_plugin_list.stdout | from_json
             | selectattr('id', 'equalto', polkit_agent_plugin_id)
             | selectattr('enabled') | list | length > 0)

    - name: Restart the shell to load the new agent code
      ansible.builtin.include_tasks: tasks/restart-shell.yml
      when: >-
        polkit_agent_copy_result is changed
        or polkit_agent_link_result is changed
        or polkit_agent_enable_result is changed

    # The swap is only real if both halves hold: ours loaded, Omarchy's
    # not. A clone that merely got linked is silently inert (the shell
    # keeps running omarchy.polkit), and neither task above fails in that
    # case, so assert it here rather than trusting the exit status.
    - name: List the shell plugins again (after the restart)
      ansible.builtin.command:
        argv: [omarchy-plugin-list, --json]
      register: polkit_agent_plugin_list_final
      changed_when: false

    - name: Assert {{ polkit_agent_plugin_id }} replaced {{ polkit_agent_replaces_id }}
      vars:
        final_plugins: "{{ polkit_agent_plugin_list_final.stdout | from_json }}"
        clone: "{{ final_plugins | selectattr('id', 'equalto', polkit_agent_plugin_id) | first | default({}) }}"
        replaced: "{{ final_plugins | selectattr('id', 'equalto', polkit_agent_replaces_id) | first | default({}) }}"
      ansible.builtin.fail:
        msg: >-
          {{ polkit_agent_plugin_id }} did not take over from
          {{ polkit_agent_replaces_id }}: ours is
          {{ 'enabled' if clone.enabled | default(false) else 'missing or disabled' }},
          the built-in is
          {{ 'disabled' if not (replaced.enabled | default(false)) else 'still enabled' }}.
          Check `omarchy-plugin-list` and
          `~/.config/omarchy/shell.json` (disabledPlugins); enable it by
          hand with `omarchy plugin enable {{ polkit_agent_plugin_id }}`,
          which also disables {{ polkit_agent_replaces_id }} again.
      when: >
        not (clone.enabled | default(false))
        or (replaced.enabled | default(false))

# xdg-desktop-portal-omarchy, per user: link and enable the packaged dialog
# plugin, and route the RemoteDesktop and Clipboard portals to the backend
# in ~/.config/xdg-desktop-portal/hyprland-portals.conf — the same file
# user/file-chooser.yml manages (seeded from Omarchy's copy when missing;
# each play only sets its own lines). Without the routing, the frontend
# keeps "default=hyprland;gtk", neither of which implements them.
- name: xdg-desktop-portal-omarchy (clipboard portal) (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [clipboard-portal]

  tasks:
    - name: Check whether the installed plugin code changed for this user
      ansible.builtin.include_tasks: tasks/plugin-code-stamp.yml
      vars:
        plugin_stamp_id: "{{ clipboard_portal_plugin_id }}"
        plugin_stamp_paths: ["{{ clipboard_portal_program }}", "{{ clipboard_portal_plugin_dir }}"]

    - name: Keep the result under the name the tasks below use
      ansible.builtin.set_fact:
        clipboard_portal_package_result: "{{ plugin_stamp_result }}"

    - name: Create ~/.config/omarchy/plugins
      ansible.builtin.file:
        path: "{{ clipboard_portal_plugin_link | dirname }}"
        state: directory
        mode: "0755"

    - name: "Link the packaged shell plugin ({{ clipboard_portal_plugin_link }})"
      ansible.builtin.file:
        src: "{{ clipboard_portal_plugin_dir }}"
        dest: "{{ clipboard_portal_plugin_link }}"
        state: link
        force: true
      register: clipboard_portal_link_result

    - name: Read the shell config
      ansible.builtin.slurp:
        src: "{{ omarchy_shell_json }}"
      register: clipboard_portal_shell_json_raw
      failed_when: false

    - name: Work out whether the plugin is already enabled
      ansible.builtin.set_fact:
        clipboard_portal_plugin_enabled: >-
          {{ (clipboard_portal_shell_json_raw.content is defined)
             and (((clipboard_portal_shell_json_raw.content | b64decode | from_json).plugins | default([]))
                  | selectattr('id', 'equalto', clipboard_portal_plugin_id) | list | length > 0) }}

    - name: "Enable the {{ clipboard_portal_plugin_id }} shell plugin"
      ansible.builtin.command:
        argv: [omarchy-shell, shell, enablePlugin, "{{ clipboard_portal_plugin_id }}", "{}"]
      register: clipboard_portal_enable_result
      failed_when: clipboard_portal_enable_result.rc != 0 or clipboard_portal_enable_result.stdout | trim != 'ok'
      when: not clipboard_portal_plugin_enabled

    - name: Restart the shell to load the new plugin code
      ansible.builtin.include_tasks: tasks/restart-shell.yml
      when: >-
        (clipboard_portal_package_result is changed or clipboard_portal_link_result is changed)
        and clipboard_portal_enable_result is skipped

    - name: Create ~/.config/xdg-desktop-portal
      ansible.builtin.file:
        path: "{{ file_chooser_portals_conf | dirname }}"
        state: directory
        mode: "0755"

    - name: Seed the portals config from Omarchy's, if missing
      ansible.builtin.copy:
        src: "{{ file_chooser_portals_conf_seed }}"
        dest: "{{ file_chooser_portals_conf }}"
        remote_src: true
        force: false
        mode: "0644"
      register: clipboard_portal_seed_result

    - name: "Route the RemoteDesktop and Clipboard portals to it ({{ file_chooser_portals_conf }})"
      community.general.ini_file:
        path: "{{ file_chooser_portals_conf }}"
        section: preferred
        option: "{{ item }}"
        value: "{{ clipboard_portal_name }}"
        no_extra_spaces: true
        mode: "0644"
      loop: "{{ clipboard_portal_interfaces }}"
      register: clipboard_portal_routing_result

    - name: Restart xdg-desktop-portal to pick up the routing
      ansible.builtin.command: systemctl --user restart xdg-desktop-portal.service
      when: clipboard_portal_seed_result.changed or clipboard_portal_routing_result.changed
      changed_when: true
      failed_when: false

    # D-Bus activated: a running one keeps the old binary and config until
    # restarted; one that isn't running starts on the next request.
    - name: Restart the backend if it runs an older build
      ansible.builtin.command: systemctl --user try-restart xdg-desktop-portal-omarchy.service
      when: clipboard_portal_package_result is changed
      changed_when: true
      failed_when: false

# fingerprint-omarchy, per user: install the overlay from the marketplace and
# enable it, and point Setup > Security > Fingerprint at it (the stock entry
# runs Omarchy's terminal script; omarchy-multiuser, now opt-in, did this too).
- name: fingerprint-omarchy (fingerprint overlay) (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [fingerprint]

  tasks:
    - name: "Install fingerprint-omarchy from the Omarchy plugin marketplace, at {{ fingerprint_plugin_ref }}"
      ansible.builtin.include_tasks: tasks/marketplace-plugin.yml
      vars:
        marketplace_plugin_id: "{{ fingerprint_plugin_id }}"
        marketplace_plugin_repo: "{{ fingerprint_plugin_repo }}"
        marketplace_plugin_ref: "{{ fingerprint_plugin_ref }}"

    - name: Keep the result under this play's name
      ansible.builtin.set_fact:
        fingerprint_plugin_changed: "{{ marketplace_plugin_changed }}"

    - name: Read the shell config
      ansible.builtin.slurp:
        src: "{{ omarchy_shell_json }}"
      register: fingerprint_plugin_shell_json_raw
      failed_when: false

    - name: Work out whether the plugin is already enabled
      ansible.builtin.set_fact:
        fingerprint_plugin_enabled: >-
          {{ (fingerprint_plugin_shell_json_raw.content is defined)
             and (((fingerprint_plugin_shell_json_raw.content | b64decode | from_json).plugins | default([]))
                  | selectattr('id', 'equalto', fingerprint_plugin_id) | list | length > 0) }}

    # enablePlugin answers "unknown" for a plugin the running shell hasn't
    # scanned yet (add rescans, but a clone left by a run that died before
    # that wouldn't be known).
    - name: Let the shell discover the plugin
      ansible.builtin.command:
        argv: [omarchy-shell, shell, rescanPlugins]
      changed_when: false
      when: not fingerprint_plugin_enabled

    - name: "Enable the {{ fingerprint_plugin_id }} shell plugin"
      ansible.builtin.command:
        argv: [omarchy-shell, shell, enablePlugin, "{{ fingerprint_plugin_id }}", "{}"]
      register: fingerprint_plugin_enable_result
      failed_when: fingerprint_plugin_enable_result.rc != 0 or fingerprint_plugin_enable_result.stdout | trim != 'ok'
      when: not fingerprint_plugin_enabled

    # keepLoaded: the overlay doesn't reload when its files change.
    - name: Restart the shell to load the new plugin code
      ansible.builtin.include_tasks: tasks/restart-shell.yml
      when: >-
        fingerprint_plugin_changed | bool
        and fingerprint_plugin_enable_result is skipped

    - name: "Open the overlay from Setup > Security > Fingerprint"
      ansible.builtin.include_tasks: tasks/menu-override.yml
      vars:
        menu_override_id: setup.security.fingerprint
        menu_override_action: "omarchy-shell shell summon {{ fingerprint_plugin_id }} '{}'"

# security-key-omarchy, per user: install the overlay from the marketplace and
# enable it, and point Setup > Security > Fido2 and Remove > Fido2 at it (the
# stock entries run Omarchy's terminal scripts; omarchy-multiuser, now opt-in,
# did this for Setup too).
- name: security-key-omarchy (security key overlay) (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [security-key]

  tasks:
    - name: "Install security-key-omarchy from the Omarchy plugin marketplace, at {{ security_key_plugin_ref }}"
      ansible.builtin.include_tasks: tasks/marketplace-plugin.yml
      vars:
        marketplace_plugin_id: "{{ security_key_plugin_id }}"
        marketplace_plugin_repo: "{{ security_key_plugin_repo }}"
        marketplace_plugin_ref: "{{ security_key_plugin_ref }}"

    - name: Keep the result under this play's name
      ansible.builtin.set_fact:
        security_key_plugin_changed: "{{ marketplace_plugin_changed }}"

    - name: Read the shell config
      ansible.builtin.slurp:
        src: "{{ omarchy_shell_json }}"
      register: security_key_plugin_shell_json_raw
      failed_when: false

    - name: Work out whether the plugin is already enabled
      ansible.builtin.set_fact:
        security_key_plugin_enabled: >-
          {{ (security_key_plugin_shell_json_raw.content is defined)
             and (((security_key_plugin_shell_json_raw.content | b64decode | from_json).plugins | default([]))
                  | selectattr('id', 'equalto', security_key_plugin_id) | list | length > 0) }}

    # enablePlugin answers "unknown" for a plugin the running shell hasn't
    # scanned yet (add rescans, but a clone left by a run that died before
    # that wouldn't be known).
    - name: Let the shell discover the plugin
      ansible.builtin.command:
        argv: [omarchy-shell, shell, rescanPlugins]
      changed_when: false
      when: not security_key_plugin_enabled

    - name: "Enable the {{ security_key_plugin_id }} shell plugin"
      ansible.builtin.command:
        argv: [omarchy-shell, shell, enablePlugin, "{{ security_key_plugin_id }}", "{}"]
      register: security_key_plugin_enable_result
      failed_when: security_key_plugin_enable_result.rc != 0 or security_key_plugin_enable_result.stdout | trim != 'ok'
      when: not security_key_plugin_enabled

    # keepLoaded: the overlay doesn't reload when its files change.
    - name: Restart the shell to load the new plugin code
      ansible.builtin.include_tasks: tasks/restart-shell.yml
      when: >-
        security_key_plugin_changed | bool
        and security_key_plugin_enable_result is skipped

    - name: "Open the overlay from Setup > Security > Fido2"
      ansible.builtin.include_tasks: tasks/menu-override.yml
      vars:
        menu_override_id: setup.security.fido2
        menu_override_action: "omarchy-shell shell summon {{ security_key_plugin_id }} '{}'"

    # The overlay removes keys one by one (each has its own button). The stock
    # entry's script, which takes pam_u2f out of sudo/polkit, deletes
    # /etc/fido2 for every user and drops the packages, stays available as
    # omarchy-remove-security-fido2.
    - name: "Open the overlay from Remove > Fido2"
      ansible.builtin.include_tasks: tasks/menu-override.yml
      vars:
        menu_override_id: remove.security.fido2
        menu_override_action: "omarchy-shell shell summon {{ security_key_plugin_id }} '{}'"
