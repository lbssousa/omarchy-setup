# Fish shell, with the same Starship prompt as Omarchy, set as the
# default login shell so every terminal opens in it.
#
# Omarchy's default shell is Bash and its prompt (see
# /usr/share/omarchy/config/starship.toml, copied to ~/.config/starship.toml
# on first use) comes from `starship init bash` in
# $OMARCHY_PATH/default/bash/rc. Fish can't source that rc file, but it
# doesn't need to for the prompt: Starship is shell-agnostic and reads the
# SAME ~/.config/starship.toml, so once fish runs `starship init fish |
# source` its prompt is identical to Omarchy's.
#
# The rest of that rc is ported to fish so the shell behaves the same:
# environment, aliases and small functions go in the block in config.fish
# below; every function from $OMARCHY_PATH/default/bash/fns/ (tmux and
# herdr layouts, the reconnecting ssh wrapper, rsync watchers, port
# forwards, worktrees, drives), the lazy `try` and the `omarchy`
# completion are autoloaded files under ~/.config/fish/{functions,
# completions}/, copied from playbooks/files/fish/. The ports keep what
# the bash code means to do: where it has an obvious bug (tdl focusing a
# pane it never set), the fish file says so and does the intended thing.
#
# Left out because fish can't do them: hiding the omarchy-* binaries from
# first-word completion (bash's `complete -I -X`) and fzf's `**<Tab>`
# completion (fzf ships key bindings only for fish; those are enabled).
# History options, `set +h` and inputrc are fish's defaults or don't apply.
#
# Omarchy changes its bash files from time to time, so the play warns
# (without failing) when they no longer match playbooks/files/fish/
# UPSTREAM.sha256 or define a name fish lacks. Review the port, then
# `just fish-upstream-hash` to record the new versions.
#
# This play also makes sure ~/.config/starship.toml exists (seeded from
# Omarchy's default when missing, never overwriting a customized one) and
# that fish's own startup file sets the session up. The default shell is
# changed through /etc/passwd (chsh equivalent), which is what Ghostty,
# Alacritty, Foot and Kitty all use when they have no explicit `command`.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags fish
#        (or: just fish)
- name: Fish shell (Starship prompt, default login shell)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [fish]

  vars:
    fish_starship_config: "{{ ansible_facts.env.HOME }}/.config/starship.toml"
    fish_starship_seed: /usr/share/omarchy/config/starship.toml
    fish_config: "{{ ansible_facts.env.HOME }}/.config/fish/config.fish"

  tasks:
    - name: Install fish (and starship, in case it is missing)
      community.general.pacman:
        name:
          - fish
          - starship
        state: present
      become: true

    - name: Make sure /usr/bin/fish is a valid login shell
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: /usr/bin/fish
      become: true

    - name: Seed ~/.config/starship.toml from Omarchy's default, if missing
      ansible.builtin.copy:
        src: "{{ fish_starship_seed }}"
        dest: "{{ fish_starship_config }}"
        remote_src: true
        force: false
        mode: "0644"

    - name: Create the fish config directory
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/fish"
        state: directory
        mode: "0755"

    - name: Configure Fish for the Omarchy defaults (environment, tools, aliases, prompt)
      ansible.builtin.blockinfile:
        path: "{{ fish_config }}"
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK (playbooks/fish.yml — Omarchy defaults for Fish)"
        block: |
          # ---- Environment (mirrors /usr/share/omarchy/default/bash/env-bootstrap and envs) ----
          # /etc/omarchy.conf is written by omarchy-dev-link and reset by
          # omarchy-dev-unlink. When absent, force the packaged default instead
          # of preserving a stale inherited value. It's shell code, so sh reads it,
          # as bash's `source` does.
          if test -f /etc/omarchy.conf
              set -gx OMARCHY_PATH (sh -c '. /etc/omarchy.conf; printf %s "${OMARCHY_PATH:-/usr/share/omarchy}"')
          else
              set -gx OMARCHY_PATH /usr/share/omarchy
          end
          # Only prepend in dev-link mode; packaged binaries are already in /usr/bin.
          set -l omarchy_bin (string replace -r '/$' '' -- $OMARCHY_PATH)/bin
          if test "$OMARCHY_PATH" != /usr/share/omarchy; and not contains -- $omarchy_bin $PATH
              set -gx PATH $omarchy_bin $PATH
          end

          if not contains $HOME/.local/share/mise/shims $PATH
              set -gx PATH $PATH $HOME/.local/share/mise/shims
          end
          if not contains $HOME/.local/bin $PATH
              set -gx PATH $PATH $HOME/.local/bin
          end

          if not set -q EDITOR
              set -gx EDITOR 'omarchy-launch-editor --inline'
          end
          if not set -q SUDO_EDITOR
              set -gx SUDO_EDITOR $EDITOR
          end
          if not set -q BROWSER
              set -gx BROWSER omarchy-launch-browser
          end
          set -gx BAT_THEME ansi
          set -gx MANROFFOPT '-c'
          set -gx MANPAGER "sh -c 'col -bx | bat -l man -p'"

          if not set -q LANG
              set -gx LANG C.UTF-8
          end

          # ---- File system ----
          if command -q eza
              alias ls 'eza -lh --group-directories-first --icons=auto'
              alias lsa 'ls -a'
              alias lt 'eza --tree --level=2 --long --icons --git'
              alias lta 'lt -a'
          end

          if test "$TERM" = "xterm-kitty"
              alias ff "fzf --preview 'case \$(file --mime-type -b {}) in image/*) kitty icat --clear --transfer-mode=memory --stdin=no --place=\${FZF_PREVIEW_COLUMNS}x\${FZF_PREVIEW_LINES}@0x0 {} ;; *) bat --style=numbers --color=always {} ;; esac'"
          else
              alias ff "fzf --preview 'bat --style=numbers --color=always {}'"
          end
          function eff
              # The pick is quoted for eval, so names with spaces open intact,
              # and a cancelled pick opens nothing (bash opens an empty editor).
              set -l file (ff); or return
              eval $EDITOR (string escape -- $file)
          end
          function sff
              if test (count $argv) -eq 0
                  echo 'Usage: sff <destination> (e.g. sff host:/tmp/)'
                  return 1
              end
              set -l file (find . -type f -printf '%T@\t%p\n' | sort -rn | cut -f2- | ff)
              test -n "$file"; and scp "$file" $argv[1]
          end

          # ---- Navigation (zoxide, same zd() behaviour) ----
          if command -q zoxide
              alias cd 'zd'
              function zd
                  # __zoxide_cd_internal is zoxide's copy of fish's own cd, which
                  # (unlike builtin cd) keeps dirprev, so cd -, prevd and cdh work.
                  if test (count $argv) -eq 0
                      __zoxide_cd_internal ~; or return
                  else if test -d "$argv[1]"
                      __zoxide_cd_internal $argv[1]; or return
                  else
                      if not z $argv
                          echo 'Error: Directory not found'
                          return 1
                      end
                      printf '\U000F17A9 '
                      pwd
                  end
              end
              zoxide init fish | source
          end

          function open
              # disown: no job left behind, like bash's ( … & ) subshell.
              xdg-open $argv >/dev/null 2>&1 &
              disown
          end

          # ---- Directories ----
          alias .. 'cd ..'
          alias ... 'cd ../..'
          alias .... 'cd ../../..'

          # ---- Tools ----
          alias a 'omarchy-agent --inline'
          alias c 'opencode --auto'
          alias cx 'printf "\033[2J\033[3J\033[H" && claude --permission-mode auto'
          alias cy 'codex --approve-for-me'
          alias d 'docker'
          alias r 'rails'
          alias t 'tmux attach || tmux new -s Work'
          alias h 'herdr'
          # tdl and the other layouts are autoloaded from ~/.config/fish/functions/.
          alias ic 'tdl c'
          alias ix 'tdl cx'
          alias icx 'tdl c cx'
          alias mup 'MISE_MINIMUM_RELEASE_AGE=0 mise up'
          function n
              if test (count $argv) -eq 0
                  command nvim .
              else
                  command nvim $argv
              end
          end

          # ---- Git ----
          alias g 'git'
          alias gcm 'git commit -m'
          alias gcam 'git commit -a -m'
          alias gcad 'git commit -a --amend'

          # ---- Compression ----
          function compress
              set -l target (string replace -r '/+$' '' $argv[1])
              tar -czf "$target.tar.gz" "$target"
          end
          alias decompress 'tar -xzf'

          # ---- Interactive-only setup ----
          if status is-interactive
              # Prompt: same Starship configuration as Omarchy/bash.
              if command -q starship
                  starship init fish | source
              end
              # Key bindings for fzf (provided by the package under /usr/share/fish).
              if command -q fzf; and functions -q fzf_key_bindings
                  fzf_key_bindings
              end
          end

    - name: Install the fish ports of Omarchy's bash functions (autoloaded)
      ansible.builtin.copy:
        src: fish/functions/
        dest: "{{ ansible_facts.env.HOME }}/.config/fish/functions/"
        mode: "0644"
        directory_mode: "0755"

    - name: Install the fish completion for the omarchy command
      ansible.builtin.copy:
        src: fish/completions/
        dest: "{{ ansible_facts.env.HOME }}/.config/fish/completions/"
        mode: "0644"
        directory_mode: "0755"

    # Drift check: warn, never fail, when Omarchy's bash files differ from
    # the versions the fish port follows, or define a name fish lacks.
    - name: Compare Omarchy's bash files with the versions the fish port follows
      ansible.builtin.command:
        cmd: sha256sum --check --quiet -
        chdir: /usr/share/omarchy/default/bash
        stdin: "{{ lookup('ansible.builtin.file', 'fish/UPSTREAM.sha256') }}"
      register: fish_upstream_files
      changed_when: false
      failed_when: false

    - name: Find Omarchy bash aliases and functions with no fish counterpart
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          bash_names=$(bash -c '
            if [ -f /etc/omarchy.conf ]; then . /etc/omarchy.conf; fi
            : "${OMARCHY_PATH:=/usr/share/omarchy}"
            source "$OMARCHY_PATH/default/bash/aliases"
            source "$OMARCHY_PATH/default/bash/functions"
            compgen -a
            compgen -A function' | sort -u)
          fish_names=$(fish -c 'functions -an' | tr ',' '\n' | sort -u)
          comm -23 <(printf '%s\n' "$bash_names") <(printf '%s\n' "$fish_names")
        executable: /bin/bash
      register: fish_missing_names
      changed_when: false
      failed_when: false

    - name: Warn when the fish port may be out of date
      ansible.builtin.debug:
        msg: >-
          Omarchy's bash setup changed since the fish port was written.
          {% if fish_upstream_files.rc != 0 %}Files that differ from
          playbooks/files/fish/UPSTREAM.sha256: {{ fish_upstream_files.stdout_lines
          | map('regex_replace', ':.*$', '') | join(', ') }}.{% endif %}
          {% if fish_missing_names.stdout | length > 0 %}Names with no fish
          counterpart: {{ fish_missing_names.stdout_lines | join(', ') }}.{% endif %}
          Review /usr/share/omarchy/default/bash against playbooks/files/fish/,
          then record the new versions with `just fish-upstream-hash`.
      when: fish_upstream_files.rc != 0 or fish_missing_names.stdout | length > 0

    - name: Set fish as the default login shell
      ansible.builtin.user:
        name: "{{ ansible_facts.env.USER }}"
        shell: /usr/bin/fish
      become: true

    - name: Remind about picking the new shell up
      ansible.builtin.debug:
        msg: >-
          Fish is installed and is now your default login shell. Open a new
          terminal (or log out and back in) to use it; existing terminals
          keep running Bash. The Starship prompt reads ~/.config/starship.toml,
          the same one Omarchy uses.
