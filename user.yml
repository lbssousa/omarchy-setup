---
# User phase: everything that lives in the user's home or session —
# ~/.config, systemctl --user, gsettings, the live omarchy-shell. Run by
# each user, inside their own graphical session, as themselves (never under
# run0): no task here becomes root. What it needs installed comes from
# system.yml, run by an administrator first.
#
# Which plays run is the feature selection (features.yml + this user's
# choices from `just configure`): scripts/run-phase.sh passes it and the
# matching --tags. Each play is tagged with its feature id; the app plays
# (tag apps) and the always-tagged ones run every time. Per-user settings
# come from users/<user>.yml and ~/.config/omarchy-setup/local.yml.
#
# Usage: just user

- name: "Preflight: as the user, in the graphical session, with the selection"
  ansible.builtin.import_playbook: playbooks/user/preflight.yml

- name: Fish, every account's login shell, with Omarchy's Starship prompt (always)
  ansible.builtin.import_playbook: playbooks/user/fish.yml

- name: git identity (from the untracked local.yml)
  ansible.builtin.import_playbook: playbooks/user/git-identity.yml

- name: Flatpak apps in the session (XDG_DATA_DIRS, Bazaar's D-Bus mask)
  ansible.builtin.import_playbook: playbooks/user/flatpak.yml

- name: "Apps: the default browser (and the Firefox Flatpak shim)"
  ansible.builtin.import_playbook: playbooks/user/apps/browser.yml

- name: "Apps: Omarchy's web apps rebuilt with the default browser"
  ansible.builtin.import_playbook: playbooks/user/apps/webapps.yml

- name: "Apps: the default password manager (keybind, autostart, SSH agent)"
  ansible.builtin.import_playbook: playbooks/user/apps/password.yml

- name: "Apps: the default PDF viewer, Zathura's tweaks"
  ansible.builtin.import_playbook: playbooks/user/apps/pdf.yml

- name: "Apps: the default file manager"
  ansible.builtin.import_playbook: playbooks/user/apps/file-manager.yml

- name: "Apps: Emacs (AUCTeX, yasnippet, lsp-mode, classic theme)"
  ansible.builtin.import_playbook: playbooks/user/apps/emacs.yml

- name: "Apps: Zed (Omazed, font sizes, Podman)"
  ansible.builtin.import_playbook: playbooks/user/apps/zed.yml

- name: Flea file dialogs for non-GNOME apps
  ansible.builtin.import_playbook: playbooks/user/file-chooser.yml

- name: gregorio-lsp, grelint, grefmt
  ansible.builtin.import_playbook: playbooks/user/gregorio-lsp.yml

- name: "LazyVim: LaTeX extra, gregorio.nvim"
  ansible.builtin.import_playbook: playbooks/user/lazyvim.yml

- name: "Portuguese (Brazil): Omarchy's language, folders, browsers, OCR"
  ansible.builtin.import_playbook: playbooks/user/ptbr.yml

- name: Podman check, the container name in the prompt
  ansible.builtin.import_playbook: playbooks/user/containers.yml

- name: Nix session, direnv hooks, nix-direnv
  ansible.builtin.import_playbook: playbooks/user/nix.yml

- name: The L4160 as this user's default printer
  ansible.builtin.import_playbook: playbooks/user/printer.yml

- name: Column resize keys, scale and text size, night light at sunset
  ansible.builtin.import_playbook: playbooks/user/desktop.yml

- name: Compose off Caps Lock (for keyd)
  ansible.builtin.import_playbook: playbooks/user/capslock.yml

- name: Omadwaita themes
  ansible.builtin.import_playbook: playbooks/user/omadwaita-themes.yml

- name: Omaraptor themes
  ansible.builtin.import_playbook: playbooks/user/omaraptor-themes.yml

- name: Omaraptor day/night switching
  ansible.builtin.import_playbook: playbooks/user/omaraptor-theme-auto.yml

- name: "Starship extras: Nix badge, ahead/behind"
  ansible.builtin.import_playbook: playbooks/user/starship.yml

- name: Omarchy shell plugins, omapin, ssh-askpass-omarchy, polkit-omarchy
  ansible.builtin.import_playbook: playbooks/user/plugins.yml

- name: Homebrew on PATH (opt-in)
  ansible.builtin.import_playbook: playbooks/user/homebrew.yml

- name: Google Drive via rclone (opt-in)
  ansible.builtin.import_playbook: playbooks/user/rclone-gdrive.yml

- name: BGRT theme (opt-in)
  ansible.builtin.import_playbook: playbooks/user/bgrt-theme.yml

- name: Yubikey GPG key and git signing (opt-in)
  ansible.builtin.import_playbook: playbooks/user/yubikey.yml
