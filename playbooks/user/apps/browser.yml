---
# Web browsers, per user (apps: browser): the per-user half of Omarchy's
# omarchy-install-browser (and omarchy-remove-browser) for Google Chrome and
# Brave Origin, the hidden firefox.desktop shim for the Firefox Flatpak, and
# the default browser. Omarchy's web apps follow in apps/webapps.yml.
#
# For Google Chrome and Brave Origin, the package and its managed policy
# directory (/etc/opt/chrome/policies/managed, /etc/brave/policies/managed)
# come from the system phase (system/apps/packages.yml and
# system/apps/browser.yml). Because the binary is already on PATH by the time
# omarchy-default-browser runs below, it doesn't invoke
# omarchy-install-browser itself (nor could its sudo calls prompt under
# Ansible), so the remaining per-user steps of omarchy-install-browser run
# here: seeding ~/.config/chrome-flags.conf (or brave-origin-flags.conf) from
# Omarchy's chromium-flags.conf, running Omarchy's Chromium extension and
# video-decode helpers when a flags file is newly created, and applying the
# active Omarchy theme color via omarchy-theme-set-browser. When a browser is
# uninstalled, its flags file is removed (matching omarchy-remove-browser).
#
# omarchy-default-browser, omarchy-cmd-default-browser and
# omarchy-launch-browser only know the native id firefox.desktop and run
# the first token of its Exec=; the shim's Exec is /usr/local/bin/firefox
# (linked by system/apps/browser.yml), and NoDisplay=true keeps the app
# launcher showing only the Flatpak's own entry. With the native build
# installed it owns firefox.desktop, and the shim goes.
#
# The default is set through omarchy-default-browser (Setup > Defaults >
# Browser), or for a build it doesn't know (the Brave Flatpak) through
# xdg-settings; only when it isn't the default already.
- name: Apps — web browsers (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [apps]

  vars:
    browser_default: "{{ apps_catalog.browser[apps.browser.default] }}"
    firefox_shim_on: "{{ 'firefox-flatpak' in apps.browser.installed and 'firefox' not in apps.browser.installed }}"
    installed_chromium_browsers: >-
      {{ chromium_browsers | dict2items
         | selectattr('key', 'in', apps.browser.installed) | list }}

  tasks:
    - name: "Seed ~/.config/{{ item.value.flags_file }} from Omarchy's chromium-flags.conf"
      ansible.builtin.copy:
        src: "{{ chromium_flags_src }}"
        dest: "{{ target_home }}/.config/{{ item.value.flags_file }}"
        remote_src: true
        force: false
        mode: "0644"
      loop: "{{ chromium_browsers | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key in apps.browser.installed
      register: chromium_flags_seeded

    - name: "Remove ~/.config/{{ item.value.flags_file }} when {{ item.value.label }} isn't installed"
      ansible.builtin.file:
        path: "{{ target_home }}/.config/{{ item.value.flags_file }}"
        state: absent
      loop: "{{ chromium_browsers | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key not in apps.browser.installed

    - name: Set up Omarchy's Chromium extensions and video decode flags
      ansible.builtin.command: "{{ item }}"
      loop:
        - omarchy-install-chromium-copy-url
        - omarchy-install-chromium-ytdlp
        - omarchy-install-video-decode
      when: chromium_flags_seeded is changed
      failed_when: false

    - name: Check whether each installed Chromium-family browser has Omarchy's theme policy
      ansible.builtin.stat:
        path: "{{ item.value.policy_dir }}/color.json"
      loop: "{{ installed_chromium_browsers }}"
      loop_control:
        label: "{{ item.key }}"
      register: chromium_theme_policy_stats

    - name: Apply the current Omarchy theme to the installed Chromium-family browsers (omarchy-theme-set-browser)
      ansible.builtin.command: omarchy-theme-set-browser
      when: installed_chromium_browsers | length > 0
      changed_when: >-
        chromium_theme_policy_stats.results
        | selectattr('stat.exists', 'equalto', false) | list | length > 0
      failed_when: false

    - name: Create ~/.local/share/applications
      ansible.builtin.file:
        path: "{{ webapps_desktop_dir }}"
        state: directory
        mode: "0755"

    - name: "{{ 'Install' if firefox_shim_on | bool else 'Remove' }} the hidden {{ firefox_desktop_id }} shim for the Firefox Flatpak"
      ansible.builtin.copy:
        content: |
          [Desktop Entry]
          Type=Application
          Name=Firefox
          Icon={{ firefox_flatpak_id }}
          TryExec={{ firefox_command_link }}
          Exec={{ firefox_command_link }} %u
          NoDisplay=true
          MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          StartupWMClass={{ firefox_flatpak_id }}
        dest: "{{ webapps_desktop_dir }}/{{ firefox_desktop_id }}"
        mode: "0644"
      when: firefox_shim_on | bool

    - name: Remove the Firefox Flatpak shim
      ansible.builtin.file:
        path: "{{ webapps_desktop_dir }}/{{ firefox_desktop_id }}"
        state: absent
      when: not firefox_shim_on | bool

    - name: Read the current default browser
      ansible.builtin.command: omarchy-cmd-default-browser
      register: default_browser_current
      changed_when: false
      failed_when: false

    - name: "Make {{ browser_default.label }} the default browser"
      ansible.builtin.command:
        argv: >-
          {{ ['omarchy-default-browser', browser_default.browser] if browser_default.browser is defined
             else ['xdg-settings', 'set', 'default-web-browser', browser_default.desktop] }}
      vars:
        browser_default_desktop: "{{ browser_default.desktop | default(browser_default.browser ~ '.desktop') }}"
      when: default_browser_current.stdout | trim != browser_default_desktop
      # omarchy-default-browser's trailing notification can fail on its own.
      failed_when: false
      changed_when: true
