---
# pt-BR localization, covering six independent areas (each with its own
# sub-tag to run or skip on its own):
#
#   - locale + LANG/LANGUAGE (ptbr-locale): enables pt_BR.UTF-8 without
#     removing other locales, and sets LANG/LANGUAGE in /etc/locale.conf
#     for TTYs and system services. The graphical session takes its LANG
#     from Omarchy's own setting instead, which user/ptbr.yml sets with
#     `omarchy-language pt-BR`; LANGUAGE (the gettext fallback chain)
#     Omarchy doesn't set, so /etc/locale.conf's still applies.
#   - xdg-user-dirs (ptbr-xdg-user-dirs): renames personal folders
#     (~/Downloads, etc.) to their pt-BR translations, and creates the
#     mapped folders that never existed yet — typically the ones
#     xdg-user-dirs leaves disabled, pointing at $HOME — flipping their
#     user-dirs.dirs entries to the translated names too. Also fixes any
#     file-manager sidebar bookmark still pointing at the old English
#     path/label.
#   - Firefox (ptbr-firefox): forces RequestedLocale via the Flatpak's
#     systemconfig policies.json (the Flathub build already bundles every
#     locale), since a profile created before LANG was pt_BR never
#     renegotiates its language on its own.
#   - Chromium and variants (ptbr-chromium): fixes each browser's
#     Preferences (intl.accept_languages), which controls the page
#     language web apps like WhatsApp Web see — frozen at en-US since
#     profile creation, with no official policy for this in Chromium.
#     Profile dirs are listed in ptbr_chromium_family_config_dirs.
#   - Man pages (ptbr-man-pages): installs man-pages-pt_br.
#   - OCR (ptbr-ocr): installs tesseract-data-por and sets
#     OMARCHY_OCR_LANGS for omarchy-capture-text.
#
# Doesn't touch keyboard layout or timezone — both are already asked by
# the Omarchy installer. Doesn't touch apps that ship pt_BR translations
# in their own package (GNOME, GTK, KDE) — those already follow LANG.
#
# A logout (or reboot) is needed after the locale step for LANG to apply
# to the whole graphical session.
#
# The locale and the packages are machine-wide (here); the folders, the
# browsers' language and OMARCHY_OCR_LANGS are per user (user/ptbr.yml).
#
# Usage: just apply ptbr-locale ptbr-xdg-user-dirs ptbr-browsers ptbr-man-pages ptbr-ocr
- name: pt-BR localization
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: pt_BR.UTF-8 locale (locale.gen + system LANG/LANGUAGE)
      become: true
      block:
        - name: Ensure pt_BR.UTF-8 UTF-8 is enabled in /etc/locale.gen
          ansible.builtin.lineinfile:
            path: /etc/locale.gen
            regexp: '^#?\s*{{ ptbr_locale_gen_line | regex_escape }}\s*$'
            line: "{{ ptbr_locale_gen_line }}"
          register: locale_gen_conf

        - name: Generate locales (locale-gen)
          ansible.builtin.command: locale-gen
          when: locale_gen_conf.changed

        - name: "Set LANG={{ ptbr_locale }} in /etc/locale.conf"
          ansible.builtin.lineinfile:
            path: /etc/locale.conf
            regexp: '^LANG='
            line: "LANG={{ ptbr_locale }}"
            create: true

        - name: Set LANGUAGE (gettext fallback chain) in /etc/locale.conf
          ansible.builtin.lineinfile:
            path: /etc/locale.conf
            regexp: '^LANGUAGE='
            line: "LANGUAGE={{ ptbr_language_fallback }}"
            create: true

        - name: Note that logout/reboot is needed for the graphical session
          ansible.builtin.debug:
            msg: >-
              LANG/LANGUAGE updated in /etc/locale.conf. Log out (or
              reboot) for Hyprland and already-open apps to pick up the
              new language.
      tags: [ptbr-locale]

    - name: xdg-user-dirs (for the per-user folder renames)
      community.general.pacman:
        name: xdg-user-dirs
        state: present
      become: true
      tags: [ptbr-xdg-user-dirs]

    - name: Firefox locale (RequestedLocale — no separate language pack needed on Flathub's build)
      block:
        - name: Check whether Firefox (Flathub) is installed
          ansible.builtin.command: "flatpak info --show-ref {{ firefox_flatpak_id }}"
          register: firefox_check
          changed_when: false
          failed_when: false

        - name: Look up the arch/branch of the installed Firefox flatpak
          vars:
            ref_parts: "{{ firefox_check.stdout_lines[0].split('/') }}"
          ansible.builtin.set_fact:
            firefox_flatpak_arch: "{{ ref_parts[2] }}"
            firefox_flatpak_branch: "{{ ref_parts[3] }}"
          when: firefox_check.rc == 0

        - name: Ensure the systemconfig extension's policies directory exists
          ansible.builtin.file:
            path: "{{ firefox_systemconfig_dir }}/{{ firefox_flatpak_arch }}/{{ firefox_flatpak_branch }}/policies"
            state: directory
            mode: "0755"
          become: true
          when: firefox_check.rc == 0

        - name: Check whether Firefox's policies.json already exists
          ansible.builtin.stat:
            path: "{{ firefox_systemconfig_dir }}/{{ firefox_flatpak_arch }}/{{ firefox_flatpak_branch }}/policies/policies.json"
          register: firefox_policies_stat
          when: firefox_check.rc == 0

        - name: Load the current policies.json (or an empty object)
          when: firefox_check.rc == 0
          block:
            - name: Try parsing the current policies.json
              ansible.builtin.set_fact:
                firefox_policies_current: >-
                  {{
                    (lookup('file', firefox_systemconfig_dir ~ '/' ~ firefox_flatpak_arch ~ '/' ~ firefox_flatpak_branch ~ '/policies/policies.json') | from_json)
                    if firefox_policies_stat.stat.exists
                    else {'policies': {}}
                  }}
          rescue:
            - name: Existing policies.json isn't valid JSON — treat as empty
              ansible.builtin.set_fact:
                firefox_policies_current: { "policies": {} }

            - name: Warn about the corrupted policies.json
              ansible.builtin.debug:
                msg: >-
                  The systemconfig extension's policies.json exists but
                  isn't valid JSON — treated as empty and will be
                  overwritten now. Any policy that only existed in that
                  file was lost.

        - name: "Force RequestedLocale={{ ptbr_firefox_requested_locale }} in policies.json"
          ansible.builtin.copy:
            content: >-
              {{
                (firefox_policies_current
                  | combine({'policies': {'RequestedLocale': ptbr_firefox_requested_locale}}, recursive=True)
                  | to_nice_json)
              }}
            dest: "{{ firefox_systemconfig_dir }}/{{ firefox_flatpak_arch }}/{{ firefox_flatpak_branch }}/policies/policies.json"
            mode: "0644"
          become: true
          when: firefox_check.rc == 0

      tags: [ptbr-browsers]

    # The native build ships English only; Flathub's bundles every locale.
    - name: "Firefox (native): {{ 'install' if 'firefox' in apps.browser.installed else 'remove' }} the pt-BR language pack"
      community.general.pacman:
        name: "{{ ptbr_firefox_langpack }}"
        state: "{{ 'present' if 'firefox' in apps.browser.installed else 'absent' }}"
      become: true
      tags: [ptbr-browsers]

    - name: pt-BR man pages
      community.general.pacman:
        name: "{{ ptbr_man_pages_package }}"
        state: present
      become: true
      tags: [ptbr-man-pages]
    # tesseract ships with Omarchy (omarchy-capture-text); only its English
    # data does.
    - name: "OCR (omarchy-capture-text) — Portuguese tesseract data"
      community.general.pacman:
        name: "{{ ptbr_tesseract_data_package }}"
        state: present
      become: true
      tags: [ptbr-ocr]
