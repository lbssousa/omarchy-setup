---
# BGRT-derived boot theme — not part of site.yml/`just setup`,
# deliberately: it rewrites the system's default Plymouth theme and
# rebuilds the initramfs, the same class of risk as
# playbooks/system/secureboot.yml.
#
# Most PCs show their own UEFI boot logo (the ACPI BGRT table,
# /sys/firmware/acpi/bgrt/*) before any bootloader or OS code runs. By
# default, Omarchy's Plymouth splash, SDDM greeter and Hyprlock look
# nothing like that firmware logo, so the screen visibly changes right
# after the firmware hands off. This playbook builds three themes from
# the machine's own BGRT logo instead of a bundled image, so the same
# picture stays on screen from firmware through Plymouth and the SDDM
# login screen to the Hyprlock lock screen:
#   - an Omarchy desktop theme (~/.config/omarchy/themes/bgrt),
#     selectable from Style > Theme, whose unlock.png (and Style >
#     Unlock menu preview) both come from the BGRT logo;
#   - a standalone Plymouth theme (omarchy-bgrt) — outside Omarchy's
#     own per-theme Plymouth mechanism (omarchy-plymouth-set-by-theme
#     recolors/replaces the single shared "omarchy" theme, which would
#     get overwritten the next time any other Omarchy theme is applied
#     from Style > Unlock) — using the same logo, a plain black
#     background instead of a theme-accent gradient, and the firmware's
#     own yoffset so the logo doesn't jump when Plymouth takes over. A
#     small Omarchy wordmark is pinned below the password field, since
#     the main logo slot is now the firmware logo instead of the
#     Omarchy wordmark;
#   - a standalone SDDM greeter theme (omarchy-bgrt) with the Plymouth
#     theme's layout — logo at the firmware's yoffset, password field
#     40px below, wordmark 30px below that — so the login screen picks
#     up where the disk prompt left off. Outside Omarchy's own "omarchy"
#     SDDM theme for the same reason as above (omarchy-plymouth-set
#     rewrites it), and selected by an sddm.conf.d drop-in that sorts
#     after Omarchy's and omarchy-multiuser's (bgrt_sddm_conf_path), so
#     it outlives upgrades with no hook. Its login logic is
#     omarchy-multiuser's (a password alone, tried for each account;
#     power keys), so it replaces that package's greeter too.
#
# Every omarchy-settings upgrade resets the default Plymouth theme to
# "omarchy" (its etc-overrides rewrite plymouthd.conf), so a pacman hook
# (bgrt_pacman_hook_path) restores omarchy-bgrt and rebuilds the boot
# image right after.
#
# Both are rebuilt from /sys/firmware/acpi/bgrt/* on every run —
# nothing here is a bundled binary asset, since the BGRT logo, its
# size and its yoffset are specific to each machine's firmware.
#
# The Omarchy theme is built once here into bgrt_shared_theme_dir; each
# user who wants it gets a copy in ~/.config/omarchy/themes from
# user/bgrt-theme.yml.
#
# The Style > Unlock menu preview is generated, not a screenshot: a
# 1920x1080 black canvas with the logo and wordmark placed at the same
# relative offsets omarchy-bgrt.script itself computes (idle boot
# state — no password field, which the real script only shows once
# unlocking starts). It's a good approximation, not a pixel-identical
# capture of the real screen at its actual resolution.
- name: BGRT-derived boot theme (Omarchy desktop theme + standalone Plymouth and SDDM themes)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [bgrt-theme]

  pre_tasks:
    - name: Check this machine's firmware has a BGRT boot logo
      ansible.builtin.stat:
        path: "{{ bgrt_sysfs_image }}"
      register: bgrt_image_stat

    - name: Fail if there's no BGRT boot logo to derive the theme from
      ansible.builtin.fail:
        msg: >-
          {{ bgrt_sysfs_image }} doesn't exist — this firmware doesn't
          expose a BGRT boot logo (common on VMs and some laptops), so
          there's nothing to build this theme from.
      when: not bgrt_image_stat.stat.exists

  tasks:
    - name: Read the firmware logo's Y offset (keeps the boot transition seamless)
      ansible.builtin.command: "cat {{ bgrt_sysfs_yoffset }}"
      register: bgrt_yoffset_read
      changed_when: false

    - name: Set bgrt_yoffset
      ansible.builtin.set_fact:
        bgrt_yoffset: "{{ bgrt_yoffset_read.stdout | trim | int }}"

    - name: Create a scratch build directory
      ansible.builtin.tempfile:
        state: directory
        prefix: omarchy-bgrt-theme.
      register: bgrt_build

    - name: Convert the firmware logo to grayscale PNG
      ansible.builtin.command: "magick {{ bgrt_sysfs_image }} -colorspace Gray {{ bgrt_build.path }}/logo.png"
      changed_when: true

    - name: Read the converted logo's dimensions
      ansible.builtin.command: "identify -format '%w %h' {{ bgrt_build.path }}/logo.png"
      register: bgrt_logo_size
      changed_when: false

    - name: Set bgrt_logo_width / bgrt_logo_height
      ansible.builtin.set_fact:
        bgrt_logo_width: "{{ bgrt_logo_size.stdout.split()[0] | int }}"
        bgrt_logo_height: "{{ bgrt_logo_size.stdout.split()[1] | int }}"

    - name: Build the small Omarchy wordmark (Omarchy's own boot logo, resized + recolored white)
      ansible.builtin.command: >-
        magick {{ bgrt_plymouth_stock_dir }}/logo.png -resize {{ bgrt_wordmark_width }}x
        -channel RGB +level-colors "#ffffff","#ffffff" {{ bgrt_build.path }}/wordmark.png
      changed_when: true

    - name: Read the wordmark's actual dimensions
      ansible.builtin.command: "identify -format '%w %h' {{ bgrt_build.path }}/wordmark.png"
      register: bgrt_wordmark_size
      changed_when: false

    - name: Read the stock entry field's size (same values omarchy-bgrt.script uses to place the field and wordmark)
      ansible.builtin.command: "identify -format '%w %h' {{ bgrt_plymouth_stock_dir }}/entry.png"
      register: bgrt_entry_height_read
      changed_when: false

    - name: Set the wordmark/entry dimensions used for layout
      ansible.builtin.set_fact:
        bgrt_wordmark_width_actual: "{{ bgrt_wordmark_size.stdout.split()[0] | int }}"
        bgrt_entry_width: "{{ bgrt_entry_height_read.stdout.split()[0] | int }}"
        bgrt_entry_height: "{{ bgrt_entry_height_read.stdout.split()[1] | int }}"

    - name: Render the Style > Unlock menu preview (logo + wordmark on black, matching the script's idle-boot layout)
      ansible.builtin.command: >-
        magick -size {{ bgrt_preview_width }}x{{ bgrt_preview_height }} xc:black
        {{ bgrt_build.path }}/logo.png
        -geometry +{{ ((bgrt_preview_width - bgrt_logo_width) / 2) | int }}+{{ bgrt_yoffset }} -composite
        {{ bgrt_build.path }}/wordmark.png
        -geometry +{{ ((bgrt_preview_width - bgrt_wordmark_width_actual) / 2) | int }}+{{ bgrt_yoffset + bgrt_logo_height + bgrt_entry_gap_above + bgrt_entry_height + bgrt_entry_gap_below }} -composite
        {{ bgrt_build.path }}/preview-unlock.png
      changed_when: true

    # Machine-wide copy of the Omarchy theme; user/bgrt-theme.yml installs
    # it into ~/.config/omarchy/themes.
    - name: Create the shared Omarchy theme directory
      ansible.builtin.file:
        path: "{{ bgrt_shared_theme_dir }}"
        state: directory
        mode: "0755"
      become: true

    - name: Install the theme colors (monochrome, matching the firmware logo)
      ansible.builtin.copy:
        src: bgrt-colors.toml
        dest: "{{ bgrt_shared_theme_dir }}/colors.toml"
        mode: "0644"
      become: true

    - name: Install the theme's unlock.png (firmware logo)
      ansible.builtin.copy:
        src: "{{ bgrt_build.path }}/logo.png"
        dest: "{{ bgrt_shared_theme_dir }}/unlock.png"
        remote_src: true
        mode: "0644"
      become: true

    - name: Install the theme's Style > Unlock menu preview
      ansible.builtin.copy:
        src: "{{ bgrt_build.path }}/preview-unlock.png"
        dest: "{{ bgrt_shared_theme_dir }}/preview-unlock.png"
        remote_src: true
        mode: "0644"
      become: true

    - name: Create the standalone Plymouth theme directory
      ansible.builtin.file:
        path: "{{ bgrt_plymouth_theme_dir }}"
        state: directory
        mode: "0755"
      become: true

    - name: Copy the stock Omarchy Plymouth assets that only need recoloring
      ansible.builtin.copy:
        src: "{{ bgrt_plymouth_stock_dir }}/{{ item }}"
        dest: "{{ bgrt_plymouth_theme_dir }}/{{ item }}"
        remote_src: true
        mode: "0644"
      loop:
        - bullet.png
        - entry.png
        - lock.png
        - progress_bar.png
      become: true
      register: bgrt_plymouth_recolor_assets

    - name: Recolor the copied assets white (same recipe omarchy-plymouth-set uses per theme)
      ansible.builtin.command: >-
        magick {{ bgrt_plymouth_theme_dir }}/{{ item.item }} -channel RGB +level-colors "#ffffff","#ffffff"
        {{ bgrt_plymouth_theme_dir }}/{{ item.item }}
      loop: "{{ bgrt_plymouth_recolor_assets.results }}"
      become: true
      changed_when: true

    - name: Copy the stock progress box (not recolored — already flat black/white)
      ansible.builtin.copy:
        src: "{{ bgrt_plymouth_stock_dir }}/progress_box.png"
        dest: "{{ bgrt_plymouth_theme_dir }}/progress_box.png"
        remote_src: true
        mode: "0644"
      become: true

    - name: Install the Plymouth theme's logo (firmware logo)
      ansible.builtin.copy:
        src: "{{ bgrt_build.path }}/logo.png"
        dest: "{{ bgrt_plymouth_theme_dir }}/logo.png"
        remote_src: true
        mode: "0644"
      become: true

    - name: Install the Plymouth theme's wordmark
      ansible.builtin.copy:
        src: "{{ bgrt_build.path }}/wordmark.png"
        dest: "{{ bgrt_plymouth_theme_dir }}/wordmark.png"
        remote_src: true
        mode: "0644"
      become: true

    - name: Install the theme descriptor
      ansible.builtin.copy:
        src: omarchy-bgrt.plymouth
        dest: "{{ bgrt_plymouth_theme_dir }}/omarchy-bgrt.plymouth"
        mode: "0644"
      become: true

    - name: Install the boot script (black background, this machine's yoffset, wordmark)
      ansible.builtin.template:
        src: omarchy-bgrt.script.j2
        dest: "{{ bgrt_plymouth_theme_dir }}/omarchy-bgrt.script"
        mode: "0644"
      become: true
      register: bgrt_plymouth_script

    - name: Check the current default Plymouth theme
      ansible.builtin.command: plymouth-set-default-theme
      register: bgrt_current_plymouth_theme
      changed_when: false

    # plymouthd starts in the initramfs and keeps running the copy of the
    # script it found there, so a changed script needs a rebuild too.
    - name: Set omarchy-bgrt as the default Plymouth theme and rebuild the initramfs
      when: >-
        bgrt_current_plymouth_theme.stdout | trim != bgrt_plymouth_theme_name
        or bgrt_plymouth_script is changed
      become: true
      block:
        - name: "plymouth-set-default-theme {{ bgrt_plymouth_theme_name }}"
          ansible.builtin.command: "plymouth-set-default-theme {{ bgrt_plymouth_theme_name }}"
          changed_when: true

        - name: Rebuild the initramfs (limine-mkinitcpio if present, else mkinitcpio -P)
          ansible.builtin.shell: >-
            if command -v limine-mkinitcpio >/dev/null 2>&1; then
              limine-mkinitcpio
            else
              mkinitcpio -P
            fi
          changed_when: true

    # omarchy-settings' install scriptlet rewrites plymouthd.conf from
    # its etc-overrides (Theme=omarchy) on every upgrade; this hook puts
    # the theme back right after, in the same pacman run.
    - name: Install the script that restores the Plymouth theme
      ansible.builtin.template:
        src: omarchy-bgrt-plymouth-restore.sh.j2
        dest: "{{ bgrt_plymouth_restore_bin }}"
        mode: "0755"
      become: true

    - name: Create /etc/pacman.d/hooks
      ansible.builtin.file:
        path: "{{ bgrt_pacman_hook_path | dirname }}"
        state: directory
        mode: "0755"
      become: true

    - name: Install the pacman hook that restores it after an omarchy-settings upgrade
      ansible.builtin.template:
        src: omarchy-bgrt-plymouth.hook.j2
        dest: "{{ bgrt_pacman_hook_path }}"
        mode: "0644"
      become: true

    # SDDM greeter: same layout as the Plymouth script, so the screen the
    # disk prompt left is the one the login password goes into. Its white
    # field, lock and bullet are the Plymouth theme's own, copied over.
    - name: Create the SDDM theme directory
      ansible.builtin.file:
        path: "{{ bgrt_sddm_theme_dir }}"
        state: directory
        mode: "0755"
      become: true

    - name: Install the SDDM theme's QML and metadata
      ansible.builtin.copy:
        src: "omarchy-bgrt-sddm/{{ item }}"
        dest: "{{ bgrt_sddm_theme_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - Main.qml
        - metadata.desktop
        - Password.js
        - Power.js
        - Strings.js
      become: true

    - name: Install the SDDM theme config (this machine's yoffset)
      ansible.builtin.template:
        src: omarchy-bgrt-sddm-theme.conf.j2
        dest: "{{ bgrt_sddm_theme_dir }}/theme.conf"
        mode: "0644"
      become: true

    - name: Copy the logo, wordmark and white field assets from the Plymouth theme
      ansible.builtin.copy:
        src: "{{ bgrt_plymouth_theme_dir }}/{{ item }}"
        dest: "{{ bgrt_sddm_theme_dir }}/{{ item }}"
        remote_src: true
        mode: "0644"
      loop:
        - logo.png
        - wordmark.png
        - entry.png
        - lock.png
        - bullet.png
      become: true

    - name: Build the failed-login variants (field, lock and bullets in the theme's red)
      ansible.builtin.command: >-
        magick {{ bgrt_plymouth_stock_dir }}/{{ item }}.png -channel RGB
        +level-colors "{{ bgrt_sddm_failed_color }}","{{ bgrt_sddm_failed_color }}"
        {{ bgrt_sddm_theme_dir }}/{{ item }}-failed.png
      loop:
        - entry
        - lock
        - bullet
      become: true
      changed_when: true

    # The Plymouth preview shows the idle boot (no field); this one shows
    # the field and lock as the greeter does, at omarchy-bgrt.script's
    # offsets on the same 1920x1080 canvas.
    - name: Render the SDDM theme preview
      vars:
        _entry_x: "{{ ((bgrt_preview_width - bgrt_entry_width | int) / 2) | int }}"
        _entry_y: "{{ bgrt_yoffset | int + bgrt_logo_height | int + bgrt_entry_gap_above }}"
        _lock_h: "{{ (bgrt_entry_height | int * 0.8) | round | int }}"
        _lock_w: "{{ (bgrt_entry_height | int * 0.8 * 84 / 96) | round | int }}"
      ansible.builtin.command: >-
        magick {{ bgrt_build.path }}/preview-unlock.png
        {{ bgrt_sddm_theme_dir }}/entry.png
        -geometry +{{ _entry_x }}+{{ _entry_y }} -composite
        ( {{ bgrt_sddm_theme_dir }}/lock.png -resize {{ _lock_w }}x{{ _lock_h }}! )
        -geometry +{{ _entry_x | int - _lock_w | int - 15 }}+{{ _entry_y | int + ((bgrt_entry_height | int - _lock_h | int) / 2) | int }} -composite
        {{ bgrt_sddm_theme_dir }}/preview.png
      become: true
      changed_when: true

    # Takes effect at the next login screen; sddm is never restarted from
    # under the open session.
    - name: Select the SDDM theme
      ansible.builtin.template:
        src: omarchy-bgrt-sddm.conf.j2
        dest: "{{ bgrt_sddm_conf_path }}"
        mode: "0644"
      become: true

    # It sorted before zz-omarchy-multiuser.conf, so it would be overridden.
    - name: Remove the SDDM theme selection from its old place
      ansible.builtin.file:
        path: "{{ bgrt_sddm_old_conf_path }}"
        state: absent
      become: true

    - name: Clean up the scratch build directory
      ansible.builtin.file:
        path: "{{ bgrt_build.path }}"
        state: absent
