---
# Local connection become timeout. Under run-empowered.sh the run0 inside
# returns at once; the generous value only matters for a playbook run without
# it, where each run0 waits on a polkit dialog that can take longer than
# Ansible's 10s default.
ansible_local_become_success_timeout: 60

# polkit authentication cache window (seconds) — playbooks/system/polkit.yml. Set
# for pkexec/graphical tools; see the playbook for what it does and doesn't
# cover.
polkit_expiration_seconds: 1800

# Flatpak (playbooks/{system,user}/flatpak.yml) — Flatpak itself plus the
# Flathub remote, system-wide (every app below is installed once, for every
# user). Omarchy doesn't ship Flatpak. Every play that installs a Flatpak
# bootstraps both itself, so each one also works standalone.
flatpak_package: flatpak
flatpak_flathub_remote: flathub
flatpak_flathub_repo_url: https://flathub.org/repo/flathub.flatpakrepo
# Bazaar — a Flathub app-store frontend.
flatpak_bazaar_id: io.github.kolunmi.Bazaar
# Flatpak desktop entries are exported to these dirs; Quickshell's
# DesktopEntries (the Omarchy app library) only scans the dirs named in
# XDG_DATA_DIRS, which the graphical session doesn't get from
# /etc/profile.d/flatpak.sh. flatpak_env_file is deployed to each user's
# ~/.config/environment.d (playbooks/user/flatpak.yml) so the session sees
# the Flatpak apps.
flatpak_system_exports_dir: /var/lib/flatpak/exports/share
flatpak_user_exports_dir: "{{ target_home }}/.local/share/flatpak/exports/share"
# Only system-wide installs export their launchers here (a user install
# exports under ~/.local/share/flatpak/exports/bin instead).
flatpak_system_exports_bin_dir: /var/lib/flatpak/exports/bin
flatpak_env_file: 40-flatpak.conf

# Firefox (playbooks/{system,user}/firefox.yml) — installed from Flathub
# (org.mozilla.firefox), replacing the Arch `firefox` package. Flathub's build
# bundles every locale itself, so no firefox-i18n-<locale> package is needed
# (see playbooks/system/ptbr.yml). Runs before pt-BR localization, which
# depends on Firefox already being installed.
firefox_flatpak_id: org.mozilla.firefox
# The Arch packages the Flatpak replaces (removed by playbooks/system/firefox.yml).
firefox_native_packages:
  - firefox
  - firefox-i18n-pt-br
# Default preferences and policies.json reach the sandbox through this
# extension point (mounted at /app/etc/firefox inside it), since the
# Flatpak can't see the host's /usr/lib/firefox.
firefox_systemconfig_extension: org.mozilla.firefox.systemconfig
firefox_systemconfig_dir: "/var/lib/flatpak/extension/{{ firefox_systemconfig_extension }}"
# The name omarchy-default-browser takes. It only knows the native ids
# (firefox.desktop, command `firefox`), so the system phase links
# /usr/local/bin/firefox to the Flatpak's exported launcher and the user
# phase adds a hidden firefox.desktop that runs it — see
# playbooks/{system,user}/firefox.yml.
firefox_browser: firefox
firefox_command_link: /usr/local/bin/firefox
firefox_desktop_id: firefox.desktop
# What Firefox names its Taskbar Tabs launchers and window classes after
# (<prefix>.webapp-<uuid>): its own app id, the Flatpak id.
firefox_desktop_prefix: "{{ firefox_flatpak_id }}"
# The Taskbar Tabs launchers run the browser binary inside the sandbox
# directly, as Firefox's own pinned launchers do.
firefox_launcher_argv:
  - flatpak
  - run
  - --command=/app/lib/firefox/firefox
  - "{{ firefox_flatpak_id }}"
# Firefox's own data, inside the sandbox's per-app directory: the profiles
# dirs (XDG layout first, as Firefox 147+ uses it, then the legacy
# ~/.mozilla one) and the native ones they're migrated from on first run
# (playbooks/user/firefox.yml), pairwise.
firefox_app_dir: "{{ target_home }}/.var/app/{{ firefox_flatpak_id }}"
firefox_profiles_dirs:
  - "{{ firefox_app_dir }}/config/mozilla/firefox"
  - "{{ firefox_app_dir }}/.mozilla/firefox"
firefox_native_profiles_dirs:
  - "{{ target_home }}/.config/mozilla/firefox"
  - "{{ target_home }}/.mozilla/firefox"
firefox_taskbar_tabs_pref_name: browser.taskbarTabs.enabled
firefox_taskbar_tabs_pref_file: omarchy-setup.js
# Firefox's "Default font size" (Settings > General > Fonts and Colors >
# Advanced; font.size.variable.x-western in about:config), px. Firefox's
# browser chrome follows org.gnome.desktop.interface font-name directly (see
# omarchy_gnome_font_sizes), so this is only the default size for page
# text. 17px is what 13pt renders to at the standard 96dpi (the size
# omarchy_system_ui_font_pt still uses), written as an integer px because
# that's what the pref takes. playbooks/system/firefox.yml drops it as a
# defaults/preferences file, so it's a default like the browser's own 16px,
# not a forced value.
firefox_font_size_pref_file: omarchy-setup-font.js
firefox_default_font_size_px: 17

# Firefox Taskbar Tabs ("tab apps") and the Hyprland keybinds that open them
# (playbooks/user/firefox-taskbar-apps.yml). Omarchy binds YouTube to
# SUPER+SHIFT+Y, WhatsApp to SUPER+SHIFT+ALT+G, Google Maps to
# SUPER+SHIFT+S, Google Photos to SUPER+SHIFT+P and Google Messages to
# SUPER+SHIFT+CTRL+G through omarchy-launch-webapp, which only knows the
# Chromium family's --app= flag and falls back to chromium.desktop for every
# other default browser — Firefox included, and Firefox is the default here
# (see default_browser below). The tab apps are created by the same playbook,
# straight into Firefox's profile without the DynamicLauncher portal's
# confirmation dialog, and Omarchy's own launchers for the same sites are
# removed.
#
# One launcher per pinned site, at
# <dir>/<firefox_desktop_prefix>.webapp-<uuid>.desktop. The uuid is generated
# per install and the Exec= line inside hardcodes the profile path, so neither
# is something a keybind can name — desktop_name (the pinned tab's own title,
# the one field that survives a reinstall) is the stable handle, and the
# keybind goes through a wrapper that resolves it at launch time.
# Microsoft Teams has no Omarchy keybind of its own, so it takes the same
# SUPER+SHIFT+ALT+<letter> shape as WhatsApp.
# Omarchy's own launcher for a site is removed when its Name= equals the
# app's desktop_name or label; set omarchy_webapp_name when it's neither.
# container (optional) is the Firefox container the app runs in, by name as
# in about:preferences#containers. It has to be the one Multi-Account
# Containers (or Facebook Container) assigns the site — and its login pages
# — to: otherwise the extension reopens the page as a tab in the main window
# and closes the app's window.
#
# This machine's default: none. Each user lists their own in
# users/<name>.yml (see users/abutre.yml).
firefox_webapp_desktop_dir: "{{ target_home }}/.local/share/applications"
firefox_webapp_desktop_glob: "{{ firefox_webapp_desktop_dir }}/{{ firefox_desktop_prefix }}.webapp-*.desktop"
firefox_taskbar_app_launcher: "{{ target_home }}/.local/bin/omarchy-setup-launch-firefox-taskbar-app"
firefox_taskbar_apps: []

# Default browser the main run leaves behind
# (playbooks/user/default-browser.yml), as the name `omarchy-default-browser`
# takes (Setup > Defaults > Browser in the Omarchy menu). Only set when it
# isn't already the default, so a later switch in the menu isn't undone.
default_browser: "{{ firefox_browser }}"

# ONLYOFFICE Desktop Editors (playbooks/system/onlyoffice.yml) — installed
# from Flathub, replacing Omarchy's pre-installed native libreoffice-fresh
# (and the AUR onlyoffice-bin an earlier version of this repo installed).
# ONLYOFFICE ships as a single desktop application, so there are no
# secondary components to hide from the app launcher.
onlyoffice_flatpak_id: org.onlyoffice.desktopeditors
onlyoffice_native_packages:
  - libreoffice-fresh
  - libreoffice-fresh-pt-br
  - onlyoffice-bin

# Native GUI apps Omarchy pre-installs (all in
# /usr/share/omarchy/install/omarchy-base.packages) replaced by their
# Flathub builds (playbooks/system/flathub-apps.yml). See that playbook's
# header for what's excluded and why.
#
# Every entry keeps the SAME desktop-entry id in both builds, so nothing has
# to be re-curated afterwards (no launcher NoDisplay stubs, no mimeapps
# rewrite, no window-rule edits) — the id is the contract, and the playbook
# fails if a Flatpak ever stops honouring it.
flathub_app_migrations:
  - name: Kdenlive
    flatpak_id: org.kde.kdenlive
    native_packages:
      - kdenlive
  - name: OBS Studio
    flatpak_id: com.obsproject.Studio
    native_packages:
      - obs-studio
  - name: Pinta
    flatpak_id: com.github.PintaProject.Pinta
    native_packages:
      - pinta
  - name: Xournal++
    flatpak_id: com.github.xournalpp.xournalpp
    native_packages:
      - xournalpp

# Bitwarden (playbooks/{system,user}/bitwarden.yml) — installed from Flathub,
# the build Bitwarden recommends on Linux for biometric unlock and automatic
# updates (https://bitwarden.com/help/biometrics/). system.yml installs the
# Flatpak and the biometric-unlock polkit action alongside KeePassXC (which
# stays the session's default password manager in user.yml); running
# `just bitwarden` also runs playbooks/user/bitwarden.yml to hand Bitwarden
# autostart, SSH_AUTH_SOCK and SUPER+SHIFT+SLASH.
bitwarden_flatpak_id: com.bitwarden.desktop
bitwarden_native_packages:
  - bitwarden
  - bitwarden-bin
# The polkit action Bitwarden's biometric unlock needs before it even offers
# the option — the "Flatpak-Specific Configuration" section of
# https://bitwarden.com/help/biometrics/ drops this exact file
# (playbooks/files/com.bitwarden.Bitwarden.policy) at this exact path.
bitwarden_polkit_action_dest: /usr/share/polkit-1/actions/com.bitwarden.Bitwarden.policy
bitwarden_ssh_agent_units:
  - bitwarden-ssh-agent.socket
  - bitwarden-ssh-agent.path
  - bitwarden-ssh-agent-env.service
# Socket activation (playbooks/user/bitwarden.yml's header): the
# ExecStartPre of bitwarden-ssh-agent-proxy.service that launches Bitwarden
# when its agent doesn't answer, how long it waits for the agent (seconds —
# long enough to unlock the vault), and how long the proxy idles before
# exiting so the next client re-checks.
bitwarden_ssh_agent_launcher: "{{ target_home }}/.local/bin/bitwarden-ssh-agent-launch"
bitwarden_ssh_agent_launch_timeout: 120
bitwarden_ssh_agent_proxy_idle: 60s
bitwarden_hypr_keybind: "SUPER + SHIFT + SLASH"
bitwarden_autostart_desktop: "{{ target_home }}/.config/autostart/com.bitwarden.desktop.desktop"
gcr_ssh_agent_units:
  - gcr-ssh-agent.socket
  - gcr-ssh-agent.service

# Emacs + AUCTeX (playbooks/{system,user}/emacs.yml). omarchy-emacs, from
# Omarchy's own pacman repo (formerly the AUR), is the package Omarchy's own
# installer uses (omarchy-install-editor-emacs); it pulls in emacs-wayland
# and syncs the Omarchy theme and font.
emacs_package: omarchy-emacs

# Emacs packages installed with package.el (batch mode, only the missing
# ones), and the archives they come from. AUCTeX and yasnippet live in GNU
# ELPA; lsp-mode (and its dependencies) only in MELPA. The same archives are
# configured in the managed omarchy-setup.el so package.el can update them.
emacs_package_archives:
  - name: gnu
    url: https://elpa.gnu.org/packages/
  - name: nongnu
    url: https://elpa.nongnu.org/nongnu/
  - name: melpa
    url: https://melpa.org/packages/
emacs_packages:
  - auctex
  - yasnippet
  - lsp-mode

# Zed editor (playbooks/{system,user}/zed.yml) — installed via Omarchy's own packages
# so the Omarchy theme integration (omazed) comes along.
zed_package: zed
zed_omazed_package: omazed
# px. Zed sizes are in logical pixels, so at the 100% monitor scale
# (omarchy_monitor_scale) this is the previous 20 times the old 1.25 scale,
# which keeps the same apparent size.
zed_font_size: 25

# Same family Omarchy sets as the system-wide monospace default (see
# /usr/share/omarchy/default/fontconfig/conf.avail/50-omarchy.conf) —
# note it's the Nerd Font build ("JetBrainsMono Nerd Font"), not plain
# "JetBrains Mono", which isn't installed on its own.
zed_buffer_font_family: "JetBrainsMono Nerd Font"

# This repo's container engine is rootless Podman (playbooks/{system,user}/containers.yml),
# not Docker — Zed's Dev Containers feature needs to be told that, or it
# shells out to `docker` and fails. See
# https://zed.dev/docs/dev-containers.
zed_dev_container_use_podman: true

# Gregorio (the GABC engraver + GregorioTeX) is built from the user's own
# fork by local-typesetting/scripts/install-gregorio.sh, not by Ansible —
# see local-typesetting/README.md. gregorio_ref here is kept in sync by
# hand with that script's own REF default and with every AISCGre-BR
# project's devcontainer gregorio feature (as of 2026-09-08:
# Eugene-Cardine-Primeiro-Ano-de-Semiologia-Gregoriana and darezzo).
gregorio_ref: bdb4eedbc2eb0521c3e040811f7d70a99b6fa639

# gregorio-lsp (playbooks/{system,user}/gregorio-lsp.yml) — LSP server, grelint and
# grefmt for GABC/NABC (Gregorian chant notation), built from source
# with cargo. Pinned to a tag for reproducibility — bump when a newer
# release is needed.
gregorio_lsp_repo: https://github.com/aiscgre-br/gregorio-lsp.git
gregorio_lsp_ref: v0.11.0
gregorio_lsp_checkout_dir: "{{ target_home }}/src/gregorio-lsp"
gregorio_lsp_cargo_bin_dir: "{{ target_home }}/.cargo/bin"
gregorio_lsp_server_crate: crates/gregorio-server
gregorio_lsp_cli_crate: crates/gregorio-cli
gregorio_lsp_binaries:
  - gregorio-lsp
  - grelint
  - grefmt

# omapin (playbooks/{system,user}/plugins.yml) — GnuPG prompts in the polkit-style
# omarchy-shell dialog. Built as an Arch package from the repo's own
# packaging/PKGBUILD with rustup's cargo. It was called pinentry-omarchy
# until 0.2.1; the play migrates an install of the old name
# (omapin_legacy_*).
omapin_repo: https://github.com/lbssousa/omapin.git
# A release tag, never a branch. main only holds GitHub-signed squash
# merges, while releases are tags signed with the Yubikey's key (see the
# "Releases" section of the omapin README). Bump this to deploy
# a new release.
omapin_ref: v0.3.1
omapin_checkout_dir: "{{ target_home }}/src/omapin"
# Refuse to build unless the tag's GPG signature verifies (git verify-tag)
# and was made by one of these keys (primary key fingerprints). Currently
# only the Yubikey's OpenPGP key, the same one yubikey.yml imports and
# git signs with.
omapin_verify_commit: true
omapin_signing_keys:
  - BAC0B1B569777A733E37447FB10712C404063D38
omapin_package: omapin
omapin_cargo_bin_dir: "{{ target_home }}/.cargo/bin"
omapin_program: /usr/bin/omapin
# Third-party shell plugin ids may not start with "omarchy." (reserved for
# first-party plugins by the shell's PluginRegistry).
omapin_plugin_id: lbssousa.omapin
omapin_plugin_dir: /usr/share/omapin/plugin
omapin_plugin_link: "{{ target_home }}/.config/omarchy/plugins/{{ omapin_plugin_id }}"
omapin_shell_json: "{{ target_home }}/.config/omarchy/shell.json"
omapin_gpg_agent_conf: "{{ target_home }}/.gnupg/gpg-agent.conf"
# What the pre-0.3.0 install left behind: the package (omapin conflicts
# with it, so pacman -U won't swap it unattended), its shell plugin entry
# in shell.json and the plugin link pointing into the removed package.
omapin_legacy_package: pinentry-omarchy
omapin_legacy_plugin_id: lbssousa.pinentry
omapin_legacy_plugin_link: "{{ target_home }}/.config/omarchy/plugins/{{ omapin_legacy_plugin_id }}"

# ssh-askpass-omarchy (playbooks/{system,user}/plugins.yml) — SSH prompts in the
# polkit-style omarchy-shell dialog. Built locally via cargo from a signed
# release tag of the repo; bump the ref to deploy a new release.
ssh_askpass_repo: https://github.com/lbssousa/ssh-askpass-omarchy.git
ssh_askpass_ref: v0.2.0
ssh_askpass_checkout_dir: "{{ target_home }}/src/ssh-askpass-omarchy"
# Refuse to build unless the tag's GPG signature verifies and was made by
# one of these keys (same as omapin's).
ssh_askpass_verify_commit: true
ssh_askpass_signing_keys: "{{ omapin_signing_keys }}"
ssh_askpass_cargo_bin_dir: "{{ target_home }}/.cargo/bin"
ssh_askpass_program: /usr/bin/ssh-askpass-omarchy
ssh_askpass_plugin_dir: /usr/share/ssh-askpass-omarchy/plugin
ssh_askpass_plugin_id: lbssousa.ssh_askpass
ssh_askpass_plugin_link: "{{ target_home }}/.config/omarchy/plugins/{{ ssh_askpass_plugin_id }}"
ssh_askpass_shell_json: "{{ target_home }}/.config/omarchy/shell.json"
ssh_askpass_environment_conf: "{{ target_home }}/.config/environment.d/90-ssh-askpass.conf"

# polkit-omarchy (playbooks/{system,user}/plugins.yml) — Omarchy's polkit agent
# plus a security key (pam_u2f) touch prompt; replaces omarchy.polkit.
# Installed from a signed release tag of
# https://github.com/lbssousa/polkit-omarchy; bump the ref to deploy a new
# release.
polkit_agent_repo: https://github.com/lbssousa/polkit-omarchy.git
polkit_agent_ref: v0.2.0
polkit_agent_checkout_dir: "{{ target_home }}/src/polkit-omarchy"
# Refuse to install unless the tag's GPG signature verifies and was made by
# one of these keys (same as omapin's).
polkit_agent_verify_commit: true
polkit_agent_signing_keys: "{{ omapin_signing_keys }}"
polkit_agent_plugin_dir: /usr/share/polkit-omarchy/plugin
polkit_agent_plugin_id: lbssousa.polkit
polkit_agent_plugin_link: "{{ target_home }}/.config/omarchy/plugins/{{ polkit_agent_plugin_id }}"
# The first-party plugin the clone's manifest declares as clonedFrom.
# Enabling the clone makes the shell add this one to its disabled list
# (PluginRegistry.setEnabled), which is the actual swap; kept here so the
# play can assert both halves of it at the end of the run.
polkit_agent_replaces_id: omarchy.polkit

# Where `just publish` (playbooks/system/shared-checkout.yml) puts the copy
# of this repository every user runs `omarchy-setup-user` from.
shared_checkout_dir: /opt/omarchy-setup

# omarchy-multiuser (playbooks/system/omarchy-multiuser.yml) — the forks of
# Omarchy's single-owner tools: the multi-user SDDM greeter (full names +
# optional username field), no autologin, per-user FIDO2 and fingerprints,
# migrations for non-admins. Built as an Arch package from a signed release
# tag of https://github.com/lbssousa/omarchy-multiuser; bump the ref to
# deploy a new release. omarchy_multiuser_repo may also be a local checkout
# (with the tag in it) before the repository is published.
omarchy_multiuser_repo: https://github.com/lbssousa/omarchy-multiuser.git
omarchy_multiuser_ref: v0.1.0
omarchy_multiuser_checkout_dir: "{{ target_home }}/src/omarchy-multiuser"
omarchy_multiuser_verify_commit: true
omarchy_multiuser_signing_keys: "{{ omapin_signing_keys }}"
omarchy_multiuser_package: omarchy-multiuser
# System units the package ships but leaves for this play to enable.
omarchy_multiuser_path_units:
  - omarchy-mu-sddm-guard.path
  - omarchy-mu-sddm-sync.path
  - omarchy-mu-apply-lock.path
omarchy_multiuser_theme: omarchy-multiuser

# openssh with askpass touch notifications (playbooks/system/openssh-askpass.yml)
# — Arch's openssh rebuilt with files/openssh/askpass-notify.patch.
openssh_askpass_packaging_repo: https://gitlab.archlinux.org/archlinux/packaging/packages/openssh.git
openssh_askpass_build_dir: "{{ target_home }}/.cache/omarchy-setup/openssh"
openssh_askpass_pkgrel_suffix: ".1"
openssh_askpass_makedepends:
  - base-devel
  - git
  - krb5
  - libedit
  - libfido2
  - libxcrypt
  - openssl
  - pam
  - zlib


# LazyVim (playbooks/user/lazyvim.yml) — Omarchy's default Neovim distro,
# already installed at ~/.config/nvim; this only adds the LaTeX language
# extra and a personal plugin on top of it.
lazyvim_config_dir: "{{ target_home }}/.config/nvim"
lazyvim_json_path: "{{ lazyvim_config_dir }}/lazyvim.json"
lazyvim_plugins_dir: "{{ lazyvim_config_dir }}/lua/plugins"
# LazyVim's LaTeX extra module is named "lang.tex", not "lang.latex" —
# see lua/lazyvim/plugins/extras/lang/tex.lua in the LazyVim plugin
# itself (installs vimtex + texlab + LaTeX treesitter).
lazyvim_latex_extra: lazyvim.plugins.extras.lang.tex

# gregorio.nvim (playbooks/user/lazyvim.yml) — GABC/NABC (Gregorian chant
# notation) support, pairs with gregorio_lsp_* above.
gregorio_nvim_repo: AISCGre-BR/gregorio.nvim
gregorio_nvim_plugin_file: "{{ lazyvim_plugins_dir }}/gregorio.lua"

# File manager (playbooks/{system,user}/file-manager.yml) — Flea, the default handler
# for directories, the "File manager" keys and FileManager1.
file_manager_package: flea
file_manager_desktop_id: com.thisisgm.flea.desktop

# PDF viewer (playbooks/{system,user}/pdf-viewer.yml) — Zathura (Flathub)
# becomes the default PDF viewer; Papers stays native as an extra,
# non-default viewer (Nautilus's sushi previewer depends on the package);
# Evince is removed.
pdf_viewer_zathura_flatpak_id: org.pwmt.zathura
pdf_viewer_papers_package: papers
# Removed if an earlier run installed it, so Papers isn't listed twice.
pdf_viewer_papers_flatpak_id: org.gnome.Papers
# The Arch packages removed: Zathura plus its MuPDF backend (the Flatpak
# bundles zathura-pdf-poppler instead), and Evince. Nothing depends on
# them, so removing them can't cascade.
pdf_viewer_native_packages:
  - zathura
  - zathura-pdf-mupdf
  - evince
# Same in both builds, which is what lets the mimeapps.list default survive
# the swap untouched (neither side overrides `desktop-file-name`).
pdf_viewer_zathura_desktop_id: org.pwmt.zathura.desktop
pdf_viewer_mimeapps_path: "{{ target_home }}/.config/mimeapps.list"
# User-level copy of the Flatpak's exported desktop entry, same id, so it
# shadows the export (~/.local/share comes first in XDG_DATA_DIRS). Its Exec
# swaps the export's `@@u %U @@` for `@@ %F @@` — see
# playbooks/user/pdf-viewer.yml for why `xdg-open relative.pdf` opens an
# empty Zathura without it.
pdf_viewer_zathura_user_desktop_path: "{{ target_home }}/.local/share/applications/{{ pdf_viewer_zathura_desktop_id }}"
# Paths handed to the Zathura Flatpak (system-wide override, so for every
# user) on top of the two its manifest already grants (xdg-documents,
# xdg-download), in Flatpak's --filesystem syntax (~ is each user's home). A
# PDF outside every granted path still opens — flatpak hands it over through
# the document portal — but the portal never reports changes to the file, so
# Zathura stops auto-reloading it (rebuilt LaTeX output stays stale on
# screen). Hence ~/Projetos, where this desktop's typeset PDFs live.
pdf_viewer_zathura_extra_paths:
  - "~/Projetos"
# Zathura's statusbar/inputbar/notification font (playbooks/{system,user}/pdf-viewer.yml).
# Zathura has a single `font` option covering all three; there's no
# statusbar-only setting. Reuses omarchy_system_ui_font_pt so it matches
# the rest of the desktop instead of Zathura's own default ("monospace
# normal 9").
#
# The path is the Flatpak's per-app config dir, NOT ~/.config/zathura:
# inside the sandbox XDG_CONFIG_HOME is redirected to
# ~/.var/app/<app-id>/config, and ~/.config isn't visible at all.
pdf_viewer_zathurarc_path: "{{ target_home }}/.var/app/{{ pdf_viewer_zathura_flatpak_id }}/config/zathura/zathurarc"
pdf_viewer_zathura_font: "monospace normal {{ omarchy_system_ui_font_pt }}"

# File chooser dialogs (playbooks/{system,user}/file-chooser.yml) — the per-desktop
# portals.conf that routes the FileChooser interface to Flea's picker
# under XDG_CURRENT_DESKTOP=Hyprland. qt5ct/qt6ct are the Qt platform
# themes that both ask that portal for dialogs and set the Qt UI font.
file_chooser_qt_packages:
  - qt5ct
  - qt6ct
file_chooser_portals_conf: "{{ target_home }}/.config/xdg-desktop-portal/hyprland-portals.conf"

# pt-BR localization (playbooks/{system,user}/ptbr.yml)
ptbr_locale: pt_BR.UTF-8
ptbr_locale_gen_line: "pt_BR.UTF-8 UTF-8"
ptbr_language_fallback: "pt_BR:pt:en"

# Each folder below is a personal XDG folder this play takes care of in
# its pt-BR form. Folders already present are renamed to the translated
# name and re-pointed in user-dirs.dirs; folders that don't exist on
# disk yet (e.g. the ones xdg-user-dirs starts out disabled, pointing at
# "$HOME/") are created and enabled. "default" is the stock
# (pre-translation) English folder name — used to find and fix
# file-manager sidebar bookmarks still pointing at it (see the GTK
# bookmarks task below).
ptbr_xdg_user_dirs:
  - { name: DESKTOP, default: "Desktop", translated: "Área de Trabalho" }
  - { name: DOWNLOAD, default: "Downloads", translated: "Downloads" }
  - { name: TEMPLATES, default: "Templates", translated: "Modelos" }
  - { name: PUBLICSHARE, default: "Public", translated: "Público" }
  - { name: DOCUMENTS, default: "Documents", translated: "Documentos" }
  - { name: MUSIC, default: "Music", translated: "Música" }
  - { name: PICTURES, default: "Pictures", translated: "Imagens" }
  - { name: VIDEOS, default: "Videos", translated: "Vídeos" }
  - { name: PROJECTS, default: "Projects", translated: "Projetos" }

ptbr_firefox_requested_locale:
  - pt-BR
  - en-US

# Accept-Language for Chromium-family web apps (affects page content
# language, not the browser's own UI language).
ptbr_chromium_accept_languages: "pt-BR,pt,en-US,en"

# Profile directories fixed by
# playbooks/tasks/ptbr-chromium-family-browser.yml. Each entry is a path
# relative to $HOME (~/.config/<dir>). Opera and Helium are excluded:
# unconfirmed profile layout on this machine.
ptbr_chromium_family_config_dirs:
  - .config/chromium
  - .config/google-chrome
  - .config/microsoft-edge
  - .config/vivaldi

ptbr_man_pages_package: man-pages-pt_br

# OCR languages for omarchy-capture-text (tesseract "+" syntax).
ptbr_tesseract_data_package: tesseract-data-por
ptbr_ocr_langs: "por+eng"

# OpenSSH agent (playbooks/{system,user}/keepassxc.yml, the play that runs before KeePassXC's) —
# enables the standard user-scope agent (socket + service) at the session
# runtime socket and exports SSH_AUTH_SOCK session-wide via environment.d
# so IDEs, CLI tools and KeePassXC can reach the same agent.
#
# keepassxc_ssh_agent_enabled picks the variant: false (the default) is a
# no-op — the agent is not enabled (Omarchy leaves it off) and nothing else in
# this setup consumes SSH_AUTH_SOCK; true enables it and exports SSH_AUTH_SOCK
# for any client. KeePassXC can act as a client, but its SSH agent
# integration isn't pre-seeded by the play — enable it in-app and it picks
# the socket up from SSH_AUTH_SOCK. Override on the command line with
# `-e keepassxc_ssh_agent_enabled=true` (or `just ssh-agent`).
keepassxc_ssh_agent_enabled: false
ssh_agent_socket: "/run/user/{{ target_uid }}/ssh-agent.socket"
ssh_agent_units:
  - ssh-agent.socket
  - ssh-agent.service

# KeePassXC (playbooks/{system,user}/keepassxc.yml) — open-source password manager
# with browser integration (Firefox and Chromium-family browsers), system tray
# integration and opt-in SSH agent support (the agent play above, see
# keepassxc_ssh_agent_enabled).
#
# The Arch package (extra/keepassxc), installed with omarchy-pkg-add. Its
# desktop-entry id is org.keepassxc.KeePassXC.desktop and its window class
# keepassxc (StartupWMClass). Being a Qt5 app on the host, it takes its UI
# font from qt5ct (playbooks/{system,user}/file-chooser.yml), so no font override is
# needed.
keepassxc_package: keepassxc
# Whether KeePassXC is the session's password manager: true deploys its
# autostart entry and hands it the keybind below. `just setup` (site.yml)
# imports the play with the default; false would install only the browser
# manifests and the YubiKey auto-lock rule.
keepassxc_primary: true
keepassxc_desktop_id: org.keepassxc.KeePassXC.desktop
# Reuses Omarchy's default "Passwords" keybinding (originally bound to
# 1Password).
keepassxc_hypr_keybind: "SUPER + SHIFT + SLASH"
# KeePassXC's "Launch KeePassXC at system startup" checkbox only writes the
# XDG autostart entry when the settings dialog is saved, so the playbook
# deploys the same file itself to make autostart deterministic on fresh
# installs (see keepassxc.yml).
keepassxc_autostart_desktop: "{{ target_home }}/.config/autostart/{{ keepassxc_desktop_id }}"
# systemd's XDG autostart fires desktop entries before the tray and theme
# are up, so a drop-in on the generated autostart unit runs this readiness
# script as ExecStartPre=: it waits for the shell's StatusNotifierHost and
# for xdg-desktop-portal before KeePassXC starts (see keepassxc.yml).
keepassxc_autostart_wait: "{{ target_home }}/.local/bin/keepassxc-autostart-wait"
keepassxc_autostart_dropin: "{{ target_home }}/.config/systemd/user/app-org.keepassxc.KeePassXC@autostart.service.d/50-wait-for-desktop.conf"

# Raise KeePassXC's unlock prompt when ssh needs a key the agent doesn't
# hold: a `Match exec` drop-in in ~/.ssh/config.d runs the script before
# every connection, and with no identity in the agent it opens the last
# active database and waits up to the timeout (seconds) for its keys. Only
# useful with KeePassXC's SSH agent integration on and "Remove keys from
# agent when database is closed/locked" ticked.
keepassxc_ssh_unlock_enabled: true
keepassxc_ssh_unlock_script: "{{ target_home }}/.local/bin/keepassxc-ssh-unlock"
keepassxc_ssh_unlock_dropin: "{{ target_home }}/.ssh/config.d/keepassxc-unlock.conf"
keepassxc_ssh_unlock_timeout: 60

# Auto-lock KeePassXC when the YubiKey is unplugged (udev rule, ported from
# lbssousa/nix-config's modules/system/security/keepassxc-yubikey-lock.nix).
# ENV{PRODUCT} format is vendor/product/revision in hex, no leading zeros
# (`lsusb`: ID 1050:0407 -> "1050/407/*") — the raw PRODUCT field is used
# instead of ATTR{idVendor}/ATTR{idProduct} because on "remove" events the
# device's sysfs attributes are already gone, while PRODUCT is still set.
keepassxc_yubikey_usb_product_match: "1050/407/*"
keepassxc_yubikey_lock_script: /usr/local/bin/keepassxc-lock-on-yubikey-remove
keepassxc_yubikey_lock_udev_rule: /etc/udev/rules.d/72-keepassxc-yubikey-lock.rules

# Browser integration: KeePassXC checks a browser's native messaging
# host manifest to decide whether it's supported. The playbook deploys
# the manifests directly ("isBrowserEnabled" is just file existence), so
# no GUI clicking is needed; the browser extension still has to be
# installed and connected by the user.
#
# Chromium runs on the host and calls the package's own keepassxc-proxy.
# The Firefox Flatpak can't see the host's native messaging dirs or run
# keepassxc-proxy inside its runtime, so its manifest (under its own
# ~/.var/app/org.mozilla.firefox/{.mozilla,config/mozilla} dirs) points at
# a small Python relay (keepassxc-proxy-relay.py.j2) that talks to
# KeePassXC's browser socket in $XDG_RUNTIME_DIR/app/org.keepassxc.KeePassXC
# (granted to Firefox via a Flatpak override).
keepassxc_app_id: org.keepassxc.KeePassXC
keepassxc_proxy_path: /usr/bin/keepassxc-proxy
keepassxc_firefox_nmh_dir: "{{ firefox_app_dir }}/.mozilla/native-messaging-hosts"
keepassxc_firefox_xdg_nmh_dir: "{{ firefox_app_dir }}/config/mozilla/native-messaging-hosts"
keepassxc_firefox_relay_name: keepassxc-proxy-relay.py
keepassxc_firefox_relay_sandbox_path: "{{ target_home }}/.mozilla/native-messaging-hosts/{{ keepassxc_firefox_relay_name }}"
keepassxc_browser_manifests:
  - name: Firefox
    src: keepassxc-browser-firefox.json.j2
    dest: "{{ keepassxc_firefox_nmh_dir }}/org.keepassxc.keepassxc_browser.json"
    manifest_path: "{{ keepassxc_firefox_relay_sandbox_path }}"
    relay_src: keepassxc-proxy-relay.py.j2
    relay_dest: "{{ keepassxc_firefox_nmh_dir }}/{{ keepassxc_firefox_relay_name }}"
  - name: Firefox (XDG)
    src: keepassxc-browser-firefox.json.j2
    dest: "{{ keepassxc_firefox_xdg_nmh_dir }}/org.keepassxc.keepassxc_browser.json"
    manifest_path: "{{ keepassxc_firefox_relay_sandbox_path }}"
  - name: Chromium
    src: keepassxc-browser-chromium.json.j2
    dest: "{{ target_home }}/.config/chromium/NativeMessagingHosts/org.keepassxc.keepassxc_browser.json"
    manifest_path: "{{ keepassxc_proxy_path }}"

# Homebrew for Linux (playbooks/{system,user}/homebrew.yml) — installed per upstream to
# /home/linuxbrew/.linuxbrew and exposed via a launcher script in
# /usr/local/bin so `brew` is on PATH without shell-profile edits.
homebrew_install_url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
homebrew_install_script_path: "{{ target_home }}/.cache/omarchy-setup/homebrew-install.sh"
homebrew_prefix: /home/linuxbrew/.linuxbrew
# The one user who owns the prefix and installs formulae (Homebrew doesn't
# share a prefix between users); the first administrator by default.
homebrew_owner: "{{ omarchy_users | selectattr('admin', 'defined') | selectattr('admin') | map(attribute='name') | first }}"
homebrew_bin: "{{ homebrew_prefix }}/bin/brew"
homebrew_symlink: /usr/local/bin/brew
homebrew_runtime_deps:
  - base-devel
  - curl
  - git
# bbrew — TUI for managing Homebrew and Flatpak packages (bold-brew).
homebrew_bbrew_package: bbrew
# homebrew_env_file is deployed to ~/.config/environment.d so every
# Homebrew-installed binary reaches the session on PATH — see the
# header comment in playbooks/{system,user}/homebrew.yml.
homebrew_env_file: 42-homebrew.conf

# Proton Pass (playbooks/{system,user}/proton-pass.yml — optional password manager
# alternative to KeePassXC, not part of `just setup`).
#
# Desktop client: Proton's own .deb repackaged in the AUR
# (proton-pass-bin), installed with omarchy-pkg-aur-add.
proton_pass_aur_package: proton-pass-bin
proton_pass_command: proton-pass

# Reuses Omarchy's default "Passwords" keybinding (originally bound to
# 1Password, which this setup doesn't install).
proton_pass_hypr_keybind: "SUPER + SHIFT + SLASH"

# CLI: the AUR packages (proton-pass-cli, proton-pass-cli-bin) are
# unreliable upstream (checksum failures / AUR pushes disabled), and
# Proton's own official installer script has no update mechanism of its
# own — `proton-pass-cli` is an official Homebrew (homebrew-core)
# formula instead, with a prebuilt x86_64_linux bottle (depends on
# homebrew_bin/homebrew_symlink/homebrew_prefix, group_vars above).
# Points straight at Homebrew's Cellar bin — playbooks/{system,user}/homebrew.yml
# already puts {{ homebrew_prefix }}/bin on PATH session-wide (via
# ~/.config/environment.d), so nothing needs mirroring into ~/.local/bin.
proton_pass_cli_bin: "{{ homebrew_prefix }}/bin/pass-cli"

# Proton Pass CLI SSH agent — a systemd --user service runs `pass-cli
# ssh-agent start` as the long-running agent (the desktop app's own "Use
# Proton Pass as SSH agent" toggle is a separate, GUI-only setup flow that
# defaults to a different socket, ~/.ssh/proton-pass-ssh-agent.sock — see
# the header comment above the CLI play). Socket path here matches
# pass-cli's own upstream default ($HOME/.ssh/proton-pass-agent.sock), so
# ad-hoc CLI calls agree with the systemd-managed agent.
proton_pass_ssh_agent_socket: "{{ target_home }}/.ssh/proton-pass-agent.sock"

# pass-cli's local encryption key backend. Defaults to the Linux kernel
# keyring, which is wiped on every reboot — so the session persisted at
# `pass-cli login` time silently becomes unreadable on the next boot
# (ssh-agent.service logs "there is no session" and never recovers on
# its own; a fresh interactive `pass-cli login` is required every time).
# "dbus" stores it in the D-Bus Secret Service (GNOME Keyring here)
# instead, which survives reboots as long as the keyring is unlocked —
# true here even under SDDM autologin (no password reaches PAM, so
# gnome-keyring's own auto-unlock fails, but this account's default
# collection has no passphrase set, so it still ends up unlocked moments
# after the daemon starts). Applied to both the systemd service and
# interactive shells (below) so `pass-cli login` and the ssh-agent daemon
# agree on where the key lives.
proton_pass_cli_linux_keyring: dbus

# Podman rootless (playbooks/{system,user}/containers.yml) — subuid/subgid range, same
# default useradd already allocates.
podman_subuid_start: 100000
podman_subuid_count: 65536

# libfprint (goodix538d, playbooks/system/libfprint.yml) — built with makepkg from
# templates/libfprint-goodix538d.PKGBUILD.j2 and installed with pacman -U,
# replacing the official libfprint (and Omarchy's libfprint-git).
libfprint_repo: https://github.com/lbssousa/libfprint.git
# Pinned to a release tag of the fork's goodix-538d-sigfm-gtls branch.
# v1.94.10-goodix538d.2 changed the print format: after upgrading from an
# earlier build, delete and re-enroll the fingerprints (fprintd-delete
# $USER, then fprintd-enroll -f <finger> for at least 2 fingers).
libfprint_ref: v1.94.100-goodix538d.1
# pkgver can't contain hyphens or a leading "v": v1.94.100-goodix538d.1 ->
# 1.94.100.goodix538d.1. Bump libfprint_pkgrel for packaging-only changes.
libfprint_pkgver: "{{ libfprint_ref | regex_replace('^v', '') | replace('-', '.') }}"
libfprint_pkgrel: "3"
# Above the omarchy repo's libfprint-git (epoch 1), so it never wins a -Syu.
libfprint_epoch: "2"
libfprint_build_dir: "{{ target_home }}/src/libfprint-goodix538d-pkg"

# Build-time deps only; the runtime ones are the PKGBUILD's depends=(),
# which pacman -U resolves from the repos.
libfprint_makedepends:
  - git
  - glib2-devel
  - meson
  - gobject-introspection

# udev rule disabling USB autosuspend for the fingerprint reader. Kept
# even though it didn't fix the real bug (see fprintd_desync_* below) —
# harmless and may still help.
libfprint_goodix_usb_vendor_id: "27c6"
libfprint_goodix_usb_product_id: "538d"

# Secure Boot (Limine + sbctl, playbooks/system/secureboot.yml — not part of
# `just setup`, run explicitly).
secureboot_esp_path: /boot
secureboot_limine_binary: "{{ secureboot_esp_path }}/EFI/limine/limine_x64.efi"
secureboot_limine_conf: "{{ secureboot_esp_path }}/limine.conf"
secureboot_default_limine_conf: /etc/default/limine
secureboot_kernel_cmdline_file: /etc/kernel/cmdline

# LUKS TPM2 auto-unlock (playbooks/system/tpm2.yml — not part of
# `just setup`, run explicitly).
# Enrolls the TPM2 chip as an authentication factor for the LUKS volume via
# systemd-cryptenroll, so the system unlocks automatically at early boot as
# long as integrity measurements match.
# PCRs to seal against (0=firmware, 2=option ROMs, 7=Secure Boot state).
tpm2_pcrs: "0+2+7"
# LUKS device path (leave empty for automatic detection of the root LUKS partition).
tpm2_luks_device: ""
# Whether to wipe any existing TPM2 slot before enrolling (useful after firmware/Secure Boot changes).
tpm2_wipe: false
# mkinitcpio drop-in path for TPM2 driver modules and sd-encrypt hook configuration.
tpm2_mkinitcpio_conf: /etc/mkinitcpio.conf.d/zz-tpm2.conf
# crypttab path for initramfs unlock configuration.
tpm2_crypttab_path: /etc/crypttab

# BGRT-derived boot theme (playbooks/{system,user}/bgrt-theme.yml — not part of
# `just setup`, run explicitly). Builds an Omarchy desktop theme and a
# standalone Plymouth theme, both derived from this machine's own UEFI
# BGRT boot logo (/sys/firmware/acpi/bgrt/*), so the same picture stays
# on screen from firmware through Plymouth to the Hyprlock lock screen.
bgrt_sysfs_dir: /sys/firmware/acpi/bgrt
bgrt_sysfs_image: "{{ bgrt_sysfs_dir }}/image"
bgrt_sysfs_yoffset: "{{ bgrt_sysfs_dir }}/yoffset"
bgrt_imagemagick_package: imagemagick
bgrt_omarchy_theme_name: bgrt
bgrt_omarchy_theme_dir: "{{ target_home }}/.config/omarchy/themes/{{ bgrt_omarchy_theme_name }}"
# Where the system phase builds the Omarchy theme for every user to copy.
bgrt_shared_theme_dir: "/usr/local/share/omarchy-setup/themes/{{ bgrt_omarchy_theme_name }}"
bgrt_plymouth_theme_name: omarchy-bgrt
bgrt_plymouth_theme_dir: "/usr/share/plymouth/themes/{{ bgrt_plymouth_theme_name }}"
# The stock "omarchy" Plymouth theme template Omarchy itself ships —
# read-only source for the assets that just need recoloring.
bgrt_plymouth_stock_dir: /usr/share/omarchy/default/plymouth
bgrt_wordmark_width: 320
# Gaps around the (hidden, until unlocking starts) password entry
# field, same values omarchy-bgrt.script itself uses to place the
# entry field below the logo and the wordmark below the entry field.
bgrt_entry_gap_above: 40
bgrt_entry_gap_below: 30
# Style > Unlock menu preview canvas — same size every Omarchy theme's
# own preview-unlock.png uses.
bgrt_preview_width: 1920
bgrt_preview_height: 1080

# Hyprland scrolling-layout column resize step (playbooks/{system,user}/desktop.yml).
hypr_scrolling_colresize_step: 0.1

# EPSON L4160 printer (playbooks/{system,user}/printer.yml) — driverless CUPS queue.
printer_l4160_name: L4160
printer_l4160_location: "Wi-Fi"
printer_l4160_description: "EPSON L4160 Series"
printer_l4160_hostname: EPSONE0321F.local
printer_l4160_device_uri: "ipp://{{ printer_l4160_hostname }}:631/ipp/print"
printer_l4160_error_policy: abort-job
printer_l4160_set_default: true

# Shell bar + terminal text size (playbooks/{system,user}/desktop.yml), px. The GTK
# text-scaling factor this command would otherwise leave in place is always
# reset — the desktop's default UI font size is set directly instead, via
# omarchy_gnome_font_sizes below.
#
# The monitor scale is 100%, so text is sized to make up for it: 20px is
# the previous 16px times the old 1.25 scale, and the top of the 9–20 range
# omarchy-display-text-size accepts. It also sets the terminal font
# (px * 9/12 = 15pt).
omarchy_text_size_px: 20

# Hyprland monitor scale factor (playbooks/{system,user}/desktop.yml) — the
# compositor-level "screen scale" applied to everything on screen. Fed
# straight into hl.monitor({ scale = ... }) in
# ~/.config/hypr/monitors.lua's omarchy_monitor_scale.
#
# 1.0 (100%): at 1.25 a 1920px-wide screen is only 1536 logical px, so a
# half-screen dwindle tile (749px) is narrower than KeePassXC's ~800px
# minimum width; Hyprland then squeezes the window's image to fit, which
# also skews where the mouse lands on its buttons. At 100% the tile is
# ~950px. omarchy_text_size_px compensates for the smaller scale.
omarchy_monitor_scale: 1.0

# GDK_SCALE (playbooks/{system,user}/desktop.yml) — the integer factor GTK/Electron read
# under XWayland, where Hyprland doesn't scale windows
# (xwayland.force_zero_scaling). Same rule as `omarchy hyprland monitor
# scaling`: the monitor scale rounded to a whole number, so it follows
# omarchy_monitor_scale. Written to ~/.config/hypr/monitors.lua's
# omarchy_gdk_scale.
omarchy_gdk_scale: "{{ omarchy_monitor_scale | float | round | int }}"

# GTK/GNOME UI font sizes (playbooks/{system,user}/desktop.yml): GNOME's own defaults
# (the gsettings-desktop-schemas defaults, as of GNOME 48+), applied
# directly to each key while keeping the font family already configured
# there. Firefox's browser chrome follows interface font-name.
omarchy_gnome_font_sizes:
  - { schema: org.gnome.desktop.interface, key: font-name, pt: 11 }
  - { schema: org.gnome.desktop.interface, key: document-font-name, pt: 12 }
  - { schema: org.gnome.desktop.interface, key: monospace-font-name, pt: 11 }
  - { schema: org.gnome.desktop.wm.preferences, key: titlebar-font, pt: 11 }

# Font point size for what is not GTK/GNOME: Qt apps (qt5ct/qt6ct, through
# playbooks/{system,user}/file-chooser.yml) and zathura. Deliberately smaller than the
# 15pt that would match the old 1.25 monitor scale (13pt * 1.25, rounded),
# unlike the shell bar and terminals, which stay compensated. Raised a
# point from the 12pt Omarchy leaves behind.
omarchy_system_ui_font_pt: 13

# Caps Lock via keyd (playbooks/{system,user}/capslock.yml). Key that takes over Compose
# from Caps Lock — must not be a hardware modifier (Ctrl/Alt/Win keep
# acting as modifiers even after their symbol changes; "menu" doesn't have
# that problem and is the natural Compose key already).
capslock_compose_key: menu
keyd_config_dest: /etc/keyd/default.conf

# Night light synced to real sunrise/sunset (playbooks/{system,user}/desktop.yml).
# hyprsunset only supports fixed HH:MM profile times, so a daily timer
# recomputes them.
nightlight_solar_night_temperature: 4000
nightlight_solar_geoip_url: "http://ip-api.com/json/"
nightlight_solar_oncalendar: "*-*-* 00:05:00"

# Inkscape (playbooks/system/inkscape.yml) — official repo. svg2tikz (an
# Inkscape extension exporting SVG paths as TikZ/PGF for LaTeX,
# https://github.com/xyz2tex/svg2tikz) has no official Arch package, so
# it's built from the AUR the same unprivileged clone+makepkg+pacman -U
# pattern as playbooks/{system,user}/blesh.yml. xclip is an optional runtime
# dependency the extension uses for its "copy to clipboard" output mode.
#
# TeX Live's own fonts are registered with fontconfig by
# local-typesetting/scripts/configure-fonts.sh, not by this playbook —
# see local-typesetting/README.md.
inkscape_package: inkscape
inkscape_svg2tikz_aur_package: python-svg2tikz
inkscape_svg2tikz_aur_git_url: "https://aur.archlinux.org/{{ inkscape_svg2tikz_aur_package }}.git"
inkscape_svg2tikz_aur_build_dir: "{{ target_home }}/.cache/omarchy-setup/aur/{{ inkscape_svg2tikz_aur_package }}"
inkscape_svg2tikz_aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info?arg[]={{ inkscape_svg2tikz_aur_package }}"
inkscape_svg2tikz_aur_build_deps:
  - python-build
  - python-installer
  - python-setuptools
  - python-wheel
  - python-poetry
inkscape_svg2tikz_runtime_deps:
  - xclip

# Limine silent boot (playbooks/system/limine-silent-boot.yml) — hide the boot
# menu for a flicker-free boot. quiet: yes keeps Limine from clearing the
# framebuffer, so the firmware logo stays up while Limine holds the
# display; it only takes effect in the config header (before the first
# entry). timeout: 1 keeps a 1-second key window (any key reveals the menu)
# — with quiet effective nothing is drawn during it; 0 boots instantly with
# no key window. firmware_logo is intentionally not set (the playbook
# removes it): Limine skips it while quiet is effective, and otherwise it
# recentres the BGRT logo away from the position omarchy-bgrt hardcodes.
# /boot/limine.conf is regenerated by
# limine-entry-tool on every kernel/UKI rebuild, but the config header
# (these global options) is preserved, so the settings survive
# `limine-update`.
limine_silent_boot_conf: /boot/limine.conf
limine_silent_boot_quiet: "yes"
limine_silent_boot_timeout: "1"

# ble.sh (playbooks/{system,user}/blesh.yml) — Bash Line Editor: fish-style
# autosuggestions + syntax highlighting. Built from the AUR (unprivileged
# clone+makepkg+pacman -U, same as inkscape_svg2tikz_*).
# blesh-git (0.4.0-devel) rather than the stable `blesh` (0.3.4): 0.3.4
# predates Bash 5.3 and prints "unsupported readline function" warnings
# on every shell start against Omarchy's inputrc (menu-complete-backward,
# emacs-editing-mode, vi-editing-mode); 0.4 loads cleanly.
blesh_aur_package: blesh-git
blesh_aur_git_url: "https://aur.archlinux.org/{{ blesh_aur_package }}.git"
blesh_aur_build_dir: "{{ target_home }}/.cache/omarchy-setup/aur/{{ blesh_aur_package }}"
blesh_aur_rpc_url: "https://aur.archlinux.org/rpc/v5/info?arg[]={{ blesh_aur_package }}"
blesh_aur_build_deps:
  - git
  - make
  - gawk
blesh_script: /usr/share/blesh/ble.sh
blesh_bashrc: "{{ target_home }}/.bashrc"
blesh_blerc: "{{ target_home }}/.blerc"

# Starship prompt inside distrobox (playbooks/{system,user}/containers.yml).
starship_distrobox_config: "{{ target_home }}/.config/starship.toml"
starship_distrobox_omarchy_default_config: /usr/share/omarchy/config/starship.toml
starship_distrobox_bashrc: "{{ target_home }}/.bashrc"
# Look of the container-name segment in the prompt.
starship_distrobox_symbol: "⬢"
starship_distrobox_style: bold yellow

# Nix (playbooks/{system,user}/nix.yml) — the Arch `nix` package in multi-user mode
# (nix-daemon, socket-activated), with the store on its own btrfs
# subvolume so snapper's root snapshots leave it out.
nix_package: nix
nix_daemon_socket_unit: nix-daemon.socket
nix_conf_path: /etc/nix/nix.conf
# Top-level subvolume mounted at /nix, next to Omarchy's own @, @home,
# @log and @pkg. Mount options are copied from the / entry in /etc/fstab
# with only subvol= changed (see the play).
nix_btrfs_subvolume: "@nix"
nix_mountpoint: /nix
# Where the play mounts the btrfs top level (subvolid=5) for the moment
# it takes to create the subvolume.
nix_btrfs_toplevel_mount: /run/omarchy-setup-btrfs-toplevel
# Settings written to nix_conf_path, one `key = value` line each.
# - experimental-features: `nix profile`, `nix shell nixpkgs#foo`, flakes.
# - nix-path: nixpkgs resolved through the flake registry, so
#   `nix-shell -p foo` and `<nixpkgs>` work without `nix-channel --add`.
nix_conf_settings:
  experimental-features: nix-command flakes
  nix-path: nixpkgs=flake:nixpkgs
# The per-user profile `nix profile install` writes to (the legacy
# location, which is still the default unless use-xdg-base-directories
# is set) and the system-wide default profile.
nix_user_profile: "{{ target_home }}/.nix-profile"
nix_default_profile: /nix/var/nix/profiles/default
# Deployed to ~/.config/environment.d: the package's
# /etc/profile.d/nix-daemon.sh only reaches login shells (and fish reads
# neither it nor the .fish variant there), so the graphical session, and
# everything started from it, gets the same variables from here.
nix_env_file: 43-nix.conf

# direnv (playbooks/{system,user}/nix.yml, tag direnv) — loads/unloads a directory's
# .envrc (e.g. `use flake`) on cd, hooked into bash and fish.
direnv_package: direnv
direnv_bashrc: "{{ target_home }}/.bashrc"
# fish's per-user vendor conf dir, same place playbooks/{system,user}/fish.yml puts
# Omarchy's ported setup — ~/.config/fish stays the user's own.
direnv_fish_conf: "{{ target_xdg_data_home }}/fish/vendor_conf.d/direnv.fish"

# nix-direnv (playbooks/{system,user}/nix.yml, tag nix-direnv) — a faster, caching
# `use flake`/`use nix` for direnv. Neither Arch nor the AUR packages
# it, so it goes in the user's Nix profile, as upstream documents for
# non-NixOS systems; `nix profile upgrade nix-direnv` updates it.
nix_direnv_installable: nixpkgs#nix-direnv
nix_direnv_profile_name: nix-direnv
nix_direnv_rc: "{{ nix_user_profile }}/share/nix-direnv/direnvrc"
direnv_rc: "{{ target_xdg_config_home }}/direnv/direnvrc"

# Omarchy shell plugins (playbooks/{system,user}/plugins.yml) — this desktop's list of
# third-party plugins, applied by `just plugins`. Append one entry per plugin;
# the play installs the whole list, so the list is the only place to edit.
#
# Plugins are arbitrary unsandboxed QML running inside the long-lived
# omarchy-shell, which is why each entry names a repo explicitly and pins a
# ref rather than tracking a branch: this list is the review `omarchy plugin
# add` asks for. Fields:
#   id:       the id the plugin's manifest declares (`omarchy plugin list`);
#             the play fails if a clone on disk doesn't carry it
#   repo:     git URL `omarchy plugin add` clones
#   ref:      tag/branch/commit the clone is pinned to — bump it to update.
#             `omarchy plugin update` fast-forwards a pinned checkout off its
#             tag (it stays detached, so the next run pins it back); bump the
#             ref instead
#   section:  bar section for the widget's icon (left/center/right), omitted
#             for plugins with no bar widget. With a section but no index the
#             shell anchors the widget right after omarchy.tray, i.e. first
#             in that group (PluginRegistry.barTarget)
#   packages: runtime dependencies, installed only when `pacman -T` reports
#             one missing (on Omarchy they all ship already)
omarchy_plugins:
  # Radio Atlas — world radio on a rotatable globe in the bar, playing
  # through Omarchy's mpv/mpv-mpris so omarchy.media keeps the usual
  # transport controls. MIT, first place in the first Omarchy plugin
  # competition. Its dependencies are what its README lists, minus the ones
  # that are part of any Arch base install (coreutils, util-linux).
  - name: Radio Atlas
    repo: https://github.com/AksharP5/omarchy-radio-atlas.git
    id: akshar.radio-atlas
    ref: v0.1.9
    section: right
    packages:
      - bubblewrap
      - curl
      - iproute2
      - jq
      - mpv
      - mpv-mpris
      - python
      - socat
omarchy_plugins_dir: "{{ target_home }}/.config/omarchy/plugins"
omarchy_plugins_shell_json: "{{ target_home }}/.config/omarchy/shell.json"

# Google Drive mounted through rclone (playbooks/user/rclone-gdrive.yml).
# The account is personal: set rclone_gdrive_email in users/<name>.yml.
rclone_gdrive_email: ""
rclone_bin: /usr/bin/rclone
rclone_gdrive_remote: Google Drive
# Mount points base, relative to $HOME: <base>/<email>/<mount_dir>.
rclone_gdrive_base_dir: Público/Google Drive
rclone_gdrive_config_file: "{{ target_home }}/.config/rclone/rclone.conf"
# Google API OAuth credentials: read from the environment on each run (or
# -e); empty = reuse the ones in the existing rclone.conf.
rclone_gdrive_client_id: "{{ lookup('ansible.builtin.env', 'RCLONE_GDRIVE_CLIENT_ID') }}"
rclone_gdrive_client_secret: "{{ lookup('ansible.builtin.env', 'RCLONE_GDRIVE_CLIENT_SECRET') }}"
# One systemd instance (rclone-google-drive@<name>.service) per entry.
rclone_gdrive_instances:
  - name: my-drive
    mount_dir: Meu Drive
    cache_slug: google-drive
    extra_flags: ""
  - name: shared-with-me
    mount_dir: Compartilhados Comigo
    cache_slug: google-drive-shared-with-me
    extra_flags: "--drive-shared-with-me"

# Omaraptor day/night theme switching (playbooks/user/omaraptor-theme-auto.yml).
# Themes applied after sunrise / after sunset (names as omarchy-theme-set
# takes them). Sunrise/sunset come from hyprsunset.conf (see
# nightlight_solar_*); the fallback times are used when it is missing.
omaraptor_auto_day_theme: "Omaraptor"
omaraptor_auto_night_theme: "Omaraptor Dark"
omaraptor_auto_fallback_sunrise: "06:00"
omaraptor_auto_fallback_sunset: "18:00"
# How often the timer checks whether the period changed (systemd timespan).
omaraptor_auto_interval: 5min
