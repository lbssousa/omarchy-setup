---
# File managers, per user (apps: file_manager): the default handler for
# directories (inode/directory). Flea takes it with `flea --default`, which
# also makes it the FileManager1 service and the "File manager" keys;
# Nautilus, Omarchy's own, through xdg-mime (`flea --default off` first
# when Flea had it). Either way the result is read back and checked.
- name: Apps — file managers (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [apps]

  vars:
    file_manager_default: "{{ apps_catalog.file_manager[apps.file_manager.default] }}"

  tasks:
    - name: Look for the default's installed desktop entry
      ansible.builtin.stat:
        path: "/usr/share/applications/{{ file_manager_default.desktop }}"
      register: file_manager_entry

    - name: Expect the package to still ship the desktop id the default points at
      ansible.builtin.assert:
        that: file_manager_entry.stat.exists
        fail_msg: >-
          /usr/share/applications/{{ file_manager_default.desktop }} is
          missing, so opening a folder would fall back to another file
          manager. Fix its desktop field in features.yml.
        quiet: true

    - name: Read the current default handler for directories
      ansible.builtin.command: xdg-mime query default inode/directory
      register: file_manager_current
      changed_when: false

    - name: "Make {{ file_manager_default.label }} the default file manager"
      when: file_manager_current.stdout | trim != file_manager_default.desktop
      block:
        - name: Make Flea the default (flea --default)
          ansible.builtin.command: flea --default
          when: apps.file_manager.default == 'flea'
          notify: restart xdg-desktop-portal

        - name: Hand directories back from Flea (flea --default off)
          ansible.builtin.command: flea --default off
          when:
            - apps.file_manager.default != 'flea'
            - "'flea' in apps.file_manager.installed"
          notify: restart xdg-desktop-portal

        - name: "Make {{ file_manager_default.label }} the default (xdg-mime)"
          ansible.builtin.command: xdg-mime default {{ file_manager_default.desktop }} inode/directory
          when: apps.file_manager.default != 'flea'

    - name: Read the default handler back
      ansible.builtin.command: xdg-mime query default inode/directory
      register: file_manager_result
      changed_when: false
      failed_when: file_manager_result.stdout | trim != file_manager_default.desktop

  handlers:
    - ansible.builtin.import_tasks: tasks/handlers-user.yml
