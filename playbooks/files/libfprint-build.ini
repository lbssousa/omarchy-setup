# Declarative build container for the libfprint fork
# (https://github.com/lbssousa/libfprint), native distrobox assemble
# format — distrobox owns the container lifecycle, not reimplemented in
# Ansible.
#
# The driver's SIGFM matcher is plain C (no OpenCV, hence no cmake)
# since v1.94.10-goodix538d.2.
[libfprint-build]
image=archlinux:latest
pull=true
additional_packages="meson ninja gcc pkgconf git glib2 glib2-devel gobject-introspection libgusb libgudev openssl pixman"
