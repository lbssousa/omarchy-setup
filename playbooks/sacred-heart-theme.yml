---
# Sacred Heart — a personal Omarchy theme (warm gold/brown palette,
# devotional backgrounds), fully portable: unlike
# playbooks/bgrt-theme.yml, nothing here is derived from this
# machine's hardware, so the finished theme itself is committed under
# playbooks/files/sacred-heart/ instead of generated on every run.
#
# colors.toml's background/dark_background/darker_background were
# tuned to match Tokyo Night's own background luminance (not just its
# foreground/background contrast ratio, which the original warmer
# background already matched almost exactly) while keeping this
# theme's gold/brown hue — see the colors.toml history for the
# original, lighter values.
- name: Sacred Heart Omarchy theme
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    sacred_heart_theme_dir: "{{ ansible_facts.env.HOME }}/.config/omarchy/themes/sacred-heart"

  tasks:
    - name: Create ~/.config/omarchy/themes
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/omarchy/themes"
        state: directory
        mode: "0755"

    - name: Install the Sacred Heart theme (colors, unlock screen, backgrounds)
      ansible.builtin.copy:
        src: sacred-heart/
        dest: "{{ sacred_heart_theme_dir }}/"
        mode: "0644"
        directory_mode: "0755"

    - name: Apply the theme
      ansible.builtin.command: omarchy-theme-set "Sacred Heart"
      changed_when: true
