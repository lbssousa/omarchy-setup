---

# KeePassXC — open-source password manager with browser integration,
# SSH agent support and system tray integration.
#
# Installs the Arch package (extra/keepassxc) with Omarchy's package helper
# (omarchy-pkg-add). It leaves KeePassXC's own settings untouched — no
# pre-seeded keepassxc.ini — so the app comes up with its stock defaults
# and the user configures it in-app. Its UI font comes from qt5ct
# (playbooks/system/file-chooser.yml), like every other Qt5 app on the host. The
# browser native-messaging manifests and the YubiKey auto-lock rule (below)
# are always deployed; the autostart entry and the keybind only with
# keepassxc_primary.
#
# The package ships the desktop-entry id org.keepassxc.KeePassXC.desktop
# and reports the window class keepassxc (StartupWMClass), which is what
# the keybind at the bottom and Omarchy's own rules key on.
#
# KeePassXC only writes its XDG autostart entry when the "Launch KeePassXC
# at system startup" checkbox is saved in the settings dialog, so the
# playbook deploys the same org.keepassxc.KeePassXC.desktop itself
# (force: false — an entry the user or KeePassXC already wrote is kept).
#
# systemd's XDG autostart fires desktop entries before quickshell has
# registered the system tray (org.kde.StatusNotifierWatcher) and before
# xdg-desktop-portal answers. KeePassXC (Qt5) samples both at startup — the
# tray to pick its D-Bus tray icon, the portal's color-scheme to pick its
# dark theme — so launching that early shows the window in the stock light
# theme with no appindicator icon; a manual restart fixes both only because
# the environment is ready by then. A drop-in on the generated
# app-org.keepassxc.KeePassXC@autostart.service therefore runs a readiness
# script as ExecStartPre= that waits for the tray and the portal. A drop-in,
# not a wrapper in the entry's Exec: KeePassXC rewrites the entry (Exec=
# keepassxc) every time its settings are saved with autostart on.
#
# The native messaging host manifests are deployed by user/keepassxc.yml to
# the Firefox Flatpak's sandbox (with a Python relay to KeePassXC's browser
# socket) and to the host Chromium location; the user still needs to install
# the KeePassXC-Browser extension in each browser and connect it.
#
# A `Match exec` drop-in in ~/.ssh/config.d raises KeePassXC's unlock
# prompt whenever ssh needs a key and the agent holds none, and waits for
# the keys before the connection goes on (keepassxc_ssh_unlock_enabled).
#
# A udev rule locks every open database as soon as the YubiKey is
# unplugged (matched on USB PRODUCT, since the reader is removable and
# ID_VENDOR_ID/ID_MODEL_ID aren't reliably available on "remove" events).
# Ported from lbssousa/nix-config's
# modules/system/security/keepassxc-yubikey-lock.nix.
- name: KeePassXC (password manager with browser + SSH agent integration)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [keepassxc]

  tasks:
    - name: Check whether KeePassXC is installed
      ansible.builtin.command: pacman -Q {{ keepassxc_package }}
      register: keepassxc_check
      changed_when: false
      failed_when: false

    - name: Install KeePassXC with Omarchy's package helper
      ansible.builtin.command: omarchy-pkg-add {{ keepassxc_package }}
      when: keepassxc_check.rc != 0
      become: true

    - name: "Auto-lock KeePassXC when the YubiKey ({{ keepassxc_yubikey_usb_product_match }}) is unplugged"
      become: true
      block:
        - name: Install the KeePassXC YubiKey auto-lock script
          ansible.builtin.copy:
            src: keepassxc-lock-on-yubikey-remove.sh
            dest: "{{ keepassxc_yubikey_lock_script }}"
            mode: "0755"

        - name: Install the udev rule
          ansible.builtin.template:
            src: 72-keepassxc-yubikey-lock.rules.j2
            dest: "{{ keepassxc_yubikey_lock_udev_rule }}"
            mode: "0644"
          notify: reload udev rules

  handlers:
    # Handlers don't inherit `become: true` from the block that notifies
    # them — needs its own.
    - name: reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
      become: true
      listen: reload udev rules
