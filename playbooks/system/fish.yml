---
# Fish shell, system phase: fish as a valid login shell and a warning
# about the omarchy-fish package. Not a feature: it always runs, because
# every account logs into fish (fish_login_shell, applied by
# system/users.yml). starship and fzf.fish's dependencies (fzf, fd, bat)
# already ship with Omarchy. The port itself (and the warnings when
# Omarchy's bash setup moves away from it) is installed per user by
# user/fish.yml, which explains it.
- name: Fish shell (Starship prompt, default login shell)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]

  tasks:
    - name: Install fish
      community.general.pacman:
        name: fish
        state: present
      become: true

    - name: Make sure {{ fish_login_shell }} is a valid login shell
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: "{{ fish_login_shell }}"
      become: true

    # The omarchy-fish package is another port of the same defaults: its
    # system-wide conf.d turns on vi key bindings and its functions differ
    # from these.
    - name: Check whether the omarchy-fish package is installed
      ansible.builtin.command: pacman -Q omarchy-fish
      register: fish_omarchy_fish_pkg
      changed_when: false
      failed_when: false

    - name: Warn about the omarchy-fish package
      ansible.builtin.debug:
        msg: >-
          The omarchy-fish package is installed. Its system-wide conf.d
          (vi key bindings, its own fzf.fish setup) runs alongside this
          play's, and its functions are shadowed by these. Remove it with
          `sudo pacman -R omarchy-fish` unless you want both.
      when: fish_omarchy_fish_pkg.rc == 0
