---
# Installs ssh-askpass-omarchy (https://github.com/lbssousa/ssh-askpass-omarchy)
# from a release tag (ssh_askpass_ref), checked out in
# ssh_askpass_checkout_dir only after the tag's GPG signature verifies and
# comes from one of ssh_askpass_signing_keys: the build runs as the user,
# and the result is installed as root. Releases are signed tags made on the
# merged commit (see the "Releases" section of its README); main only holds
# GitHub-signed squash merges, so it isn't deployable.
# This compiles the Rust binary (--locked, from the repo's Cargo.lock),
# installs it to /usr/bin,
# links the shell plugin, enables it via omarchy-shell IPC,
# and configures SSH to use it.
#
# Usage: ./run-empowered.sh ansible-playbook site.yml --tags ssh-askpass
- name: ssh-askpass-omarchy (SSH prompts in the polkit-style shell dialog)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [ssh-askpass]

  vars:
    ssh_askpass_cargo_env:
      PATH: "{{ ssh_askpass_cargo_bin_dir }}:{{ ansible_facts.env.PATH }}"

  tasks:
    - name: Install git and gnupg (the signature check needs both)
      community.general.pacman:
        name:
          - git
          - gnupg
        state: present
      become: true

    - name: Check that the release signing key is in the GPG keyring
      ansible.builtin.command: "gpg --list-keys --with-colons {{ item }}"
      loop: "{{ ssh_askpass_signing_keys }}"
      register: ssh_askpass_key_check
      changed_when: false
      failed_when: false
      when: ssh_askpass_verify_commit

    - name: Fail early if the signing key is missing (run `just gpg-yubikey`)
      ansible.builtin.fail:
        msg: >-
          ssh-askpass-omarchy is deployed from a release tag whose GPG signature is
          verified, and the signing key isn't in your keyring yet
          ({{ ssh_askpass_signing_keys | join(', ') }}). Import it first with
          `just gpg-yubikey` (Yubikey plugged in): that playbook is a
          dependency of this one. Set ssh_askpass_verify_commit=false only
          for an unsigned fork.
      when: >-
        ssh_askpass_verify_commit
        and (ssh_askpass_key_check.results | selectattr('rc', 'ne', 0) | list | length) > 0

    - name: "Check out the ssh-askpass-omarchy release ({{ ssh_askpass_ref }}), verifying its signed tag"
      block:
        - name: "Check out the ssh-askpass-omarchy release ({{ ssh_askpass_ref }}), verifying its signed tag"
          ansible.builtin.git:
            repo: "{{ ssh_askpass_repo }}"
            dest: "{{ ssh_askpass_checkout_dir }}"
            version: "{{ ssh_askpass_ref }}"
            force: false
            verify_commit: "{{ ssh_askpass_verify_commit }}"
            gpg_allowlist: "{{ ssh_askpass_signing_keys if ssh_askpass_verify_commit else [] }}"
          register: ssh_askpass_git_result
      rescue:
        - name: Explain a failed signature check
          ansible.builtin.fail:
            msg: >-
              Couldn't check out {{ ssh_askpass_repo }}
              ({{ ssh_askpass_ref }}) with a verified GPG signature:
              {{ ansible_failed_result.msg | default('unknown error') }}.
              ssh_askpass_ref must be a release tag signed with one of
              ssh_askpass_signing_keys (the Yubikey's OpenPGP key). A branch
              like main won't do, because its merges are signed by GitHub.
              If the key is missing from the keyring, import it with
              `just gpg-yubikey` (token plugged in). Set
              ssh_askpass_verify_commit=false only for an unsigned fork.

    - name: Check whether Rust (cargo) is already installed
      ansible.builtin.stat:
        path: "{{ ssh_askpass_cargo_bin_dir }}/cargo"
      register: ssh_askpass_cargo_stat

    - name: Install Rust (omarchy-install-dev-env rust)
      ansible.builtin.command: omarchy-install-dev-env rust
      when: not ssh_askpass_cargo_stat.stat.exists

    - name: Build the ssh-askpass-omarchy binary
      ansible.builtin.command:
        cmd: cargo build --release --locked
        chdir: "{{ ssh_askpass_checkout_dir }}"
      environment: "{{ ssh_askpass_cargo_env }}"
      register: ssh_askpass_build_result

    - name: Create system directories for ssh-askpass-omarchy
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /usr/bin
        - "{{ ssh_askpass_plugin_dir }}"
      become: true

    - name: Install the binary to /usr/bin
      ansible.builtin.copy:
        src: "{{ ssh_askpass_checkout_dir }}/target/release/ssh-askpass-omarchy"
        dest: "{{ ssh_askpass_program }}"
        mode: "0755"
        remote_src: true
      become: true

    - name: Install the plugin to /usr/share
      ansible.builtin.copy:
        src: "{{ ssh_askpass_checkout_dir }}/plugin/"
        dest: "{{ ssh_askpass_plugin_dir }}/"
        mode: preserve
        remote_src: true
      become: true
      register: ssh_askpass_copy_result

    - name: Create ~/.config/omarchy/plugins
      ansible.builtin.file:
        path: "{{ ssh_askpass_plugin_link | dirname }}"
        state: directory
        mode: "0755"

    - name: "Link the packaged shell plugin ({{ ssh_askpass_plugin_link }})"
      ansible.builtin.file:
        src: "{{ ssh_askpass_plugin_dir }}"
        dest: "{{ ssh_askpass_plugin_link }}"
        state: link
        force: true
      register: ssh_askpass_link_result

    - name: Read the shell config
      ansible.builtin.slurp:
        src: "{{ ssh_askpass_shell_json }}"
      register: ssh_askpass_shell_json_raw
      failed_when: false

    - name: Work out whether the plugin is already enabled
      ansible.builtin.set_fact:
        ssh_askpass_plugin_enabled: >-
          {{ (ssh_askpass_shell_json_raw.content is defined)
             and (((ssh_askpass_shell_json_raw.content | b64decode | from_json).plugins | default([]))
                  | selectattr('id', 'equalto', ssh_askpass_plugin_id) | list | length > 0) }}

    - name: "Enable the {{ ssh_askpass_plugin_id }} shell plugin"
      ansible.builtin.command:
        argv: [omarchy-shell, shell, enablePlugin, "{{ ssh_askpass_plugin_id }}", "{}"]
      register: ssh_askpass_enable_result
      failed_when: ssh_askpass_enable_result.rc != 0 or ssh_askpass_enable_result.stdout | trim != 'ok'
      when: not ssh_askpass_plugin_enabled

    # A keepLoaded service doesn't reload when its files change, so new
    # plugin code (not just a new link) needs a restart too.
    - name: Restart the shell to load the new plugin code
      ansible.builtin.command: omarchy-restart-shell
      when: >-
        (ssh_askpass_link_result is changed or ssh_askpass_copy_result is changed)
        and ssh_askpass_enable_result is skipped
      changed_when: true

    - name: Create ~/.config/environment.d
      ansible.builtin.file:
        path: "{{ ssh_askpass_environment_conf | dirname }}"
        state: directory
        mode: "0755"

    - name: "Configure SSH to use ssh-askpass-omarchy ({{ ssh_askpass_environment_conf }})"
      ansible.builtin.copy:
        content: |
          SSH_ASKPASS={{ ssh_askpass_program }}
          SSH_ASKPASS_REQUIRE=prefer
        dest: "{{ ssh_askpass_environment_conf }}"
        mode: "0644"
