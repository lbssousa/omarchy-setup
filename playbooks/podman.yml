---
# Podman, configured for rootless use — the container engine used by
# playbooks/distrobox.yml, but usable on its own too. The Arch package
# already pulls in networking (passt, netavark/aardvark-dns) and short
# image-name mappings as dependencies, so only subuid/subgid allocation
# needs manual attention here.
- name: Podman (rootless)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Install Podman via pacman
      community.general.pacman:
        name: podman
        state: present
      become: true

    - name: Check for an existing subuid range
      ansible.builtin.command: "grep -q ^{{ ansible_facts.env.USER }}: /etc/subuid"
      register: podman_subuid_check
      changed_when: false
      failed_when: false

    - name: Allocate a subuid/subgid range (only if the user doesn't have one)
      when: podman_subuid_check.rc != 0
      become: true
      block:
        - name: Add the subuid range
          ansible.builtin.lineinfile:
            path: /etc/subuid
            line: "{{ ansible_facts.env.USER }}:{{ podman_subuid_start }}:{{ podman_subuid_count }}"
            create: true

        - name: Add the subgid range
          ansible.builtin.lineinfile:
            path: /etc/subgid
            line: "{{ ansible_facts.env.USER }}:{{ podman_subuid_start }}:{{ podman_subuid_count }}"
            create: true

    - name: Verify Podman runs rootless correctly
      ansible.builtin.command: podman info --format '{{ "{{" }}.Host.Security.Rootless{{ "}}" }}'
      register: podman_info_check
      changed_when: false
      failed_when: podman_info_check.rc != 0 or podman_info_check.stdout != "true"
