---
# Replaces Omarchy's pre-installed native LibreOffice
# (omarchy-base.packages: libreoffice-fresh) with ONLYOFFICE Desktop
# Editors from the AUR (onlyoffice-bin, upstream's own .deb repackaged),
# installed with Omarchy's AUR helper (omarchy-pkg-aur-add), the same way
# playbooks/system/emacs.yml installs omarchy-emacs. ONLYOFFICE ships as a single
# desktop application, so there are no secondary components to hide from
# the app launcher and no mimeapps re-curation on top of what Omarchy
# already curates.
#
# Removes libreoffice-fresh. Doesn't touch shared libraries it pulled in
# (e.g. libcdr) — pacman leaves those alone too unless something else also
# depends on them. Omarchy binds no key to LibreOffice, so there is no
# keybind to reassign.
#
# Usage: just onlyoffice
- name: ONLYOFFICE Desktop Editors (AUR, replacing the pre-installed native LibreOffice)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check whether ONLYOFFICE is installed
      ansible.builtin.command: pacman -Q {{ onlyoffice_aur_package }}
      register: onlyoffice_check
      changed_when: false
      failed_when: false

    # As the user: yay refuses to build as root (see playbooks/system/emacs.yml).
    - name: Install ONLYOFFICE (AUR) with Omarchy's own helper
      ansible.builtin.command: omarchy-pkg-aur-add {{ onlyoffice_aur_package }}
      when: onlyoffice_check.rc != 0

    - name: Remove the pre-installed native LibreOffice
      community.general.pacman:
        name: libreoffice-fresh
        state: absent
      become: true
