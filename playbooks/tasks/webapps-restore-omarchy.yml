---
# Takes the PWA launchers this setup wrote out of `webapps_restore_apps`
# (entries of the webapps list) and, with webapps_restore, puts Omarchy's own
# launchers for those sites back. Used when leaving a PWA engine
# (playbooks/user/apps/webapps.yml) and, under a PWA engine, for the entries
# that aren't PWAs (pwa: false). Omarchy's launchers are copies of
# omarchy_applications_dir (omarchy-refresh-applications copies them the same
# way), so they come back from there; launchers an older run or Firefox's
# script set aside in webapps_backup_dir come back too. Neither overwrites a
# launcher that is there already.
- name: Find the PWA launchers written for these web apps
  ansible.builtin.find:
    paths: "{{ webapps_desktop_dir }}"
    patterns: "*.desktop"
    contains: "Exec=.*--app-id="
    read_whole_file: true
  register: webapps_pwa_launchers

- name: Remove them
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ webapps_pwa_launchers.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename | regex_replace('\.desktop$', '')) in (webapps_restore_apps | map(attribute='label') | list)
  notify: refresh the applications database

- name: Put Omarchy's launchers back
  when: webapps_restore | bool
  block:
    - name: Look for Omarchy's own launcher of each site
      ansible.builtin.stat:
        path: "{{ omarchy_applications_dir }}/{{ item.omarchy_webapp_name | default(item.label) }}.desktop"
      loop: "{{ webapps_restore_apps }}"
      loop_control:
        label: "{{ item.label }}"
      register: webapps_omarchy_sources

    - name: Copy them back from {{ omarchy_applications_dir }}
      ansible.builtin.copy:
        src: "{{ item.stat.path }}"
        dest: "{{ webapps_desktop_dir }}/"
        remote_src: true
        force: false
        mode: "0644"
      loop: "{{ webapps_omarchy_sources.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.stat.path | basename }}"
      notify: refresh the applications database

    - name: Find the launchers set aside earlier
      ansible.builtin.find:
        paths: "{{ webapps_backup_dir }}"
        patterns: "*.desktop"
      register: webapps_omarchy_backups

    - name: Put those back too
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ webapps_desktop_dir }}/{{ item.path | basename }}"
        remote_src: true
        force: false
        mode: "0644"
      loop: "{{ webapps_omarchy_backups.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (item.path | basename | regex_replace('\.desktop$', '')) in webapps_restore_names
      notify: refresh the applications database
      vars:
        webapps_restore_names: >-
          {{ webapps_restore_apps | map(attribute='label') | list
             + webapps_restore_apps | selectattr('omarchy_webapp_name', 'defined') | map(attribute='omarchy_webapp_name') | list }}
