---
# TeX Live and the Gregorio engraver that builds on it, in this order:
#
#   TeX Live            tags: tex, texlive, gregorio
#   Gregorio            tags: tex, gregorio
#
# Not part of site.yml/`just setup`: TeX Live is a long network install,
# so both run on demand. Gregorio needs TeX Live, so the TeX Live play
# also carries the `gregorio` tag: `just gregorio` sets TeX Live up first
# (a no-op when it's already installed), like `just texlive` alone.
#
# Usage: ./run-empowered.sh ansible-playbook playbooks/tex.yml
#        ./run-empowered.sh ansible-playbook playbooks/tex.yml --tags gregorio

# TeX Live via the AUR texlive-installer package — a thin wrapper
# around upstream's own install-tl script that also makes pacman think
# every texlive-* package is already satisfied (see its PKGBUILD
# `provides=`), instead of pulling in Arch's own texlive-* packages.
# https://aur.archlinux.org/packages/texlive-installer
#
# install-tl then does the real work, driven by a generated unattended
# profile: scheme-minimal, installed under
# "{{ texlive_texdir }}", from the same CTAN mirror the AISCGre-BR
# devcontainer texlive feature uses (texlive_repository below).
# instopt_adjustpath 1 makes install-tl symlink its own binaries into
# /usr/local/bin at install time, so the scheme-minimal set (tlmgr,
# pdflatex, etc.) lands on PATH without a separate step.
#
# On top of scheme-minimal, tlmgr installs texlive_extra_packages — the
# union of the "packages" list from every AISCGre-BR project's
# devcontainer texlive feature
# (~/Projetos/AISCGre-BR/*/.devcontainer/devcontainer.json as of
# 2026-09-08: Eugene-Cardine-Primeiro-Ano-de-Semiologia-Gregoriana and
# darezzo). Re-sync that list by hand in group_vars/all/main.yml if
# those projects' package selections change. Those extra packages can
# add binaries install-tl never symlinked (latexmk, luatex/lualatex —
# not part of scheme-minimal), so `tlmgr path add` runs again
# afterward to pick them up; instopt_adjustpath alone only covers
# what's on disk at install-tl time, not later tlmgr installs.
#
# Building texlive-installer itself follows the same unprivileged
# clone+makepkg+pacman -U pattern as playbooks/bitwarden.yml — makepkg
# refuses to run as root, and its own sudo (for missing build deps)
# can't take an interactive password from Ansible. Unlike Bitwarden,
# there's no official-vs-AUR comparison here: texlive-installer only
# exists on the AUR.
#
# Usage: ./run-empowered.sh ansible-playbook playbooks/tex.yml --tags texlive
- name: TeX Live (AUR texlive-installer, scheme-minimal + AISCGre-BR packages)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [tex, texlive, gregorio]

  tasks:
    - name: Check the currently installed texlive-installer version, if any
      ansible.builtin.command: "pacman -Qi {{ texlive_aur_package }}"
      environment:
        LC_ALL: C
      register: texlive_installer_installed
      changed_when: false
      failed_when: false

    - name: Extract the installed texlive-installer version
      ansible.builtin.set_fact:
        texlive_installer_installed_version: >-
          {{ (texlive_installer_installed.stdout_lines | select('match', 'Version') | first).split(':')[1] | trim }}
      when: texlive_installer_installed.rc == 0

    - name: Check the texlive-installer version on the AUR
      ansible.builtin.uri:
        url: "{{ texlive_aur_rpc_url }}"
        return_content: true
      register: texlive_aur_info

    - name: Extract the AUR package version
      ansible.builtin.set_fact:
        texlive_aur_version: "{{ texlive_aur_info.json.results[0].Version }}"

    - name: "Build and install texlive-installer (only if missing or outdated)"
      when: >-
        texlive_installer_installed.rc != 0
        or texlive_installer_installed_version != texlive_aur_version
      block:
        - name: Install texlive-installer's build dependencies
          community.general.pacman:
            name: "{{ texlive_aur_build_deps }}"
            state: present
          become: true

        - name: Clone/update the texlive-installer AUR repo
          ansible.builtin.git:
            repo: "{{ texlive_aur_git_url }}"
            dest: "{{ texlive_aur_build_dir }}"
            update: true

        - name: Build the package (makepkg, no dep resolution, unprivileged)
          ansible.builtin.command: makepkg --nodeps --noconfirm --force
          args:
            chdir: "{{ texlive_aur_build_dir }}"

        - name: Install the built package
          ansible.builtin.shell: "pacman -U --noconfirm {{ texlive_aur_build_dir }}/*.pkg.tar.zst"
          become: true

    - name: Check whether TeX Live is already installed
      ansible.builtin.stat:
        path: "{{ texlive_tlmgr_bin }}"
      register: texlive_tlmgr_stat

    - name: "Run the TeX Live installer ({{ texlive_scheme }} into {{ texlive_texdir }})"
      when: not texlive_tlmgr_stat.stat.exists
      block:
        - name: Create ~/.cache/omarchy-setup
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.cache/omarchy-setup"
            state: directory
            mode: "0755"

        - name: Write the unattended install profile
          ansible.builtin.copy:
            dest: "{{ texlive_profile_path }}"
            mode: "0644"
            content: |
              selected_scheme {{ texlive_scheme }}
              TEXDIR {{ texlive_texdir }}
              instopt_adjustpath 1
              tlpdbopt_install_docfiles 0
              tlpdbopt_install_srcfiles 0

        - name: "Run install-tl (network install from {{ texlive_repository }} — this takes a while)"
          ansible.builtin.command: >-
            {{ texlive_installer_bin }}
            --profile={{ texlive_profile_path }}
            --repository {{ texlive_repository }}
          become: true

    - name: Get the currently installed TeX Live package names
      ansible.builtin.command: "{{ texlive_tlmgr_bin }} list --only-installed --data name"
      register: texlive_installed_packages
      changed_when: false

    - name: Determine which AISCGre-BR packages are still missing
      ansible.builtin.set_fact:
        texlive_missing_packages: "{{ texlive_extra_packages | difference(texlive_installed_packages.stdout_lines) }}"

    - name: "Install the AISCGre-BR devcontainer package selection on top of {{ texlive_scheme }}"
      ansible.builtin.command: "{{ texlive_tlmgr_bin }} install {{ texlive_missing_packages | join(' ') }}"
      when: texlive_missing_packages | length > 0
      become: true

    - name: Re-sync /usr/local/bin symlinks (tlmgr path add)
      # install-tl's own instopt_adjustpath only symlinks the binaries
      # present at install time (scheme-minimal). tlmgr doesn't keep
      # those symlinks in sync on its own when new packages add new
      # binaries (e.g. latexmk, luatex/lualatex) — without this,
      # tlmgr install above silently leaves them off PATH.
      ansible.builtin.command: "{{ texlive_tlmgr_bin }} path add"
      when: texlive_missing_packages | length > 0
      become: true

# Gregorio (GABC → GregorioTeX engraver), built from the user's own
# fork (lbssousa/gregorio) at the exact commit both AISCGre-BR projects
# pin in their devcontainer's gregorio feature
# (~/Projetos/AISCGre-BR/{Eugene-Cardine-Primeiro-Ano-de-Semiologia-Gregoriana,darezzo}/.devcontainer/devcontainer.json)
# — see gregorio_ref in group_vars/all/main.yml. Keep that value in
# sync with those devcontainer.json files rather than bumping it
# independently.
#
# Depends on TeX Live: the TeX Live play above also carries this play's
# `gregorio` tag, so it always runs first. kpsewhich/texhash resolve the system
# TEXMFLOCAL tree that the second build step below installs GregorioTeX's
# support files into. Fails early, without changing anything, if
# kpsewhich isn't on PATH yet.
#
# Mirrors the two build steps of
# https://github.com/aiscgre-br/devcontainer-features (src/gregorio/install.sh),
# minus the container-only bits (no tarball download — a real git
# checkout instead, like playbooks/gregorio-lsp.yml — and build
# dependencies are left installed afterward instead of being removed,
# since this is a desktop install, not a throwaway container layer):
#
#   1. autoreconf + `configure --disable-version-in-exe` + make + make
#      install — builds and installs the `gregorio` command-line
#      binary (GABC → GregorioTeX). --disable-version-in-exe installs
#      it as plain "gregorio" rather than a version-suffixed name.
#   2. `install-gtex.sh system` — installs the GregorioTeX TeX/LaTeX
#      sources and fonts into the system TEXMFLOCAL tree (resolved via
#      kpsewhich) and refreshes texhash. AUTO_UNINSTALL=true answers
#      its old-file-removal prompts non-interactively; SKIP
#      leaves out docs/examples/font-sources, which nothing here needs.
#
# Usage: ./run-empowered.sh ansible-playbook playbooks/tex.yml --tags gregorio
- name: Gregorio (GABC engraver + GregorioTeX, from lbssousa/gregorio)
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [tex, gregorio]

  tasks:
    - name: Check whether TeX Live's kpsewhich is on PATH
      ansible.builtin.command: kpsewhich --version
      register: gregorio_kpsewhich_check
      changed_when: false
      failed_when: false

    - name: TeX Live must already be installed (the TeX Live play above)
      ansible.builtin.assert:
        that: gregorio_kpsewhich_check.rc == 0
        fail_msg: >-
          kpsewhich not found on PATH — run `just texlive` (or
          `./run-empowered.sh ansible-playbook playbooks/tex.yml --tags texlive`)
          first, and don't skip the TeX Live play.

    - name: Install Gregorio's build dependencies
      community.general.pacman:
        name: "{{ gregorio_build_deps }}"
        state: present
      become: true

    - name: "Clone/update the gregorio repo ({{ gregorio_ref }})"
      ansible.builtin.git:
        repo: "{{ gregorio_repo }}"
        dest: "{{ gregorio_checkout_dir }}"
        version: "{{ gregorio_ref }}"
        force: false
      register: gregorio_git_result

    - name: Check whether the gregorio binary is already installed
      ansible.builtin.stat:
        path: "{{ gregorio_binary_path }}"
      register: gregorio_binary_stat

    - name: Check whether GregorioTeX's support files are already installed
      ansible.builtin.command: kpsewhich gregoriotex.sty
      register: gregorio_gtex_check
      changed_when: false
      failed_when: false

    - name: Determine whether a (re)build is needed
      ansible.builtin.set_fact:
        gregorio_needs_build: >-
          {{ gregorio_git_result.changed
             or not gregorio_binary_stat.stat.exists
             or gregorio_gtex_check.rc != 0 }}

    - name: "Build and install Gregorio ({{ gregorio_ref }})"
      when: gregorio_needs_build
      block:
        - name: Generate the autotools build files (autoreconf)
          ansible.builtin.command: autoreconf -fi
          args:
            chdir: "{{ gregorio_checkout_dir }}"

        - name: "Configure Gregorio (prefix={{ gregorio_configure_prefix }})"
          # Run with bash explicitly: configure uses CFLAGS+= (a
          # bash-ism) that breaks under a POSIX /bin/sh.
          ansible.builtin.command: >-
            bash ./configure --prefix={{ gregorio_configure_prefix }}
            --disable-version-in-exe
          args:
            chdir: "{{ gregorio_checkout_dir }}"

        - name: "Build Gregorio (make -j{{ ansible_facts.processor_nproc }})"
          ansible.builtin.command: "make -j{{ ansible_facts.processor_nproc }}"
          args:
            chdir: "{{ gregorio_checkout_dir }}"

        - name: Install the gregorio binary
          ansible.builtin.command: make install
          args:
            chdir: "{{ gregorio_checkout_dir }}"
          become: true

        - name: Install GregorioTeX's TeX/LaTeX support files and fonts (install-gtex.sh system)
          ansible.builtin.command: bash ./install-gtex.sh system
          args:
            chdir: "{{ gregorio_checkout_dir }}"
          environment:
            SKIP: docs,examples,font-sources
            AUTO_UNINSTALL: "true"
          become: true
