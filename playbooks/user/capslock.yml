---
# Caps Lock = Esc, Shift+Caps Lock = Caps Lock, with XKB's own
# caps:escape_shifted_capslock in ~/.config/hypr/input.lua — no daemon.
# Omarchy's kb_options (omarchy:shift_caps_compose) put Compose on
# Shift+Caps Lock, so the block replaces them and moves Compose to
# capslock_compose_key. The layout-switch option Omarchy adds for
# non-Latin layouts (grp:alts_toggle) is kept. Turning the feature off
# removes the block, giving Omarchy's options back.
#
# Usage: just apply capslock
- name: Caps Lock = Esc, Shift+Caps Lock = Caps Lock (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [capslock]

  vars:
    feature_on: "{{ features['capslock'] | default(true) }}"

  tasks:
    - name: "{{ 'Caps Lock as Esc, Compose on ' ~ capslock_compose_key if feature_on | bool else 'Give Caps Lock and Compose back to Omarchy' }}"
      ansible.builtin.include_tasks: tasks/hypr-user-block.yml
      vars:
        hypr_file: input.lua
        hypr_marker: "playbooks/user/capslock.yml — Compose on {{ capslock_compose_key }}"
        hypr_state: "{{ 'present' if feature_on | bool else 'absent' }}"
        hypr_block: |
          local capslock_kb_options = "caps:escape_shifted_capslock,compose:{{ capslock_compose_key }}"
          local omarchy_kb_options = hl.get_config("input.kb_options")
          if type(omarchy_kb_options) == "string" and omarchy_kb_options:find("grp:alts_toggle", 1, true) then
            capslock_kb_options = capslock_kb_options .. ",grp:alts_toggle"
          end
          hl.config({
            input = {
              kb_options = capslock_kb_options,
            },
          })

  handlers:
    - ansible.builtin.import_tasks: tasks/handlers-user.yml
