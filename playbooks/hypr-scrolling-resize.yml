---
# Hyprland's "scrolling" layout has its own resize dispatcher,
# hl.dsp.layout("colresize <±fraction>") — the generic window-resize
# dispatcher (used by Omarchy's default SUPER+MINUS/EQUAL binds) doesn't
# understand the scrolling layout's infinite horizontal strip model, so
# this playbook adds new, dedicated binds instead of overriding the
# defaults.
#
# One key per direction, on the two adjacent bracket keys of this
# machine's ABNT2 keyboard: SUPER+[ shrinks, SUPER+] grows. Keycodes
# (xkb, layout "br"): "[" is <AD12> = code:35 and "]" is <BKSL> =
# code:51 — NOT code:34, which is <AD11> (the ´/` dead-key). Binding by
# code:N instead of the keysym name keeps the pair tied to the physical
# keys regardless of which symbol a layout variant puts on them.
#
# SUPER+"]" was empirically confirmed to reach Hyprland (runtime probe
# binds on both code:51 and the "bracketright" keysym fired on every
# press); an earlier "hardware rollover" theory for this key was wrong,
# it came from testing the wrong keycode. colresize is a no-op outside
# the scrolling layout (Hyprland just logs and ignores it).
#
# Written to ~/.config/hypr/bindings.lua via a marked block, so it
# coexists with any other customization already there.
- name: Hyprland scrolling-layout column resize (SUPER+[ / SUPER+])
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Create ~/.config/hypr
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr"
        state: directory
        mode: "0755"

    - name: Create ~/.config/hypr/bindings.lua from the Omarchy default, if missing
      ansible.builtin.copy:
        src: /usr/share/omarchy/default/hypr/bindings.lua
        dest: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
        remote_src: true
        force: false
        mode: "0644"

    - name: "Bind SUPER+[ / SUPER+] to colresize (±{{ hypr_scrolling_colresize_step }}) on the scrolling layout"
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
        marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/hypr-scrolling-resize.yml — scrolling column resize)"
        block: |
          -- code:35 = "[" and code:51 = "]" on this machine's ABNT2
          -- keyboard (xkb layout "br"; code:34 is the ´ key, not "]").
          o.bind("SUPER + code:35", "Shrink column (scrolling)", hl.dsp.layout("colresize -{{ hypr_scrolling_colresize_step }}"))
          o.bind("SUPER + code:51", "Grow column (scrolling)", hl.dsp.layout("colresize +{{ hypr_scrolling_colresize_step }}"))
      register: hypr_scrolling_resize_binding
      notify: reload Hyprland

  handlers:
    - name: reload Hyprland
      # Only has an effect inside a real Hyprland session; the bind
      # still applies on next login either way.
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      listen: reload Hyprland
