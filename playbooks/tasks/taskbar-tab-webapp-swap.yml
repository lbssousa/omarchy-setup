# One web app swap — looped by playbooks/taskbar-tab-webapps.yml
# (taskbar_tab_webapp_swaps), var `webapp_swap`. Needs `all_taskbar_tabs`
# (set by the parent play) already in scope.
#
# `tags: [taskbar-tab-webapps]` is repeated on every task here, not just
# on the include_tasks call — a looped include_tasks with a tag only on
# the call itself silently skips every inner task under --tags without
# any warning (see tasks/ptbr-chromium-family-browser.yml).
- name: "[{{ webapp_swap.omarchy_webapp_name }}] Find the matching Taskbar Tab ({{ webapp_swap.taskbar_tab_hostname }})"
  ansible.builtin.set_fact:
    taskbar_tab_match: >-
      {{
        (all_taskbar_tabs
          | selectattr('startUrl', 'search', webapp_swap.taskbar_tab_hostname | regex_escape)
          | list | first)
        | default(none)
      }}
  tags: [taskbar-tab-webapps]

- name: "[{{ webapp_swap.omarchy_webapp_name }}] Fail if no Taskbar Tab exists yet for {{ webapp_swap.taskbar_tab_hostname }}"
  ansible.builtin.fail:
    msg: >-
      No Firefox Taskbar Tab found with a start URL containing
      "{{ webapp_swap.taskbar_tab_hostname }}". Create it first in
      Firefox (open the site, then page menu → "Save as Taskbar
      Tab..."), then rerun this playbook.
  when: taskbar_tab_match is none
  tags: [taskbar-tab-webapps]

- name: "[{{ webapp_swap.omarchy_webapp_name }}] Compute the Taskbar Tab's app id"
  ansible.builtin.set_fact:
    taskbar_tab_app_id: "{{ taskbar_tab_match.shortcutRelativePath | regex_replace('\\.desktop$', '') }}"
  tags: [taskbar-tab-webapps]

- name: "[{{ webapp_swap.omarchy_webapp_name }}] Check whether the Omarchy web app launcher exists"
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.local/share/applications/{{ webapp_swap.omarchy_webapp_name }}.desktop"
  register: omarchy_webapp_launcher_stat
  tags: [taskbar-tab-webapps]

- name: "[{{ webapp_swap.omarchy_webapp_name }}] Remove the Omarchy web app launcher"
  ansible.builtin.command: "omarchy webapp remove {{ webapp_swap.omarchy_webapp_name }}"
  environment:
    OMARCHY_REMOVE_NOTIFY: "false"
  when: omarchy_webapp_launcher_stat.stat.exists
  changed_when: true
  tags: [taskbar-tab-webapps]

- name: Create ~/.config/hypr
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/hypr"
    state: directory
    mode: "0755"
  tags: [taskbar-tab-webapps]

- name: Create ~/.config/hypr/bindings.lua from the Omarchy default, if missing
  ansible.builtin.copy:
    src: /usr/share/omarchy/default/hypr/bindings.lua
    dest: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
    remote_src: true
    force: false
    mode: "0644"
  tags: [taskbar-tab-webapps]

- name: "[{{ webapp_swap.omarchy_webapp_name }}] Rebind {{ webapp_swap.hypr_keybind }} to the {{ webapp_swap.hypr_description }} Taskbar Tab"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts.env.HOME }}/.config/hypr/bindings.lua"
    marker: "-- {mark} ANSIBLE MANAGED BLOCK (playbooks/taskbar-tab-webapps.yml — {{ webapp_swap.hypr_description }} keybinding)"
    # gtk-launch resolves the Taskbar Tab's own .desktop file (found by
    # Firefox in ~/.local/share/applications, its Exec launches Firefox
    # pinned to that one site's profile/container); the window class
    # Firefox assigns it is the same app id, so `focus` matches on it
    # literally — the id's one dot (firefox.webapp-<uuid>) is escaped
    # for the regex, and that escape needs a DOUBLED backslash here:
    # Lua string literals don't support "\." as an escape sequence
    # (invalid escape sequence), only "\\." (literal backslash + dot).
    block: |
      hl.unbind("{{ webapp_swap.hypr_keybind }}")
      o.bind("{{ webapp_swap.hypr_keybind }}", "{{ webapp_swap.hypr_description }}", { launch = "gtk-launch {{ taskbar_tab_app_id }}", focus = "^{{ taskbar_tab_app_id | regex_replace('\.', '\\\\.') }}$" })
  notify: reload Hyprland
  tags: [taskbar-tab-webapps]
