---
# Brave Origin, per user: Omarchy's Chromium flags and companions, and the
# web app container wiring. The browser itself is installed by
# system/brave.yml, which explains how.
#
# Usage: just brave

# What `omarchy-install-browser brave-origin` does in the installing user's
# home (copy_chromium_flags): Omarchy's Chromium flags as
# ~/.config/brave-origin-flags.conf, read by the /usr/bin/brave-origin
# wrapper, then the copy-URL and yt-dlp extensions and the video decode
# settings. Only when the flags file is missing, so a user's own changes to
# it survive re-runs, and so the administrator who ran the installer is
# left alone.
- name: Brave Origin flags (user)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [brave]

  tasks:
    - name: Check whether ~/.config/brave-origin-flags.conf exists
      ansible.builtin.stat:
        path: "{{ target_home }}/.config/brave-origin-flags.conf"
      register: brave_origin_flags

    - name: Write Omarchy's Chromium flags and companions for Brave Origin
      when: not brave_origin_flags.stat.exists
      block:
        - name: Copy Omarchy's Chromium flags to ~/.config/brave-origin-flags.conf
          ansible.builtin.copy:
            src: /usr/share/omarchy/config/chromium-flags.conf
            dest: "{{ target_home }}/.config/brave-origin-flags.conf"
            remote_src: true
            force: false
            mode: "0644"

        - name: Install Omarchy's Chromium-family companions (copy URL, yt-dlp, video decode)
          ansible.builtin.command: "{{ item }}"
          loop:
            - omarchy-install-chromium-copy-url
            - omarchy-install-chromium-ytdlp
            - omarchy-install-video-decode
          changed_when: true

# Omarchy's native web apps (YouTube, WhatsApp, Google Maps, ...; see
# ~/.local/share/applications) are launchers whose Exec runs
# `omarchy-launch-webapp <url>`. With Brave Origin the default browser
# that opens a Brave Origin --app= window in the profile's default
# (non-container) partition. Brave supports `--container=<name>` together with `--app=`
# since 1.95.x (brave/brave-browser#58019 landed via brave-core#38964),
# so a launcher can opt into a storage-isolated container by appending
# --container=<name> to its Exec=. This play converges the launchers
# mapped in brave_omarchy_webapp_containers (group_vars/all/main.yml) on
# their container, idempotently, and installs a systemd --user path unit
# that reruns the fix whenever a web app launcher appears or is rewritten
# (e.g. by omarchy-webapp-install). Container names must already exist
# in Brave Origin (brave://settings/containers).
- name: Brave Omarchy web app container wiring
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [brave, brave-webapp-containers]

  tasks:
    - name: Create ~/.local/bin
      ansible.builtin.file:
        path: "{{ target_home }}/.local/bin"
        state: directory
        mode: "0755"
      tags: [brave, brave-webapp-containers]

    - name: Deploy fix-brave-omarchy-webapp-containers
      ansible.builtin.template:
        src: fix-brave-omarchy-webapp-containers.sh.j2
        dest: "{{ target_home }}/.local/bin/fix-brave-omarchy-webapp-containers"
        mode: "0755"
      tags: [brave, brave-webapp-containers]

    - name: Create ~/.config/systemd/user
      ansible.builtin.file:
        path: "{{ target_home }}/.config/systemd/user"
        state: directory
        mode: "0755"
      tags: [brave, brave-webapp-containers]

    - name: Install the fix-brave-omarchy-webapp-containers systemd --user units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ target_home }}/.config/systemd/user/{{ item }}"
        mode: "0644"
      loop:
        - fix-brave-omarchy-webapp-containers.service
        - fix-brave-omarchy-webapp-containers.path
      notify: reload systemd --user
      tags: [brave, brave-webapp-containers]

    - name: Enable the fix-brave-omarchy-webapp-containers path unit
      ansible.builtin.systemd:
        name: fix-brave-omarchy-webapp-containers.path
        scope: user
        daemon_reload: true
        enabled: true
        state: started
      tags: [brave, brave-webapp-containers]

    - name: Run fix-brave-omarchy-webapp-containers now
      ansible.builtin.command: "{{ target_home }}/.local/bin/fix-brave-omarchy-webapp-containers"
      register: fix_brave_omarchy_webapp_containers_result
      changed_when: "fix_brave_omarchy_webapp_containers_result.stdout is search('Result: [1-9]')"
      tags: [brave, brave-webapp-containers]

  handlers:
    - name: reload systemd --user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      listen: reload systemd --user
