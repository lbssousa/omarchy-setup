---
# Installs Firefox and enables "tab apps" (Taskbar Tabs — pin a site to
# the taskbar as an app-like window), off by default on Linux even
# though it's already stable and on by default on Windows.
#
# browser.taskbarTabs.enabled isn't in the fixed allowlist the
# Preferences key in policies.json accepts, so it can't be set that way
# (see policies.json's Firefox pt-BR block in playbooks/ptbr.yml, which
# CAN use it for RequestedLocale). Instead, this drops a small
# defaults/preferences/*.js file — the same mechanism the Arch package
# itself uses for its own overrides (see vendor.js in the same
# directory) — which only changes the *default* value: still visible
# and user-overridable in about:config, and untouched by future Firefox
# upgrades since it's a separate file from the package's own vendor.js.
#
# Runs before playbooks/ptbr.yml (see site.yml) so that Firefox is
# already installed by the time the pt-BR language pack step checks for
# it.
- name: Firefox
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Remove Firefox from Flathub if present
      community.general.flatpak:
        name: org.mozilla.firefox
        state: absent
        method: system
      become: true

    - name: Install Firefox
      community.general.pacman:
        name: "{{ firefox_package }}"
        state: present
      become: true

    - name: "Enable tab apps by default ({{ firefox_taskbar_tabs_pref_name }})"
      ansible.builtin.copy:
        content: |
          // Tab apps (Taskbar Tabs) — stable but off by default on
          // Linux. Only flips the default; still user-overridable in
          // about:config.
          pref("{{ firefox_taskbar_tabs_pref_name }}", true);
        dest: "{{ firefox_taskbar_tabs_pref_dest }}"
        mode: "0644"
      become: true

    - name: "Set the default page font size to {{ firefox_default_font_size_px }}px (font.size.variable.x-western)"
      # Same defaults/preferences mechanism as the taskbar-tabs pref above, so
      # it's a default rather than a locked policy (what policies.json's
      # fixed allowlist would accept anyway). The browser chrome already
      # follows the GTK font set by playbooks/desktop.yml; this only
      # raises the default size for page text, one step above Firefox's
      # own 16px (see firefox_default_font_size_px in group_vars).
      ansible.builtin.copy:
        content: |
          // Default size for page text — one step above Firefox's own
          // 16px, matching the 13pt GTK bump. Only flips the default;
          // still user-overridable in about:config.
          pref("font.size.variable.x-western", {{ firefox_default_font_size_px }});
        dest: "{{ firefox_font_size_pref_dest }}"
        mode: "0644"
      become: true
